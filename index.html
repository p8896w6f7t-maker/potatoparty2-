<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>감자 키우기</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:#f3e5d0;
  color:#4b3525;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

body{
  min-height:100vh;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

.hidden{
  display:none !important;
}

.screen{
  width:100%;
  max-width:500px;
  min-height:100vh;
  margin:0 auto;
  background:#fffaf2;
}


/* ==================================================
   시작 화면
================================================== */

#startScreen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}

.start-potato{
  font-size:80px;
  margin-bottom:20px;
}

.start-title{
  font-size:40px;
  font-weight:1000;
  margin-bottom:8px;
}

.start-subtitle{
  font-size:14px;
  color:#806b58;
  margin-bottom:28px;
}

.start-button{
  width:240px;
  padding:16px;
  border-radius:17px;
  background:#c98745;
  color:white;
  font-size:17px;
  font-weight:900;
  box-shadow:0 4px 0 #9f6330;
}

.start-button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #9f6330;
}


/* ==================================================
   공통 헤더
================================================== */

.header{
  padding:15px 16px 8px;
  text-align:center;
}

.header-title{
  font-size:23px;
  font-weight:1000;
}

.header-subtitle{
  margin-top:4px;
  color:#806b58;
  font-size:11px;
}


/* ==================================================
   성장 화면
================================================== */

#beforeScreen{
  padding-bottom:30px;
}

.egg-scene{
  width:100%;
  height:270px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:20px;
  position:relative;
}

.soil{
  position:absolute;
  width:250px;
  height:55px;
  background:#9a704e;
  border-radius:50%;
  bottom:20px;
}

.growth-emoji{
  position:relative;
  z-index:2;
  font-size:80px;
  line-height:1;
  animation:sproutBounce 2s ease-in-out infinite;
}

@keyframes sproutBounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

.growth-info{
  text-align:center;
  padding:0 20px;
}

.growth-title{
  font-size:21px;
  font-weight:1000;
  margin-bottom:8px;
}

.growth-percent{
  font-size:14px;
  color:#806b58;
  margin-bottom:10px;
}

.progress{
  width:100%;
  height:18px;
  background:#eadcc6;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#c98745;
  border-radius:20px;
  transition:width .3s;
}


/* ==================================================
   메시지
================================================== */

.message{
  width:calc(100% - 32px);
  margin:12px 16px;
  padding:11px 14px;
  min-height:52px;
  border-radius:15px;
  background:#fff0c9;
  border:2px solid #ead7ae;
  color:#4b3525;
  text-align:center;
  font-size:13px;
  font-weight:800;
  line-height:1.6;
  position:relative;
  z-index:10;
  box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.birth-line{
  display:block;
}


/* ==================================================
   게임 화면
================================================== */

#gameScreen{
  padding-bottom:30px;
}

.sticky-top{
  position:sticky;
  top:0;
  z-index:50;
  background:#fffaf2;
  box-shadow:0 3px 12px rgba(80,50,20,.08);
}

#potatoWrap{
  width:100%;
  height:190px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:visible;
}

#potatoImage{
  width:150px;
  max-width:55%;
  height:auto;
  object-fit:contain;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  position:relative;
  z-index:3;
}


/* ==================================================
   감자 애니메이션
================================================== */

.potato-jump{
  animation:potatoJump .55s ease;
}

@keyframes potatoJump{
  0%{transform:translateY(0) scale(1);}
  35%{transform:translateY(-45px) scale(1.05);}
  65%{transform:translateY(-20px) scale(.98);}
  100%{transform:translateY(0) scale(1);}
}

.potato-shy{
  animation:potatoShy .7s ease;
}

@keyframes potatoShy{
  0%,100%{transform:rotate(0);}
  20%{transform:rotate(-8deg) translateX(-4px);}
  40%{transform:rotate(8deg) translateX(4px);}
  60%{transform:rotate(-5deg);}
  80%{transform:rotate(5deg);}
}

.potato-wiggle{
  animation:potatoWiggle .55s ease;
}

@keyframes potatoWiggle{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-18px) rotate(-5deg);}
  50%{transform:translateX(18px) rotate(5deg);}
  75%{transform:translateX(-10px);}
}

.potato-angry{
  animation:potatoAngry .5s ease;
}

@keyframes potatoAngry{
  0%,100%{transform:scale(1);}
  25%{transform:scale(1.08) rotate(-4deg);}
  50%{transform:scale(1.08) rotate(4deg);}
  75%{transform:scale(1.05);}
}

.potato-happy{
  animation:potatoHappy .65s ease;
}

@keyframes potatoHappy{
  0%,100%{transform:rotate(0) scale(1);}
  25%{transform:rotate(-12deg) scale(1.08);}
  50%{transform:rotate(12deg) scale(1.08);}
  75%{transform:rotate(-8deg) scale(1.04);}
}

.potato-sleep{
  animation:potatoSleep 1s ease;
}

@keyframes potatoSleep{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(10px) scale(.96);}
}

.walking{
  animation:walking .9s ease-in-out;
}

@keyframes walking{
  0%{
    transform:translateX(0) rotate(0) scale(1);
  }
  20%{
    transform:translateX(-55px) rotate(-6deg) scale(1.04);
  }
  40%{
    transform:translateX(0) rotate(3deg) scale(.97);
  }
  60%{
    transform:translateX(55px) rotate(6deg) scale(1.04);
  }
  80%{
    transform:translateX(20px) rotate(-3deg) scale(.98);
  }
  100%{
    transform:translateX(0) rotate(0) scale(1);
  }
}


/* ==================================================
   하트 / 효과
================================================== */

.touch-heart{
  position:absolute;
  font-size:28px;
  pointer-events:none;
  animation:heartFloat 1s ease forwards;
  z-index:20;
}

@keyframes heartFloat{
  0%{
    opacity:1;
    transform:translateY(0) scale(.7);
  }
  100%{
    opacity:0;
    transform:translateY(-80px) scale(1.3);
  }
}

.touch-sparkle{
  position:absolute;
  pointer-events:none;
  font-size:24px;
  animation:sparkleFloat .8s ease forwards;
  z-index:20;
}

@keyframes sparkleFloat{
  0%{
    opacity:1;
    transform:scale(.5) rotate(0);
  }
  100%{
    opacity:0;
    transform:scale(1.5) rotate(180deg) translateY(-35px);
  }
}

.walk-effect{
  position:absolute;
  font-size:28px;
  animation:walkEffect 1s ease forwards;
  pointer-events:none;
  z-index:10;
}

@keyframes walkEffect{
  0%{
    opacity:1;
    transform:translateY(0) scale(.8);
  }
  50%{
    opacity:1;
    transform:translateY(-15px) scale(1);
  }
  100%{
    opacity:0;
    transform:translateY(-35px) scale(.7);
  }
}


/* ==================================================
   스탯
================================================== */

.info{
  padding:8px 16px 0;
}

.potato-name{
  text-align:center;
  font-size:24px;
  font-weight:1000;
  margin:4px 0 5px;
}

.personality{
  text-align:center;
  color:#806b58;
  font-size:12px;
  font-weight:800;
  margin-bottom:16px;
}

.stat{
  margin-bottom:12px;
}

.stat-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
  font-size:12px;
  font-weight:800;
}

.stat-bar{
  width:100%;
  height:12px;
  background:#eadcc6;
  border-radius:20px;
  overflow:hidden;
}

.stat-fill{
  height:100%;
  width:0%;
  border-radius:20px;
  transition:width .3s ease;
}


/* ==================================================
   버튼
================================================== */

.action-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:20px 16px 24px;
}

.action-button{
  min-height:56px;
  padding:12px 8px;
  border-radius:15px;
  background:#eadcc6;
  color:#4b3525;
  font-size:14px;
  font-weight:900;
  line-height:1.3;
  box-shadow:0 3px 0 #d1bea3;
}

.action-button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #d1bea3;
}

.action-button.harvest{
  background:#c98745;
  color:white;
  box-shadow:0 3px 0 #9f6330;
}


/* ==================================================
   생활 / 감자사전
================================================== */

.life-header{
  padding:18px 16px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.life-title{
  font-size:23px;
  font-weight:1000;
}

.life-day{
  padding:7px 11px;
  border-radius:10px;
  background:#eadcc6;
  color:#6b4b35;
  font-size:11px;
  font-weight:900;
}

.grow-back-button{
  display:block;
  width:calc(100% - 32px);
  margin:0 16px 14px;
  padding:13px;
  border-radius:14px;
  background:#c98745;
  color:white;
  font-size:14px;
  font-weight:900;
  box-shadow:0 3px 0 #9f6330;
}

.grow-back-button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #9f6330;
}


/* ==================================================
   방
================================================== */

.room-title{
  text-align:center;
  font-size:18px;
  font-weight:1000;
  margin:4px 0 5px;
}

.room-subtitle{
  text-align:center;
  color:#806b58;
  font-size:11px;
  font-weight:700;
  margin-bottom:12px;
}

.room{
  width:calc(100% - 24px);
  height:330px;
  margin:0 12px 12px;
  position:relative;
  overflow:hidden;
  border:7px solid #513725;
  border-radius:10px;
  background:#d7b78f;
  box-shadow:
    inset 0 0 0 4px #b68d63,
    inset 0 0 0 7px #ead2ad,
    0 6px 0 #382519;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
}

.room::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:30;
  opacity:.22;
  background-image:
    linear-gradient(
      rgba(81,55,37,.07) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(81,55,37,.07) 1px,
      transparent 1px
    );
  background-size:4px 4px;
}

.room-floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:105px;
  background:
    repeating-linear-gradient(
      0deg,
      #a97850 0px,
      #a97850 7px,
      #b9865b 7px,
      #b9865b 14px
    );
  border-top:5px solid #805335;
}

.room-wall{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:110px;
  background:
    repeating-linear-gradient(
      0deg,
      #d9bd98 0px,
      #d9bd98 19px,
      #c8a77c 19px,
      #c8a77c 22px
    );
}

.room-window{
  position:absolute;
  top:25px;
  left:50%;
  transform:translateX(-50%);
  width:105px;
  height:65px;
  background:#c6d0c8;
  border:6px solid #704a31;
  box-shadow:inset 0 0 0 4px #e5d5bb;
  z-index:4;
}

.room-window::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:5px;
  background:#704a31;
  transform:translateX(-50%);
}

.room-window::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:5px;
  background:#704a31;
  transform:translateY(-50%);
}

.furniture{
  position:absolute;
  z-index:5;
}


/* ==================================================
   가구
================================================== */

.sofa{
  left:20px;
  bottom:45px;
  width:125px;
  height:65px;
  background:#8d6042;
  border:6px solid #60402c;
  border-radius:10px;
  box-shadow:
    inset 0 9px 0 #aa7854,
    5px 5px 0 #68442e;
}

.sofa::before,
.sofa::after{
  content:"";
  position:absolute;
  bottom:-15px;
  width:12px;
  height:15px;
  background:#543622;
}

.sofa::before{
  left:12px;
}

.sofa::after{
  right:12px;
}

.table{
  right:25px;
  bottom:48px;
  width:80px;
  height:48px;
  background:#9a673f;
  border:5px solid #60402c;
}

.table::before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  bottom:-35px;
  height:35px;
  border-left:7px solid #60402c;
  border-right:7px solid #60402c;
}

.kitchen-counter{
  left:18px;
  bottom:48px;
  width:150px;
  height:90px;
  background:#9b6b46;
  border:6px solid #60402c;
  box-shadow:inset 0 13px 0 #b9845a;
}

.kitchen-counter::before{
  content:"";
  position:absolute;
  left:15px;
  top:25px;
  width:48px;
  height:35px;
  background:#6d4831;
  border:5px solid #513523;
}

.kitchen-counter::after{
  content:"";
  position:absolute;
  right:15px;
  top:24px;
  width:35px;
  height:35px;
  background:#c3b095;
  border:5px solid #6b4932;
}

.fridge{
  right:20px;
  top:55px;
  width:65px;
  height:135px;
  background:#d7c5a9;
  border:6px solid #60402c;
}

.fridge::before{
  content:"";
  position:absolute;
  top:67px;
  left:0;
  right:0;
  height:5px;
  background:#8b6548;
}

.fridge::after{
  content:"";
  position:absolute;
  right:8px;
  top:25px;
  width:5px;
  height:25px;
  background:#60402c;
}

.bed{
  left:22px;
  bottom:42px;
  width:175px;
  height:105px;
  background:#cda66f;
  border:7px solid #60402c;
  border-radius:10px 10px 4px 4px;
  box-shadow:inset 0 15px 0 #e5c89c;
}

.bed::before{
  content:"";
  position:absolute;
  left:12px;
  top:10px;
  width:45px;
  height:35px;
  background:#f0ddbc;
  border:4px solid #8c684b;
}

.bed::after{
  content:"Z z";
  position:absolute;
  right:-55px;
  top:-25px;
  color:#76513a;
  font-family:"Courier New",monospace;
  font-size:20px;
  font-weight:900;
}

.bedside{
  right:22px;
  bottom:45px;
  width:70px;
  height:65px;
  background:#8e6041;
  border:6px solid #60402c;
}

.bath-tile{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      transparent 49%,
      rgba(112,74,49,.13) 50%,
      transparent 51%
    ),
    linear-gradient(
      0deg,
      transparent 49%,
      rgba(112,74,49,.13) 50%,
      transparent 51%
    );
  background-size:45px 45px;
}

.toilet{
  right:35px;
  bottom:48px;
  width:90px;
  height:95px;
  background:#eee1ca;
  border:6px solid #60402c;
  border-radius:20px 20px 30px 30px;
}

.toilet::before{
  content:"";
  position:absolute;
  left:18px;
  top:-42px;
  width:45px;
  height:42px;
  background:#eee1ca;
  border:6px solid #60402c;
  border-bottom:0;
}

.sink{
  left:28px;
  bottom:65px;
  width:105px;
  height:65px;
  background:#e8d9bd;
  border:6px solid #60402c;
}

.sink::before{
  content:"";
  position:absolute;
  left:42px;
  top:-30px;
  width:15px;
  height:30px;
  border-left:6px solid #60402c;
  border-top:6px solid #60402c;
}

.mirror{
  left:45px;
  top:25px;
  width:80px;
  height:65px;
  background:#b8c4c0;
  border:6px solid #60402c;
}


/* ==================================================
   방 픽셀 감자
   중요: 이미지가 아니라 canvas만 사용
================================================== */

.room-potato-group{
  position:absolute;
  inset:0;
  z-index:16;
  pointer-events:none;
}

.room-friend{
  position:absolute;
  width:72px;
  height:72px;
  z-index:16;
  image-rendering:pixelated;
  transition:
    left .4s ease,
    top .4s ease,
    transform .4s ease;
}

.room-friend-name{
  position:absolute;
  z-index:20;
  transform:translateX(-50%);
  padding:3px 5px;
  background:#d7b78f;
  border:2px solid #60402c;
  color:#4b3525;
  font-family:"Courier New",monospace;
  font-size:7px;
  font-weight:900;
  line-height:1;
  white-space:nowrap;
}

.room-friend.bounce{
  animation:roomFriendBounce .55s ease;
}

@keyframes roomFriendBounce{
  0%,100%{
    transform:translateY(0);
  }
  40%{
    transform:translateY(-12px) rotate(-5deg) scale(1.08);
  }
  70%{
    transform:translateY(-3px) rotate(4deg);
  }
}


/* ==================================================
   방 아이템
================================================== */

.room-items{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:8px 12px 12px;
}

.room-item{
  min-height:62px;
  padding:8px 5px;
  border-radius:14px;
  background:#eadcc6;
  color:#4b3525;
  box-shadow:0 3px 0 #cbb497;
  font-size:12px;
  font-weight:900;
  line-height:1.35;
}

.room-item:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #cbb497;
}

.room-item.main{
  background:#c98745;
  color:white;
  box-shadow:0 3px 0 #9f6330;
}


/* ==================================================
   방 이동
================================================== */

.room-nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  padding:4px 12px 22px;
}

.room-nav-button{
  min-height:52px;
  padding:7px 3px;
  border-radius:13px;
  background:#dbc5a5;
  color:#5a3d2b;
  box-shadow:0 3px 0 #b59a78;
  font-size:11px;
  font-weight:900;
}

.room-nav-button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #b59a78;
}

.room-nav-button.active{
  background:#8f5d3d;
  color:white;
  box-shadow:0 3px 0 #65402a;
}


/* ==================================================
   효과
================================================== */

.item-effect{
  position:absolute;
  z-index:45;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation:itemEffect .9s ease forwards;
}

.item-effect canvas{
  width:52px;
  height:52px;
  image-rendering:pixelated;
}

@keyframes itemEffect{
  0%{
    opacity:0;
    transform:translate(-50%,-20%) scale(.5);
  }
  30%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-100%) scale(.8);
  }
}


/* ==================================================
   도감
================================================== */

.collection-section-title{
  text-align:center;
  font-size:18px;
  font-weight:1000;
  margin:8px 0 7px;
}

.collection-section-subtitle{
  text-align:center;
  color:#806b58;
  font-size:11px;
  margin-bottom:12px;
}

.collection-count{
  text-align:center;
  margin:0 16px 18px;
  padding:12px;
  background:#fff0c9;
  border-radius:14px;
  font-size:14px;
  font-weight:900;
}

.collection-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:0 16px 30px;
}

.collection-card{
  min-height:210px;
  background:#fff;
  border:2px solid #eadcc6;
  border-radius:18px;
  padding:14px 10px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.collection-card canvas{
  width:115px;
  height:115px;
  image-rendering:pixelated;
}

.collection-question{
  font-size:65px;
  height:115px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.collection-name{
  font-size:15px;
  font-weight:1000;
  margin-top:6px;
}

.collection-status{
  margin-top:5px;
  font-size:11px;
  color:#806b58;
  line-height:1.4;
}


/* ==================================================
   놀이터
================================================== */

.play-potato{
  position:absolute;
  width:58px;
  height:58px;
  z-index:35;
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  image-rendering:pixelated;
  transition:filter .15s ease;
}

.play-potato.dragging{
  filter:
    drop-shadow(0 4px 0 rgba(80,45,20,.3))
    brightness(1.08);
  transform:scale(1.12);
}

.play-potato-name{
  pointer-events:none;
}

.play-touch{
  animation:playTouch .35s ease;
}

@keyframes playTouch{
  0%,100%{
    transform:scale(1);
  }
  40%{
    transform:scale(1.12);
  }
  70%{
    transform:scale(.95);
  }
}

.play-jump{
  animation:playJump .55s ease;
}

@keyframes playJump{
  0%,100%{
    transform:translateY(0) rotate(0);
  }
  40%{
    transform:translateY(-24px) rotate(-7deg) scale(1.08);
  }
  70%{
    transform:translateY(-8px) rotate(5deg);
  }
}

.play-shy{
  animation:playShy .55s ease;
}

@keyframes playShy{
  0%,100%{
    transform:translateX(0);
  }
  25%{
    transform:translateX(-10px) rotate(-5deg);
  }
  50%{
    transform:translateX(10px) rotate(5deg);
  }
  75%{
    transform:translateX(-5px);
  }
}

.play-spin{
  animation:playSpin .65s ease;
}

@keyframes playSpin{
  0%{
    transform:rotate(0) scale(1);
  }
  50%{
    transform:rotate(180deg) scale(1.1);
  }
  100%{
    transform:rotate(360deg) scale(1);
  }
}

.play-angry{
  animation:playAngry .45s ease;
}

@keyframes playAngry{
  0%,100%{
    transform:scale(1);
  }
  30%{
    transform:scale(1.12) rotate(-6deg);
  }
  60%{
    transform:scale(1.12) rotate(6deg);
  }
}

.play-stun{
  animation:playStun 1.5s ease;
}

@keyframes playStun{
  0%{
    transform:rotate(0);
    opacity:1;
  }
  20%{
    transform:rotate(-12deg);
  }
  40%{
    transform:rotate(12deg);
  }
  60%{
    transform:rotate(-8deg);
  }
  80%{
    transform:rotate(8deg);
  }
  100%{
    transform:rotate(0);
    opacity:.65;
  }
}

.play-effect{
  position:absolute;
  width:50px;
  height:50px;
  z-index:60;
  pointer-events:none;
  image-rendering:pixelated;
  animation:playEffect .8s ease forwards;
}

@keyframes playEffect{
  0%{
    opacity:0;
    transform:translate(-50%,-20%) scale(.5);
  }
  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-90%) scale(.75);
  }
}

.follow-indicator{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  z-index:40;
  padding:5px 9px;
  border-radius:10px;
  background:#fff0c9;
  border:2px solid #d9b77c;
  color:#65452f;
  font-size:10px;
  font-weight:900;
  pointer-events:none;
  animation:indicatorFade .35s ease;
}

@keyframes indicatorFade{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(-5px);
  }
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
}


/* ==================================================
   모달
================================================== */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:flex;
  align-items:center;

<script>


/* ==================================================
   감자 데이터
================================================== */

const potatoes = [

  {
    name:"꾼감자",
    image:"Potato1.PNG",
    style:"social"
  },

  {
    name:"대장감자",
    image:"Potato2.PNG",
    style:"leader"
  },

  {
    name:"독감자",
    image:"Potato3.PNG",
    style:"poison"
  },

  {
    name:"폭력감자",
    image:"Potato4.PNG",
    style:"violent"
  },

  {
    name:"저능감자",
    image:"Potato5.PNG",
    style:"silly"
  }

];


const personalities = [

  "애교쟁이",
  "느긋한",
  "장난꾸러기",
  "호기심 많은",
  "겁이 많은"

];


const STORAGE_KEY =
  "POTATO_GAME_FINAL_V5";


/* ==================================================
   게임 상태
================================================== */

let state = {

  started:false,

  startDate:null,

  born:false,

  growth:0,

  character:null,

  personality:null,

  hunger:100,

  water:100,

  love:50,

  energy:100,

  cleanliness:100,

  collection:[]

};


let currentRoom =
  "living";


let playgroundTimer =
  null;

let playgroundPotatoes =
  [];

let leaderFollowing =
  false;

let followTarget =
  null;


/* ==================================================
   저장
================================================== */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* ==================================================
   불러오기
================================================== */

function load(){

  let saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if(!saved){

    const oldKeys = [

      "POTATO_GAME_FINAL_V4",
      "POTATO_GAME_FINAL_V3",
      "POTATO_GAME_FINAL_V2"

    ];


    for(
      const key of oldKeys
    ){

      const oldData =
        localStorage.getItem(
          key
        );


      if(oldData){

        saved =
          oldData;

        break;

      }

    }

  }


  if(!saved){
    return;
  }


  try{

    const parsed =
      JSON.parse(saved);


    state = {
      ...state,
      ...parsed
    };


    if(
      !Array.isArray(
        state.collection
      )
    ){

      state.collection = [];

    }


    if(
      typeof state.cleanliness !== "number"
    ){

      state.cleanliness = 100;

    }

  }
  catch(error){

    console.log(
      "저장 데이터 불러오기 실패"
    );

  }

}


/* ==================================================
   날짜
================================================== */

function ensureStartDate(){

  if(
    state.started &&
    !state.startDate
  ){

    state.startDate =
      new Date().toISOString();

    save();

  }

}


function getDayCount(){

  if(!state.startDate){
    return 1;
  }


  const start =
    new Date(
      state.startDate
    );


  const today =
    new Date();


  const startDay =
    new Date(
      start.getFullYear(),
      start.getMonth(),
      start.getDate()
    );


  const todayDay =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );


  return Math.max(
    1,
    Math.floor(
      (
        todayDay.getTime() -
        startDay.getTime()
      ) / 86400000
    ) + 1
  );

}


function updateDayCount(){

  const day =
    getDayCount();


  const gameDay =
    document.getElementById(
      "dayCount"
    );


  const lifeDay =
    document.getElementById(
      "lifeDay"
    );


  const growthDay =
    document.getElementById(
      "growthDay"
    );


  if(gameDay){
    gameDay.innerText =
      `${day}일차`;
  }


  if(lifeDay){
    lifeDay.innerText =
      `${day}일차`;
  }


  if(growthDay){
    growthDay.innerText =
      `${day}일차`;
  }

}


/* ==================================================
   화면 전환
================================================== */

function hideAllScreens(){

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("beforeScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.add("hidden");

  document
    .getElementById("collectionScreen")
    .classList.add("hidden");

}


function startGame(){

  state.started = true;


  if(!state.startDate){

    state.startDate =
      new Date().toISOString();

  }


  save();

  showBeforeScreen();

}


function showBeforeScreen(){

  hideAllScreens();

  document
    .getElementById("beforeScreen")
    .classList.remove("hidden");


  updateGrowth();

  updateDayCount();

}


function showGameScreen(){

  hideAllScreens();

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");


  updateCharacter();

  updateStats();

  updateDayCount();

}


function showCollection(){

  hideAllScreens();

  document
    .getElementById("collectionScreen")
    .classList.remove("hidden");


  updateDayCount();

  renderCollection();

  changeRoom(
    currentRoom
  );

}


function backToGame(){

  stopPlayground();

  showGameScreen();

}


/* ==================================================
   성장
================================================== */

function addGrowth(amount){

  if(state.born){
    return;
  }


  state.growth += amount;


  if(
    state.growth > 100
  ){

    state.growth = 100;

  }


  save();

  updateGrowth();


  const messages = [

    "조금씩 자라고 있어요!",
    "감자가 힘을 내고 있어요!",
    "쑥쑥 자라는 중이에요!",
    "조금만 더 힘내요!",
    "땅속에서 무언가 움직여요..."

  ];


  document
    .getElementById(
      "beforeMessage"
    )
    .innerText =

      messages[
        Math.floor(
          Math.random() *
          messages.length
        )
      ];


  if(
    state.growth >= 100
  ){

    setTimeout(
      hatchPotato,
      500
    );

  }

}


function updateGrowth(){

  const percent =
    state.growth;


  document
    .getElementById(
      "growthPercent"
    )
    .innerText =
      `성장도 ${percent}%`;


  document
    .getElementById(
      "growthBar"
    )
    .style.width =
      `${percent}%`;


  const emoji =
    document.getElementById(
      "growthEmoji"
    );


  if(percent < 25){

    emoji.innerText =
      "🌱";

  }
  else if(percent < 50){

    emoji.innerText =
      "🌿";

  }
  else if(percent < 75){

    emoji.innerText =
      "🌳";

  }
  else{

    emoji.innerText =
      "🥔";

  }

}


/* ==================================================
   감자 탄생
================================================== */

function hatchPotato(){

  if(state.born){
    return;
  }


  const character =
    potatoes[
      Math.floor(
        Math.random() *
        potatoes.length
      )
    ];


  const personality =
    personalities[
      Math.floor(
        Math.random() *
        personalities.length
      )
    ];


  state.born = true;

  state.character =
    character;

  state.personality =
    personality;

  state.hunger = 100;
  state.water = 100;
  state.love = 50;
  state.energy = 100;
  state.cleanliness = 100;


  save();

  showGameScreen();


  document
    .getElementById("messageLine1")
    .innerText =
      `🥔 ${character.name}가 태어났어요!`;


  document
    .getElementById("messageLine2")
    .innerText =
      `성격은 ${personality}이에요!`;

}


/* ==================================================
   감자 정보
================================================== */

function updateCharacter(){

  if(!state.character){
    return;
  }


  const image =
    document.getElementById(
      "potatoImage"
    );


  /*
    여기만 원본 이미지 사용.
    다른 화면에서는 이 이미지를 사용하지 않는다.
  */

  image.src =
    state.character.image;


  image.alt =
    state.character.name;


  document
    .getElementById("potatoName")
    .innerText =

/* ==================================================
   픽셀 캔버스
================================================== */

function createPixelPotato(
  src,
  callback
){

  const source =
    new Image();


  source.onload = () => {

    const small =
      document.createElement(
        "canvas"
      );


    small.width = 24;
    small.height = 24;


    const ctx =
      small.getContext(
        "2d",
        {
          willReadFrequently:true
        }
      );


    ctx.imageSmoothingEnabled =
      false;


    ctx.clearRect(
      0,
      0,
      24,
      24
    );


    ctx.drawImage(
      source,
      0,
      0,
      24,
      24
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        24,
        24
      );


    const pixels =
      imageData.data;


    for(
      let i = 0;
      i < pixels.length;
      i += 4
    ){

      const r =
        pixels[i];

      const g =
        pixels[i + 1];

      const b =
        pixels[i + 2];

      const a =
        pixels[i + 3];


      if(a < 30){

        pixels[i + 3] =
          0;

        continue;

      }


      const brightness =
        (
          r * .299 +
          g * .587 +
          b * .114
        );


      let nr;
      let ng;
      let nb;


      if(brightness > 220){

        nr = 242;
        ng = 219;
        nb = 185;

      }
      else if(brightness > 185){

        nr = 215;
        ng = 178;
        nb = 134;

      }
      else if(brightness > 145){

        nr = 184;
        ng = 142;
        nb = 96;

      }
      else if(brightness > 95){

        nr = 132;
        ng = 88;
        nb = 58;

      }
      else if(brightness > 50){

        nr = 88;
        ng = 54;
        nb = 37;

      }
      else{

        nr = 52;
        ng = 31;
        nb = 23;

      }


      pixels[i] =
        nr;

      pixels[i + 1] =
        ng;

      pixels[i + 2] =
        nb;

    }


    ctx.putImageData(
      imageData,
      0,
      0
    );


    const finalCanvas =
      document.createElement(
        "canvas"
      );


    finalCanvas.width =
      72;

    finalCanvas.height =
      72;


    const finalCtx =
      finalCanvas.getContext(
        "2d"
      );


    finalCtx.imageSmoothingEnabled =
      false;


    finalCtx.clearRect(
      0,
      0,
      72,
      72
    );


    finalCtx.drawImage(
      small,
      0,
      0,
      24,
      24,
      0,
      0,
      72,
      72
    );


    callback(
      finalCanvas
    );

  };


  source.onerror = () => {

    callback(
      null
    );

  };


  source.src =
    src;

}

function createPixelEffectCanvas(
  symbol,
  size = 32
){

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    size;

  canvas.height =
    size;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.imageSmoothingEnabled =
    false;


  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  ctx.font =
    `${Math.floor(size * .72)}px Apple Color Emoji, Segoe UI Emoji, sans-serif`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.fillText(
    symbol,
    size / 2,
    size / 2 + 1
  );


  return canvas;

}

/* ==================================================
   다른 방의 픽셀 감자
================================================== */

function renderRoomPotatoes(){

  const group =
    document.getElementById(
      "roomPotatoGroup"
    );


  if(!group){
    return;
  }


  group.innerHTML =
    "";


  if(
    !state.collection ||
    state.collection.length === 0
  ){

    return;

  }


  const positions = [

    {
      left:20,
      top:185,
      rotate:-5
    },

    {
      left:46,
      top:220,
      rotate:4
    },

    {
      left:70,
      top:175,
      rotate:-3
    },

    {
      left:34,
      top:250,
      rotate:6
    },

    {
      left:61,
      top:255,
      rotate:-7
    }

  ];


  state.collection.forEach(
    (name,index) => {

      const potato =
        potatoes.find(
          p => p.name === name
        );


      if(!potato){
        return;
      }


      /*
        img가 아니라 canvas.
        따라서 주방/침실/화장실에는
        원본 이미지가 절대 나오지 않는다.
      */

      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.className =
        "room-friend";


      canvas.width =
        72;

      canvas.height =
        72;


      canvas.setAttribute(
        "aria-label",
        potato.name
      );


      const pos =
        positions[
          index %
          positions.length
        ];


      canvas.style.left =
        `${pos.left}%`;


      canvas.style.top =
        `${pos.top}px`;


      canvas.style.transform =
        `translateX(-50%) rotate(${pos.rotate}deg)`;


      const label =
        document.createElement(
          "div"
        );

function startPlayground(){

  const playground =
    document.getElementById(
      "room"
    );


  if(
    !playground ||
    currentRoom !== "living"
  ){

    return;

  }


  playgroundPotatoes = [];


  if(
    !state.collection ||
    state.collection.length === 0
  ){

    return;

  }


  playground.onselectstart =
    () => false;

  playground.oncopy =
    () => false;

  playground.oncut =
    () => false;

  playground.onpaste =
    () => false;

  playground.oncontextmenu =
    () => false;

    () => false;

  leaderFollowing =

/* ==================================================
   놀이터 픽셀 감자 생성
================================================== */

function createPlayPotato(
  potato,
  index
){

  const playground =
    document.getElementById(
      "room"
    );


  /*
    canvas로 생성.
    놀이터에는 원본 img가 존재하지 않는다.
  */

  const img =
    document.createElement(
      "canvas"
    );


  img.className =
    "play-potato";


  img.width =
    72;

  img.height =
    72;


  img.setAttribute(
    "aria-label",
    potato.name
  );


  img.setAttribute(
    "role",
    "img"
  );


  img.style.position =
    "absolute";


  img.style.width =
    "58px";


  img.style.height =
    "58px";


  img.style.zIndex =
    "35";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "play-potato-name";


  name.innerText =
    potato.name;


  name.style.position =
    "absolute";


  name.style.zIndex =
    "40";


  name.style.transform =
    "translateX(-50%)";


  name.style.padding =
    "3px 5px";


  name.style.background =
    "#d7b78f";


  name.style.border =
    "2px solid #60402c";


  name.style.color =
    "#4b3525";


  name.style.fontFamily =
    '"Courier New",monospace';


  name.style.fontSize =
    "7px";


  name.style.fontWeight =
    "900";


  name.style.lineHeight =
    "1";


  name.style.whiteSpace =
    "nowrap";


  name.style.pointerEvents =
    "none";


  playground.appendChild(
    img
  );


  playground.appendChild(
    name
  );


  const width =
    playground.clientWidth;


  const height =
    playground.clientHeight;


  const actor = {

    data:potato,

    img:img,

    label:name,

    x:
      20 +
      Math.random() *
      Math.max(
        50,
        width - 85
      ),

    y:
      115 +
      Math.random() *
      Math.max(
        50,
        height - 205
      ),

    vx:
      (
        Math.random() * 2 - 1
      ) * 1.5,

    vy:
      (
        Math.random() * 2 - 1
      ) * 1.5,

    stunned:false,

    lastCollision:0,

    pressing:false,

    dragging:false,

    longPressTimer:null,

    suppressClick:false,

    isLeader:false

  };


  if(
    potato.style === "leader"
  ){

    actor.isLeader =
      true;

  }


  /*
    원본 이미지 → 픽셀 canvas
  */

  createPixelPotato(
    potato.image,
    canvas => {

      if(!canvas){
        return;
      }


      const ctx =
        img.getContext(
          "2d"
        );


      ctx.imageSmoothingEnabled =
        false;


      ctx.clearRect(
        0,
        0,
        72,
        72
      );


      ctx.drawImage(
        canvas,
        0,
        0,
        72,
        72
      );

    }
  );


  /* 짧게 터치 */

  img.addEventListener(
    "click",
    function(e){

      e.preventDefault();

      e.stopPropagation();


      if(
        actor.suppressClick
      ){

        actor.suppressClick =
          false;

        return;

      }


      playPotatoTouch(
        actor
      );

    }
  );


  /* 길게 누르기 */

  img.addEventListener(
    "pointerdown",
    function(e){

      if(
        actor.stunned
      ){

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      actor.pressing =
        true;


      actor.longPressTimer =
        setTimeout(
          () => {

            if(
              !actor.pressing
            ){

              return;

            }


            if(
              actor.isLeader
            ){

              actor.suppressClick =
                true;

              toggleLeaderFollow(
                actor
              );

              actor.pressing =
                false;

              actor.longPressTimer =
                null;

              return;

            }


            actor.dragging =
              true;


            actor.suppressClick =
              true;


            img.classList.add(
              "dragging"
            );


            try{

              img.setPointerCapture(
                e.pointerId
              );

            }
            catch(error){}

          },
          450
        );

    }
  );


  /* 드래그 */

  img.addEventListener(
    "pointermove",
    function(e){

      if(
        !actor.dragging
      ){

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      const rect =
        playground.getBoundingClientRect();


      actor.x =
        e.clientX -
        rect.left -
        29;


      actor.y =
        e.clientY -
        rect.top -
        29;


      keepInside(
        actor
      );


      updateActorPosition(
        actor
      );

    }
  );


  function releasePotato(e){

    actor.pressing =
      false;


    if(
      actor.longPressTimer
    ){

      clearTimeout(
        actor.longPressTimer
      );

      actor.longPressTimer =
        null;

    }


    if(
      actor.dragging
    ){

      actor.dragging =
        false;


      img.classList.remove(
        "dragging"
      );


      try{

        img.releasePointerCapture(
          e.pointerId
        );

      }
      catch(error){}


      updateActorPosition(
        actor
      );

    }

  }


  img.addEventListener(
    "pointerup",
    releasePotato
  );


  img.addEventListener(
    "pointercancel",
    releasePotato
  );


  playgroundPotatoes.push(
    actor
  );


  updateActorPosition(
    actor
  );

}


/* ==================================================
   대장감자
================================================== */

function toggleLeaderFollow(
  leader
){

  if(
    leaderFollowing &&
    followTarget === leader
  ){

    leaderFollowing =
      false;

    followTarget =
      null;


    showFollowIndicator(
      "따라오기 해제"
    );


    return;

  }


  leaderFollowing =
    true;

  followTarget =
    leader;


  showFollowIndicator(
    "대장감자를 따라가요!"
  );


  playActorAnimation(
    leader,
    "jump"
  );


  createPlayEffect(
    leader,
    "♥"
  );

}


function showFollowIndicator(
  text
){

  const playground =
    document.getElementById(
      "room"
    );


  if(!playground){
    return;
  }


  const old =
    playground.querySelector(
      ".follow-indicator"
    );


  if(old){
    old.remove();
  }


  const indicator =
    document.createElement(
      "div"
    );


  indicator.className =
    "follow-indicator";


  indicator.innerText =
    text;


  playground.appendChild(
    indicator
  );


  setTimeout(
    () => {

      if(indicator.parentNode){

        indicator.remove();

      }

    },
    1200
  );

}


/* ==================================================
   놀이터 감자 터치
================================================== */

function playPotatoTouch(
  actor
){

  if(
    !actor ||
    actor.stunned ||
    actor.dragging
  ){

    return;

  }


  actor.lastCollision =
    Date.now();


  actor.img.classList.remove(
    "play-touch",
    "play-jump",
    "play-shy",
    "play-spin",
    "play-angry"
  );


  void actor.img.offsetWidth;


  actor.img.classList.add(
    "play-touch"
  );


  const style =
    actor.data.style;


  let actions = [];


  if(style === "social"){

    actions = [
      "♥",
      "+",
      "*"
    ];

  }
  else if(style === "leader"){

    actions = [
      "*",
      "!",
      "+"
    ];

  }
  else if(style === "poison"){

    actions = [
      "X",
      "!",
      "@"
    ];

  }
  else if(style === "violent"){

    actions = [
      "!",
      "X",
      "*"
    ];

  }
  else{

    actions = [
      "?",
      "*",
      "!"
    ];

  }


  const effect =
    actions[
      Math.floor(
        Math.random() *
        actions.length
      )
    ];


  createPlayEffect(
    actor,
    effect
  );


  if(style === "social"){

    playActorAnimation(
      actor,
      "heart"
    );

  }
  else if(style === "leader"){

    playActorAnimation(
      actor,
      "spin"
    );

  }
  else if(style === "poison"){

    playActorAnimation(
      actor,
      "angry"
    );

  }
  else if(style === "violent"){

    playActorAnimation(
      actor,
      "angry"
    );

  }
  else{

    playActorAnimation(
      actor,
      "jump"
    );

  }

}


/* ==================================================
   위치
================================================== */

function updateActorPosition(
  actor
){

  const playground =
    document.getElementById(
      "room"
    );


  if(!playground){
    return;
  }


  const maxX =
    playground.clientWidth - 65;


  const maxY =
    playground.clientHeight - 105;


  actor.x =
    Math.max(
      8,
      Math.min(
        maxX,
        actor.x
      )
    );


  actor.y =
    Math.max(
      115,
      Math.min(
        maxY,
        actor.y
      )
    );


  actor.img.style.left =
    `${actor.x}px`;


  actor.img.style.top =
    `${actor.y}px`;


  actor.label.style.left =
    `${actor.x + 29}px`;


  actor.label.style.top =
    `${actor.y + 58}px`;

}


/* ==================================================
   놀이터 AI
================================================== */

function playgroundTick(){

  const playground =
    document.getElementById(
      "room"
    );


  if(
    !playground ||
    currentRoom !== "living"
  ){

    return;

  }


  playgroundPotatoes.forEach(
    actor => {

      if(
        actor.stunned ||
        actor.dragging
      ){

        updateActorPosition(
          actor
        );

        return;

      }


      if(
        leaderFollowing &&
        followTarget &&
        !actor.isLeader
      ){

        const leader =
          followTarget;


        const leaderIndex =
          playgroundPotatoes.indexOf(
            actor
          );


        const angle =
          leaderIndex * 2.1;


        const followDistance =
          55 +
          leaderIndex * 8;


        const targetX =
          leader.x +
          Math.cos(angle) *
          followDistance;


        const targetY =
          leader.y +
          Math.sin(angle) *
          followDistance;


        moveToward(
          actor,
          targetX,
          targetY,
          1.7
        );


        randomAction(
          actor,
          ["jump"],
          .012
        );


        keepInside(
          actor
        );


        updateActorPosition(
          actor
        );


        return;

      }


      const style =
        actor.data.style;


      if(style === "social"){

        const target =
          getNearestOther(
            actor
          );


        if(target){

          moveToward(
            actor,
            target.x,
            target.y,
            .8
          );

        }


        randomAction(
          actor,
          [
            "jump",
            "heart"
          ],
          .025
        );

      }


      else if(style === "leader"){

        const centerX =
          playground.clientWidth / 2;


        const centerY =
          170;


        moveToward(
          actor,
          centerX - 29,
          centerY,
          .45
        );


        randomAction(
          actor,
          [
            "jump",
            "spin"
          ],
          .015
        );

      }


      else if(style === "poison"){

        actor.x +=
          actor.vx;

        actor.y +=
          actor.vy;


        if(
          Math.random() < .035
        ){

          actor.vx =
            (
              Math.random() * 2 - 1
            ) * 1.5;

          actor.vy =
            (
              Math.random() * 2 - 1
            ) * 1.5;

        }


        randomAction(
          actor,
          ["angry"],
          .025
        );

      }


      else if(style === "violent"){

        const target =
          getNearestOther(
            actor
          );


        if(target){

          moveToward(
            actor,
            target.x,
            target.y,
            1.8
          );

        }


        randomAction(
          actor,
          [
            "angry",
            "jump"
          ],
          .035
        );

      }


      else if(style === "silly"){

        actor.x +=
          actor.vx;

        actor.y +=
          actor.vy;


        if(
          Math.random() < .025
        ){

          actor.vx =
            (
              Math.random() * 2 - 1
            ) * 2;

          actor.vy =
            (
              Math.random() * 2 - 1
            ) * 2;

        }


        randomAction(
          actor,
          [
            "spin",
            "jump"
          ],
          .02
        );

      }


      keepInside(
        actor
      );


      updateActorPosition(
        actor
      );

    }
  );


  checkPlaygroundCollisions();

}


/* ==================================================
   다른 감자
================================================== */

function getNearestOther(
  actor
){

  let nearest =
    null;


  let distance =
    Infinity;


  playgroundPotatoes.forEach(
    other => {

      if(
        other === actor ||
        other.stunned ||
        other.dragging
      ){

        return;

      }


      const dx =
        other.x -
        actor.x;


      const dy =
        other.y -
        actor.y;


      const d =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if(d < distance){

        distance =
          d;

        nearest =
          other;

      }

    }
  );


  return nearest;

}


/* ==================================================
   이동
================================================== */

function moveToward(
  actor,
  tx,
  ty,
  speed
){

  const dx =
    tx -
    actor.x;


  const dy =
    ty -
    actor.y;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if(
    distance < 5
  ){

    return;

  }


  actor.x +=
    dx / distance *
    speed;


  actor.y +=
    dy / distance *
    speed;

}


/* ==================================================
   화면 밖 방지
================================================== */

function keepInside(
  actor
){

  const playground =
    document.getElementById(
      "room"
    );


  if(!playground){
    return;
  }


  const maxX =
    playground.clientWidth - 65;


  const maxY =
    playground.clientHeight - 105;


  if(
    actor.x <= 8 ||
    actor.x >= maxX
  ){

    actor.vx *= -1;

  }


  if(
    actor.y <= 115 ||
    actor.y >= maxY
  ){

    actor.vy *= -1;

  }


  actor.x =
    Math.max(
      8,
      Math.min(
        maxX,
        actor.x
      )
    );


  actor.y =
    Math.max(
      115,
      Math.min(
        maxY,
        actor.y
      )
    );

}


/* ==================================================
   랜덤 행동
================================================== */

function randomAction(
  actor,
  actions,
  chance
){

  if(
    Math.random() > chance
  ){

    return;

  }


  const action =
    actions[
      Math.floor(
        Math.random() *
        actions.length
      )
    ];


  playActorAnimation(
    actor,
    action
  );

}


/* ==================================================
   행동 애니메이션
================================================== */

function playActorAnimation(
  actor,
  action
){

  if(
    actor.dragging
  ){

    return;

  }


  actor.img.classList.remove(

    "play-jump",
    "play-shy",
    "play-spin",
    "play-angry"

  );


  void actor.img.offsetWidth;


  if(action === "jump"){

    actor.img.classList.add(
      "play-jump"
    );

  }


  if(action === "shy"){

    actor.img.classList.add(
      "play-shy"
    );

  }


  if(action === "spin"){

    actor.img.classList.add(
      "play-spin"
    );

  }


  if(action === "angry"){

    actor.img.classList.add(
      "play-angry"
    );

  }


  if(action === "heart"){

    createPlayEffect(
      actor,
      "♥"
    );

  }

}


/* ==================================================
   충돌
================================================== */

function checkPlaygroundCollisions(){

  const now =
    Date.now();


  for(
    let i = 0;
    i < playgroundPotatoes.length;
    i++
  ){

    for(
      let j = i + 1;
      j < playgroundPotatoes.length;
      j++
    ){

      const a =
        playgroundPotatoes[i];


      const b =
        playgroundPotatoes[j];


      if(
        a.stunned ||
        b.stunned ||
        a.dragging ||
        b.dragging
      ){

        continue;

      }


      const dx =
        b.x -
        a.x;


      const dy =
        b.y -
        a.y;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if(
        distance < 45
      ){

        if(
          now - a.lastCollision < 1200 ||
          now - b.lastCollision < 1200
        ){

          continue;

        }


        a.lastCollision =
          now;

        b.lastCollision =
          now;


        const angle =
          Math.atan2(
            dy,
            dx
          );


        a.x -=
          Math.cos(angle) *
          10;


        a.y -=
          Math.sin(angle) *
          10;


        b.x +=
          Math.cos(angle) *
          10;


        b.y +=
          Math.sin(angle) *
          10;


        createCollisionEffect(
          a,
          b
        );


        if(
          a.data.style === "poison" &&
          b.data.style !== "poison"
        ){

          if(
            Math.random() < .3
          ){

            stunPotato(
              b,
              a
            );

          }
          else{

            playActorAnimation(
              a,
              "angry"
            );

            playActorAnimation(
              b,
              "shy"
            );

          }

        }
        else if(
          b.data.style === "poison" &&
          a.data.style !== "poison"
        ){

          if(
            Math.random() < .3
          ){

            stunPotato(
              a,
              b
            );

          }
          else{

            playActorAnimation(
              b,
              "angry"
            );

            playActorAnimation(
              a,
              "shy"
            );

          }

        }
        else if(
          a.data.style === "violent" &&
          b.data.style !== "violent"
        ){

          playActorAnimation(
            a,
            "angry"
          );

          playActorAnimation(
            b,
            "shy"
          );

        }
        else if(
          b.data.style === "violent" &&
          a.data.style !== "violent"
        ){

          playActorAnimation(
            b,
            "angry"
          );

          playActorAnimation(
            a,
            "shy"
          );

        }
        else{

          playActorAnimation(
            a,
            "jump"
          );

          playActorAnimation(
            b,
            "jump"
          );

        }

      }

    }

  }

}


/* ==================================================
   독감자 공격
================================================== */

function stunPotato(
  victim,
  attacker
){

  victim.stunned =
    true;


  victim.img.classList.remove(
    "play-stun"
  );


  void victim.img.offsetWidth;


  victim.img.classList.add(
    "play-stun"
  );


  createPlayEffect(
    victim,
    "X"
  );


  createPlayEffect(
    victim,
    "?"
  );


  playActorAnimation(
    attacker,
    "angry"
  );


  setTimeout(
    () => {

      victim.stunned =
        false;


      victim.img.classList.remove(
        "play-stun"
      );


      createPlayEffect(
        victim,
        "*"
      );

    },
    1500
  );

}


/* ==================================================
   충돌 효과
================================================== */

function createCollisionEffect(
  a,
  b
){

  const x =
    (
      a.x +
      b.x
    ) / 2;


  const y =
    (
      a.y +
      b.y
    ) / 2;


  const playground =
    document.getElementById(
      "room"
    );


  if(!playground){
    return;
  }


  const effect =
    document.createElement(
      "div"
    );


  effect.className =
    "play-effect";


  effect.style.left =
    `${x + 29}px`;


  effect.style.top =
    `${y + 29}px`;


  const canvas =
    createPixelEffectCanvas(
      "X",
      24
    );


  effect.appendChild(
    canvas
  );


  playground.appendChild(
    effect
  );


  setTimeout(
    () => {

      effect.remove();

    },
    800
  );

}


/* ==================================================
   놀이터 효과
================================================== */

function createPlayEffect(
  actor,
  symbol
){

  const playground =
    document.getElementById(
      "room"
    );


  if(!playground){
    return;
  }


  const effect =
    document.createElement(
      "div"
    );


  effect.className =
    "play-effect";


  effect.style.left =
    `${actor.x + 29}px`;


  effect.style.top =
    `${actor.y + 20}px`;


  const canvas =
    createPixelEffectCanvas(
      symbol,
      24
    );


  effect.appendChild(
    canvas
  );


  playground.appendChild(
    effect
  );


  setTimeout(
    () => {

      effect.remove();

    },
    850
  );

}


/* ==================================================
   모달
================================================== */

function openModal(
  title,
  text
){

  document
    .getElementById(
      "modalTitle"
    )
    .innerHTML =
      title;


  document
    .getElementById(
      "modalText"
    )
    .innerHTML =
      text;


  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "hidden"
    );

}


function closeModal(){

  document
    .getElementById(
      "modal"
    )
    .classList.add(
      "hidden"
    );

}


/* ==================================================
   수확
================================================== */

function harvest(){

  if(
    !state.born ||
    !state.character
  ){

    return;

  }


  const character =
    state.character;


  const isNew =
    !state.collection.includes(
      character.name
    );


  if(isNew){

    state.collection.push(
      character.name
    );

  }


  leaderFollowing =
    false;

  followTarget =
    null;


  state.born =
    false;

  state.growth =
    0;

  state.character =
    null;

  state.personality =
    null;

  state.hunger =
    100;

  state.water =
    100;

  state.love =
    50;

  state.energy =
    100;

  state.cleanliness =
    100;


  save();

  showBeforeScreen();


  if(isNew){

    openModal(

      "🥔 새로운 감자 발견!",

      `${character.name}를 수확했어요!<br><br>
       도감에 등록되었습니다.<br>
       이제 모든 방에서 ${character.name}를 볼 수 있어요.`

    );

  }
  else{

    document
      .getElementById(
        "beforeMessage"
      )
      .innerText =
        `${character.name}는 이미 도감에 등록되어 있어요!`;

  }

}


/* ==================================================
   자동 감소
================================================== */

setInterval(
  () => {

    if(!state.born){
      return;
    }


    state.hunger -= 2;
    state.water -= 2;
    state.energy -= 1;
    state.cleanliness -= .5;


    state.hunger =
      Math.max(
        0,
        state.hunger
      );


    state.water =
      Math.max(
        0,
        state.water
      );


    state.energy =
      Math.max(
        0,
        state.energy
      );


    state.cleanliness =
      Math.max(
        0,
        state.cleanliness
      );


    save();

    updateStats();


    if(
      state.hunger <= 20
    ){

      showMessage(
        "hungry"
      );

    }
    else if(
      state.water <= 20
    ){

      showMessage(
        "thirsty"
      );

    }
    else if(
      state.energy <= 20
    ){

      showMessage(
        "tired"
      );

    }

  },
  10000
);


/* ==================================================
   초기 실행
================================================== */

load();

ensureStartDate();


if(state.born){

  showGameScreen();

}
else if(state.started){

  showBeforeScreen();

}
else{

  hideAllScreens();

  document
    .getElementById(
      "startScreen"
    )
    .classList.remove(
      "hidden"
    );

}

</script>
