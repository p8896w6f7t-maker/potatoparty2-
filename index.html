<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>감자키우기</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#f3ead7;
    font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    overflow-x:hidden;
    -webkit-touch-callout:none;
}

body{
    overscroll-behavior-x:none;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

img{
    -webkit-user-drag:none;
    user-select:none;
    -webkit-user-select:none;
    pointer-events:none;
}

#app{
    width:100%;
    min-height:100vh;
}

.screen{
    width:100%;
    min-height:100vh;
}

.hidden{
    display:none!important;
}

.page{
    width:min(600px,100%);
    min-height:100vh;
    margin:auto;
    background:#fffaf0;
}

button:active{
    transform:scale(.94);
}

/* 시작 */
#startScreen{
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at center,#fff9eb 0%,#f3dfb8 100%);
}

.startBox{
    text-align:center;
    padding:40px 25px;
}

.bigPotato{
    font-size:80px;
    animation:floatPotato 2s infinite ease-in-out;
}

@keyframes floatPotato{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

.gameTitle{
    font-size:34px;
    font-weight:900;
    margin:10px 0 25px;
}

.startBtn{
    padding:15px 55px;
    border-radius:18px;
    background:#76502e;
    color:white;
    font-size:20px;
    font-weight:900;
    box-shadow:0 6px 0 #50351f;
}

.startBtn:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #50351f;
}

/* 성장 */
.growPage{
    padding-bottom:30px;
}

.growHeader{
    padding:18px 18px 10px;
    text-align:center;
}

.growHeader h1{
    margin:0;
    font-size:25px;
}

.dayText{
    margin-top:5px;
    font-size:14px;
    color:#777;
}

.growArea{
    position:relative;
    height:360px;
    margin:10px 15px;
    overflow:hidden;
    border-radius:25px;
    background:linear-gradient(#bfe8ff 0 67%,#8fc66c 67% 100%);
    border:4px solid #725236;
}

.sun{
    position:absolute;
    top:25px;
    right:35px;
    font-size:45px;
    animation:sunPulse 2s infinite;
}

@keyframes sunPulse{
    50%{transform:scale(1.08)}
}

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:32%;
    background:repeating-linear-gradient(
        0deg,
        #8bc36a,
        #8bc36a 8px,
        #83ba62 8px,
        #83ba62 16px
    );
}

.growPotato{
    position:absolute;
    left:50%;
    bottom:20%;
    transform:translateX(-50%);
    width:150px;
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:100px;
    z-index:5;
}

.growPotato.jump{
    animation:potatoJump .6s ease;
}

@keyframes potatoJump{
    0%{
        transform:translateX(-50%) translateY(0) rotate(0);
    }
    35%{
        transform:translateX(-50%) translateY(-55px) rotate(-8deg);
    }
    70%{
        transform:translateX(-50%) translateY(-25px) rotate(8deg);
    }
    100%{
        transform:translateX(-50%) translateY(0) rotate(0);
    }
}

.growthInfo{
    padding:0 20px;
}

.growthTop{
    display:flex;
    justify-content:space-between;
    font-weight:800;
    margin-bottom:7px;
}

.progress{
    width:100%;
    height:20px;
    background:#e5d9c5;
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    background:#72ad50;
    border-radius:20px;
    transition:width .4s ease;
}

.growActions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:18px;
}

.actionBtn{
    padding:15px 8px;
    border-radius:15px;
    background:#f0e1c5;
    font-size:15px;
    font-weight:800;
}

/* 키우기 */
.petPage{
    min-height:100vh;
    position:relative;
    background:#fffaf0;
}

.petFixed{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:min(600px,100%);
    z-index:999;
    background:#fffaf0;
    box-shadow:0 5px 18px rgba(80,50,20,.12);
}

.petFixedSpacer{
    height:395px;
}

.petTop{
    padding:8px 18px 4px;
    text-align:center;
    background:#fffaf0;
}

.petTop h1{
    margin:0;
    font-size:23px;
}

.petDay{
    font-size:13px;
    color:#888;
    margin-top:3px;
}

.petMain{
    padding:0 15px;
}

.petStage{
    position:relative;
    height:285px;
    border-radius:24px;
    background:linear-gradient(#c7ecff 0 70%,#9bc76e 70%);
    border:4px solid #725236;
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

.petSun{
    position:absolute;
    top:15px;
    right:25px;
    font-size:40px;
    animation:sunPulse 2s infinite;
}

.petGround{
    position:absolute;
    bottom:0;
    height:30%;
    width:100%;
    background:repeating-linear-gradient(
        90deg,
        #91bf69 0 15px,
        #88b761 15px 20px
    );
}

.petImage{
    position:absolute;
    width:165px;
    height:165px;
    left:50%;
    top:46%;
    transform:translate(-50%,-50%);
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    image-rendering:pixelated;
    z-index:5;
    touch-action:none;
    -webkit-user-drag:none;
    pointer-events:auto;
    -webkit-touch-callout:none;
    user-select:none;
    -webkit-user-select:none;
    will-change:transform,left,top;
}

.petImage.breathe{
    animation:potatoBreathe 2.2s ease-in-out infinite;
}

@keyframes potatoBreathe{
    0%,100%{
        transform:translate(-50%,-50%) scale(1) rotate(0);
    }
    50%{
        transform:translate(-50%,-52%) scale(1.025) rotate(-1deg);
    }
}

.petImage.petJump{
    animation:petJump .65s ease;
}

@keyframes petJump{
    0%{
        transform:translate(-50%,-50%) translateY(0) rotate(0);
    }
    30%{
        transform:translate(-50%,-50%) translateY(-55px) rotate(-8deg) scale(1.03);
    }
    55%{
        transform:translate(-50%,-50%) translateY(-70px) rotate(8deg) scale(1.04);
    }
    100%{
        transform:translate(-50%,-50%) translateY(0) rotate(0) scale(1);
    }
}

.petImage.tilt{
    animation:potatoTilt .55s ease;
}

@keyframes potatoTilt{
    0%{transform:translate(-50%,-50%) rotate(0)}
    25%{transform:translate(-50%,-50%) rotate(-10deg)}
    50%{transform:translate(-50%,-50%) rotate(10deg)}
    75%{transform:translate(-50%,-50%) rotate(-5deg)}
    100%{transform:translate(-50%,-50%) rotate(0)}
}

.petImage.running{
    animation:runPotato .55s infinite alternate;
}

@keyframes runPotato{
    from{
        transform:translate(-50%,-50%) translateY(2px) rotate(-3deg);
    }
    to{
        transform:translate(-50%,-50%) translateY(-3px) rotate(3deg);
    }
}

.petEmotion{
    position:absolute;
    z-index:30;
    left:50%;
    top:30%;
    font-size:30px;
    pointer-events:none;
    animation:emotionFloat 1s ease-out forwards;
}

@keyframes emotionFloat{
    0%{
        opacity:0;
        transform:translate(-50%,10px) scale(.5);
    }
    20%{opacity:1}
    100%{
        opacity:0;
        transform:translate(-50%,-45px) scale(1.15);
    }
}

.message{
    position:absolute;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    width:82%;
    min-height:42px;
    background:white;
    border:3px solid #543b26;
    border-radius:18px;
    padding:9px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    z-index:40;
}

.nameBox{
    padding:7px 5px 10px;
    background:#fffaf0;
    text-align:center;
}

.potatoName{
    font-size:21px;
    font-weight:900;
}

.personality{
    color:#777;
    margin-top:2px;
    font-size:13px;
}

.stats{
    margin:12px 0;
    padding:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    background:#f2e7d4;
    border-radius:20px;
}

.stat{
    background:white;
    border-radius:15px;
    padding:9px;
    display:flex;
    align-items:center;
    gap:8px;
}

.statCircle{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#eee4d2;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:19px;
    flex-shrink:0;
}

.statText{
    font-size:12px;
    font-weight:800;
}

.statValue{
    font-size:11px;
    color:#777;
    margin-top:2px;
}

.petActions{
    padding:4px 0 30px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.petAction{
    padding:14px 5px;
    border-radius:15px;
    background:#ead8ba;
    font-size:14px;
    font-weight:900;
}

/* 사전 */
.dictionary{
    min-height:100vh;
    background:#fffaf0;
}

.dictionaryHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;
    border-bottom:2px solid #e5d7c0;
    background:#fffaf0;
    position:relative;
    z-index:300;
}

.dictionaryHeader h1{
    margin:0;
    font-size:20px;
}

.backBtn{
    padding:7px 11px;
    border-radius:10px;
    background:#e5d5b8;
    font-weight:800;
}

.tama{
    margin:18px auto;
    width:min(92vw,500px);
    aspect-ratio:1/1;
    max-height:500px;
    position:relative;
    overflow:hidden;
    border:12px solid #473d35;
    border-radius:12px;
    background:#9aaf72;
    image-rendering:pixelated;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
    isolation:isolate;
}

.pixelWall{
    position:absolute;
    inset:0;
    background-color:#c8a47b;
    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 11px,
            #b99268 11px,
            #b99268 13px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 23px,
            rgba(150,110,70,.28) 23px,
            rgba(150,110,70,.28) 25px
        );
    z-index:1;
}

.pixelWall:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 11px,
            rgba(255,255,255,.06) 11px,
            rgba(255,255,255,.06) 12px
        );
    opacity:.8;
    pointer-events:none;
}

.pixelFloor{
    position:absolute;
    bottom:0;
    width:100%;
    height:31%;
    background-color:#b17d4e;
    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 11px,
            #9d6e45 11px,
            #9d6e45 13px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 15px,
            rgba(115,75,42,.42) 15px,
            rgba(115,75,42,.42) 18px
        );
    z-index:3;
}

.pixelFloor:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            45deg,
            transparent 0 7px,
            rgba(255,255,255,.05) 7px 9px,
            transparent 9px 16px
        );
    pointer-events:none;
}

.window{
    position:absolute;
    top:28px;
    left:25px;
    width:100px;
    height:75px;
    background:#9edcf1;
    border:8px solid #6e4c36;
    box-shadow:inset 0 0 0 4px #d7e9dc;
    z-index:5;
}

.window:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:5px;
    height:100%;
    background:#6e4c36;
}

.window:after{
    content:"";
    position:absolute;
    left:0;
    top:50%;
    width:100%;
    height:5px;
    background:#6e4c36;
}

.sofa{
    position:absolute;
    bottom:65px;
    right:20px;
    width:130px;
    height:55px;
    background:#865d4c;
    border:7px solid #654535;
    z-index:8;
    box-shadow:inset 0 -10px 0 rgba(60,35,25,.18);
}

.sofa:before{
    content:"";
    position:absolute;
    left:8px;
    right:8px;
    top:-18px;
    height:20px;
    background:#865d4c;
    border:7px solid #654535;
}

.sofa:after{
    content:"";
    position:absolute;
    left:15px;
    bottom:-13px;
    width:15px;
    height:12px;
    background:#543b2d;
    box-shadow:80px 0 #543b2d;
}

.tv{
    position:absolute;
    top:25px;
    right:22px;
    width:75px;
    height:55px;
    background:#2e302e;
    border:7px solid #4b4035;
    z-index:7;
}

.tvScreen{
    position:absolute;
    inset:7px;
    background:#71a3a2;
    animation:tvGlow 2s infinite alternate;
}

@keyframes tvGlow{
    from{opacity:.65}
    to{opacity:1}
}

/* 다마고치 감자 */
.tamaPotato{
    position:absolute;
    width:65px;
    height:65px;
    z-index:20;
    transform:translate3d(-50%,-50%,0);
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-user-drag:none;
    cursor:grab;
    will-change:left,top,transform;
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    image-rendering:pixelated;
}

.tamaPotato:active{
    cursor:grabbing;
}

.tamaPotato.selected{
    filter:drop-shadow(0 0 7px white) brightness(1.08);
}

.tamaPotato.leaderHeld{
    filter:drop-shadow(0 0 10px #ffd84d) brightness(1.12);
}

.tamaPotato.walking{
    animation:tamaWalk .55s infinite alternate;
}

@keyframes tamaWalk{
    from{
        margin-top:2px;
        transform:translate3d(-50%,-50%,0) rotate(-2deg);
    }
    to{
        margin-top:-2px;
        transform:translate3d(-50%,-50%,0) rotate(2deg);
    }
}

.tamaPotato.reactionJump{
    animation:tamaReactionJump .6s ease;
}

@keyframes tamaReactionJump{
    0%{
        transform:translate3d(-50%,-50%,0) translateY(0) rotate(0);
    }
    35%{
        transform:translate3d(-50%,-50%,0) translateY(-18px) rotate(-10deg);
    }
    65%{
        transform:translate3d(-50%,-50%,0) translateY(-10px) rotate(10deg);
    }
    100%{
        transform:translate3d(-50%,-50%,0) translateY(0) rotate(0);
    }
}

.tamaPotato.reactionTilt{
    animation:tamaTilt .65s ease;
}

@keyframes tamaTilt{
    0%{transform:translate3d(-50%,-50%,0) rotate(0)}
    25%{transform:translate3d(-50%,-50%,0) rotate(-12deg)}
    50%{transform:translate3d(-50%,-50%,0) rotate(12deg)}
    75%{transform:translate3d(-50%,-50%,0) rotate(-5deg)}
    100%{transform:translate3d(-50%,-50%,0) rotate(0)}
}

.tamaSpeech{
    position:absolute;
    z-index:70;
    background:white;
    border:2px solid #332a22;
    border-radius:10px;
    padding:3px 6px;
    font-size:10px;
    font-weight:900;
    white-space:nowrap;
    pointer-events:none;
    animation:speech 1.5s ease forwards;
}

.tamaSpeech.groupSpeech{
    font-size:10px;
    padding:4px 7px;
}

@keyframes speech{
    0%{
        opacity:0;
        transform:translate(-50%,8px) scale(.8);
    }
    20%{
        opacity:1;
        transform:translate(-50%,0) scale(1);
    }
    80%{opacity:1}
    100%{
        opacity:0;
        transform:translate(-50%,-15px) scale(.95);
    }
}

.tamaEmotion{
    position:absolute;
    z-index:80;
    pointer-events:none;
    font-size:22px;
    animation:tamaEmotionFloat 1s ease-out forwards;
}

@keyframes tamaEmotionFloat{
    0%{
        opacity:0;
        transform:translate(-50%,10px) scale(.5);
    }
    20%{opacity:1}
    100%{
        opacity:0;
        transform:translate(-50%,-30px) scale(1.1);
    }
}

.tamaPotato.stunned{
    filter:grayscale(1) brightness(.7);
    animation:stunShake .25s infinite alternate;
}

@keyframes stunShake{
    from{margin-left:-3px}
    to{margin-left:3px}
}

.snack{
    position:absolute;
    z-index:100;
    font-size:28px;
    pointer-events:none;
    transform:translate(-50%,-50%);
    image-rendering:pixelated;
}

.sleepOverlay{
    position:absolute;
    inset:0;
    background:rgba(25,30,55,.58);
    z-index:150;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
    font-weight:900;
    pointer-events:none;
}

.tamaControls{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:0 15px;
}

.tamaControl{
    padding:13px 4px;
    border-radius:14px;
    background:#e4d0ad;
    font-size:13px;
    font-weight:900;
}

/* 도감 */
.discovery{
    margin:20px 15px;
    padding:16px;
    border-radius:18px;
    background:#f0e3cd;
}

.discoveryTitle{
    font-weight:900;
    font-size:19px;
}

.discoverySub{
    font-size:13px;
    color:#777;
    margin:4px 0 15px;
}

.potatoList{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.bookItem{
    background:white;
    border-radius:14px;
    padding:8px;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:65px;
}

.bookImage{
    width:50px;
    height:50px;
    flex-shrink:0;
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    image-rendering:pixelated;
}

.bookItemName{
    flex:1;
    text-align:left;
    font-size:13px;
    font-weight:900;
}

.bookStatus{
    font-size:10px;
    color:#999;
    margin-top:3px;
}

.potatoToggle{
    width:52px;
    height:29px;
    border-radius:20px;
    background:#aaa;
    position:relative;
    flex-shrink:0;
    transition:background .2s ease;
}

.potatoToggle.on{
    background:#6ca04c;
}

.potatoToggle:after{
    content:"";
    position:absolute;
    top:4px;
    left:4px;
    width:21px;
    height:21px;
    background:white;
    border-radius:50%;
    transition:left .2s ease;
}

.potatoToggle.on:after{
    left:27px;
}

.switchInfo{
    margin-top:14px;
    padding-top:12px;
    border-top:2px solid #dfceb1;
    font-size:11px;
    color:#777;
    text-align:center;
}

@media(max-width:420px){
    .petFixedSpacer{height:375px}
    .petTop{padding-top:7px}
    .petStage{height:275px}
    .petImage{width:150px;height:150px}
    .nameBox{padding-bottom:7px}
    .stats{gap:7px;padding:9px}
    .stat{padding:7px}
    .statCircle{width:38px;height:38px}
    .tamaPotato{width:58px;height:58px}
}

@media(max-height:700px){
    .petFixedSpacer{height:350px}
    .petStage{height:250px}
    .petImage{width:140px;height:140px}
}

@media(max-width:360px){
    .petFixedSpacer{height:350px}
    .petStage{height:245px}
    .petImage{width:135px;height:135px}
    .petTop h1{font-size:21px}
    .potatoName{font-size:19px}
}
</style>
</head>

<body>

<div id="app">

<!-- 시작 -->
<section id="startScreen" class="screen">
    <div class="startBox">
        <div class="bigPotato">🥔</div>
        <div class="gameTitle">감자키우기</div>
        <button class="startBtn" id="startBtn">시작</button>
    </div>
</section>

<!-- 성장 -->
<section id="growScreen" class="screen hidden">
<div class="page growPage">

    <div class="growHeader">
        <h1>🥔 감자키우기</h1>
        <div class="dayText" id="growDay">감자를 심어주세요</div>

/* ==================================================
   성장 단계
================================================== */

const STAGES=[
    "싹",
    "이파리",
    "나무",
    "감자"
];

const STAGE_EMOJIS=[
    "🌱",
    "🌿",
    "🌳",
    "🥔"
];

/* ==================================================
   DOM
================================================== */

const startScreen=document.getElementById("startScreen");
const growScreen=document.getElementById("growScreen");
const petScreen=document.getElementById("petScreen");
const dictionaryScreen=document.getElementById("dictionaryScreen");

const growPotato=document.getElementById("growPotato");
const growthBar=document.getElementById("growthBar");
const growthText=document.getElementById("growthText");
const stageText=document.getElementById("stageText");
const petImage=document.getElementById("petImage");

/* ==================================================
   화면 전환
================================================== */

function showScreen(screen){

    [
        startScreen,
        growScreen,
        petScreen,
        dictionaryScreen
    ].forEach(
        s=>s.classList.add("hidden")
    );

    screen.classList.remove("hidden");

    window.scrollTo(0,0);

    if(screen===dictionaryScreen){
        startTamaLoop();
    }else{
        stopTamaLoop();
    }
}

/* ==================================================
   시작
================================================== */

document.getElementById("startBtn").addEventListener(
    "click",
    ()=>{
        game.growth=0;
        game.stage=0;
        game.day=1;
        game.potato=null;

        updateGrow();
        showScreen(growScreen);
    }
);

/* ==================================================
   성장
================================================== */

let creatingPotato=false;

function growAction(type){

    if(creatingPotato){
        return;
    }

    let amount=7;

    if(type==="fertilizer") amount=12;
    if(type==="water") amount=8;
    if(type==="sun") amount=9;
    if(type==="cheer") amount=6;

    game.growth+=amount;

    if(game.growth>100){
        game.growth=100;
    }

    game.stage=Math.min(
        3,
        Math.floor(game.growth/25)
    );

    growPotato.classList.remove("jump");

    void growPotato.offsetWidth;

    growPotato.classList.add("jump");

    updateGrow();

    if(
        game.growth>=100 &&
        !creatingPotato
    ){

        creatingPotato=true;

        setTimeout(
            ()=>{
                createRandomPotato();
                creatingPotato=false;
            },
            650
        );
    }
}

function updateGrow(){

    growthBar.style.width=
        game.growth+"%";

    growthText.textContent=
        game.growth+" / 100%";

    stageText.textContent=
        STAGES[game.stage];

    growPotato.textContent=
        STAGE_EMOJIS[game.stage];

    document.getElementById("growDay").textContent=
        game.day+"일차";
}

/* ==================================================
   랜덤 감자 탄생
================================================== */

function createRandomPotato(){

    const potato=
        POTATOES[
            Math.floor(
                Math.random()*POTATOES.length
            )
        ];

    game.potato=potato;

    if(!game.discovered.includes(potato.name)){

        game.discovered.push(
            potato.name
        );

        game.tamaEnabled[potato.name]=true;
    }

    game.stats={
        hunger:50,
        water:50,
        love:50,
        energy:100
    };

    updatePet();
    showScreen(petScreen);

    showEmotion(
        emotionEmoji(potato)
    );

    speak(
        random([
            "태어났다! "+potato.name+"이다! 🥔",
            "새로운 감자가 태어났다!",
            "짜잔! "+potato.name+" 등장!",
            potato.name+"와 함께 시작해보자!"
        ])
    );
}

/* ==================================================
   감정
================================================== */

function emotionEmoji(p){

    if(p.style==="social") return "💕";
    if(p.style==="leader") return "🫡";
    if(p.style==="toxic") return "☠️";
    if(p.style==="violent") return "💢";

    return "🥺";
}

function emotionSet(p){

    if(p.style==="social")
        return ["💕","❤️","🥰","✨"];

    if(p.style==="leader")
        return ["🫡","⭐","📣","💪"];

    if(p.style==="toxic")
        return ["☠️","💢","😑","⚠️"];

    if(p.style==="violent")
        return ["💢","👊","🔥","😤"];

    return ["🥺","😳","💭","😊"];
}

/* ==================================================
   키우기 감정
================================================== */

function showEmotion(emoji){

    const stage=
        document.getElementById("petStage");

    const old=
        stage.querySelector(".petEmotion");

    if(old){
        old.remove();
    }

    const el=
        document.createElement("div");

    el.className="petEmotion";
    el.textContent=emoji;

    stage.appendChild(el);

    setTimeout(
        ()=>{
            if(el.parentNode){
                el.remove();
            }
        },
        1000
    );
}

/* ==================================================
   키우기 감자 터치
================================================== */

let petTouchStart=0;
let petTouchStartX=0;
let petTouchStartY=0;
let petTouchMoved=false;

petImage.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        petTouchStart=
            performance.now();

        petTouchStartX=e.clientX;
        petTouchStartY=e.clientY;

        petTouchMoved=false;

        try{
            petImage.setPointerCapture(
                e.pointerId
            );
        }catch(err){}

    },
    {passive:false}
);

petImage.addEventListener(
    "pointermove",
    e=>{

        e.preventDefault();

        const dx=
            e.clientX-petTouchStartX;

        const dy=
            e.clientY-petTouchStartY;

        if(
            Math.hypot(dx,dy)>8
        ){
            petTouchMoved=true;
        }

    },
    {passive:false}
);

petImage.addEventListener(
    "pointerup",
    e=>{

        e.preventDefault();

        const elapsed=
            performance.now()-
            petTouchStart;

        if(
            !petTouchMoved &&
            elapsed<800
        ){
            touchPet();
        }

    },
    {passive:false}
);

/* ==================================================
   키우기 감자 터치 반응
================================================== */

function touchPet(){

    if(!game.potato)
        return;

    const p=game.potato;

    petImage.classList.remove(
        "breathe",
        "petJump",
        "tilt"
    );

    void petImage.offsetWidth;

    if(Math.random()<.55){
        petImage.classList.add(
            "petJump"
        );
    }else{
        petImage.classList.add(
            "tilt"
        );
    }

    petImage.classList.add("breathe");

    const emotions=
        emotionSet(p);

    showEmotion(
        random(emotions)
    );

    speak(
        random(p.lines.touch)+
        " "+
        random(emotions)
    );

    game.stats.love=
        clamp(
            game.stats.love+5
        );

    updateStats();
}

/* ==================================================
   키우기 상호작용
================================================== */

function petAction(type){

    if(!game.potato)
        return;

    const p=game.potato;

    if(type==="food"){

        game.stats.hunger=
            clamp(
                game.stats.hunger+20
            );

        speak(
            random(p.lines.food)+
            " "+
            random(emotionSet(p))
        );

        showEmotion(
            random(emotionSet(p))
        );

        jumpPet();
    }

    if(type==="water"){

        game.stats.water=
            clamp(
                game.stats.water+20
            );

        speak(
            random(p.lines.water)+
            " "+
            random(["💧","😊","✨"])
        );

        showEmotion(
            random(["💧","😊","✨"])
        );

        jumpPet();
    }

    if(type==="pet"){

        game.stats.love=
            clamp(
                game.stats.love+15
            );

        speak(
            random(p.lines.pet)+
            " "+
            random(emotionSet(p))
        );

        showEmotion(
            random(emotionSet(p))
        );

        if(Math.random()<.5){
            jumpPet();
        }else{
            tiltPet();
        }
    }

    if(type==="walk"){

        game.stats.energy=
            clamp(
                game.stats.energy-15
            );

        speak(
            random(p.lines.walk)+
            " "+
            random(["🏃","💨","😆"])
        );

        showEmotion("🏃");

        runPet();
    }

    updateStats();
}

/* ==================================================
   키우기 모션
================================================== */

function jumpPet(){

    petImage.classList.remove(
        "petJump",
        "tilt"
    );

/* ==================================================
   산책
================================================== */

let petWalkFrame=null;
let petWalkStart=0;
let petWalkX=50;
let petWalkDirection=1;

function runPet(){

    if(petWalkFrame){
        cancelAnimationFrame(
            petWalkFrame
        );
    }

    petImage.classList.add(
        "running"
    );

    petWalkStart=
        performance.now();

    petWalkX=50;

    petWalkDirection=
        Math.random()<.5
        ? -1
        : 1;

    function walkFrame(now){

        const elapsed=
            now-petWalkStart;

        if(elapsed>=3000){

            petImage.classList.remove(
                "running"
            );

            petImage.style.left="50%";

            petWalkFrame=null;

            return;
        }

        petWalkX+=
            petWalkDirection*.08;

        if(petWalkX>=78){

            petWalkX=78;
            petWalkDirection=-1;
        }

        if(petWalkX<=22){

            petWalkX=22;
            petWalkDirection=1;
        }

        petImage.style.left=
            petWalkX+"%";

        petWalkFrame=
            requestAnimationFrame(
                walkFrame
            );
    }

    petWalkFrame=
        requestAnimationFrame(
            walkFrame
        );
}

/* ==================================================
   롱프레스 드래그
   대장감자 구출 이벤트 포함
================================================== */

function enableLongPress(
    element,
    obj
){

    let pointerId=null;

    let startX=0;
    let startY=0;

    let moved=false;

    let longPressTimer=null;

    let dragging=false;

    element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            pointerId=
                e.pointerId;

            startX=e.clientX;
            startY=e.clientY;

            moved=false;
            dragging=false;

            try{
                element.setPointerCapture(
                    pointerId
                );
            }catch(err){}

            longPressTimer=
                setTimeout(
                    ()=>{

                        dragging=true;

                        obj.dragging=true;

                        obj.vx=0;
                        obj.vy=0;

                        element.classList.add(
                            "selected"
                        );

                        /* 대장을 들었을 때 */
                        if(
                            obj.data.style===
                            "leader"
                        ){

                            game.leaderHeld=true;
                            game.leaderRescueMode=true;

                            element.classList.add(
                                "leaderHeld"
                            );

                            startLeaderRescue(obj);
                        }

                    },
                    400
                );
        },
        {
            passive:false
        }
    );

    element.addEventListener(
        "pointermove",
        e=>{

            if(
                e.pointerId!==pointerId
            )
                return;

            e.preventDefault();

            const dx=
                e.clientX-startX;

            const dy=
                e.clientY-startY;

            if(
                Math.hypot(dx,dy)>8
            ){
                moved=true;
            }

            if(!dragging){

                if(moved){
                    clearTimeout(
                        longPressTimer
                    );
                }

                return;
            }

            const tama=
                document.getElementById(
                    "tama"
                );

            const rect=
                tama.getBoundingClientRect();

            let x=
                (
                    (e.clientX-
                    rect.left)/
                    rect.width
                )*100;

            let y=
                (
                    (e.clientY-
                    rect.top)/
                    rect.height
                )*100;

            x=clampTamaX(x);
            y=clampTamaY(y);

            obj.x=x;
            obj.y=y;

            obj.vx=0;
            obj.vy=0;

            updateTamaDOM(obj);

            /*
               대장을 들고 움직이면
               다른 감자들이 즉시 대장을 따라감
            */
            if(
                obj.data.style===
                "leader"
            ){

                game.leaderHeld=true;

                updateLeaderFollowing(
                    true
                );
            }

        },
        {
            passive:false
        }
    );

    function finish(e){

        if(
            e.pointerId!==pointerId
        )
            return;

        e.preventDefault();

        clearTimeout(
            longPressTimer
        );

        if(dragging){

            obj.dragging=false;

            dragging=false;

            element.classList.remove(
                "selected"
            );

            if(
                obj.data.style===
                "leader"
            ){

                game.leaderHeld=false;
                game.leaderRescueMode=false;

                element.classList.remove(
                    "leaderHeld"
                );

                finishLeaderRescue(
                    obj
                );
            }

            tamaReaction(obj);

        }else if(!moved){

            tamaReaction(obj);
        }

        pointerId=null;
    }

    element.addEventListener(
        "pointerup",
        finish,
        {
            passive:false
        }
    );

    element.addEventListener(
        "pointercancel",
        finish,
        {
            passive:false
        }
    );
}

/* ==================================================
   좌표
================================================== */

function clampTamaX(x){

    return Math.max(
        8,
        Math.min(
            92,
            x
        )
    );
}

function clampTamaY(y){

    return Math.max(
        50,
        Math.min(
            89,
            y
        )
    );
}

function distanceBetween(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}

function randomRange(
    min,
    max
){

    return min+
        Math.random()*
        (max-min);
}

/* ==================================================
   랜덤 대사
================================================== */

function randomDialogue(
    array,
    obj
){

    if(
        !array||
        !array.length
    )
        return "";

    if(array.length===1)
        return array[0];

    let result="";

    let tries=0;

    do{

        result=
            array[
                Math.floor(
                    Math.random()*
                    array.length
                )
            ];

        tries++;

    }while(
        result===
        obj.lastDialogue &&
        tries<10
    );

    obj.lastDialogue=result;

    return result;
}

function random(array){

    if(
        !array||
        array.length===0
    )
        return "";

    return array[
        Math.floor(
            Math.random()*
            array.length
        )
    ];
}

/* ==================================================
   AI 목표
================================================== */

function chooseAITarget(
    obj,
    now
){

    if(
        obj.sleeping||
        obj.dragging||
        now<obj.stunnedUntil||
        game.dialogueLock
    )
        return;

    /* 대장을 들고 있는 동안 */
    if(
        game.leaderHeld &&
        obj.data.style!=="leader"
    ){

        const leader=
            game.tamaPotatoes.find(
                x=>
                    x.data.style===
                    "leader"
            );

        if(leader){

            const offset=
                formationOffset(
                    obj
                );

            obj.targetX=
                clampTamaX(
                    leader.x+
                    offset.x
                );

            obj.targetY=
                clampTamaY(
                    leader.y+
                    offset.y
                );

            return;
        }
    }

    const style=
        obj.data.style;

    /* 독감자 */
    if(style==="toxic"){

        let avgX=50;
        let avgY=70;

        const others=
            game.tamaPotatoes.filter(
                x=>
                    x!==obj &&
                    !x.sleeping
            );

        if(others.length){

            avgX=
                others.reduce(
                    (sum,x)=>
                        sum+x.x,
                    0
                )/
                others.length;

            avgY=
                others.reduce(
                    (sum,x)=>
                        sum+x.y,
                    0
                )/
                others.length;
        }

        let dx=
            obj.x-avgX;

        let dy=
            obj.y-avgY;

        const len=
            Math.hypot(
                dx,
                dy
            )||1;

        dx/=len;
        dy/=len;

        obj.targetX=
            clampTamaX(
                obj.x+
                dx*18
            );

        obj.targetY=
            clampTamaY(
                obj.y+
                dy*14
            );

        return;
    }

    /* 폭력감자 */
    if(style==="violent"){

        const toxic=
            game.tamaPotatoes.find(
                x=>
                    x.data.style===
                    "toxic"
            );

        if(toxic){

            const angle=
                Math.random()*
                Math.PI*2;

            const radius=
                9+
                Math.random()*7;

            obj.targetX=
                clampTamaX(
                    toxic.x+
                    Math.cos(angle)*
                    radius
                );

            obj.targetY=
                clampTamaY(
                    toxic.y+
                    Math.sin(angle)*
                    radius
                );

        }else{

            chooseInitialTarget(
                obj
            );
        }

        return;
    }

    /* 대장감자 */
    if(style==="leader"){

        obj.targetX=
            randomRange(
                25,
                75
            );

        obj.targetY=
            randomRange(
                60,
                82
            );

        return;
    }

    /* 저능감자 */
    if(style==="dummy"){

        const leader=
            game.tamaPotatoes.find(
                x=>
                    x.data.style===
                    "leader"
            );

        if(leader){

            const offset=
                formationOffset(
                    obj
                );

            obj.targetX=
                clampTamaX(
                    leader.x+
                    offset.x
                );

            obj.targetY=
                clampTamaY(
                    leader.y+
                    offset.y
                );

        }else{

            chooseInitialTarget(
                obj
            );
        }

        return;
    }

    /* 꾼감자 */
    if(style==="social"){

        const others=
            game.tamaPotatoes.filter(
                x=>
                    x!==obj &&
                    !x.sleeping
            );

        if(others.length){

            const other=
                random(others);

            obj.targetX=
                clampTamaX(
                    other.x+
                    randomRange(
                        -10,
                        10
                    )
                );

            obj.targetY=
                clampTamaY(
                    other.y+
                    randomRange(
                        -7,
                        7
                    )
                );

        }else{

            chooseInitialTarget(
                obj
            );
        }
    }
}

/* ==================================================
   대장 주변의 감자 위치
   서로 겹치지 않도록 작은 편대 형태
================================================== */

function formationOffset(obj){

    const others=
        game.tamaPotatoes.filter(
            x=>
                x!==obj &&
                x.data.style!=="toxic"
        );

    const index=
        Math.max(
            0,
            others.indexOf(obj)
        );

    const positions=[
        {x:-11,y:3},
        {x:11,y:3},
        {x:-7,y:10},
        {x:7,y:10},
        {x:-15,y:10},
        {x:15,y:10}
    ];

    return positions[
        index%
        positions.length
    ];
}

/* ==================================================
   대장 추종
   대장을 들고 있으면 최우선
================================================== */

function updateLeaderFollowing(
    held=false
){

    const leader=
        game.tamaPotatoes.find(
            obj=>
                obj.data.style===
                "leader"
        );

    if(!leader)
        return;

    game.tamaPotatoes.forEach(
        obj=>{

            if(
                obj===leader||
                obj.dragging||
                obj.sleeping
            )
                return;

            /*
               대장을 들고 있으면
               독감자와 폭력감자까지
               일단 대장 위치를 우선적으로 본다.
            */
            if(held){

                const offset=
                    formationOffset(
                        obj
                    );

                obj.targetX=
                    clampTamaX(
                        leader.x+
                        offset.x
                    );

                obj.targetY=
                    clampTamaY(
                        leader.y+
                        offset.y
                    );

                obj.nextDecision=
                    performance.now()+
                    1000;

                return;
            }

            /*
               평소에는 독감자와 폭력감자를
               강제로 따라가게 하지 않음.
            */
            if(
                obj.data.style==="toxic"||
                obj.data.style==="violent"
            )
                return;

            const offset=
                formationOffset(
                    obj
                );

            obj.targetX=
                clampTamaX(
                    leader.x+
                    offset.x
                );

            obj.targetY=
                clampTamaY(
                    leader.y+
                    offset.y
                );
        }
    );
}

/* ==================================================
   부드러운 이동
   느린 걷기 + 대화 중 정지
================================================== */

function updateTamaMovement(
    obj,
    delta,
    now
){

    if(
        obj.sleeping||
        obj.dragging||
        game.dialogueLock
    ){

        if(game.dialogueLock){

            obj.vx*=.7;
            obj.vy*=.7;

            const el=
                getTamaElement(obj);

            if(el){
                el.classList.remove(
                    "walking"
                );
            }
        }

        return;
    }

    if(now<obj.stunnedUntil){

        obj.vx*=.9;
        obj.vy*=.9;

        return;
    }

    if(
        obj.targetX===null||
        obj.targetY===null
    ){

        chooseAITarget(
            obj,
            now
        );
    }

    if(obj.targetX===null)
        return;

    let dx=
        obj.targetX-
        obj.x;

    let dy=
        obj.targetY-
        obj.y;

    const dist=
        Math.hypot(
            dx,
            dy
        );

    if(dist<1.5){

        obj.vx*=.82;
        obj.vy*=.82;

        const el=
            getTamaElement(obj);

        if(el){
            el.classList.remove(
                "walking"
            );
        }

        return;
    }

    dx/=dist;
    dy/=dist;

    let speed=
        obj.maxSpeed;

    /*
       각 감자별 속도 차이를 아주 작게.
       전부 뛰어다니는 것처럼 보이는 문제 제거.
    */
    if(obj.data.style==="dummy")
        speed*=.75;

    if(obj.data.style==="toxic")
        speed*=.85;

    if(obj.data.style==="violent")
        speed*=1.05;

    if(
        game.leaderHeld &&
        obj.data.style!=="leader"
    ){
        speed*=1.15;
    }

    const acceleration=.025;

    obj.vx+=
        dx*
        acceleration;

    obj.vy+=
        dy*
        acceleration;

    const velocity=
        Math.hypot(
            obj.vx,
            obj.vy
        );

    if(velocity>speed){

        obj.vx=
            obj.vx/
            velocity*
            speed;

        obj.vy=
            obj.vy/
            velocity*
            speed;
    }

    const frameScale=
        Math.min(
            delta/16.6667,
            2
        );

    obj.x+=
        obj.vx*
        frameScale;

    obj.y+=
        obj.vy*
        frameScale;

    if(obj.x<8){

        obj.x=8;

        obj.vx=
            Math.abs(
                obj.vx
            );
    }

    if(obj.x>92){

        obj.x=92;

        obj.vx=
            -Math.abs(
                obj.vx
            );
    }

    if(obj.y<50){

        obj.y=50;

        obj.vy=
            Math.abs(
                obj.vy
            );
    }

    if(obj.y>89){

        obj.y=89;

        obj.vy=
            -Math.abs(
                obj.vy
            );
    }

    const el=
        getTamaElement(obj);

    if(el){

        if(velocity>.08){

            el.classList.add(
                "walking"
            );

        }else{

            el.classList.remove(
                "walking"
            );
        }
    }

    updateTamaDOM(obj);
}

/* ==================================================
   감자끼리 너무 겹치지 않게
   밀어내기는 아주 약하게만 적용
================================================== */

function keepPotatoesSeparated(){

    const list=
        game.tamaPotatoes;

    for(
        let i=0;
        i<list.length;
        i++
    ){

        const a=list[i];

        if(
            a.sleeping||
            a.dragging
        )
            continue;

        for(
            let j=i+1;
            j<list.length;
            j++
        ){

            const b=list[j];

            if(
                b.sleeping||
                b.dragging
            )
                continue;

            /*
               독감자는 사람을 피하려고 하므로
               별도의 간격을 유지.
            */
            const toxicPair=
                a.data.style==="toxic"||
                b.data.style==="toxic";

            const minDistance=
                toxicPair
                ? 12
                : 6.5;

            const d=
                distanceBetween(
                    a,
                    b
                );

            if(
                d>0 &&
                d<minDistance
            ){

                let dx=
                    a.x-b.x;

                let dy=
                    a.y-b.y;

                const len=
                    Math.hypot(
                        dx,
                        dy
                    )||1;

                dx/=len;
                dy/=len;

                const push=
                    (
                        minDistance-d
                    )*
                    (
                        toxicPair
                        ? .025
                        : .012
                    );

                /*
                   같은 곳에 있어도 괜찮게
                   아주 조금만 분리.
                */
                a.x=
                    clampTamaX(
                        a.x+
                        dx*push
                    );

                a.y=
                    clampTamaY(
                        a.y+
                        dy*push
                    );

                b.x=
                    clampTamaX(
                        b.x-
                        dx*push
                    );

                b.y=
                    clampTamaY(
                        b.y-
                        dy*push
                    );
            }
        }
    }
}

/* ==================================================
   감자끼리 상호작용
================================================== */

function processPotatoInteractions(now){

    const list=
        game.tamaPotatoes;

    /*
       대장을 들고 있으면
       기존 대화보다 구출 행동을 우선.
    */
    if(game.leaderHeld)
        return;

    for(
        let i=0;
        i<list.length;
        i++
    ){

        const a=list[i];

        for(
            let j=i+1;
            j<list.length;
            j++
        ){

            const b=list[j];

            if(
                a.sleeping||
                b.sleeping||
                a.dragging||
                b.dragging
            )
                continue;

            const distance=
                distanceBetween(
                    a,
                    b
                );

            if(
                distance<10 &&
                now>
                Math.max(
                    a.nextInteraction,
                    b.nextInteraction
                )
            ){

                handlePotatoMeeting(
                    a,
                    b,
                    now
                );
            }
        }
    }
}

/* ==================================================
   스타일 조합 키
================================================== */

function getPairKey(
    a,
    b
){

    const styles=[
        a.data.style,
        b.data.style
    ].sort();

    return styles.join("_");
}

/* ==================================================
   대화용 스타일 변환
================================================== */

function styleMatch(
    obj,
    style
){

    return obj.data.style===
        style;
}

/* ==================================================
   2인 대화 실행
================================================== */

function runTwoPersonDialogue(
    a,
    b
){

    const key=
        getPairKey(
            a,
            b
        );

    const data=
        TWO_PERSON_DIALOGUES[key];

    if(
        !data||
        !data.length
    )
        return false;

    const shuffled=[
        ...data
    ];

    /*
       대사 세트를 랜덤하게 조금 섞음
    */
    const selected=
        random(shuffled);

    /*
       selected가 두 줄이면
       첫 감자와 둘째 감자의 순서를
       실제 감자에 맞게 변경.
    */
    if(
        selected.length>=2
    ){

        const firstStyle=
            selected[0][0];

        const secondStyle=
            selected[1][0];

        let firstObj=null;
        let secondObj=null;

        if(
            styleMatch(
                a,
                firstStyle
            )
        ){
            firstObj=a;
        }else if(
            styleMatch(
                b,
                firstStyle
            )
        ){
            firstObj=b;
        }

        if(
            styleMatch(
                a,
                secondStyle
            )
        ){
            secondObj=a;
        }else if(
            styleMatch(
                b,
                secondStyle
            )
        ){
            secondObj=b;
        }

        if(
            firstObj&&
            secondObj
        ){

            freezeForDialogue(
                [a,b],
                2300
            );

            showTamaSpeech(
                firstObj,
                selected[0][1]
            );

            showTamaEmotion(
                firstObj,
                random(
                    emotionSet(
                        firstObj.data
                    )
                )
            );

            setTimeout(
                ()=>{
                    if(
                        !firstObj.sleeping &&
                        !firstObj.dragging
                    ){
                        showTamaSpeech(
                            secondObj,
                            selected[1][1]
                        );

                        showTamaEmotion(
                            secondObj,
                            random(
                                emotionSet(
                                    secondObj.data
                                )
                            )
                        );
                    }
                },
                850
            );

            return true;
        }
    }

    return false;
}

/* ==================================================
   3인 대화 실행
================================================== */

function runThreePersonDialogue(
    group
){

    const styles=
        group
        .map(
            obj=>
                obj.data.style
        )
        .sort();

    const script=
        THREE_PERSON_DIALOGUES.find(
            item=>
                [...item.styles]
                    .sort()
                    .join("_")===
                styles.join("_")
        );

    if(!script)
        return false;

    freezeForDialogue(
        group,
        3600
    );

    let delay=0;

    script.lines.forEach(
        line=>{

            const style=
                line[0];

            const text=
                line[1];

            const obj=
                group.find(
                    x=>
                        x.data.style===
                        style
                );

            if(!obj)
                return;

            setTimeout(
                ()=>{

                    if(
                        obj.sleeping||
                        obj.dragging
                    )
                        return;

                    showTamaSpeech(
                        obj,
                        text
                    );

                    showTamaEmotion(
                        obj,
                        random(
                            emotionSet(
                                obj.data
                            )
                        )
                    );

                },
                delay
            );

            delay+=650;
        }
    );

    return true;
}

/* ==================================================
   대화 중 감자 정지
================================================== */

function freezeForDialogue(
    group,
    duration
){

    game.dialogueLock=true;

    game.dialogueUntil=
        Math.max(
            game.dialogueUntil,
            performance.now()+
            duration
        );

    group.forEach(
        obj=>{

            if(
                obj.sleeping||
                obj.dragging
            )
                return;

            obj.vx=0;
            obj.vy=0;

            obj.targetX=obj.x;
            obj.targetY=obj.y;

            const el=
                getTamaElement(
                    obj
                );

            if(el){
                el.classList.remove(
                    "walking"
                );
            }
        }
    );
}

/* ==================================================
   2인 / 3인 대화 후보 찾기
================================================== */

function findNearbyGroup(){

    const active=
        game.tamaPotatoes.filter(
            obj=>
                !obj.sleeping &&
                !obj.dragging &&
                obj.data.style!=="toxic"
        );

    if(active.length<2)
        return null;

    /*
       3명이 가까우면 3인 대화를 우선.
    */
    for(
        let i=0;
        i<active.length;
        i++
    ){

        for(
            let j=i+1;
            j<active.length;
            j++
        ){

            const a=active[i];
            const b=active[j];

            if(
                distanceBetween(
                    a,
                    b
                )>13
            )
                continue;

            for(
                let k=j+1;
                k<active.length;
                k++
            ){

                const c=active[k];

                if(
                    distanceBetween(
                        a,
                        c
                    )<14 &&
                    distanceBetween(
                        b,
                        c
                    )<14
                ){

                    const possible=
                        THREE_PERSON_DIALOGUES.some(
                            item=>
                                [...item.styles]
                                    .sort()
                                    .join("_")===
                                [
                                    a.data.style,
                                    b.data.style,
                                    c.data.style
                                ].sort().join("_")
                        );

                    if(possible){
                        return [
                            a,
                            b,
                            c
                        ];
                    }
                }
            }
        }
    }

    /*
       2인
    */
    for(
        let i=0;
        i<active.length;
        i++
    ){

        for(
            let j=i+1;
            j<active.length;
            j++
        ){

            const a=active[i];
            const b=active[j];

            if(
                distanceBetween(
                    a,
                    b
                )>12
            )
                continue;

            const key=
                getPairKey(
                    a,
                    b
                );

            if(
                TWO_PERSON_DIALOGUES[key]
            ){
                return [
                    a,
                    b
                ];
            }
        }
    }

    return null;
}

/* ==================================================
   일반 대화 처리
================================================== */

function tryGroupDialogue(
    now
){

    if(
        game.dialogueLock||
        game.leaderHeld||
        now<game.nextGroupDialogue
    )
        return;

    const group=
        findNearbyGroup();

    if(!group)
        return;

    let success=false;

    if(group.length===3){

        success=
            runThreePersonDialogue(
                group
            );

    }else{

        success=
            runTwoPersonDialogue(
                group[0],
                group[1]
            );
    }

    if(success){

        game.nextGroupDialogue=
            now+
            6500+
            Math.random()*5000;
    }
}

================================================== */

function stunTama(obj){

    if(
        obj.data.style===
        "violent"
    )
        return;

    obj.stunnedUntil=
        performance.now()+
        3000;

    obj.vx=0;
    obj.vy=0;

    const el=
        getTamaElement(
            obj
        );

    if(!el)
        return;

    el.classList.add(
        "stunned"
    );

    showTamaEmotion(
        obj,
        "😵"
    );

    showTamaSpeech(
        obj,
        randomDialogue(
            [
                "으악...",
                "어지러워...",
                "머리가 빙글빙글...",
                "잠깐만...",
                "움직일 수가 없어...",
                "뭐였지...?"
            ],
            obj
        )
    );

    setTimeout(
        ()=>{
            if(
                el.parentNode
            ){
                el.classList.remove(
                    "stunned"
                );
            }
        },
        3000
    );
}

   다마고치 감자 터치

function tamaReaction(obj){

    if(
        !obj||
        obj.sleeping
    )
        return;

    const p=
        obj.data;

    const el=
        getTamaElement(
            obj
        );

    if(el){

        el.classList.remove(
            "reactionJump",
            "reactionTilt"
        );

        void el.offsetWidth;

        if(Math.random()<.55){

            el.classList.add(
                "reactionJump"
            );

        }else{

            el.classList.add(
                "reactionTilt"
            );
        }
    }

    showTamaSpeech(
        obj,
        randomDialogue(
            p.tama.touch,
            obj
        )
    );

    showTamaEmotion(
        obj,
        random(
            emotionSet(p)
        )
    );

    if(
        p.style==="leader"
    ){

        makeLeaderFollow(
            obj
        );
    }

    if(
        p.style==="toxic"
    ){

        toxicAttack(
            obj
        );
    }
}

function makeLeaderFollow(
    leader
){

    if(
        !leader||
        leader.data.style!=="leader"
    )
        return;

    updateLeaderFollowing(
        false
    );

    /*
       대장을 직접 눌렀을 때도
       감자들이 잠깐 모임.
    */
    const followers=
        game.tamaPotatoes.filter(
            other=>
                other!==leader &&
                !other.dragging &&
                !other.sleeping &&
                other.data.style!=="toxic" &&
                other.data.style!=="violent"
        );

    if(followers.length){

        game.dialogueLock=true;

        game.dialogueUntil=
            performance.now()+
            1500;

        followers.slice(
            0,
            3
        ).forEach(
            (obj,index)=>{

                setTimeout(

                            ])

                    },
                    index*180

        setTimeout(

        );

/* ==================================================
   독감자 공격
================================================== */

function toxicAttack(
    toxic
){

    game.tamaPotatoes.forEach(
        other=>{

            if(
                other===toxic||
                other.data.style==="violent"
            )
                return;

            const distance=
                distanceBetween(
                    toxic,
                    other
                );

            if(
                distance<15&&
                Math.random()<.10
            ){

                stunTama(
                    other
                );
            }
        }
    );
}

/* ==================================================
   간식 업데이트
================================================== */

function updateSnacks(
    delta,
    now
){

    for(
        let i=
            game.tamaSnacks.length-1;
        i>=0;
        i--
    ){

        const snack=
            game.tamaSnacks[i];

        if(
            !snack.element||
            !snack.element.parentNode
        ){

            game.tamaSnacks.splice(
                i,
                1
            );

            continue;
        }

        if(!snack.landed){

            snack.y+=
                snack.speed*
                delta/
                1000;

            if(
                snack.y>=73
            ){

                snack.y=73;
                snack.landed=true;
            }
        }

        snack.element.style.left=
            snack.x+"%";

        snack.element.style.top=
            snack.y+"%";

        if(
            snack.landed
        ){

            let eater=null;

            let closest=Infinity;

            game.tamaPotatoes.forEach(
                obj=>{

                    if(
                        obj.sleeping||
                        obj.dragging||
                        now<
                        obj.stunnedUntil
                    )
                        return;

                    const d=
                        Math.hypot(
                            obj.x-snack.x,
                            obj.y-snack.y
                        );

                    if(
                        d<closest
                    ){

                        closest=d;
                        eater=obj;
                    }
                }
            );

            if(
                eater&&
                closest<8
            ){

                eatSnack(
                    eater,
                    snack,
                    i
                );
            }
        }

        if(
            now-snack.created>
            20000
        ){

            if(
                snack.element.parentNode
            ){
                snack.element.remove();
            }

            game.tamaSnacks.splice(
                i,
                1
            );
        }
    }
}

================================================== */

function startTamaLoop(){

    stopTamaLoop();

    game.lastTamaTime=
        performance.now();

    function frame(now){

        if(
            dictionaryScreen.classList.contains(
                "hidden"
            )
        ){

            game.tamaAnimationId=null;

            return;
        }

        const delta=
            Math.min(
                now-game.lastTamaTime,
                40
            );

        game.lastTamaTime=
            now;

        /*
           대화가 끝났는지 확인
        */
        if(
            game.dialogueLock &&
            now>=game.dialogueUntil
        ){

            game.dialogueLock=false;

            game.tamaPotatoes.forEach(
                obj=>{

                    if(
                        !obj.sleeping &&
                        !obj.dragging
                    ){

                        obj.targetX=null;
                        obj.targetY=null;
                        obj.nextDecision=0;
                    }
                }
            );
        }

        /*
           대장 최우선 추종
        */
        if(
            game.leaderHeld
        ){

            updateLeaderFollowing(
                true
            );
        }else{

            updateLeaderFollowing(
                false
            );
        }

        /* 감자 이동 */
        game.tamaPotatoes.forEach(
            obj=>{

                if(
                    obj.sleeping||
                    obj.dragging
                )
                    return;

                /*
                   대화 중에는 움직이지 않음
                */
                if(
                    game.dialogueLock
                ){

                    obj.vx=0;
                    obj.vy=0;

                    const el=
                        getTamaElement(
                            obj
                        );

                    if(el){
                        el.classList.remove(
                            "walking"
                        );
                    }

                    return;
                }

                if(
                    now>
                    obj.nextDecision
                ){

                    chooseAITarget(
                        obj,
                        now
                    );

                    obj.nextDecision=
                        now+
                        2200+
                        Math.random()*2500;
                }

                updateTamaMovement(
                    obj,
                    delta,
                    now
                );

                /*
                   혼잣말
                */
                if(
                    now>
                    obj.nextSpeech
                ){

                    if(
                        Math.random()<.42 &&
                        !game.dialogueLock
                    ){

                        autonomousSpeech(
                            obj
                        );
                    }

                    obj.nextSpeech=
                        now+
                        7000+
                        Math.random()*8000;
                }
            }
        );

        /*
           감자끼리 약간의 거리 유지.
           밀어내는 힘은 매우 약함.
        */
        keepPotatoesSeparated();

        /*
           2인/3인 그룹 대화
        */
        tryGroupDialogue(
            now
        );

        /*
           기존 가까운 감자 만남
        */
        processPotatoInteractions(
            now
        );

        /*
           간식
        */
        updateSnacks(
            delta,
            now
        );

        /*
           말풍선 감자 따라가기
        */
        game.tamaPotatoes.forEach(
            obj=>{

                if(
                    obj.speechEl&&
                    obj.speechEl.parentNode
                ){

                    obj.speechEl.style.left=
                        obj.x+"%";

                    obj.speechEl.style.top=
                        (
                            obj.y-11
                        )+"%";
                }
            }
        );

        game.tamaAnimationId=
            requestAnimationFrame(
                frame
            );
    }

    game.tamaAnimationId=
        requestAnimationFrame(
            frame
        );
}

function stopTamaLoop(){

    if(
        game.tamaAnimationId
    ){

        cancelAnimationFrame(
            game.tamaAnimationId
        );

        game.tamaAnimationId=null;
    }
}

/* ==================================================
   💾 게임 저장
================================================== */

const SAVE_KEY = "potatoGameSave";

function saveGame() {
    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify({
            potatoes: potatoes
        })
    );
}

function loadGame() {
    const saved = localStorage.getItem(SAVE_KEY);

    if (!saved) return;

    try {
        const data = JSON.parse(saved);

        if (data.potatoes && typeof potatoes !== "undefined") {
            data.potatoes.forEach(savedPotato => {

                const potato = potatoes.find(
                    p => p.name === savedPotato.name
                );

                if (potato) {
                    Object.assign(
                        potato,
                        savedPotato
                    );
                }
            });
        }

        updateGrow();

    } catch (e) {
        console.log("저장 데이터 불러오기 실패");
    }
}


/* 처음 들어왔을 때 저장 데이터 불러오기 */
loadGame();


/* 3초마다 자동 저장 */
setInterval(saveGame, 3000);


/* 사이트를 나갈 때 저장 */
window.addEventListener(
    "beforeunload",
    saveGame
);

/* ==================================================
   추가 복사 방지
================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            (e.ctrlKey||e.metaKey)&&
            (
                e.key==="c"||
                e.key==="C"
            )
        ){

            if(
                e.target.closest(
                    ".tama"
                )||
                e.target.closest(
                    ".petStage"
                )
            ){

                e.preventDefault();
            }
        }
    },
    {
        passive:false
    }
);

/* ==========================================
   🐈 꾼감자 고양이
========================================== */

(function(){

    const room = document.getElementById("room");

    if(!room) return;

    // 고양이 생성
    const cat = document.createElement("div");

    cat.id = "kkungCat";
    cat.textContent = "🐈";

    cat.style.position = "absolute";
    cat.style.fontSize = "30px";
    cat.style.zIndex = "30";
    cat.style.pointerEvents = "none";
    cat.style.transition =
        "left 2.5s linear, top 2.5s linear";

    room.appendChild(cat);


    // 처음 위치
    let catX = 50;
    let catY = 50;

    cat.style.left = catX + "px";
    cat.style.top = catY + "px";


    // 고양이 자연스럽게 이동
    function moveCat(){

        const maxX =
            Math.max(10, room.clientWidth - 45);

        const maxY =
            Math.max(10, room.clientHeight - 55);


        // 완전 랜덤보다는 현재 위치 근처로 이동
        const moveX =
            catX + (Math.random() - 0.5) * 180;

        const moveY =
            catY + (Math.random() - 0.5) * 140;


        catX =
            Math.max(
                10,
                Math.min(maxX, moveX)
            );

        catY =
            Math.max(
                10,
                Math.min(maxY, moveY)
            );


        cat.style.left = catX + "px";
        cat.style.top = catY + "px";
    }


    // 2~4초마다 이동
    function randomMove(){

        moveCat();

        const nextTime =
            2000 + Math.random() * 2000;

        setTimeout(
            randomMove,
            nextTime
        );
    }


    // 시작
    randomMove();


})();

</script>
