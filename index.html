<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>감자 키우기</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:#f3e5d0;
  color:#4b3525;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

body{
  min-height:100vh;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

.hidden{
  display:none !important;
}

.screen{
  width:100%;
  max-width:500px;
  min-height:100vh;
  margin:0 auto;
  background:#fffaf2;
  position:relative;
  overflow:hidden;
}

/* =========================
   시작 화면
========================= */

#startScreen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}

.start-potato{
  font-size:80px;
  margin-bottom:20px;
}

.start-title{
  font-size:40px;
  font-weight:1000;
  margin-bottom:8px;
}

.start-subtitle{
  font-size:14px;
  color:#806b58;
  margin-bottom:28px;
}

.start-button{
  width:240px;
  padding:16px;
  border-radius:17px;
  background:#c98745;
  color:white;
  font-size:17px;
  font-weight:900;
  box-shadow:0 4px 0 #9f6330;
}

.start-button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #9f6330;
}

/* =========================
   성장 화면
========================= */

#beforeScreen{
  padding-bottom:30px;
}

.header{
  padding:15px 16px 8px;
  text-align:center;
}

.header-title{
  font-size:23px;
  font-weight:1000;
}

.header-subtitle{
  margin-top:4px;
  color:#806b58;
  font-size:11px;
}

.egg-scene{
  width:100%;
  height:270px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:20px;
  position:relative;
}

.soil{
  position:absolute;
  width:250px;
  height:55px;
  background:#9a704e;
  border-radius:50%;
  bottom:20px;
}

.growth-emoji{
  position:relative;
  z-index:2;
  font-size:80px;
  line-height:1;
  animation:sproutBounce 2s ease-in-out infinite;
}

@keyframes sproutBounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

.growth-info{
  text-align:center;
  padding:0 20px;
}

.growth-title{
  font-size:21px;
  font-weight:1000;
  margin-bottom:8px;
}

.growth-percent{
  font-size:14px;
  color:#806b58;
  margin-bottom:10px;
}

.progress{
  width:100%;
  height:18px;
  background:#eadcc6;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#c98745;
  border-radius:20px;
  transition:width .3s;
}

/* =========================
   메시지
========================= */

.message{
  width:calc(100% - 32px);
  margin:12px 16px;
  padding:11px 14px;
  min-height:52px;
  border-radius:15px;
  background:#fff0c9;
  border:2px solid #ead7ae;
  color:#4b3525;
  text-align:center;
  font-size:13px;
  font-weight:800;
  line-height:1.6;
  position:relative;
  z-index:30;
}

/* =========================
   게임
========================= */

#gameScreen{
  padding-bottom:80px;
}

.sticky-top{
  position:sticky;
  top:0;
  z-index:50;
  background:#fffaf2;
  box-shadow:0 3px 12px rgba(80,50,20,.08);
}

#potatoWrap{
  width:100%;
  height:180px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:visible;
}

#potatoImage{
  width:150px;
  max-width:55%;
  height:auto;
  object-fit:contain;
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  position:relative;
  z-index:3;
}

/* =========================
   스탯
========================= */

.info{
  padding:8px 16px 0;
}

.potato-name{
  text-align:center;
  font-size:24px;
  font-weight:1000;
  margin:4px 0 5px;
}

.personality{
  text-align:center;
  color:#806b58;
  font-size:12px;
  font-weight:800;
  margin-bottom:16px;
}

.stat{
  margin-bottom:12px;
}

.stat-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
  font-size:12px;
  font-weight:800;
}

.stat-bar{
  width:100%;
  height:12px;
  background:#eadcc6;
  border-radius:20px;
  overflow:hidden;
}

.stat-fill{
  height:100%;
  width:0%;
  border-radius:20px;
  transition:width .3s ease;
}

.health-fill{
  background:#d86f5b;
}

.hunger-fill{
  background:#d69a4a;
}

.happy-fill{
  background:#e4b94d;
}

/* =========================
   행동 버튼
========================= */

.action-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:20px 16px 24px;
}

.action-button{
  min-height:56px;
  padding:12px 8px;
  border-radius:15px;
  background:#eadcc6;
  color:#4b3525;
  font-size:14px;
  font-weight:900;
  line-height:1.3;
  box-shadow:0 3px 0 #d1bea3;
}

.action-button:active{
  transform:translateY(2px);
}

/* =========================
   방
========================= */

.room-area{
  padding:0 12px 20px;
}

.room{
  position:relative;
  width:100%;
  height:330px;
  border-radius:24px;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  border:4px solid #d6b991;
}

/* 거실 */

.room.living{
  background:
    linear-gradient(
      to bottom,
      #f6dfb8 0%,
      #f6dfb8 68%,
      #c9905e 68%,
      #c9905e 100%
    );
}

/* 주방 */

.room.kitchen{
  background:
    linear-gradient(
      to bottom,
      #e9edf0 0%,
      #e9edf0 65%,
      #b8a07e 65%,
      #b8a07e 100%
    );
}

/* 침실 */

.room.bedroom{
  background:
    linear-gradient(
      to bottom,
      #d9e3f3 0%,
      #d9e3f3 67%,
      #b78d68 67%,
      #b78d68 100%
    );
}

/* 화장실 */

.room.bathroom{
  background:
    linear-gradient(
      to bottom,
      #dceff2 0%,
      #dceff2 65%,
      #c4d0d0 65%,
      #c4d0d0 100%
    );
}

/* 놀이터 */

.room.playground{
  background:
    linear-gradient(
      to bottom,
      #b9dff2 0%,
      #b9dff2 62%,
      #7db56c 62%,
      #7db56c 100%
    );
}

.room-title{
  position:absolute;
  top:12px;
  left:14px;
  z-index:5;
  padding:7px 11px;
  border-radius:12px;
  background:rgba(255,255,255,.8);
  font-size:14px;
  font-weight:1000;
}

.room-decoration{
  position:absolute;
  pointer-events:none;
  z-index:1;
}

.kitchen-table{
  width:150px;
  height:70px;
  background:#9c704d;
  border-radius:10px;
  right:20px;
  bottom:50px;
}

.kitchen-fridge{
  width:60px;
  height:120px;
  background:#f8f8f8;
  border-radius:8px;
  left:20px;
  bottom:40px;
  border:3px solid #ccc;
}

.bed{
  width:190px;
  height:100px;
  background:#f4e8dc;
  border-radius:20px;
  left:20px;
  bottom:45px;
  border:5px solid #a67c5b;
}

.bathtub{
  width:190px;
  height:80px;
  background:#f8ffff;
  border-radius:40px 40px 20px 20px;
  right:20px;
  bottom:45px;
  border:5px solid #9fbabd;
}

.playground-slide{
  width:70px;
  height:130px;
  right:25px;
  bottom:42px;
  border-left:15px solid #9d6849;
  border-bottom:12px solid #9d6849;
  transform:skew(-20deg);
}

.playground-ball{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#f0a85c;
  right:90px;
  bottom:45px;
}

/* =========================
   방 버튼
========================= */

.room-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  padding:12px 0 0;
}

.room-button{
  padding:11px 3px;
  border-radius:12px;
  background:#eadcc6;
  color:#4b3525;
  font-size:12px;
  font-weight:900;
}

.room-button.active{
  background:#c98745;
  color:#fff;
}

/* =========================
   여러 감자
========================= */

.play-potato{
  position:absolute;
  width:75px;
  height:75px;
  object-fit:contain;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  z-index:10;
  cursor:pointer;
  will-change:left,top,transform;
}

.play-potato.leader{
  width:90px;
  height:90px;
  z-index:15;
}

.play-potato.dragging{
  transform:scale(1.08);
}

.potato-name-tag{
  position:absolute;
  z-index:20;
  transform:translate(-50%,-100%);
  padding:4px 8px;
  border-radius:9px;
  background:rgba(255,255,255,.85);
  font-size:10px;
  font-weight:900;
  pointer-events:none;
  white-space:nowrap;
}

/* =========================
   효과
========================= */

.touch-heart{
  position:absolute;
  font-size:28px;
  pointer-events:none;
  animation:heartFloat 1s ease forwards;
  z-index:40;
}

@keyframes heartFloat{
  0%{
    opacity:1;
    transform:translateY(0) scale(.7);
  }
  100%{
    opacity:0;
    transform:translateY(-80px) scale(1.3);
  }
}

.touch-sparkle{
  position:absolute;
  pointer-events:none;
  font-size:24px;
  animation:sparkleFloat .8s ease forwards;
  z-index:40;
}

@keyframes sparkleFloat{
  0%{
    opacity:1;
    transform:scale(.5) rotate(0);
  }
  100%{
    opacity:0;
    transform:scale(1.5) rotate(180deg) translateY(-35px);
  }
}

/* =========================
   하단 네비
========================= */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:500px;
  height:70px;
  background:#fffaf2;
  border-top:2px solid #eadcc6;
  display:grid;
  grid-template-columns:1fr 1fr;
  z-index:100;
}

.nav-button{
  background:transparent;
  color:#806b58;
  font-size:13px;
  font-weight:900;
}

.nav-button.active{
  color:#c06f34;
}

/* =========================
   사전
========================= */

#collectionScreen{
  padding-bottom:90px;
}

.collection-header{
  padding:18px 16px 10px;
  text-align:center;
}

.collection-title{
  font-size:25px;
  font-weight:1000;
}

.collection-subtitle{
  margin-top:5px;
  font-size:12px;
  color:#806b58;
}

.collection-count{
  margin:12px 16px;
  padding:12px;
  border-radius:14px;
  background:#fff0c9;
  border:2px solid #ead7ae;
  text-align:center;
  font-size:13px;
  font-weight:900;
}

.collection-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 16px 20px;
}

.collection-card{
  background:#fff;
  border:2px solid #eadcc6;
  border-radius:18px;
  padding:12px;
  text-align:center;
  box-shadow:0 2px 7px rgba(80,50,20,.06);
}

.collection-card.on{
  border-color:#c98745;
}

.collection-card.off{
  opacity:.55;
}

.collection-card img{
  width:100px;
  height:100px;
  object-fit:contain;
  display:block;
  margin:0 auto 7px;
  user-select:none;
  -webkit-user-select:none;
}

.collection-name{
  font-size:14px;
  font-weight:1000;
  margin-bottom:4px;
}

.collection-description{
  font-size:10px;
  color:#806b58;
  min-height:28px;
  line-height:1.4;
  margin-bottom:10px;
}

.toggle-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.toggle{
  position:relative;
  width:54px;
  height:30px;
  border-radius:20px;
  background:#c8bcae;
  transition:.2s;
}

.toggle::after{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  background:white;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.toggle.on{
  background:#c98745;
}

.toggle.on::after{
  left:27px;
}

.toggle-text{
  font-size:11px;
  font-weight:1000;
  min-width:22px;
}

/* =========================
   모달
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:200;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal{
  width:100%;
  max-width:360px;
  background:#fffaf2;
  border-radius:22px;
  padding:22px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.modal-title{
  font-size:21px;
  font-weight:1000;
  margin-bottom:10px;
}

.modal-text{
  font-size:13px;
  line-height:1.6;
  color:#806b58;
  margin-bottom:18px;
}

.modal-close{
  width:100%;
  padding:13px;
  border-radius:13px;
  background:#c98745;
  color:white;
  font-weight:900;
}

/* =========================
   애니메이션
========================= */

.potato-jump{
  animation:potatoJump .55s ease;
}

@keyframes potatoJump{
  0%{transform:translateY(0) scale(1);}
  35%{transform:translateY(-45px) scale(1.05);}
  65%{transform:translateY(-20px) scale(.98);}
  100%{transform:translateY(0) scale(1);}
}

.potato-wiggle{
  animation:potatoWiggle .55s ease;
}

@keyframes potatoWiggle{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-15px) rotate(-5deg);}
  50%{transform:translateX(15px) rotate(5deg);}
  75%{transform:translateX(-8px);}
}

</style>
</head>

<body>

<!-- =========================
     시작 화면
========================= -->

<div id="startScreen" class="screen">

  <div class="start-potato">🥔</div>

  <div class="start-title">
    감자 키우기
  </div>

  <div class="start-subtitle">
    나만의 감자를 키워보세요
  </div>

  <button
    class="start-button"
    onclick="startGame()"
  >
    감자 키우기 시작
  </button>

</div>


<!-- =========================
     성장 화면
========================= -->

<div id="beforeScreen" class="screen hidden">

  <div class="header">
    <div class="header-title">
      감자가 자라고 있어요
    </div>

    <div class="header-subtitle">
      조금만 기다려주세요
    </div>
  </div>

  <div class="egg-scene">

    <div class="soil"></div>

    <div class="growth-emoji">
      🌱
    </div>

  </div>

  <div class="growth-info">

    <div class="growth-title">
      감자 성장 중
    </div>

    <div
      id="growthPercent"
      class="growth-percent"
    >
      0%
    </div>

    <div class="progress">
      <div
        id="growthBar"
        class="progress-bar"
      ></div>
    </div>

  </div>

</div>


<!-- =========================
     게임 화면
========================= -->

<div id="gameScreen" class="screen hidden">

  <div class="sticky-top">

    <div class="header">

      <div class="header-title">
        감자 생활
      </div>

      <div class="header-subtitle">
        감자와 함께 생활해보세요
      </div>

    </div>

    <div id="potatoWrap">

      <img
        id="potatoImage"
        src="Potato1.PNG"
        alt="대장감자"
        draggable="false"
      >

    </div>

  </div>


  <div
    id="gameMessage"
    class="message"
  >
    대장감자를 꾹 눌러 움직일 수 있어요
  </div>


  <div class="info">

    <div
      id="mainPotatoName"
      class="potato-name"
    >
      대장감자
    </div>

    <div
      id="mainPersonality"
      class="personality"
    >
      느긋하고 순한 감자
    </div>


    <div class="stat">

      <div class="stat-line">
        <span>체력</span>
        <span id="healthText">100</span>
      </div>

      <div class="stat-bar">
        <div
          id="healthBar"
          class="stat-fill health-fill"
        ></div>
      </div>

    </div>


    <div class="stat">

      <div class="stat-line">
        <span>배고픔</span>
        <span id="hungerText">100</span>
      </div>

      <div class="stat-bar">
        <div
          id="hungerBar"
          class="stat-fill hunger-fill"
        ></div>
      </div>

    </div>


    <div class="stat">

      <div class="stat-line">
        <span>행복도</span>
        <span id="happyText">100</span>
      </div>

      <div class="stat-bar">
        <div
          id="happyBar"
          class="stat-fill happy-fill"
        ></div>
      </div>

    </div>

  </div>


  <div class="action-buttons">

    <button
      class="action-button"
      onclick="feedPotato()"
    >
      🍚 밥 주기
    </button>

    <button
      class="action-button"
      onclick="playPotato()"
    >
      🎮 놀아주기
    </button>

    <button
      class="action-button"
      onclick="touchMainPotato()"
    >
      ❤️ 쓰다듬기
    </button>

    <button
      class="action-button"
      onclick="sleepPotato()"
    >
      😴 재우기
    </button>

  </div>


  <div class="room-area">

    <div
      id="room"
      class="room living"
    >

      <div
        id="roomTitle"
        class="room-title"
      >
        🏠 거실
      </div>

      <div
        id="roomDecor1"
        class="room-decoration"
      ></div>

      <div
        id="roomDecor2"
        class="room-decoration"
      ></div>

      <div
        id="roomPotatoes"
      ></div>

    </div>


    <div class="room-buttons">

      <button
        class="room-button active"
        data-room="living"
        onclick="changeRoom('living')"
      >
        🏠 거실
      </button>

      <button
        class="room-button"
        data-room="kitchen"
        onclick="changeRoom('kitchen')"
      >
        🍳 주방
      </button>

      <button
        class="room-button"
        data-room="bedroom"
        onclick="changeRoom('bedroom')"
      >
        🛏️ 침실
      </button>

      <button
        class="room-button"
        data-room="bathroom"
        onclick="changeRoom('bathroom')"
      >
        🚿 화장실
      </button>

    </div>


    <div style="padding-top:7px">

      <button
        class="room-button"
        style="width:100%"
        data-room="playground"
        onclick="changeRoom('playground')"
      >
        🎡 놀이터
      </button>

    </div>

  </div>


  <div class="bottom-nav">

    <button
      id="navHome"
      class="nav-button active"
      onclick="showGameScreen()"
    >
      🏠 키우기
    </button>

    <button
      id="navCollection"
      class="nav-button"
      onclick="showCollectionScreen()"
    >
      📖 감자사전
    </button>

  </div>

</div>


<!-- =========================
     감자사전
========================= -->

<div
  id="collectionScreen"
  class="screen hidden"
>

  <div class="collection-header">

    <div class="collection-title">
      📖 감자사전
    </div>

    <div class="collection-subtitle">
      함께 키울 감자를 ON으로 켜주세요
    </div>

  </div>


  <div
    id="collectionCount"
    class="collection-count"
  >
    함께 키우는 감자 1마리
  </div>


  <div
    id="collectionList"
    class="collection-list"
  ></div>


  <div class="bottom-nav">

    <button
      class="nav-button"
      onclick="showGameScreen()"
    >
      🏠 키우기
    </button>

    <button
      class="nav-button active"

</div>

      id="modalText"

    >
      확인

  </div>

</div>


<script>

/* ==================================================
   감자 데이터
================================================== */

const POTATOES = [

  {
    id:"potato1",
    name:"대장감자",
    image:"Potato1.PNG",
    personality:"느긋하고 순한 감자",
    description:"감자들의 대장. 느긋하지만 은근히 주변을 잘 챙겨요."
  },

  {
    id:"potato2",
    name:"멋쟁이감자",
    image:"Potato2.PNG",
    personality:"자신감 넘치는 감자",
    description:"어디서든 자신감이 넘치는 멋쟁이 감자예요."
  },

  {
    id:"potato3",
    name:"졸린감자",
    image:"Potato3.PNG",
    personality:"잠이 많은 감자",
    description:"하루 종일 졸려서 자주 하품을 해요."
  },

  {
    id:"potato4",
    name:"장난감자",
    image:"Potato4.PNG",
    personality:"활발하고 장난꾸러기",
    description:"가만히 있는 법이 없는 장난꾸러기 감자예요."
  },

  {
    id:"potato5",
    name:"행복감자",
    image:"Potato5.PNG",
    personality:"밝고 긍정적인 감자",
    description:"항상 웃고 있어서 주변 감자까지 행복하게 만들어요."
  }

];


/* ==================================================
   기본 상태
================================================== */

let gameState = {

  started:false,

  growth:100,

  health:100,
  hunger:100,
  happy:100,

  currentRoom:"living",

  enabledPotatoes:{
    potato1:true,
    potato2:false,
    potato3:false,
    potato4:false,
    potato5:false
  },

  positions:{

    potato1:{
      living:{x:45,y:55},
      kitchen:{x:42,y:55},
      bedroom:{x:45,y:55},
      bathroom:{x:45,y:55},
      playground:{x:42,y:50}
    },

    potato2:{
      living:{x:25,y:62},
      kitchen:{x:25,y:58},
      bedroom:{x:25,y:60},
      bathroom:{x:25,y:58},
      playground:{x:25,y:55}
    },

    potato3:{
      living:{x:65,y:58},
      kitchen:{x:65,y:60},
      bedroom:{x:65,y:58},
      bathroom:{x:65,y:60},
      playground:{x:62,y:55}
    },

    potato4:{
      living:{x:25,y:35},
      kitchen:{x:25,y:35},
      bedroom:{x:25,y:35},
      bathroom:{x:25,y:35},
      playground:{x:70,y:55}
    },

    potato5:{
      living:{x:70,y:38},
      kitchen:{x:70,y:38},
      bedroom:{x:70,y:38},
      bathroom:{x:70,y:38},
      playground:{x:55,y:55}
    }

  }

};


/* ==================================================
   로컬 저장
================================================== */

function saveGame(){

  localStorage.setItem(
    "potatoPartyGame",
    JSON.stringify(gameState)
  );

}


function loadGame(){

  const saved =
    localStorage.getItem("potatoPartyGame");

  if(!saved){
    return;
  }

  try{

    const parsed = JSON.parse(saved);

    gameState = {
      ...gameState,
      ...parsed,

      enabledPotatoes:{
        ...gameState.enabledPotatoes,
        ...(parsed.enabledPotatoes || {})
      },

      positions:{
        ...gameState.positions,
        ...(parsed.positions || {})
      }

    };

  }catch(error){

    console.log("저장 데이터 불러오기 실패");

  }

}


/* ==================================================
   시작
================================================== */

function startGame(){

  gameState.started = true;

  saveGame();

  document
    .getElementById("startScreen")
    .classList
    .add("hidden");

  document
    .getElementById("gameScreen")
    .classList
    .remove("hidden");

  updateStats();

  renderRoom();

}


/* ==================================================
   화면 전환
================================================== */

function showGameScreen(){

  document
    .getElementById("collectionScreen")
    .classList
    .add("hidden");

  document
    .getElementById("gameScreen")
    .classList
    .remove("hidden");

  document
    .getElementById("navHome")
    ?.classList
    .add("active");

  renderRoom();

}


function showCollectionScreen(){

  document
    .getElementById("gameScreen")
    .classList
    .add("hidden");

  document
    .getElementById("collectionScreen")
    .classList
    .remove("hidden");

  renderCollection();

}


/* ==================================================
   감자사전
================================================== */

function renderCollection(){

  const list =
    document.getElementById("collectionList");

  list.innerHTML = "";

  const enabledCount =
    Object.values(gameState.enabledPotatoes)
      .filter(Boolean)
      .length;

  document
    .getElementById("collectionCount")
    .textContent =
      `함께 키우는 감자 ${enabledCount}마리`;


  POTATOES.forEach(potato => {

    const isOn =
      !!gameState.enabledPotatoes[potato.id];

    const card =
      document.createElement("div");

    card.className =
      "collection-card " +
      (isOn ? "on" : "off");


    card.innerHTML = `

      <img
        src="${potato.image}"
        alt="${potato.name}"
        draggable="false"
      >

      <div class="collection-name">
        ${potato.name}
      </div>

      <div class="collection-description">
        ${potato.description}
      </div>

      <div class="toggle-row">

        <div
          class="toggle ${isOn ? "on" : ""}"
          data-id="${potato.id}"
        ></div>

        <div class="toggle-text">
          ${isOn ? "ON" : "OFF"}
        </div>

      </div>

    `;


    card
      .querySelector(".toggle")
      .addEventListener(
        "click",
        function(){

          togglePotato(
            potato.id
          );

        }
      );


    card.addEventListener(
      "click",
      function(event){

        if(
          event.target.classList.contains("toggle")
        ){
          return;
        }

        openModal(
          potato.name,
          potato.description
        );

      }
    );


    list.appendChild(card);

  });

}


function togglePotato(id){

  /*
    대장감자는 최소 한 마리 있어야 하므로
    potato1은 OFF 불가능
  */

  if(id === "potato1"){

    gameState.enabledPotatoes.potato1 = true;

    openModal(
      "대장감자",
      "대장감자는 항상 함께 있어야 해요."
    );

    return;

  }


  gameState.enabledPotatoes[id] =
    !gameState.enabledPotatoes[id];

  saveGame();

  renderCollection();

  if(
    !document
      .getElementById("gameScreen")
      .classList
      .contains("hidden")
  ){

    renderRoom();

  }

}


/* ==================================================
   방 변경
================================================== */

function changeRoom(room){

  gameState.currentRoom = room;

  saveGame();

  updateRoomButtons();

  renderRoom();

}


function updateRoomButtons(){

  document
    .querySelectorAll(".room-button[data-room]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.room ===
        gameState.currentRoom
      );

    });

}


/* ==================================================
   방 렌더링
================================================== */

function renderRoom(){

  const room =
    document.getElementById("room");

  const title =
    document.getElementById("roomTitle");

  const decor1 =
    document.getElementById("roomDecor1");

  const decor2 =
    document.getElementById("roomDecor2");


  room.className =
    "room " +
    gameState.currentRoom;


  const roomInfo = {

    living:{
      title:"🏠 거실"
    },

    kitchen:{
      title:"🍳 주방"
    },

    bedroom:{
      title:"🛏️ 침실"
    },

    bathroom:{
      title:"🚿 화장실"
    },

    playground:{
      title:"🎡 놀이터"
    }

  };


  title.textContent =
    roomInfo[gameState.currentRoom].title;


  decor1.className =
    "room-decoration";

  decor2.className =
    "room-decoration";


  if(gameState.currentRoom === "kitchen"){

    decor1.classList.add("kitchen-table");
    decor2.classList.add("kitchen-fridge");

  }


  if(gameState.currentRoom === "bedroom"){

    decor1.classList.add("bed");
    decor2.innerHTML = "";

  }


  if(gameState.currentRoom === "bathroom"){

    decor1.classList.add("bathtub");
    decor2.innerHTML = "";

  }


  if(gameState.currentRoom === "playground"){

    decor1.classList.add("playground-slide");
    decor2.classList.add("playground-ball");

  }


  if(gameState.currentRoom === "living"){

    decor1.innerHTML = "🛋️";
    decor1.style.fontSize = "80px";
    decor1.style.left = "20px";
    decor1.style.bottom = "35px";

    decor2.innerHTML = "📺";
    decor2.style.fontSize = "55px";
    decor2.style.right = "25px";
    decor2.style.bottom = "45px";

  }


  renderRoomPotatoes();

}


/* ==================================================
   방 안 감자
================================================== */

function renderRoomPotatoes(){

  const container =
    document.getElementById("roomPotatoes");

  container.innerHTML = "";


  POTATOES.forEach(
    potato => {

      if(
        !gameState.enabledPotatoes[potato.id]
      ){
        return;
      }


      const position =
        gameState
          .positions
          [potato.id]
          [gameState.currentRoom];


      if(!position){
        return;
      }


      const img =
        document.createElement("img");

      img.className =
        "play-potato";


      if(potato.id === "potato1"){

        img.classList.add("leader");

      }


      img.src =
        potato.image;

      img.alt =
        potato.name;

      img.draggable = false;


      img.style.left =
        `calc(${position.x}% - ${potato.id === "potato1" ? 45 : 37.5}px)`;

      img.style.top =
        `calc(${position.y}% - ${potato.id === "potato1" ? 45 : 37.5}px)`;


      img.dataset.id =
        potato.id;


      container.appendChild(img);


      setupPotatoInteraction(
        img,
        potato.id
      );

    }
  );

}


/* ==================================================
   감자 터치 / 드래그
================================================== */

function setupPotatoInteraction(
  element,
  potatoId
){

  let pointerDown = false;
  let dragging = false;

  let startX = 0;
  let startY = 0;

  let startLeft = 0;
  let startTop = 0;

  let longPressTimer = null;

  const LONG_PRESS_TIME = 450;


  element.addEventListener(
    "pointerdown",
    function(event){

      event.preventDefault();

      pointerDown = true;

      startX = event.clientX;
      startY = event.clientY;

      const rect =
        element.getBoundingClientRect();

      const parentRect =
        document
          .getElementById("room")
          .getBoundingClientRect();


      startLeft =
        rect.left -
        parentRect.left;


      startTop =
        rect.top -
        parentRect.top;


      element.setPointerCapture?.(
        event.pointerId
      );


      /*
        대장감자는 꾹 눌러야 이동 시작
      */

      if(potatoId === "potato1"){

        longPressTimer =
          setTimeout(
            function(){

              if(!pointerDown){
                return;
              }

              dragging = true;

              element.classList.add(
                "dragging"
              );

              showMessage(
                "대장감자를 움직이는 중이에요"
              );

            },
            LONG_PRESS_TIME
          );

      }else{

        /*
          다른 감자는 바로 움직일 수 있음
        */

        dragging = true;

      }

    }
  );


  element.addEventListener(
    "pointermove",
    function(event){

      if(!pointerDown){
        return;
      }


      const dx =
        event.clientX - startX;

      const dy =
        event.clientY - startY;


      /*
        대장감자는 일정 거리 이상 움직여도
        롱프레스 타이머 취소
      */

      if(
        potatoId === "potato1" &&
        Math.sqrt(dx * dx + dy * dy) > 12 &&
        !dragging
      ){

        clearTimeout(longPressTimer);

        return;

      }


      if(!dragging){
        return;
      }


      event.preventDefault();


      const room =
        document.getElementById("room");


      const roomRect =
        room.getBoundingClientRect();


      const potatoSize =
        potatoId === "potato1"
          ? 90
          : 75;


      let left =
        startLeft + dx;

      let top =
        startTop + dy;


      /*
        방 밖으로 못 나가게 제한
      */

      left =
        Math.max(
          0,
          Math.min(
            roomRect.width - potatoSize,
            left
          )
        );


      top =
        Math.max(
          35,
          Math.min(
            roomRect.height - potatoSize,
            top
          )
        );


      element.style.left =
        left + "px";

      element.style.top =
        top + "px";


      /*
        퍼센트 좌표 저장
      */

      const x =
        (left + potatoSize / 2) /
        roomRect.width *
        100;

      const y =
        (top + potatoSize / 2) /
        roomRect.height *
        100;


      gameState
        .positions
        [potatoId]
        [gameState.currentRoom] = {
          x:x,
          y:y
        };


      /*
        대장감자를 움직이면
        다른 감자들이 따라오도록 처리
      */

      if(potatoId === "potato1"){

        moveFollowers(
          dx,
          dy
        );

      }

    }
  );


  element.addEventListener(
    "pointerup",
    function(event){

      finishInteraction(
        event
      );

    }
  );


  element.addEventListener(
    "pointercancel",
    function(event){

      finishInteraction(
        event
      );

    }
  );


  function finishInteraction(event){

    clearTimeout(
      longPressTimer
    );

    pointerDown = false;


    if(dragging){

      dragging = false;

      element.classList.remove(
        "dragging"
      );

      saveGame();

      return;

    }


    /*
      드래그하지 않았다면 터치
    */

    touchPotato(
      potatoId,
      element
    );

  }

}


/* ==================================================
   대장감자 따라오기
================================================== */

function moveFollowers(
  dx,
  dy
){

  const room =
    document.getElementById("room");

  const roomRect =
    room.getBoundingClientRect();


  POTATOES.forEach(
    potato => {

      if(
        potato.id === "potato1"
      ){
        return;
      }


      if(
        !gameState.enabledPotatoes
          [potato.id]
      ){
        return;
      }


      const position =
        gameState
          .positions
          [potato.id]
          [gameState.currentRoom];


      if(!position){
        return;
      }


      /*
        대장감자 이동량을
        조금 느리게 따라가도록 처리
      */

      const followerMoveX =
        dx / roomRect.width *
        100 *
        0.75;

      const followerMoveY =
        dy / roomRect.height *
        100 *
        0.75;


      position.x +=
        followerMoveX;

      position.y +=
        followerMoveY;


      position.x =
        Math.max(
          10,
          Math.min(
            90,
            position.x
          )
        );


      position.y =
        Math.max(
          25,
          Math.min(
            85,
            position.y
          )
        );


      const element =
        room.querySelector(
          `.play-potato[data-id="${potato.id}"]`
        );


      if(!element){
        return;
      }


      const size = 75;


      const left =
        position.x / 100 *
        roomRect.width -
        size / 2;


      const top =
        position.y / 100 *
        roomRect.height -
        size / 2;


      element.style.left =
        left + "px";

      element.style.top =
        top + "px";

    }
  );

}


/* ==================================================
   감자 터치
================================================== */

function touchPotato(
  potatoId,
  element
){

  const potato =
    POTATOES.find(
      p => p.id === potatoId
    );


  if(!potato){
    return;
  }


  createHeart(
    element
  );


  element.classList.remove(
    "potato-wiggle"
  );


  void element.offsetWidth;


  element.classList.add(
    "potato-wiggle"
  );


  gameState.happy =
    Math.min(
      100,
      gameState.happy + 5
    );


  showMessage(
    `${potato.name}가 좋아해요 ❤️`
  );


  updateStats();

  saveGame();

}


/* ==================================================
   대장감자 터치
================================================== */

function touchMainPotato(){

  const img =
    document.getElementById(
      "potatoImage"
    );


  createHeart(
    img
  );


  img.classList.remove(
    "potato-jump"
  );


  void img.offsetWidth;


  img.classList.add(
    "potato-jump"
  );


  gameState.happy =
    Math.min(
      100,
      gameState.happy + 8
    );


  updateStats();

  saveGame();

  showMessage(
    "대장감자가 기분 좋아졌어요 ❤️"
  );

}


/* ==================================================
   행동
================================================== */

function feedPotato(){

  gameState.hunger =
    Math.min(
      100,
      gameState.hunger + 25
    );

  gameState.happy =
    Math.min(
      100,
      gameState.happy + 4
    );


  updateStats();

  saveGame();

  showMessage(
    "냠냠! 감자가 밥을 먹었어요 🍚"
  );

}


function playPotato(){

  gameState.happy =
    Math.min(
      100,
      gameState.happy + 20
    );

  gameState.health =
    Math.min(
      100,
      gameState.health + 3
    );


  updateStats();

  saveGame();

  showMessage(
    "감자가 신나게 놀았어요 🎮"
  );


  const img =
    document.getElementById(
      "potatoImage"
    );


  img.classList.remove(
    "potato-jump"
  );


  void img.offsetWidth;


  img.classList.add(
    "potato-jump"
  );

}


function sleepPotato(){

  gameState.health =
    Math.min(
      100,
      gameState.health + 10
    );

  gameState.hunger =
    Math.max(
      0,
      gameState.hunger - 3
    );


  updateStats();

  saveGame();

  showMessage(
    "감자가 푹 자고 있어요 😴"
  );

}


/* ==================================================
   스탯
================================================== */

function updateStats(){

  const health =
    Math.round(
      gameState.health
    );

  const hunger =
    Math.round(
      gameState.hunger
    );

  const happy =
    Math.round(
      gameState.happy
    );


  document
    .getElementById("healthText")
    .textContent =
    health;


  document
    .getElementById("hungerText")
    .textContent =
    hunger;


  document
    .getElementById("happyText")
    .textContent =
    happy;


  document
    .getElementById("healthBar")
    .style.width =
    health + "%";


  document
    .getElementById("hungerBar")
    .style.width =
    hunger + "%";


  document
    .getElementById("happyBar")
    .style.width =
    happy + "%";

}


/* ==================================================
   자동 스탯 감소
================================================== */

setInterval(
  function(){

    if(
      !gameState.started
    ){
      return;
    }


    gameState.hunger =
      Math.max(
        0,
        gameState.hunger - 1
      );


    gameState.happy =
      Math.max(
        0,
        gameState.happy - 0.5
      );


    if(
      gameState.hunger <= 20
    ){

      gameState.health =
        Math.max(
          0,
          gameState.health - 0.5
        );

    }


    updateStats();

    saveGame();

  },
  30000
);


/* ==================================================
   메시지
================================================== */

let messageTimer = null;


function showMessage(text){

  const message =
    document.getElementById(
      "gameMessage"
    );


  message.textContent =
    text;


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(
      function(){

        message.textContent =
          "대장감자를 꾹 눌러 움직일 수 있어요";

      },
      2500
    );

}


/* ==================================================
   효과
================================================== */

function createHeart(
  element
){

  const room =
    document.getElementById(
      "room"
    );


  const roomRect =
    room.getBoundingClientRect();


  const rect =
    element.getBoundingClientRect();


  const heart =
    document.createElement(
      "div"
    );


  heart.className =
    "touch-heart";


  heart.textContent =
    "❤️";


  heart.style.left =
    (
      rect.left -
      roomRect.left +
      rect.width / 2
    ) + "px";


  heart.style.top =
    (
      rect.top -
      roomRect.top
    ) + "px";


  room.appendChild(
    heart
  );


  setTimeout(
    () => heart.remove(),
    1000
  );

}


/* ==================================================
   모달
================================================== */

function openModal(
  title,
  text
){

  document
    .getElementById("modalTitle")
    .textContent =
    title;


  document
    .getElementById("modalText")
    .textContent =
    text;


  document
    .getElementById("modalBg")
    .classList
    .remove("hidden");

}


function closeModal(
  event
){

  if(
    event &&
    event.target !==
    document.getElementById("modalBg")
  ){

    return;

  }


  document
    .getElementById("modalBg")
    .classList
    .add("hidden");

}


/* ==================================================
   메인 대장감자 롱프레스 이동
================================================== */

(function(){

  const img =
    document.getElementById(
      "potatoImage"
    );


  let pointerDown = false;
  let dragging = false;

  let startX = 0;
  let startY = 0;

  let startLeft = 0;
  let startTop = 0;

  let timer = null;


  img.addEventListener(
    "pointerdown",
    function(event){

      event.preventDefault();

      pointerDown = true;

      startX =
        event.clientX;

      startY =
        event.clientY;


      const rect =
        img.getBoundingClientRect();


      const wrap =
        document.getElementById(
          "potatoWrap"
        );


      const wrapRect =
        wrap.getBoundingClientRect();


      startLeft =
        rect.left -
        wrapRect.left;


      startTop =
        rect.top -
        wrapRect.top;


      img.setPointerCapture?.(
        event.pointerId
      );


      timer =
        setTimeout(
          function(){

            if(!pointerDown){
              return;
            }

            dragging = true;

            img.style.position =
              "absolute";

            img.style.zIndex =
              "20";

            showMessage(
              "대장감자를 움직이는 중이에요"
            );

          },
          450
        );

    }
  );


  img.addEventListener(
    "pointermove",
    function(event){

      if(
        !pointerDown ||
        !dragging
      ){
        return;
      }


      event.preventDefault();


      const wrap =
        document.getElementById(
          "potatoWrap"
        );


      const rect =
        wrap.getBoundingClientRect();


      const dx =
        event.clientX -
        startX;


      const dy =
        event.clientY -
        startY;


      let left =
        startLeft + dx;


      let top =
        startTop + dy;


      const width =
        img.offsetWidth;


      const height =
        img.offsetHeight;


      left =
        Math.max(
          0,
          Math.min(
            rect.width - width,
            left
          )
        );


      top =
        Math.max(
          0,
          Math.min(
            rect.height - height,
            top
          )
        );


      img.style.left =
        left + "px";


      img.style.top =
        top + "px";

    }
  );


  function finish(){

    clearTimeout(timer);

    pointerDown = false;


    if(dragging){

      dragging = false;

      showMessage(
        "대장감자를 이동했어요"
      );

      return;

    }

  }


  img.addEventListener(
    "pointerup",
    finish
  );


  img.addEventListener(
    "pointercancel",
    finish
  );

})();
