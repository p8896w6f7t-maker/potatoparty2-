<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>감자키우기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    sans-serif;
  background:#f4ead7;
  color:#352819;
  user-select:none;
  -webkit-user-select:none;
}

button{
  border:0;
  font:inherit;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

/* ==================================================
   시작 화면
================================================== */

.screen{
  width:100%;
  height:100%;
  display:none;
}

.screen.active{
  display:flex;
}

#startScreen{
  background:
    radial-gradient(circle at 50% 30%, #fff7df 0%, #f3dfb9 55%, #d8bd91 100%);
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.start-potato{
  font-size:110px;
  line-height:1;
  margin-bottom:20px;
  animation:startBounce 1.7s infinite ease-in-out;
}

@keyframes startBounce{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-12px);
  }
}

.start-title{
  font-size:42px;
  font-weight:900;
  letter-spacing:-2px;
  margin-bottom:35px;
}

.start-button{
  width:220px;
  height:65px;
  border-radius:20px;
  background:#8b633d;
  color:white;
  font-size:22px;
  font-weight:900;
  box-shadow:
    0 7px 0 #62432b,
    0 12px 25px rgba(0,0,0,.15);
}

.start-button:active{
  transform:translateY(5px);
  box-shadow:
    0 2px 0 #62432b,
    0 5px 12px rgba(0,0,0,.12);
}

/* ==================================================
   키우기 화면
================================================== */

#growScreen{
  flex-direction:column;
  background:#f6ead4;
}

.grow-header{
  height:74px;
  flex-shrink:0;
  background:#fff7e8;
  border-bottom:2px solid #ddc7a6;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  z-index:10;
}

.header-title{
  font-weight:900;
  font-size:21px;
}

.day-text{
  font-size:14px;
  font-weight:800;
  color:#866746;
}

.grow-main{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:12px 16px 100px;
}

.potato-stage{
  width:100%;
  min-height:390px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  border-radius:28px;
  background:
    linear-gradient(
      to bottom,
      #d9eff7 0%,
      #e9f5ef 58%,
      #9ac17e 58%,
      #82ae68 100%
    );
  border:3px solid #c7b08d;
  box-shadow:
    inset 0 -18px 0 rgba(80,100,55,.10),
    0 5px 0 #bba27d;
}

.potato-stage::before{
  content:"";
  position:absolute;
  width:100%;
  height:50px;
  left:0;
  bottom:0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 13px,
      rgba(60,100,45,.15) 13px 17px
    );
}

.stage-potato{
  width:285px;
  height:285px;
  object-fit:contain;
  display:block;
  position:relative;
  z-index:3;
  image-rendering:auto;
  animation:potatoIdle 2.8s infinite ease-in-out;
  filter:drop-shadow(0 14px 8px rgba(0,0,0,.18));
}

@keyframes potatoIdle{
  0%,100%{
    transform:translateY(0) rotate(0deg);
  }
  50%{
    transform:translateY(-8px) rotate(-1deg);
  }
}

.growth-emoji{
  position:absolute;
  z-index:2;
  font-size:100px;
  animation:growFloat 2s infinite ease-in-out;
}

@keyframes growFloat{
  0%,100%{
    transform:translateY(5px) scale(1);
  }
  50%{
    transform:translateY(-8px) scale(1.05);
  }
}

.stage-text{
  position:absolute;
  top:15px;
  left:0;
  width:100%;
  text-align:center;
  z-index:5;
  font-size:18px;
  font-weight:900;
  color:#60452c;
}

.progress-wrap{
  margin:16px 0;
}

.progress-label{
  display:flex;
  justify-content:space-between;
  font-weight:900;
  font-size:14px;
  margin-bottom:7px;
}

.progress-bar{
  height:18px;
  border-radius:20px;
  background:#ddcbb0;
  overflow:hidden;
  border:2px solid #c5ab84;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(
    90deg,
    #83bd62,
    #4f9d48
  );
  border-radius:20px;
  transition:width .25s;
}

.grow-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.action-button{
  min-height:67px;
  border-radius:16px;
  background:#fffaf0;
  border:2px solid #dec8a5;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  font-size:13px;
  font-weight:900;
  box-shadow:0 3px 0 #c5aa83;
}

.action-button span:first-child{
  font-size:26px;
}

.action-button:active{
  transform:translateY(3px);
  box-shadow:none;
}

.potato-info{
  margin-top:16px;
  background:#fffaf0;
  border:2px solid #ddc8a7;
  border-radius:20px;
  padding:15px;
}

.info-name{
  font-size:24px;
  font-weight:1000;
}

.info-personality{
  margin-top:4px;
  font-size:14px;
  color:#886b48;
  font-weight:800;
}

.message-box{
  margin-top:12px;
  background:#f0e1c7;
  border-radius:15px;
  padding:12px;
  min-height:50px;
  font-weight:800;
  line-height:1.45;
}

.stats{
  margin-top:13px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.stat{
  background:#f8eedc;
  border-radius:14px;
  padding:9px 5px;
  text-align:center;
  border:1px solid #e1cdb0;
}

.stat-icon{
  font-size:19px;
}

.stat-name{
  font-size:11px;
  font-weight:900;
  margin:3px 0;
}

.stat-value{
  font-size:12px;
  font-weight:900;
}

.interactions{
  margin-top:13px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.interact-button{
  height:53px;
  border-radius:15px;
  background:#8d6945;
  color:#fff;
  font-size:13px;
  font-weight:900;
}

.interact-button:active{
  transform:scale(.96);
}

.harvest-button{
  background:#668b4c;
}

/* ==================================================
   하단 메뉴
================================================== */

.bottom-menu{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:75px;
  background:#fff9ec;
  border-top:2px solid #ddc7a6;
  display:grid;
  grid-template-columns:1fr 1fr;
  z-index:100;
}

.bottom-button{
  background:transparent;
  font-weight:900;
  color:#806346;
  font-size:14px;
}

.bottom-button.active{
  color:#5b3e25;
  background:#f2e3ca;
}

/* ==================================================
   감자사전
================================================== */

#dictionaryScreen{
  flex-direction:column;
  background:#d9c39d;
}

.dictionary-top{
  height:65px;
  flex-shrink:0;
  background:#f9edda;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:3px solid #b59769;
  z-index:20;
}

.dictionary-title{
  font-size:22px;
  font-weight:1000;
}

.back-button{
  padding:10px 13px;
  border-radius:12px;
  background:#80603c;
  color:#fff;
  font-size:13px;
  font-weight:900;
}

.tama-wrap{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.tama-screen{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-bottom:4px solid #705535;
  background:#c8aa7a;
}

/* ==================================================
   18비트 픽셀 배경
================================================== */

.pixel-room{
  position:absolute;
  inset:0;
  overflow:hidden;
  image-rendering:pixelated;
}

/*
  18비트 느낌의 블록형 배경.
  CSS grid를 이용해 작은 픽셀 타일을 반복한다.
*/

.pixel-room::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      #d8bd91 0 68%,
      #9a7048 68% 100%
    );
  z-index:0;
}

.pixel-room::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:68%;
  height:32%;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(80,50,25,.18) 0 3px,
      transparent 3px 24px
    ),
    repeating-linear-gradient(
      0deg,
      rgba(80,50,25,.12) 0 3px,
      transparent 3px 24px
    );
  z-index:1;
}

/* ==================================================
   픽셀 가구 공통
================================================== */

.pixel-object{
  position:absolute;
  z-index:4;
  image-rendering:pixelated;
}

/* 창문 */

.pixel-window{
  width:105px;
  height:72px;
  left:15px;
  top:18px;
  border:7px solid #68482e;
  background:#8ed2e8;
  box-shadow:
    inset 0 0 0 4px #d8c092;
}

.pixel-window::before{
  content:"";
  position:absolute;
  left:45%;
  top:0;
  width:7px;
  height:100%;
  background:#68482e;
}

.pixel-window::after{
  content:"";
  position:absolute;
  left:0;
  top:45%;
  width:100%;
  height:7px;
  background:#68482e;
}

/* 소파 */

.pixel-sofa{
  width:150px;
  height:65px;
  right:15px;
  bottom:24%;
  background:#725c91;
  border:7px solid #4c3a66;
  box-shadow:
    inset 0 -13px 0 #5a4777,
    0 7px 0 rgba(45,30,20,.3);
}

.pixel-sofa::before,
.pixel-sofa::after{
  content:"";
  position:absolute;
  width:20px;
  height:52px;
  top:5px;
  background:#5d477b;
  border:4px solid #44345d;
}

.pixel-sofa::before{
  left:-16px;
}

.pixel-sofa::after{
  right:-16px;
}

/* TV */

.pixel-tv{
  width:100px;
  height:70px;
  left:24px;
  bottom:25%;
  background:#403e44;
  border:7px solid #27262b;
}

.pixel-tv::before{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  top:10px;
  bottom:13px;
  background:#6ca4a1;
  border:4px solid #18181b;
}

.pixel-tv::after{
  content:"";
  position:absolute;
  width:25px;
  height:7px;
  bottom:-15px;
  left:30px;
  background:#29272b;
}

/* 테이블 */

.pixel-table{
  width:100px;
  height:25px;
  left:50%;
  bottom:20%;
  transform:translateX(-50%);
  background:#70452a;
  border:5px solid #4c2e1e;
}

.pixel-table::before,
.pixel-table::after{
  content:"";
  position:absolute;
  top:18px;
  width:9px;
  height:40px;
  background:#4c2e1e;
}

.pixel-table::before{
  left:8px;
}

.pixel-table::after{
  right:8px;
}

/* ==================================================
   방별 가구
================================================== */

/* 주방 */

.kitchen-cabinet{
  width:150px;
  height:70px;
  right:15px;
  top:20px;
  background:#9d6945;
  border:6px solid #633f2a;
}

.kitchen-cabinet::before{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  top:10px;
  height:25px;
  border-top:5px solid #5b3824;
  border-bottom:5px solid #5b3824;
}

/* 냉장고 */

.pixel-fridge{
  width:55px;
  height:105px;
  left:18px;
  top:105px;
  background:#d8d5cb;
  border:6px solid #77746d;
}

.pixel-fridge::before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  top:43%;
  height:4px;
  background:#77746d;
}

/* 침대 */

.pixel-bed{
  width:180px;
  height:90px;
  left:50%;
  top:30%;
  transform:translateX(-50%);
  background:#c78383;
  border:8px solid #694343;
}

.pixel-bed::before{
  content:"";
  position:absolute;
  left:8px;
  top:8px;
  width:65px;
  height:38px;
  background:#f1e3d2;
  border:5px solid #9b7770;
}

/* 베개 */

.pixel-pillow{
  width:52px;
  height:32px;
  left:calc(50% - 75px);
  top:calc(30% + 19px);
  background:#f7ead8;
  border:4px solid #b38e80;
  z-index:5;
}

/* 욕조 */

.pixel-bath{
  width:190px;
  height:75px;
  left:50%;
  top:30%;
  transform:translateX(-50%);
  background:#e8e4d9;
  border:8px solid #77756e;
  border-radius:15px;
}

/* 세면대 */

.pixel-sink{
  width:95px;
  height:60px;
  right:15px;
  top:25px;
  background:#e7e4dc;
  border:6px solid #77746c;
}

.pixel-sink::after{
  content:"";
  position:absolute;
  width:8px;
  height:20px;
  background:#77746c;
  top:-22px;
  left:40px;
}

/* 놀이터 미끄럼틀 */

.pixel-slide{
  width:100px;
  height:100px;
  left:20px;
  top:30%;
  border-left:12px solid #b95648;
  border-bottom:12px solid #b95648;
  transform:skewY(-25deg);
}

.pixel-slide::after{
  content:"";
  position:absolute;
  width:70px;
  height:12px;
  top:-5px;
  left:0;
  background:#d87558;
}

/* 나무 */

.pixel-tree{
  width:75px;
  height:100px;
  right:35px;
  top:22%;
}

.pixel-tree::before{
  content:"";
  position:absolute;
  width:23px;
  height:62px;
  left:27px;
  bottom:0;
  background:#69452c;
  border:5px solid #4a311f;
}

.pixel-tree::after{
  content:"";
  position:absolute;
  width:72px;
  height:60px;
  left:0;
  top:0;
  background:#65984c;
  border:7px solid #3e6732;
  box-shadow:
    20px 22px 0 #74a955,
    -8px 20px 0 #568a43;
}

/* ==================================================
   방 이름
================================================== */

.room-label{
  position:absolute;
  left:10px;
  top:8px;
  z-index:20;
  padding:5px 9px;
  background:rgba(35,27,18,.72);
  color:#fff4d9;
  font-size:12px;
  font-weight:1000;
  border:2px solid #fff0c9;
}

/* ==================================================
   감자 객체
================================================== */

.room-potato{
  position:absolute;
  width:58px;
  height:58px;
  z-index:30;
  transform:translate(-50%,-50%);
  touch-action:none;
  cursor:grab;
}

.room-potato img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  image-rendering:auto;
  filter:
    drop-shadow(3px 4px 0 rgba(0,0,0,.22));
}

.room-potato.running img{
  animation:
    tamaRun .28s infinite alternate;
}

.room-potato.jumping img{
  animation:
    tamaJump .55s ease;
}

.room-potato.spin img{
  animation:
    tamaSpin .65s ease;
}

.room-potato.stunned{
  filter:grayscale(.4);
}

@keyframes tamaRun{
  from{
    transform:translateY(0);
  }
  to{
    transform:translateY(-5px);
  }
}

@keyframes tamaJump{
  0%{
    transform:translateY(0) scale(1);
  }
  50%{
    transform:translateY(-22px) scale(1.05);
  }
  100%{
    transform:translateY(0) scale(1);
  }
}

@keyframes tamaSpin{
  0%{
    transform:rotate(0) scale(1);
  }
  50%{
    transform:rotate(180deg) scale(1.15);
  }
  100%{
    transform:rotate(360deg) scale(1);
  }
}

/* ==================================================
   말풍선 / 이펙트
================================================== */

.room-bubble{
  position:absolute;
  z-index:100;
  transform:translate(-50%,-100%);
  padding:6px 9px;
  background:#fff;
  color:#38291d;
  border:3px solid #493426;
  border-radius:9px;
  font-size:11px;
  font-weight:1000;
  white-space:nowrap;
  pointer-events:none;
  box-shadow:3px 3px 0 rgba(0,0,0,.18);
}

.room-effect{
  position:absolute;
  z-index:120;
  pointer-events:none;
  font-size:28px;
  animation:effectPop .8s ease forwards;
}

@keyframes effectPop{
  0%{
    opacity:0;
    transform:translate(-50%,0) scale(.4);
  }
  30%{
    opacity:1;
    transform:translate(-50%,-15px) scale(1.2);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-55px) scale(.8);
  }
}

/* ==================================================
   방 이동
================================================== */

.room-tabs{
  height:51px;
  flex-shrink:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  padding:5px;
  background:#806443;
  z-index:30;
}

.room-tab{
  border-radius:9px;
  background:#d9c39f;
  color:#493522;
  font-size:12px;
  font-weight:1000;
}

.room-tab.active{
  background:#fff0cf;
  box-shadow:
    inset 0 -4px 0 #aa875a;
}

/* ==================================================
   다마고치 조작 버튼
================================================== */

.tama-controls{
  height:72px;
  flex-shrink:0;
  background:#f8ecd7;
  border-top:2px solid #b89b72;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:8px;
}

.tama-button{
  border-radius:13px;
  background:#fff8e9;
  border:2px solid #cdb28a;
  color:#59422d;
  font-size:13px;
  font-weight:1000;
  box-shadow:0 3px 0 #ad8f67;
}

.tama-button:active{
  transform:translateY(3px);
  box-shadow:none;
}

/* ==================================================
   사전 목록
================================================== */

.collection-panel{
  height:190px;
  flex-shrink:0;
  background:#fff8e9;
  border-top:2px solid #c9aa7e;
  padding:11px 12px 90px;
  overflow-y:auto;
}

.collection-heading{
  font-size:17px;
  font-weight:1000;
}

.collection-sub{
  font-size:12px;
  color:#876b4b;
  margin-top:2px;
}

.collection-count{
  margin-top:4px;
  font-size:12px;
  font-weight:900;
}

.collection-list{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-top:9px;
}

.collection-card{
  min-width:0;
  border-radius:12px;
  border:2px solid #d5bc99;
  background:#f7ead4;
  padding:5px;
  text-align:center;
}

.collection-card img{
  width:45px;
  height:45px;
  object-fit:contain;
}

.collection-name{
  font-size:10px;
  font-weight:1000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.toggle{
  margin-top:4px;
  width:100%;
  height:24px;
  border-radius:7px;
  font-size:10px;
  font-weight:1000;
}

.toggle.on{
  background:#709b58;
  color:white;
}

.toggle.off{
  background:#b6aaa0;
  color:white;
}

/* ==================================================
   알림
================================================== */

.toast{
  position:absolute;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:rgba(48,35,23,.92);
  color:#fff;
  padding:10px 15px;
  border-radius:12px;
  font-size:13px;
  font-weight:900;
  opacity:0;
  pointer-events:none;
  z-index:9999;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ==================================================
   반응형
================================================== */

@media(max-width:390px){

            50
          </div>
        </div>

        <div class="stat">
          <div class="stat-icon">❤️</div>
          <div class="stat-name">사랑</div>
          <div
            id="loveValue"

            50
          </div>
        </div>

        <div class="stat">

        <button

  <nav class="bottom-menu">

      </button>

      <button

  id="toast"
  class="toast">
</div>

</div>


<script>

/* ==================================================
   감자 데이터
================================================== */

const POTATOES = {

  Potato1:{
    name:"꾼감자",
    personality:"모두를 좋아하고 사랑을 표현하는 감자",
    emoji:"💕",
    lines:[
      "다들 너무 좋아!",
      "우리 같이 놀자!",
      "사랑해 감자들아!",
      "💕💕💕"
    ]
  },

  Potato2:{
    name:"대장감자",
    personality:"친구들을 이끄는 듬직한 대장 감자",
    emoji:"👑",
    lines:[
      "내가 앞장선다!",
      "다들 따라와!",
      "저능감자는 내가 챙긴다.",
      "대장은 바쁘다."
    ]
  },

  Potato3:{
    name:"독감자",
    personality:"혼자 있는 것을 좋아하고 가끔 독을 쓰는 감자",
    emoji:"☠️",
    lines:[
      "...혼자 있고 싶다.",
      "가까이 오지 마.",
      "귀찮아.",
      "건드리지 마."
    ]
  },

  Potato4:{
    name:"폭력감자",
    personality:"툭하면 싸우지만 독감자에게는 친절한 감자",
    emoji:"💢",
    lines:[
      "야! 싸우자!",
      "누가 나 건드렸냐?",
      "독감자는 건들지 마.",
      "한 판 붙자!"
    ]
  },

  Potato5:{
    name:"저능감자",
    personality:"조금 느리고 순하지만 모두에게 사랑받는 감자",
    emoji:"🥹",
    lines:[
      "뭐였더라?",
      "배고파...",
      "같이 놀자!",
      "나 잘하고 있지?"
    ]
  }

};


/* ==================================================
   게임 상태
================================================== */

let state = {

  started:false,

  growth:0,

  day:1,

  currentPotato:null,

  collection:[],

  activePotatoes:[],

  stats:{
    hunger:50,
    water:50,
    love:50,
    energy:50
  }

};


let room = "living";

let roomPotatoes = {};

let followLeader = false;

let leaderId = null;

let sleepTimer = null;


/* ==================================================
   저장 / 불러오기
================================================== */

function loadSave(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "potatoGameSave"
        )
      );

    if(saved){

      state.collection =
        saved.collection || [];

      state.activePotatoes =
        saved.activePotatoes || [];

    }

  }catch(e){

    console.log(e);

  }

}


function saveGame(){

  localStorage.setItem(
    "potatoGameSave",
    JSON.stringify({

      collection:
        state.collection,

      activePotatoes:
        state.activePotatoes

    })
  );

}


loadSave();


/* ==================================================
   화면 전환
================================================== */

function hideScreens(){

  document
    .querySelectorAll(".screen")
    .forEach(
      screen =>
        screen.classList.remove("active")
    );

}


function startGame(){

  state.started = true;

  hideScreens();

  document
    .getElementById("growScreen")
    .classList.add("active");

  updateGrowScreen();

}


function showGrow(){

  hideScreens();

  document
    .getElementById("growScreen")
    .classList.add("active");

  updateGrowScreen();

}


function showDictionary(){

  hideScreens();

  document
    .getElementById("dictionaryScreen")
    .classList.add("active");

  renderCollection();

  renderRoom();

  startRoomLoop();

}


/* ==================================================
   성장
================================================== */

function growAction(type){

  if(state.growth >= 100){

    showToast(
      "이미 감자가 태어났어요!"
    );

    return;

  }


  let amount = 5;

  if(type === "fertilizer"){
    amount = 10;
  }

  if(type === "water"){
    amount = 7;
  }

  if(type === "sun"){
    amount = 6;
  }

  if(type === "cheer"){
    amount = 5;
  }


  state.growth =
    Math.min(
      100,
      state.growth + amount
    );


  const messages = {

    fertilizer:
      "🌱 비료를 줬어요!",

    water:
      "💧 시원하게 물을 마셨어요!",

    sun:
      "☀️ 햇빛을 쬐고 있어요!",

    cheer:
      "💕 응원을 듣고 힘이 났어요!"

  };


  setMessage(
    messages[type]
  );


  updateGrowScreen();


  if(state.growth >= 100){

    setTimeout(
      birthPotato,
      500
    );

  }

}


/* ==================================================
   성장 단계
================================================== */

function getGrowthStage(){

  if(state.growth < 25){

    return {
      text:"🌱 싹",
      emoji:"🌱"
    };

  }

  if(state.growth < 50){

    return {
      text:"🍃 이파리",
      emoji:"🌿"
    };

  }

  if(state.growth < 75){

    return {
      text:"🌳 나무",
      emoji:"🌳"
    };

  }

  return {
    text:"🥔 감자",
    emoji:"🥔"
  };

}


/* ==================================================
   랜덤 감자 탄생
================================================== */

function randomPotato(){

  const ids =
    Object.keys(POTATOES);

  return ids[
    Math.floor(
      Math.random() * ids.length
    )
  ];

}


function birthPotato(){

  if(state.currentPotato){
    return;
  }


  const id =
    randomPotato();


  state.currentPotato = id;


  if(
    !state.collection.includes(id)
  ){

    state.collection.push(id);

    if(
      !state.activePotatoes.includes(id)
    ){

      state.activePotatoes.push(id);

    }

    saveGame();

  }


  state.stats = {

    hunger:50,
    water:50,
    love:50,
    energy:50

  };


  setMessage(
    `${POTATOES[id].emoji} ${POTATOES[id].name}가 태어났어요!`
  );


  updateGrowScreen();

  renderCollection();

  showToast(
    `${POTATOES[id].name} 탄생!`
  );

}


/* ==================================================
   키우기 화면 업데이트
================================================== */

function updateGrowScreen(){

  document
    .getElementById("growDay")
    .textContent =
      `${state.day}일차`;


  const stage =
    getGrowthStage();


  document
    .getElementById("stageText")
    .textContent =
      stage.text;


  document
    .getElementById("growthEmoji")
    .textContent =
      stage.emoji;


  document
    .getElementById("progressText")
    .textContent =
      `${state.growth}%`;


  document
    .getElementById("progressFill")
    .style.width =
      `${state.growth}%`;


  const image =
    document.getElementById(
      "stagePotato"
    );


  const emoji =
    document.getElementById(
      "growthEmoji"
    );


  if(state.currentPotato){

    image.src =
      `${state.currentPotato}.Png`;

    image.style.display =
      "block";

    emoji.style.display =
      "none";

  }else{

    image.style.display =
      "none";

    emoji.style.display =
      "block";

  }


  if(state.currentPotato){

    const potato =
      POTATOES[
        state.currentPotato
      ];


    document
      .getElementById("potatoName")
      .textContent =
        potato.name;


    document
      .getElementById("potatoPersonality")
      .textContent =
        potato.personality;

  }else{

    document
      .getElementById("potatoName")
      .textContent =
        "아직 감자가 없어요";

    document
      .getElementById("potatoPersonality")
      .textContent =
        "감자를 키워보세요.";

  }


  document
    .getElementById("hungerValue")
    .textContent =
      state.stats.hunger;


  document
    .getElementById("waterValue")
    .textContent =
      state.stats.water;


  document
    .getElementById("loveValue")
    .textContent =
      state.stats.love;


  document
    .getElementById("energyValue")
    .textContent =
      state.stats.energy;

}


/* ==================================================
   메시지
================================================== */

function setMessage(text){

  document
    .getElementById("messageBox")
    .textContent =
      text;

}


function randomLine(id){

  const lines =
    POTATOES[id].lines;

  return lines[
    Math.floor(
      Math.random() * lines.length
    )
  ];

}


/* ==================================================
   기본 상호작용
================================================== */

function feedPotato(){

  if(!state.currentPotato){

    showToast(
      "먼저 감자를 키워주세요."
    );

    return;

  }


  state.stats.hunger =
    Math.min(
      100,
      state.stats.hunger + 20
    );

  state.stats.energy =
    Math.min(
      100,
      state.stats.energy + 5
    );


  setMessage(
    `🍖 ${POTATOES[state.currentPotato].name}: 냠냠!`
  );


  updateGrowScreen();

}


function waterPotato(){

  if(!state.currentPotato){

    showToast(
      "먼저 감자를 키워주세요."
    );

    return;

  }


  state.stats.water =
    Math.min(
      100,
      state.stats.water + 20
    );


  setMessage(
    `💧 ${POTATOES[state.currentPotato].name}: 시원하다!`
  );


  updateGrowScreen();

}


function petPotato(){

  if(!state.currentPotato){

    showToast(
      "아직 쓰다듬을 감자가 없어요."
    );

    return;

  }


  state.stats.love =
    Math.min(
      100,
      state.stats.love + 15
    );


  state.stats.energy =
    Math.max(
      0,
      state.stats.energy - 2
    );


  setMessage(
    `${POTATOES[state.currentPotato].emoji} ${randomLine(state.currentPotato)}`
  );


  const img =
    document.getElementById(
      "stagePotato"
    );


  img.classList.remove(
    "jumping"
  );

  void img.offsetWidth;

  img.classList.add(
    "jumping"
  );


  updateGrowScreen();

}


function walkPotato(){

  if(!state.currentPotato){

    showToast(
      "산책할 감자가 없어요."
    );

    return;

  }


  if(state.stats.energy < 10){

    setMessage(
      "⚡ 너무 지쳤어요..."
    );

    return;

  }


  state.stats.energy -= 10;

  state.stats.love =
    Math.min(
      100,
      state.stats.love + 8
    );


  setMessage(
    `🏃 ${POTATOES[state.currentPotato].name}가 신나게 산책했어요!`
  );


  updateGrowScreen();

}


/* ==================================================
   수확
================================================== */

function harvestPotato(){

  if(!state.currentPotato){

    showToast(
      "수확할 감자가 없어요."
    );

    return;

  }


  const id =
    state.currentPotato;


  if(
    !state.collection.includes(id)
  ){

    state.collection.push(id);

  }


  if(
    !state.activePotatoes.includes(id)
  ){

    state.activePotatoes.push(id);

  }


  state.currentPotato = null;

  state.growth = 0;

  state.day++;


  state.stats = {

    hunger:50,
    water:50,
    love:50,
    energy:50

  };


  saveGame();

  setMessage(
    "🥔 감자를 수확했어요! 새로운 감자를 키워보세요."
  );


  updateGrowScreen();

  renderCollection();

}


/* ==================================================
   감자 사전
================================================== */

function renderCollection(){

  const list =
    document.getElementById(
      "collectionList"
    );


  list.innerHTML = "";


  document
    .getElementById("collectionCount")
    .textContent =
      `발견한 감자 ${state.collection.length}/5`;


  state.collection.forEach(
    id => {

      const data =
        POTATOES[id];


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "collection-card";


      const img =
        document.createElement(
          "img"
        );

      img.src =
        `${id}.Png`;

      img.draggable =
        false;


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "collection-name";

      name.textContent =
        data.name;


      const toggle =
        document.createElement(
          "button"
        );


      const isOn =
        state.activePotatoes
          .includes(id);


      toggle.className =
        `toggle ${
          isOn ? "on" : "off"
        }`;


      toggle.textContent =
        isOn ? "ON" : "OFF";


      toggle.onclick =
        () => togglePotato(id);


      card.appendChild(img);
      card.appendChild(name);
      card.appendChild(toggle);


      list.appendChild(card);

    }
  );

}


function togglePotato(id){

  if(
    state.activePotatoes
      .includes(id)
  ){

    state.activePotatoes =
      state.activePotatoes
        .filter(
          x => x !== id
        );

  }else{

    state.activePotatoes.push(id);

  }


  saveGame();

  renderCollection();

  renderRoom();

}


/* ==================================================
   방 변경
================================================== */

function changeRoom(newRoom){

  room = newRoom;


  document
    .querySelectorAll(".room-tab")
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  const index = {

    living:0,
    kitchen:1,
    bedroom:2,
    bathroom:3

  }[newRoom];


  document
    .querySelectorAll(".room-tab")
    [index]
    .classList.add("active");


  renderRoom();

}


/* ==================================================
   방 배경
================================================== */

function renderRoom(){

  const roomEl =
    document.getElementById(
      "pixelRoom"
    );


  const label =
    document.getElementById(
      "roomLabel"

){

/* ==================================================
   방 감자 생성
================================================== */

function randomRoomPosition(){

  const roomEl =
    document.getElementById(
      "pixelRoom"
    );


  const width =
    roomEl.clientWidth || 350;

  const height =
    roomEl.clientHeight || 350;


  return {

    x:
      60 +
      Math.random() *
      Math.max(
        80,
        width - 120
      ),

    y:
      110 +
      Math.random() *
      Math.max(
        60,
        height - 180
      )

  };

}


function renderRoomPotatoes(){

  const container =
    document.getElementById(
      "roomPotatoes"
    );


  container.innerHTML = "";


  const active =
    state.activePotatoes;


  active.forEach(
    id => {

      if(!roomPotatoes[id]){

        roomPotatoes[id] =
          randomRoomPosition();

      }


      const potato =
        document.createElement(
          "div"
        );


      potato.className =
        "room-potato";


      potato.dataset.id =
        id;


      potato.style.left =
        `${roomPotatoes[id].x}px`;


      potato.style.top =
        `${roomPotatoes[id].y}px`;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        `${id}.Png`;

      img.draggable =
        false;


      potato.appendChild(img);


      setupPotatoTouch(
        potato,
        id
      );


      container.appendChild(
        potato
      );

    }
  );

}


/* ==================================================
   감자 터치 / 드래그
================================================== */

let dragData = null;


function setupPotatoTouch(
  element,
  id
){

  let pressTimer = null;

  let longPress = false;

  let startX = 0;

  let startY = 0;


  element.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      element.setPointerCapture(
        e.pointerId
      );


      startX =
        e.clientX;

      startY =
        e.clientY;


      longPress = false;


      pressTimer =
        setTimeout(
          () => {

            longPress = true;

            if(id === "Potato2"){

              leaderId =
                id;

              followLeader = true;

              showToast(
                "대장감자를 따라가기 시작했어요!"
              );

            }

          },
          450
        );


      dragData = {

        id:id,

        element:element,

        offsetX:
          e.clientX -
          element.getBoundingClientRect().left,

        offsetY:
          e.clientY -
          element.getBoundingClientRect().top

      };

    }
  );


  element.addEventListener(
    "pointermove",
    e => {

      if(!dragData){
        return;
      }


      const dx =
        e.clientX -
        startX;

      const dy =
        e.clientY -
        startY;


      if(
        Math.abs(dx) > 8 ||
        Math.abs(dy) > 8
      ){

        clearTimeout(
          pressTimer
        );

      }


      if(
        longPress ||
        Math.abs(dx) > 8 ||
        Math.abs(dy) > 8
      ){

        movePotato(
          id,
          e.clientX,
          e.clientY
        );

      }

    }
  );


  element.addEventListener(
    "pointerup",
    e => {

      clearTimeout(
        pressTimer
      );


      if(
        !longPress &&
        Math.abs(
          e.clientX - startX
        ) < 10 &&
        Math.abs(
          e.clientY - startY
        ) < 10
      ){

        potatoTouched(id);

      }


      dragData = null;

    }
  );


  element.addEventListener(
    "pointercancel",
    () => {

      clearTimeout(
        pressTimer
      );

      dragData = null;

    }
  );

}


function movePotato(
  id,
  clientX,
  clientY
){

  const roomEl =
    document.getElementById(
      "pixelRoom"
    );


  const rect =
    roomEl.getBoundingClientRect();


  let x =
    clientX -
    rect.left;


  let y =
    clientY -
    rect.top;


  x =
    Math.max(
      35,
      Math.min(
        rect.width - 35,
        x
      )
    );


  y =
    Math.max(
      75,
      Math.min(
        rect.height - 35,
        y
      )
    );


  roomPotatoes[id] = {
    x:x,
    y:y
  };


  const element =
    document.querySelector(
      `.room-potato[data-id="${id}"]`
    );


  if(element){

    element.style.left =
      `${x}px`;

    element.style.top =
      `${y}px`;

  }


  if(
    id === "Potato2" &&
    followLeader
  ){

    moveFollowers();

  }

}


function moveFollowers(){

  if(
    !roomPotatoes.Potato2
  ){
    return;
  }


  const leader =
    roomPotatoes.Potato2;


  state.activePotatoes
    .forEach(
      id => {

        if(
          id === "Potato2" ||
          id === "Potato3"
        ){
          return;
        }


        if(
          !roomPotatoes[id]
        ){

          roomPotatoes[id] =
            randomRoomPosition();

        }


        const p =
          roomPotatoes[id];


        const dx =
          leader.x -
          p.x;

        const dy =
          leader.y -
          p.y;


        p.x += dx * .035;

        p.y += dy * .035;


        const element =
          document.querySelector(
            `.room-potato[data-id="${id}"]`
          );


        if(element){

          element.style.left =
            `${p.x}px`;

          element.style.top =
            `${p.y}px`;

        }

      }
    );

}


/* ==================================================
   감자 접촉
================================================== */

function potatoTouched(id){

  const data =
    POTATOES[id];


  const pos =
    roomPotatoes[id];


  if(!pos){
    return;
  }


  createEffect(
    pos.x,
    pos.y,
    data.emoji
  );


  const element =
    document.querySelector(
      `.room-potato[data-id="${id}"]`
    );


  if(element){

    element.classList.remove(
      "jumping",
      "spin"
    );

    void element.offsetWidth;

    element.classList.add(
      "jumping"
    );

  }


  showBubble(
    id,
    randomLine(id)
  );


  /*
    독감자:
    접촉 시 10% 확률로 상대를 약 3초간 기절
  */

  if(
    id === "Potato3" &&
    Math.random() < .10
  ){

    const others =
      state.activePotatoes
        .filter(
          x => x !== id
        );


    if(others.length){

      const target =
        others[
          Math.floor(
            Math.random() *
            others.length
          )
        ];


      stunPotato(
        target
      );

    }

  }


  /*
    폭력감자는 모두와 싸우지만
    독감자에게는 친절
  */

  if(id === "Potato4"){

    if(
      state.activePotatoes
        .includes("Potato3")
    ){

      showBubble(
        id,
        "독감자는 건드리지 마."
      );

    }else{

      showBubble(
        id,
        "야! 싸우자!"
      );

    }

  }

}


/* ==================================================
   기절
================================================== */

function stunPotato(id){

  if(id === "Potato3"){
    return;
  }


  const element =
    document.querySelector(
      `.room-potato[data-id="${id}"]`
    );


  if(!element){
    return;
  }


  element.classList.add(
    "stunned"
  );


  createEffect(
    roomPotatoes[id].x,
    roomPotatoes[id].y,
    "💫"
  );


  setTimeout(
    () => {

      element.classList.remove(
        "stunned"
      );

    },
    3000
  );

}

/* ==================================================
   방 감자 자동 이동
================================================== */

let roomLoopStarted = false;


function startRoomLoop(){

  if(roomLoopStarted){
    return;
  }


  roomLoopStarted = true;


  function loop(){

    if(
      document
        .getElementById(
          "dictionaryScreen"
        )
        .classList
        .contains("active")
    ){

      moveRoomPotatoes();

      if(followLeader){

        moveFollowers();

      }

    }


    requestAnimationFrame(
      loop
    );

  }


  requestAnimationFrame(
    loop
  );

}


function moveRoomPotatoes(){

  const roomEl =
    document.getElementById(
      "pixelRoom"
    );


  if(!roomEl){
    return;
  }


  const width =
    roomEl.clientWidth;


  const height =
    roomEl.clientHeight;


  state.activePotatoes
    .forEach(
      id => {

        if(
          id === "Potato3"
        ){

          /*
            독감자는 혼자 있는 성향이 강해서
            움직임을 아주 작게 한다.
          */

        }


        if(
          id === "Potato2" &&
          followLeader
        ){

          return;

        }


        if(
          !roomPotatoes[id]
        ){

          roomPotatoes[id] =
            randomRoomPosition();

        }


        const p =
          roomPotatoes[id];


        if(
          Math.random() < .015
        ){

          p.targetX =
            45 +
            Math.random() *
            Math.max(
              50,
              width - 90
            );

          p.targetY =
            80 +
            Math.random() *
            Math.max(
              50,
              height - 120
            );

        }


        if(
          p.targetX == null
        ){

          p.targetX =
            p.x;

        }


        if(
          p.targetY == null
        ){

          p.targetY =
            p.y;

        }


        const speed =
          id === "Potato3"
            ? .004
            : .009;


        p.x +=
          (p.targetX - p.x) *
          speed;


        p.y +=
          (p.targetY - p.y) *
          speed;


        p.x =
          Math.max(
            35,
            Math.min(
              width - 35,
              p.x
            )
          );


        p.y =
          Math.max(
            75,
            Math.min(
              height - 35,
              p.y
            )
          );


        const element =
          document.querySelector(
            `.room-potato[data-id="${id}"]`
          );


        if(element){

          element.style.left =
            `${p.x}px`;

          element.style.top =
            `${p.y}px`;

        }

      }
    );

}


/* ==================================================
