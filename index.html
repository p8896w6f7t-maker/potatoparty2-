<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>감자키우기</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#f3ead7;
    font-family:
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    overflow-x:hidden;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
}

#app{
    width:100%;
    min-height:100vh;
}

.screen{
    width:100%;
    min-height:100vh;
}

/* ==================================================
   시작 화면
================================================== */

#startScreen{
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#fff9eb 0%,#f3dfb8 100%);
}

.startBox{
    text-align:center;
    padding:40px 25px;
}

.bigPotato{
    font-size:80px;
    animation:floatPotato 2s infinite ease-in-out;
}

@keyframes floatPotato{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

.gameTitle{
    font-size:34px;
    font-weight:900;
    margin:10px 0 25px;
}

.startBtn{
    padding:15px 55px;
    border-radius:18px;
    background:#76502e;
    color:white;
    font-size:20px;
    font-weight:900;
    box-shadow:0 6px 0 #50351f;
}

.startBtn:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #50351f;
}

/* ==================================================
   공통
================================================== */

.hidden{
    display:none!important;
}

.page{
    width:min(600px,100%);
    min-height:100vh;
    margin:auto;
    background:#fffaf0;
}

button:active{
    transform:scale(.94);
}

/* ==================================================
   성장 화면
================================================== */

.growPage{
    padding-bottom:30px;
}

.growHeader{
    padding:18px 18px 10px;
    text-align:center;
}

.growHeader h1{
    margin:0;
    font-size:25px;
}

.dayText{
    margin-top:5px;
    font-size:14px;
    color:#777;
}

.growArea{
    position:relative;
    height:360px;
    margin:10px 15px;
    overflow:hidden;
    border-radius:25px;
    background:
        linear-gradient(#bfe8ff 0 67%,#8fc66c 67% 100%);
    border:4px solid #725236;
}

.sun{
    position:absolute;
    top:25px;
    right:35px;
    font-size:45px;
    animation:sunPulse 2s infinite;
}

@keyframes sunPulse{
    50%{transform:scale(1.08)}
}

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:32%;
    background:
        repeating-linear-gradient(
            0deg,
            #8bc36a,
            #8bc36a 8px,
            #83ba62 8px,
            #83ba62 16px
        );
}

.growPotato{
    position:absolute;
    left:50%;
    bottom:20%;
    transform:translateX(-50%);
    width:150px;
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:100px;
    z-index:5;
    transition:.3s;
}

.growPotato.jump{
    animation:potatoJump .6s ease;
}

@keyframes potatoJump{
    0%{transform:translateX(-50%) translateY(0) rotate(0)}
    35%{transform:translateX(-50%) translateY(-55px) rotate(-8deg)}
    70%{transform:translateX(-50%) translateY(-25px) rotate(8deg)}
    100%{transform:translateX(-50%) translateY(0) rotate(0)}
}

.growPotato.shake{
    animation:shake .5s;
}

@keyframes shake{
    0%,100%{transform:translateX(-50%)}
    25%{transform:translateX(calc(-50% - 10px))}
    75%{transform:translateX(calc(-50% + 10px))}
}

.growthInfo{
    padding:0 20px;
}

.growthTop{
    display:flex;
    justify-content:space-between;
    font-weight:800;
    margin-bottom:7px;
}

.progress{
    width:100%;
    height:20px;
    background:#e5d9c5;
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    background:#72ad50;
    border-radius:20px;
    transition:.4s;
}

.growActions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:18px;
}

.actionBtn{
    padding:15px 8px;
    border-radius:15px;
    background:#f0e1c5;
    font-size:15px;
    font-weight:800;
}

.actionBtn:hover{
    background:#e8d2ad;
}

/* ==================================================
   키우기 화면
================================================== */

.petPage{
    min-height:100vh;
    position:relative;
}

.petTop{
    padding:14px 18px 8px;
    text-align:center;
}

.petTop h1{
    margin:0;
    font-size:24px;
}

.petDay{
    font-size:13px;
    color:#888;
    margin-top:4px;
}

.petMain{
    padding:0 15px;
}

.petStage{
    position:relative;
    height:330px;
    border-radius:24px;
    background:
        linear-gradient(#c7ecff 0 70%,#9bc76e 70%);
    border:4px solid #725236;
    overflow:hidden;
}

.petSun{
    position:absolute;
    top:15px;
    right:25px;
    font-size:40px;
}

.petGround{
    position:absolute;
    bottom:0;
    height:30%;
    width:100%;
    background:#91bf69;
}

.petImage{
    position:absolute;
    width:170px;
    height:170px;
    object-fit:contain;
    left:50%;
    top:46%;
    transform:translate(-50%,-50%);
    image-rendering:pixelated;
    z-index:5;
    touch-action:none;
}

.petImage.running{
    animation:runPotato .35s infinite alternate;
}

@keyframes runPotato{
    from{transform:translate(-50%,-50%) translateX(-12px) rotate(-4deg)}
    to{transform:translate(-50%,-50%) translateX(12px) rotate(4deg)}
}

.petImage.petJump{
    animation:petJump .65s;
}

@keyframes petJump{
    0%{transform:translate(-50%,-50%) translateY(0)}
    45%{transform:translate(-50%,-50%) translateY(-70px) rotate(10deg)}
    100%{transform:translate(-50%,-50%) translateY(0)}
}

.message{
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:80%;
    min-height:45px;
    background:white;
    border:3px solid #543b26;
    border-radius:18px;
    padding:10px;
    text-align:center;
    font-size:14px;
    font-weight:700;
    z-index:10;
}

.nameBox{
    padding:15px 5px 5px;
}

.potatoName{
    font-size:22px;
    font-weight:900;
}

.personality{
    color:#777;
    margin-top:3px;
}

/* ==================================================
   스탯
================================================== */

.stats{
    margin:10px 15px;
    padding:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    background:#f2e7d4;
    border-radius:20px;
}

.stat{
    background:white;
    border-radius:15px;
    padding:9px;
    display:flex;
    align-items:center;
    gap:8px;
}

.statCircle{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#eee4d2;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:19px;
    flex-shrink:0;
}

.statText{
    font-size:12px;
    font-weight:800;
}

.statValue{
    font-size:11px;
    color:#777;
    margin-top:2px;
}

/* ==================================================
   상호작용
================================================== */

.petActions{
    padding:12px 15px 25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.petAction{
    padding:14px 5px;
    border-radius:15px;
    background:#ead8ba;
    font-size:14px;
    font-weight:900;
}

/* ==================================================
   감자사전
================================================== */

.dictionary{
    min-height:100vh;
    background:#fffaf0;
}

.dictionaryHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;
    border-bottom:2px solid #e5d7c0;
}

.dictionaryHeader h1{
    margin:0;
    font-size:20px;
}

.backBtn{
    padding:7px 11px;
    border-radius:10px;
    background:#e5d5b8;
    font-weight:800;
}

.tama{
    margin:18px auto;
    width:min(92vw,500px);
    aspect-ratio:1/1;
    max-height:500px;
    position:relative;
    overflow:hidden;
    border:12px solid #473d35;
    border-radius:12px;
    background:#9aaf72;
    image-rendering:pixelated;
    touch-action:none;
}

.pixelWall{
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            #c8a47b 0px,
            #c8a47b 15px,
            #b99268 15px,
            #b99268 18px
        );
}

.pixelFloor{
    position:absolute;
    bottom:0;
    width:100%;
    height:31%;
    background:
        repeating-linear-gradient(
            90deg,
            #b17d4e 0 18px,
            #a87349 18px 21px
        );
}

.window{
    position:absolute;
    top:28px;
    left:25px;
    width:100px;
    height:75px;
    background:#9edcf1;
    border:8px solid #6e4c36;
    box-shadow:inset 0 0 0 4px #d7e9dc;
}

.window:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:5px;
    height:100%;
    background:#6e4c36;
}

.window:after{
    content:"";
    position:absolute;
    left:0;
    top:50%;
    width:100%;
    height:5px;
    background:#6e4c36;
}

.sofa{
    position:absolute;
    bottom:65px;
    right:20px;
    width:130px;
    height:55px;
    background:#865d4c;
    border:7px solid #654535;
}

.tv{
    position:absolute;
    top:25px;
    right:22px;
    width:75px;
    height:55px;
    background:#2e302e;
    border:7px solid #4b4035;
}

.tvScreen{
    position:absolute;
    inset:7px;
    background:#71a3a2;
}

.tamaPotato{
    position:absolute;
    width:65px;
    height:65px;
    object-fit:contain;
    image-rendering:pixelated;
    transform:translate(-50%,-50%);
    z-index:20;
    touch-action:none;
    transition:left .3s,top .3s;
}

.tamaPotato.selected{
    filter:drop-shadow(0 0 8px white);
}

.tamaSpeech{
    position:absolute;
    z-index:50;
    background:white;
    border:2px solid #332a22;
    border-radius:10px;
    padding:3px 6px;
    font-size:10px;
    font-weight:900;
    white-space:nowrap;
    pointer-events:none;
    animation:speech .8s;
}

@keyframes speech{
    0%{opacity:0;transform:translateY(8px)}
    20%,80%{opacity:1}
    100%{opacity:0;transform:translateY(-10px)}
}

.tamaControls{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:0 15px;
}

.tamaControl{
    padding:13px 4px;
    border-radius:14px;
    background:#e4d0ad;
    font-size:13px;
    font-weight:900;
}

.discovery{
    margin:20px 15px;
    padding:16px;
    border-radius:18px;
    background:#f0e3cd;
}

.discoveryTitle{
    font-weight:900;
    font-size:19px;
}

.discoverySub{
    font-size:13px;
    color:#777;
    margin:4px 0 15px;
}

.potatoList{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.bookItem{
    background:white;
    border-radius:12px;
    padding:7px 3px;
    text-align:center;
}

.bookItem img{
    width:45px;
    height:45px;
    object-fit:contain;
    image-rendering:pixelated;
}

.bookItem div{
    font-size:10px;
    font-weight:800;
}

.switch{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:15px;
    padding-top:12px;
    border-top:2px solid #dfceb1;
}

.toggle{
    width:50px;
    height:28px;
    border-radius:20px;
    background:#aaa;
    position:relative;
}

.toggle.on{
    background:#6ca04c;
}

.toggle:after{
    content:"";
    position:absolute;
    top:4px;
    left:4px;
    width:20px;
    height:20px;
    background:white;
    border-radius:50%;
    transition:.2s;
}

.toggle.on:after{
    left:26px;
}

/* ==================================================
   간식
================================================== */

.snack{
    position:absolute;
    z-index:100;
    font-size:28px;
    animation:snackFall 2.2s linear forwards;
    pointer-events:none;
}

@keyframes snackFall{
    0%{top:-40px}
    100%{top:75%}
}

/* ==================================================
   잠
================================================== */

.sleepOverlay{
    position:absolute;
    inset:0;
    background:rgba(25,30,55,.58);
    z-index:90;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
    font-weight:900;
}

/* ==================================================
   모바일
================================================== */

@media(max-width:420px){

    .growArea{
        height:330px;
    }

    .petStage{
        height:310px;
    }

    .petImage{
        width:150px;
        height:150px;
    }

    .stats{
        gap:7px;
        padding:9px;
    }

    .stat{
        padding:7px;
    }

    .statCircle{
        width:38px;
        height:38px;
    }

}
</style>
</head>

<body>

<div id="app">

<!-- ==================================================
     START
================================================== -->

<section id="startScreen" class="screen">

    <div class="startBox">

        <div class="bigPotato">🥔</div>

        <div class="gameTitle">
            감자키우기
        </div>

        <button
            class="startBtn"
            id="startBtn">
            시작
        </button>

    </div>

</section>


<!-- ==================================================
     GROW
================================================== -->

<section id="growScreen" class="screen hidden">

<div class="page growPage">

    <div class="growHeader">

        <h1>🥔 감자키우기</h1>

        <div class="dayText" id="growDay">
            감자를 심어주세요
        </div>

    </div>


    <div class="growArea">

        <div class="sun">☀️</div>

        <div class="ground"></div>

        <div
            id="growPotato"
            class="growPotato">
            🌱
        </div>

    </div>


    <div class="growthInfo">

        <div class="growthTop">
            <span id="stageText">싹</span>
            <span id="growthText">0 / 100%</span>
        </div>

        <div class="progress">
            <div
                id="growthBar"
                class="progressBar">
            </div>
        </div>

    </div>


    <div class="growActions">

        <button
            class="actionBtn"
            onclick="growAction('fertilizer')">
            🌱 비료 주기
        </button>

        <button
            class="actionBtn"
            onclick="growAction('water')">
            💧 물 주기
        </button>

        <button
            class="actionBtn"
            onclick="growAction('sun')">
            ☀️ 햇빛 쬐기
        </button>

        <button
            class="actionBtn"
            onclick="growAction('cheer')">
            💕 응원하기
        </button>

    </div>

</div>

</section>


<!-- ==================================================
     PET
================================================== -->

<section id="petScreen" class="screen hidden">

<div class="page petPage">

    <div class="petTop">

        <h1>나의 감자</h1>

        <div
            class="petDay"
            id="petDay">
            1일차
        </div>

    </div>


    <div class="petMain">

        <div
            class="petStage"
            id="petStage">

            <div class="petSun">
                ☀️
            </div>

            <div class="petGround"></div>

            <img
                id="petImage"
                class="petImage"
                src="Potato1.PNG"
                draggable="false"
                alt="감자">

            <div
                id="petMessage"
                class="message">
                ...
            </div>

        </div>


        <div class="nameBox">

            <div
                id="potatoName"
                class="potatoName">
                감자
            </div>

            <div
                id="potatoPersonality"
                class="personality">
                성격 • ...
            </div>

        </div>


        <div class="stats">

            <div class="stat">
                <div class="statCircle">🍖</div>
                <div>
                    <div class="statText">배고픔</div>
                    <div
                        class="statValue"
                        id="hunger">
                        0 / 100
                    </div>
                </div>
            </div>

            <div class="stat">
                <div class="statCircle">💧</div>
                <div>
                    <div class="statText">수분</div>
                    <div
                        class="statValue"
                        id="water">
                        0 / 100
                    </div>
                </div>
            </div>

            <div class="stat">
                <div class="statCircle">❤️</div>
                <div>
                    <div class="statText">사랑</div>
                    <div
                        class="statValue"
                        id="love">
                        0 / 100
                    </div>
                </div>
            </div>

            <div class="stat">
                <div class="statCircle">⚡</div>
                <div>
                    <div class="statText">체력</div>
                    <div
                        class="statValue"
                        id="energy">
                        0 / 100
                    </div>
                </div>
            </div>

        </div>


        <div class="petActions">

            <button
                class="petAction"
                onclick="petAction('food')">
                🍖 먹이 주기
            </button>

            <button
                class="petAction"
                onclick="petAction('water')">
                💧 물 주기
            </button>

            <button
                class="petAction"
                onclick="petAction('pet')">
                ❤️ 쓰다듬기
            </button>

            <button
                class="petAction"
                onclick="petAction('walk')">
                🏃 산책하기
            </button>

            <button
                class="petAction"
                onclick="harvest()">
                🥔 수확하기
            </button>

            <button
                class="petAction"
                onclick="openDictionary()">
                📖 감자사전
            </button>

        </div>

    </div>

</div>

</section>


<!-- ==================================================
     DICTIONARY
================================================== -->

<section id="dictionaryScreen" class="screen hidden">

<div class="page dictionary">

    <div class="dictionaryHeader">

        <button
            class="backBtn"
            onclick="backToPet()">
            ← 키우기로
        </button>

        <h1>🥔 감자사전</h1>

        <div
            id="dictionaryDay"
            class="dayText">
            1일차
        </div>

    </div>


    <div
        id="tama"
        class="tama">

        <div class="pixelWall"></div>
        <div class="pixelFloor"></div>

        <div class="window"></div>

        <div class="sofa"></div>

        <div class="tv">
            <div class="tvScreen"></div>
        </div>

    </div>


    <div class="tamaControls">

        <button
            class="tamaControl"
            onclick="tamaPet()">
            ❤️ 쓰다듬기
        </button>

        <button
            class="tamaControl"
            onclick="tamaSnack()">
            🍬 간식주기
        </button>

        <button
            class="tamaControl"
            onclick="tamaSleep()">
            😴 잠자기
        </button>

    </div>


    <div class="discovery">

        <div class="discoveryTitle">
            감자 사전
        </div>

        <div class="discoverySub">
            지금까지 만난 감자들이에요
        </div>

        <div
            id="discoveredCount"
            class="discoverySub">
            발견한 감자 0/5
        </div>

        <div
            id="potatoList"
            class="potatoList">
        </div>


        <div class="switch">

            <span>
                다마고치에 등장시키기
            </span>

            <button
                id="toggleButton"
                class="toggle on"
                onclick="toggleDictionary()">
            </button>

        </div>

    </div>

</div>

</section>

</div>


<script>

/* ==================================================
   감자 데이터
================================================== */

const POTATOES = [

{
    name:"꾼감자",
    image:"Potato1.PNG",
    style:"social",
    personality:"사교적이고 사랑이 넘친다",
    favorite:"모두",
    lines:{
        food:[
            "오! 먹을 거다! 나눠 먹자!",
            "냠냠! 이것도 사랑의 맛인가?",
            "맛있다! 너도 먹을래?"
        ],
        water:[
            "물이다! 시원하다!",
            "역시 물은 생명의 친구야!",
            "한 모금 마시면 모두 좋아져!"
        ],
        pet:[
            "꺄! 더 쓰다듬어줘!",
            "너 정말 좋은 감자구나!",
            "하트 받아! ❤️❤️❤️"
        ],
        walk:[
            "산책이다! 같이 가자!",
            "어디든 좋아! 친구랑 가면!",
            "달려어어어!!"
        ]
    }
},

{
    name:"대장감자",

/* ==================================================
   화면 전환
================================================== */

function showScreen(screen){

    [
        startScreen,
        growScreen,
        petScreen,
        dictionaryScreen
    ].forEach(s=>s.classList.add("hidden"));

    screen.classList.remove("hidden");

    window.scrollTo(0,0);
}


/* ==================================================
   시작
================================================== */

document
.getElementById("startBtn")
.addEventListener("click",()=>{

    game.growth=0;
    game.stage=0;
    game.day=1;

    updateGrow();

    showScreen(growScreen);

});


/* ==================================================
   성장
================================================== */

function growAction(type){

    let amount = 7;

    if(type==="fertilizer"){

        amount = 12;

    }

    if(type==="water"){

        amount = 8;

    }

    if(type==="sun"){

        amount = 9;

    }

    if(type==="cheer"){

        amount = 6;

    }

    game.growth += amount;

    if(game.growth>100){
        game.growth=100;
    }

    game.stage =
        Math.min(
            3,
            Math.floor(game.growth/25)
        );

    growPotato.classList.remove("jump");

    void growPotato.offsetWidth;

    growPotato.classList.add("jump");

    updateGrow();

    if(game.growth>=100){

        setTimeout(
            createRandomPotato,
            600
        );

    }

}


function updateGrow(){

    growthBar.style.width =
        game.growth+"%";

    growthText.textContent =
        game.growth+" / 100%";

    stageText.textContent =
        STAGES[game.stage];

    growPotato.textContent =
        STAGE_EMOJIS[game.stage];

    document
    .getElementById("growDay")
    .textContent =
        game.day+"일차";
}


/* ==================================================
   랜덤 감자 탄생
================================================== */

function createRandomPotato(){

    const potato =
        POTATOES[
            Math.floor(
                Math.random()*POTATOES.length
            )
        ];

    game.potato = potato;

    if(
        !game.discovered.includes(
            potato.name
        )
    ){

        game.discovered.push(
            potato.name
        );

    }

    game.stats={
        hunger:50,
        water:50,
        love:50,
        energy:100
    };

    updatePet();

    showScreen(petScreen);

    speak(
        "태어났다! "+potato.name+
        "이다! 🥔"
    );

}


/* ==================================================
   감자 터치
================================================== */

const petImage =
    document.getElementById("petImage");

let petTouchStart=0;
let petTouchMoved=false;

petImage.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        petTouchStart =
            Date.now();

        petTouchMoved=false;

    },
    {passive:false}
);

petImage.addEventListener(
    "pointermove",
    e=>{

        e.preventDefault();

        if(
            Math.abs(
                e.clientX-
                petImage.getBoundingClientRect().left
            )>5
        ){
            petTouchMoved=true;
        }

    },
    {passive:false}
);

petImage.addEventListener(
    "pointerup",
    e=>{

        e.preventDefault();

        if(
            !petTouchMoved &&
            Date.now()-petTouchStart<800
        ){

            touchPet();

        }

    },
    {passive:false}
);


function touchPet(){

    if(!game.potato) return;

    petImage.classList.remove(
        "petJump"
    );

    void petImage.offsetWidth;

    petImage.classList.add(
        "petJump"
    );

    const lines =
        game.potato.lines.pet;

    speak(
        random(lines)
        +" "+emotionEmoji(game.potato)
    );

    game.stats.love =
        clamp(
            game.stats.love+5
        );

    updateStats();

}


/* ==================================================
   키우기 상호작용
================================================== */

function petAction(type){

    if(!game.potato) return;

    const p=game.potato;

    if(type==="food"){

        game.stats.hunger =
            clamp(
                game.stats.hunger+20
            );

        speak(
            random(p.lines.food)
            +" "+emotionEmoji(p)
        );

        jumpPet();

    }


    if(type==="water"){

        game.stats.water =
            clamp(
                game.stats.water+20
            );

        speak(
            random(p.lines.water)
            +" "+emotionEmoji(p)
        );

        jumpPet();

    }


    if(type==="pet"){

        game.stats.love =
            clamp(
                game.stats.love+15
            );

        speak(
            random(p.lines.pet)
            +" "+emotionEmoji(p)
        );

        jumpPet();

    }


    if(type==="walk"){

        game.stats.energy =
            clamp(
                game.stats.energy-15
            );

        speak(
            random(p.lines.walk)
            +" "+emotionEmoji(p)
        );

        runPet();

    }

    updateStats();

}


/* ==================================================
   모션
================================================== */

function jumpPet(){

    petImage.classList.remove(
        "petJump"
    );

    void petImage.offsetWidth;

    petImage.classList.add(
        "petJump"
    );

}


function runPet(){

    petImage.classList.add(
        "running"
    );

    const stage =
        document.getElementById("petStage");

    let direction=1;
    let x=50;

    const timer =
        setInterval(()=>{

            x += direction*2;

            if(x>78){
                direction=-1;
            }

            if(x<22){
                direction=1;
            }

            petImage.style.left =
                x+"%";

        },50);

    setTimeout(()=>{

        clearInterval(timer);

        petImage.classList.remove(
            "running"
        );

        petImage.style.left="50%";

    },3000);

}


/* ==================================================
   메시지
================================================== */

function speak(text){

    const box =
        document.getElementById(
            "petMessage"
        );

    box.textContent=text;

    box.animate(
        [
            {transform:"translateX(-50%) scale(.9)"},
            {transform:"translateX(-50%) scale(1.03)"},
            {transform:"translateX(-50%) scale(1)"}
        ],
        {
            duration:300
        }
    );

}


function emotionEmoji(p){

    if(p.style==="social")
        return "💕";

    if(p.style==="leader")
        return "🫡";

    if(p.style==="toxic")
        return "☠️";

    if(p.style==="violent")
        return "💢";

    return "🥺";

}


/* ==================================================
   스탯
================================================== */

function clamp(value){

    return Math.max(
        0,
        Math.min(100,value)
    );

}

   다마고치 상태
================================================== */

let tamaTimer=null;

function renderTama(){

    const tama =
        document.getElementById(
            "tama"
        );

    tama
    .querySelectorAll(
        ".tamaPotato,.tamaSpeech,.snack,.sleepOverlay"
    )
    .forEach(el=>el.remove());

    if(!game.tamaEnabled){

        game.tamaEnabled={};

    }

    const selected =
        game.discovered.filter(
            name =>
                game.tamaEnabled[name] !== false
        );

    game.tamaPotatoes =
        selected.map(
            name=>{

                const p =
                    POTATOES.find(
                        x=>x.name===name
                    );

                return {

                    data:p,

                    x:
                        20+
                        Math.random()*60,

                    y:
                        55+
                        Math.random()*30,

                    targetX:null,
                    targetY:null,

                    sleeping:false

                };

            }
        );

    game.tamaPotatoes.forEach(
        createTamaPotato
    );

}


/* ==================================================
   다마고치 감자 생성
================================================== */

function createTamaPotato(obj){

    const img =
        document.createElement(
            "img"
        );

    img.className="tamaPotato";

    img.src =
        obj.data.image;

    img.alt =
        obj.data.name;

    img.draggable=false;

    img.style.left =
        obj.x+"%";

    img.style.top =
        obj.y+"%";

    img.dataset.name =
        obj.data.name;

    img.addEventListener(
        "contextmenu",
        e=>e.preventDefault()
    );

    enableLongPress(
        img,
        obj
    );

    document
    .getElementById("tama")
    .appendChild(img);

}

/* ==================================================
   꾹 누르기
================================================== */

function enableLongPress(element,obj){

    let startX=0;
    let startY=0;

    let dragging=false;

    element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            startX=e.clientX;
            startY=e.clientY;

            dragging=true;

            element.setPointerCapture(
                e.pointerId
            );

            element.classList.add(
                "selected"
            );

        },
        {passive:false}
    );


    element.addEventListener(
        "pointermove",
        e=>{

            if(!dragging) return;

            e.preventDefault();

            const tama =
                document.getElementById(
                    "tama"
                );

            const rect =
                tama.getBoundingClientRect();

            let x =
                ((e.clientX-rect.left)/
                rect.width)*100;

            let y =
                ((e.clientY-rect.top)/
                rect.height)*100;

            x=clamp(x);
            y=clamp(y);

            obj.x=x;
            obj.y=y;

            element.style.left =
                x+"%";

            element.style.top =
                y+"%";

        },
        {passive:false}
    );


    element.addEventListener(
        "pointerup",
        e=>{

            if(!dragging) return;

            e.preventDefault();

            dragging=false;

            element.classList.remove(
                "selected"
            );

            tamaReaction(
                obj
            );

        },
        {passive:false}
    );

}

/* ==================================================
   대장감자 추종
================================================== */

function makeLeaderFollow(leader){

    if(
        leader.data.style!=="leader"
    ){
        return;
    }

    game.tamaPotatoes.forEach(
        other=>{

            if(
                other===leader ||
                other.data.style==="toxic"
            ){
                return;
            }

            other.targetX =
                leader.x+
                (Math.random()*12-6);

            other.targetY =
                leader.y+
                (Math.random()*12-6);

            moveTamaObject(
                other
            );

        }
    );

}


/* ==================================================
   독감자 스턴
================================================== */

function toxicAttack(toxic){

    game.tamaPotatoes.forEach(
        other=>{

            if(
                other===toxic
            ){
                return;
            }

            if(
                other.data.style==="violent"
            ){
                return;
            }

            const distance =
                Math.hypot(
                    toxic.x-other.x,
                    toxic.y-other.y
                );

            if(
                distance<15 &&
                Math.random()<.1
            ){

                stunTama(
                    other
                );

            }

        }
    );

}


function stunTama(obj){

    const tama =
        document.getElementById(
            "tama"
        );

    const el =
        [...tama.querySelectorAll(
            ".tamaPotato"
        )]
        .find(
            x=>
                x.dataset.name===
                obj.data.name
        );

    if(!el) return;

    el.style.filter=
        "grayscale(1)";

    showTamaSpeech(
        obj,
        "어... 움직일 수 없어... 😵"
    );

    setTimeout(()=>{

        el.style.filter="";

    },3000);

}


/* ==================================================
   감자 이동
================================================== */

function moveTamaObject(obj){

    if(
        obj.data.style==="toxic"
    ){
        return;
    }

    const tama =
        document.getElementById(
            "tama"
        );

    const el =
        [...tama.querySelectorAll(
            ".tamaPotato"
        )]
        .find(
            x=>
                x.dataset.name===
                obj.data.name
        );

    if(!el) return;

    if(
        obj.targetX===null
    ){
        return;
    }

    obj.x =
        clamp(obj.targetX);

    obj.y =
        clamp(obj.targetY);

    el.style.left =
        obj.x+"%";

    el.style.top =
        obj.y+"%";

}


/* ==================================================
   다마고치 자동 AI
================================================== */

setInterval(()=>{

    if(
        dictionaryScreen.classList.contains(
            "hidden"
        )
    ){
        return;
    }

    if(
        game.tamaPotatoes.length===0
    ){
        return;
    }

    game.tamaPotatoes.forEach(
        obj=>{

            if(obj.sleeping){
                return;
            }

            const p=obj.data;

            if(
                p.style==="social"
            ){

                const other =
                    random(
                        game.tamaPotatoes
                    );

                if(
                    other &&
                    other!==obj
                ){

                    obj.targetX =
                        other.x;

                    obj.targetY =
                        other.y;

                    moveTamaObject(obj);

                    if(
                        Math.random()<.5
                    ){

                        showTamaSpeech(
                            obj,
                            "좋아! ❤️"
                        );

                    }

                }

            }

            else if(
                p.style==="leader"
            ){

                makeLeaderFollow(
                    obj
                );

            }

            else if(
                p.style==="violent"
            ){

                const toxic =
                    game.tamaPotatoes.find(
                        x=>
                            x.data.style===
                            "toxic"
                    );

                if(toxic){

                    obj.targetX =
                        toxic.x;

                    obj.targetY =
                        toxic.y;

                    moveTamaObject(
                        obj
                    );

                    showTamaSpeech(
                        obj,
                        "독감자! ❤️"
                    );

                }

                else{

                    showTamaSpeech(
                        obj,
                        "누구랑 싸우지?"
                    );

                }

            }

            else if(
                p.style==="dummy"
            ){

                const leader =
                    game.tamaPotatoes.find(
                        x=>
                            x.data.style===
                            "leader"
                    );

                if(leader){

                    obj.targetX =
                        leader.x;

                    obj.targetY =
                        leader.y;

                    moveTamaObject(
                        obj
                    );

                }

            }

            else if(
                p.style==="toxic"
            ){

                /* 독감자는 혼자 있으려고 한다 */

                obj.targetX =
                    20+
                    Math.random()*60;

                obj.targetY =
                    55+
                    Math.random()*25;

                moveTamaObject(
                    obj
                );

                toxicAttack(
                    obj
                );

            }

        }
    );

},3500);


/* ==================================================
   다마고치 말풍선
================================================== */

function showTamaSpeech(
    obj,
    text
){

    const tama =
        document.getElementById(
            "tama"
        );

    const speech =
        document.createElement(
            "div"
        );

    speech.className=
        "tamaSpeech";

    speech.textContent=
        text;

    speech.style.left=
        obj.x+"%";

    speech.style.top=
        (obj.y-10)+"%";

    tama.appendChild(
        speech
    );

    setTimeout(
        ()=>{
            speech.remove();
        },
        1200
    );

}


/* ==================================================
   다마고치 쓰다듬기
================================================== */

function tamaPet(){

    if(
        game.tamaPotatoes.length===0
    ){
        return;
    }

    const obj =
        random(
            game.tamaPotatoes
        );

    const tama =
        document.getElementById(
            "tama"
        );

    const el =
        [...tama.querySelectorAll(
            ".tamaPotato"
        )]
        .find(
            x=>
                x.dataset.name===
                obj.data.name
        );

    if(el){

        el.animate(
            [
                {
                    transform:
                    "translate(-50%,-50%) rotate(0)"
                },
                {
                    transform:
                    "translate(-50%,-70%) rotate(15deg)"
                },
                {
                    transform:
                    "translate(-50%,-50%) rotate(-15deg)"
                },
                {
                    transform:
                    "translate(-50%,-50%) rotate(0)"
                }
            ],
            {
                duration:700
            }
        );

    }

    tamaReaction(
        obj
    );

}


/* ==================================================
   간식
================================================== */

function tamaSnack(){

    if(
        game.tamaPotatoes.length===0
    ){
        return;
    }

    const tama =
        document.getElementById(
            "tama"
        );

    const snackEmojis=[
        "🍬",
        "🍪",
        "🍭",
        "🍫",
        "🍩"
    ];

    const snacks=[];

    for(
        let i=0;
        i<8;
        i++
    ){

        const snack =
            document.createElement(
                "div"
            );

        snack.className="snack";

        snack.textContent=
            random(snackEmojis);

        snack.style.left=
            (10+
            Math.random()*80)+"%";

        tama.appendChild(
            snack
        );

        snacks.push(
            snack
        );

    }

    game.tamaPotatoes.forEach(
        obj=>{

            showTamaSpeech(
                obj,
                obj.data.style==="dummy"
                ?
                "먹어도 돼?"
                :
                "간식이다! 🍬"
            );

        }
    );

    setTimeout(()=>{

        snacks.forEach(
            x=>x.remove()
        );

    },2300);

}


/* ==================================================
   잠자기
================================================== */

function tamaSleep(){

    if(game.sleeping){
        return;
    }

    game.sleeping=true;

    const tama =
        document.getElementById(
            "tama"
        );

    const overlay =
        document.createElement(
            "div"
        );

    overlay.className=
        "sleepOverlay";

    overlay.textContent=
        "🌙 Zzz...";

    tama.appendChild(
        overlay
    );

    game.tamaPotatoes.forEach(
        obj=>{

            obj.sleeping=true;

            showTamaSpeech(
                obj,
                "Zzz... 😴"
            );

        }
    );

    setTimeout(()=>{

        overlay.remove();

        game.tamaPotatoes.forEach(
            obj=>{
                obj.sleeping=false;
            }
        );

        game.sleeping=false;

    },10000);

}


/* ==================================================
   ON / OFF
================================================== */

function toggleDictionary(){

    const button =
        document.getElementById(
            "toggleButton"
        );

    const enabled =
        button.classList.contains(
            "on"
        );

    button.classList.toggle(
        "on"
    );

    const selected =
        game.discovered;

    selected.forEach(
        name=>{
            game.tamaEnabled[name]=
                !enabled;
        }
    );

    renderTama();

}


/* ==================================================
   유틸
================================================== */

function random(array){

    if(
        !array ||
        array.length===0
    ){
        return "";
    }

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}


/* ==================================================
   브라우저 기본 드래그 차단
================================================== */

document.addEventListener(
    "dragstart",
    e=>{

        if(
            e.target.tagName==="IMG"
        ){
            e.preventDefault();
        }

    }
);


/* ==================================================
   모바일 롱프레스 메뉴 차단
================================================== */

document.addEventListener(
    "touchstart",
    e=>{

        if(
            e.target.closest(
                ".tamaPotato"
            ) ||
            e.target.closest(
                ".petImage"
            )
        ){

            e.preventDefault();

        }

    },
    {
        passive:false
    }
);


/* ==================================================
   초기화
================================================== */

updateGrow();

</script>
