<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>감자키우기</title>

<style>

/* ==================================================
   기본
================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;
  background:#f5ead8;
  color:#51351f;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

img{
  -webkit-user-drag:none;
  user-drag:none;
}

#app{
  width:100%;
  height:100%;
  overflow:hidden;
  position:relative;
}


/* ==================================================
   화면
================================================== */

.screen{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  overflow:hidden;
}

.screen.active{
  display:flex;
}


/* ==================================================
   시작 화면
================================================== */

#startScreen{
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(
      circle at 50% 35%,
      #fff8e9 0%,
      #f8e7ca 50%,
      #efd2a5 100%
    );
}

.start-potato{
  font-size:90px;
  animation:
    potatoBounce 1.5s ease-in-out infinite;
}

@keyframes potatoBounce{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-12px);
  }
}

.game-title{
  margin-top:15px;
  font-size:36px;
  font-weight:900;
}

.game-subtitle{
  margin-top:8px;
  color:#987452;
  font-size:14px;
}

.start-button{
  margin-top:35px;
  padding:16px 42px;
  border-radius:18px;
  background:#8d603c;
  color:white;
  font-size:19px;
  font-weight:800;
  box-shadow:0 6px 0 #65432b;
}

.start-button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #65432b;
}


/* ==================================================
   공통 버튼
================================================== */

.action-button{
  min-height:58px;
  padding:10px 8px;
  border-radius:16px;
  background:#fff8ea;
  border:2px solid #e4cba7;
  color:#5a3d26;
  font-size:14px;
  font-weight:800;
  box-shadow:0 3px 0 #d2b28b;
}

.action-button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #d2b28b;
}

.action-button:disabled{
  opacity:.5;
}


/* ==================================================
   새싹 키우기
================================================== */

#sproutScreen{
  flex-direction:column;
  background:#f7ecd9;
}

.sprout-header{
  flex:none;
  padding:18px 18px 10px;
  text-align:center;
}

.sprout-header h1{
  margin:0;
  font-size:24px;
}

.sprout-day{
  margin-top:5px;
  color:#987452;
  font-size:13px;
}

.sprout-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:10px 16px 110px;
}

.growth-card{
  background:#fff8ea;
  border:2px solid #e6cfaa;
  border-radius:22px;
  padding:18px;
  text-align:center;
}

.growth-stage{
  font-size:18px;
  font-weight:900;
}

.sprout-box{
  height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin:10px 0;
}

.sprout{
  position:relative;
  font-size:100px;
  transition:.3s;
}

.sprout.small{
  font-size:55px;
}

.sprout.medium{
  font-size:75px;
}

.sprout.large{
  font-size:100px;
}

.growth-percent{
  font-size:30px;
  font-weight:900;
  color:#739344;
}

.progress-bar{
  width:100%;
  height:20px;
  margin-top:10px;
  background:#e5dccb;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#8db45c;
  border-radius:20px;
  transition:.3s;
}

.growth-message{
  margin-top:10px;
  min-height:25px;
  color:#856746;
  font-size:13px;
}

.sprout-actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:15px;
}

.sprout-actions button{
  min-height:72px;
  font-size:15px;
}


/* ==================================================
   감자 키우기
================================================== */

#growScreen{
  flex-direction:column;
  background:#f7ecd9;
  overflow:hidden;
}


/*
   중요:
   이 영역은 스크롤 밖에 둔다.
   따라서 이름/성격까지 절대 내려가지 않는다.
*/

.grow-header{
  flex:none;
  height:145px;
  padding:10px 14px 8px;
  background:#fff7e8;
  border-bottom:2px solid #e3cba6;
  z-index:50;
}

.grow-header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.grow-title{
  font-size:20px;
  font-weight:900;
}

.grow-day{
  font-size:13px;
  color:#987452;
}

.potato-info{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:6px;
}

.header-potato-img{
  width:64px;
  height:64px;
  object-fit:contain;
  flex:none;
}

.header-info{
  min-width:0;
  flex:1;
}

.message-box{
  min-height:31px;
  padding:5px 9px;
  background:#f4e4cb;
  border-radius:10px;
  font-size:12px;
  line-height:1.3;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.potato-name{
  margin-top:4px;
  font-size:16px;
  font-weight:900;
}

.potato-personality{
  margin-top:2px;
  font-size:12px;
  color:#967250;
}


/*
   여기만 스크롤된다.
*/

.grow-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:10px 14px 105px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.stat{
  background:#fff8ea;
  border:1px solid #e3c9a3;
  border-radius:12px;
  padding:7px 3px;
  text-align:center;
}

.stat-name{
  font-size:10px;
  color:#8e6c4d;
}

.stat-value{
  margin-top:3px;
  font-size:13px;
  font-weight:900;
}

.stat-bar{
  height:5px;
  margin:4px 4px 0;
  background:#ded4c4;
  border-radius:5px;
  overflow:hidden;
}

.stat-fill{
  height:100%;
  width:100%;
  background:#9dbb67;
  transition:.3s;
}

.grow-main{
  min-height:430px;
  margin-top:10px;
  background:
    linear-gradient(
      #e7f2d4 0 68%,
      #b4c987 68% 100%
    );
  border:2px solid #b5c58e;
  border-radius:20px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.grow-sky{
  position:absolute;
  top:15px;
  right:20px;
  font-size:42px;
  opacity:.75;
}

.grow-ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:31%;
  background:
    repeating-linear-gradient(
      90deg,
      #9dbb70 0 10px,
      #a9c47b 10px 20px
    );
}

.grow-potato-wrap{
  position:relative;
  z-index:2;
  text-align:center;
}

.main-potato-img{
  width:180px;
  height:180px;
  object-fit:contain;
  transition:.25s;
}

.main-potato-img.walking{
  animation:
    potatoWalk .3s infinite alternate;
}

.main-potato-img.jumping{
  animation:
    potatoJump .45s ease;
}

@keyframes potatoWalk{
  from{
    transform:translateY(0) rotate(-3deg);
  }
  to{
    transform:translateY(-8px) rotate(3deg);
  }
}

@keyframes potatoJump{
  0%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-45px) rotate(8deg);
  }
  100%{
    transform:translateY(0);
  }
}

.grow-emotion{
  min-height:35px;
  font-size:25px;
  font-weight:900;
}

.grow-message{
  max-width:270px;
  margin:7px auto 0;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.88);
  font-size:13px;
  line-height:1.4;
}

.grow-actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:12px;
}

.grow-actions .harvest{
  grid-column:span 2;
  background:#d8b27c;
}

.bottom-menu{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:66px;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#fff9ed;
  border-top:2px solid #dfc8a5;
  z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
}

.bottom-menu button{
  background:transparent;
  color:#8c6b4c;
  font-size:13px;
  font-weight:800;
}

.bottom-menu button.active{
  color:#65452c;
  background:#f3e3c9;
}


/* ==================================================
   감자사전
================================================== */

#dictionaryScreen{
  flex-direction:column;
  background:#f7ecd9;
}

.dictionary-header{
  flex:none;
  height:64px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff8ea;
  border-bottom:2px solid #e3cba6;
  z-index:20;
}

.back-button{
  padding:8px 11px;
  border-radius:10px;
  background:#ead5b5;
  color:#65452d;
  font-weight:900;
}

.dictionary-title{
  font-size:21px;
  font-weight:900;
}

.dictionary-day{
  margin-left:auto;
  color:#987452;
  font-size:12px;
}

.dictionary-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:10px 12px 20px;
}

.room-tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:7px;
}

.room-tab{
  flex:none;
  padding:8px 11px;
  border-radius:12px;
  background:#ead8bb;
  color:#76583d;
  font-size:12px;
  font-weight:900;
}

.room-tab.active{
  background:#8d6846;
  color:white;
}


/* ==================================================
   18비트 다마고치 방
================================================== */

.tamagotchi-frame{
  background:#493b31;
  border:6px solid #705943;
  border-radius:15px;
  padding:8px;
  box-shadow:
    inset 0 0 0 3px #2e2722,
    0 5px 0 #b99b73;
}

.tamagotchi-screen{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  min-height:290px;
  max-height:420px;
  overflow:hidden;
  image-rendering:pixelated;
  background:#b8d49d;
  touch-action:none;
}


/* 거실 */

.room-living{
  background:
    linear-gradient(
      #9cc4dc 0 57%,
      #d5b080 57% 100%
    );
}

.room-living::before{
  content:"";
  position:absolute;
  left:9%;
  top:9%;
  width:23%;
  height:23%;
  background:#d9f0f7;
  border:4px solid #745b46;
  box-shadow:
    inset 0 0 0 3px #a6d2dc;
}

.sofa{
  position:absolute;
  left:12%;
  bottom:19%;
  width:42%;
  height:21%;
  background:#8b6d5a;
  border:4px solid #614b3c;
  border-radius:8px;
}

.sofa::before{
  content:"";
  position:absolute;
  left:5%;
  right:5%;
  top:-18%;
  height:35%;
  background:#9d7b65;
  border:4px solid #614b3c;
  border-radius:8px;
}

.tv{
  position:absolute;
  right:9%;
  top:15%;
  width:28%;
  height:22%;
  background:#423d38;
  border:4px solid #2e2925;
}

.tv::after{
  content:"";
  position:absolute;
  left:36%;
  bottom:-24%;
  width:28%;
  height:22%;
  background:#614d3d;
}


/* 주방 */

.room-kitchen{
  background:
    linear-gradient(
      #ead5b0 0 58%,
      #aeb77f 58% 100%
    );
}

.kitchen-counter{
  position:absolute;
  left:5%;
  right:5%;
  top:25%;
  height:18%;
  background:#9b7655;
  border:4px solid #654b39;
}

.kitchen-fridge{
  position:absolute;
  right:8%;
  top:7%;
  width:24%;
  height:48%;
  background:#d7d7cd;
  border:4px solid #77736a;
}


/* 침실 */

.room-bedroom{
  background:
    linear-gradient(
      #b8cbe0 0 58%,
      #b99676 58% 100%
    );
}

.bed{
  position:absolute;
  left:8%;
  bottom:15%;
  width:58%;
  height:28%;
  background:#d5b6a3;
  border:4px solid #715849;
}

.bed::before{
  content:"";
  position:absolute;
  left:5%;
  right:5%;
  top:5%;
  height:52%;
  background:#f0e2d2;
}

.lamp{
  position:absolute;
  right:15%;
  top:18%;
  width:13%;
  height:25%;
  background:#f0d890;
  border:4px solid #80664c;
}


/* 욕실 */

.room-bathroom{
  background:
    repeating-linear-gradient(
      90deg,
      #cce5e5 0 28px,
      #b8d8d8 28px 30px
    );
}

.bathtub{
  position:absolute;
  left:10%;
  bottom:17%;
  width:62%;
  height:28%;
  background:#f1f2ea;
  border:5px solid #6d8886;
  border-radius:20px;
}

.toilet{
  position:absolute;
  right:9%;
  bottom:17%;
  width:20%;
  height:23%;
  background:#f0eee7;
  border:4px solid #6d8886;
  border-radius:50% 50% 30% 30%;
}


/* 놀이터 */

.room-playground{
  background:
    linear-gradient(
      #a9d4ed 0 57%,
      #9dc478 57% 100%
    );
}

.slide{
  position:absolute;
  left:13%;
  bottom:16%;
  width:24%;
  height:46%;
  border-left:10px solid #e48467;
  border-bottom:10px solid #e48467;
  transform:skewY(15deg);
}

.swing{
  position:absolute;
  right:17%;
  top:18%;
  width:25%;
  height:38%;
  border-left:5px solid #75593e;
  border-right:5px solid #75593e;
}

.swing::after{
  content:"";
  position:absolute;
  left:20%;
  right:20%;
  bottom:5%;
  height:5px;
  background:#75593e;
}


/* ==================================================
   픽셀 감자
================================================== */

.pixel-potato{
  position:absolute;
  width:32px;
  height:32px;
  z-index:10;
  touch-action:none;
  cursor:grab;
  transition:transform .15s;
}

.pixel-potato.dragging{
  cursor:grabbing;
  transform:scale(1.15);
}

.pixel-potato img{
  width:100%;
  height:100%;
  object-fit:contain;
  image-rendering:pixelated;
  pointer-events:none;
}

.pixel-potato.jumping{
  animation:
    pixelJump .5s ease;
}

@keyframes pixelJump{
  0%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-20px) rotate(8deg);
  }
  100%{
    transform:translateY(0);
  }
}

.pixel-emotion{
  position:absolute;
  pointer-events:none;
  z-index:30;
  font-size:20px;
  animation:
    emotionUp 1s ease forwards;
}

@keyframes emotionUp{
  0%{
    opacity:1;
    transform:translateY(0);
  }
  100%{
    opacity:0;
    transform:translateY(-35px);
  }
}


/* ==================================================
   다마고치 조작
================================================== */

.room-controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.room-controls button{
  min-height:50px;
  border-radius:13px;
  background:#fff8ea;
  border:2px solid #dfc8a4;
  color:#60452e;
  font-size:13px;
  font-weight:900;
}

.room-controls button:active{
  transform:scale(.97);
}


/* ==================================================
   감자 사전 목록
================================================== */

.collection-card{
  margin-top:12px;
  background:#fff8ea;
  border:2px solid #dfc8a4;
  border-radius:17px;
  padding:13px;
}

.collection-title{
  font-size:17px;
  font-weight:900;
}

.collection-subtitle{
  margin-top:3px;
  font-size:12px;
  color:#967250;
}

.collection-count{
  margin-top:5px;
  font-size:12px;
  color:#8c6849;
}

.potato-list{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:10px;
}

.dictionary-item{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px;
  background:#f5e8d3;
  border-radius:12px;
}

.dictionary-item img{
  width:45px;
  height:45px;
  object-fit:contain;
}

.dictionary-info{
  flex:1;
}

.dictionary-name{
  font-weight:900;
  font-size:14px;
}

.dictionary-personality{
  margin-top:2px;
  font-size:11px;
  color:#92704f;
}

.toggle{
  width:45px;
  height:25px;
  border-radius:20px;
  background:#c4b9aa;
  position:relative;
}

.toggle.on{
  background:#88a85d;
}

.toggle::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:white;
  transition:.2s;
}

.toggle.on::after{
  left:23px;
}


/* ==================================================
   토스트
================================================== */

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%) translateY(20px);
  max-width:85%;
  padding:10px 15px;
  background:rgba(55,43,33,.92);
  color:white;
  border-radius:13px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  z-index:9999;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}


/* ==================================================
   반응형
================================================== */

@media(max-width:380px){

  .grow-header{
    height:138px;
  }

  .header-potato-img{
    width:57px;
    height:57px;
  }

  .grow-main{
    min-height:390px;
  }

  .main-potato-img{
    width:150px;
    height:150px;
  }

}

</style>
</head>


<body>

<div id="app">


<!-- ==================================================
     시작
================================================== -->

<section id="startScreen" class="screen active">

  <div class="start-potato">🥔</div>

  <div class="game-title">
    감자키우기
  </div>

  <div class="game-subtitle">
    나만의 감자를 키워보세요
  </div>

  <button
    class="start-button"
    onclick="startGame()">
    🌱 시작하기
  </button>

</section>


<!-- ==================================================
     새싹 키우기
================================================== -->

<section id="sproutScreen" class="screen">

  <div class="sprout-header">

    <h1>🌱 새싹 키우기</h1>

    <div class="sprout-day">
      감자가 태어날 준비를 하고 있어요
    </div>

  </div>


  <div class="sprout-scroll">

    <div class="growth-card">

      <div
        id="growthStage"
        class="growth-stage">
        싹
      </div>

      <div class="sprout-box">

        <div
          id="sprout"
          class="sprout small">
          🌱
        </div>

      </div>

      <div
        id="growthPercent"
        class="growth-percent">
        0%
      </div>

      <div class="progress-bar">

        <div
          id="growthFill"
          class="progress-fill">
        </div>

      </div>

      <div
        id="growthMessage"
        class="growth-message">
        감자가 태어날 준비를 하고 있어요.
      </div>

    </div>


    <div class="sprout-actions">

      <button
        class="action-button"
        onclick="growBy(8,'🌱','비료를 듬뿍 줬어요!')">
        🌱<br>비료 주기
      </button>

      <button
        class="action-button"

  id="toast"
  class="toast">
</div>

</div>


<script>

/* ==================================================
   감자 데이터
================================================== */

const POTATOES = {

  potato1:{
    id:"potato1",
    name:"꾼감자",
    image:"Potato1.Png",
    personality:"모두를 좋아하고 사랑을 표현하는 감자",
    messages:[
      "다 좋아! ❤️",
      "너도 좋아! ❤️",
      "감자 친구 최고! 💕",
      "사랑해! ❤️❤️"
    ]
  },

  potato2:{
    id:"potato2",
    name:"대장감자",
    image:"Potato2.Png",
    personality:"친구들을 이끄는 리더 감자",
    messages:[
      "다들 따라와!",
      "내가 대장이야!",
      "저능감자는 내가 챙길게.",
      "모두 사이좋게 지내!"
    ]
  },

  potato3:{
    id:"potato3",
    name:"독감자",
    image:"Potato3.Png",
    personality:"혼자 있는 걸 좋아하는 까칠한 감자",
    messages:[
      "가까이 오지 마.",
      "혼자 있고 싶어.",
      "...",
      "왜 건드려."
    ]
  },

  potato4:{
    id:"potato4",
    name:"폭력감자",
    image:"Potato4.Png",
    personality:"툭하면 싸우지만 독감자에게는 친절한 감자",
    messages:[
      "한판 붙자!",
      "누가 내 상대야!",
      "독감자야 ❤️",
      "오늘은 봐준다."
    ]
  },

  potato5:{
    id:"potato5",
    name:"저능감자",
    image:"Potato5.Png",
    personality:"조금 느리지만 모두에게 사랑받는 감자",
    messages:[
      "어...?",
      "뭐였지?",
      "배고파...",
      "헤헤..."
    ]
  }

};


/* ==================================================
   상태
================================================== */

let state = {

  growth:0,

  day:1,

  potato:null,

  stats:{
    hunger:100,
    water:100,
    love:50,
    energy:100
  },

  collection:[],

  activePotatoes:{},

  room:"living"

};


/* ==================================================
   저장
================================================== */

function saveGame(){

  localStorage.setItem(
    "potatoGame",
    JSON.stringify(state)
  );

}


/* ==================================================
   불러오기
================================================== */

function loadGame(){

  const saved =
    localStorage.getItem("potatoGame");

  if(!saved){
    return;
  }

  try{

    const parsed =
      JSON.parse(saved);

    state = {
      ...state,
      ...parsed
    };

    if(!state.collection){
      state.collection=[];
    }

    if(!state.activePotatoes){
      state.activePotatoes={};
    }

    if(state.potato){
      showGrowScreen();
      updateGrowScreen();
    }

  }catch(e){

    console.log("저장 데이터 오류");

  }

}


/* ==================================================
   화면 전환
================================================== */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

}


/* ==================================================
   시작
================================================== */

function startGame(){

  state.growth=0;
  state.day=1;
  state.potato=null;

  showScreen("sproutScreen");

  updateSprout();

  saveGame();

}


/* ==================================================
   새싹 성장
================================================== */

function growBy(amount,emoji,message){

  if(state.growth>=100){
    return;
  }

  state.growth =
    Math.min(
      100,
      state.growth + amount
    );

  updateSprout();

  showToast(
    emoji + " " + message
  );

  if(state.growth>=100){

    setTimeout(
      hatchPotato,
      700
    );

  }

  saveGame();

}


/* ==================================================
   새싹 화면
================================================== */

function updateSprout(){

  const growth =
    state.growth;

  const percent =
    document.getElementById(
      "growthPercent"
    );

  const fill =
    document.getElementById(
      "growthFill"
    );

  const sprout =
    document.getElementById(
      "sprout"
    );

  const stage =
    document.getElementById(
      "growthStage"
    );

  const message =
    document.getElementById(
      "growthMessage"
    );


  percent.textContent =
    growth + "%";

  fill.style.width =
    growth + "%";


  if(growth<25){

    stage.textContent="싹";

    sprout.textContent="🌱";

    sprout.className=
      "sprout small";

    message.textContent=
      "작은 싹이 올라왔어요!";

  }

  else if(growth<50){

    stage.textContent="이파리";

    sprout.textContent="🌿";

    sprout.className=
      "sprout medium";

    message.textContent=
      "이파리가 자라고 있어요!";

  }

  else if(growth<75){

    stage.textContent="나무";

    sprout.textContent="🌳";

    sprout.className=
      "sprout large";

    message.textContent=
      "무럭무럭 자라고 있어요!";

  }

  else if(growth<100){

    stage.textContent="감자";

    sprout.textContent="🥔";

    sprout.className=
      "sprout large";

    message.textContent=
      "감자가 태어나기 직전이에요!";

  }

  else{

    stage.textContent="감자 탄생!";

    sprout.textContent="🥔";

    sprout.className=
      "sprout large";

    message.textContent=
      "감자가 태어났어요!";

  }

}


/* ==================================================
   감자 탄생
================================================== */

function hatchPotato(){

  if(state.potato){
    return;
  }

  const keys =
    Object.keys(POTATOES);

  const randomKey =
    keys[
      Math.floor(
        Math.random()*keys.length
      )
    ];

  state.potato =
    JSON.parse(
      JSON.stringify(
        POTATOES[randomKey]
      )
    );

  state.stats={
    hunger:100,
    water:100,
    love:50,
    energy:100
  };

  /*
     수확한 감자만 사전에 등록.
     탄생 즉시 등록하지 않는다.
  */

  showToast(
    "🥔 감자가 태어났어요!"
  );

  setTimeout(()=>{

    showGrowScreen();
    updateGrowScreen();

  },900);

  saveGame();

}


/* ==================================================
   감자 화면
================================================== */

function showGrowScreen(){

  if(!state.potato){

    showScreen("sproutScreen");

    return;

  }

  showScreen("growScreen");

  updateGrowScreen();

}


/* ==================================================
   감자 정보 업데이트
================================================== */

function updateGrowScreen(){

  if(!state.potato){
    return;
  }

  const p =
    state.potato;


  document
    .getElementById("growDay")
    .textContent =
      state.day + "일차";


  document
    .getElementById("dictionaryDay")
    .textContent =
      state.day + "일차";


  document
    .getElementById("potatoName")
    .textContent =
      p.name;


  document
    .getElementById("potatoPersonality")
    .textContent =
      p.personality;


  document
    .getElementById("headerPotatoImage")
    .src =
      p.image;


  document
    .getElementById("mainPotatoImage")
    .src =
      p.image;


  updateStats();

}


/* ==================================================
   스탯
================================================== */

function updateStats(){

  const stats =
    state.stats;

  setStat(
    "hunger",
    stats.hunger
  );

  setStat(
    "water",
    stats.water
  );

  setStat(
    "love",
    stats.love
  );

  setStat(
    "energy",
    stats.energy
  );

}


function setStat(name,value){

  value =
    Math.max(
      0,
      Math.min(100,value)
    );

  document
    .getElementById(
      name+"Value"
    )
    .textContent =
      Math.round(value);

  document
    .getElementById(
      name+"Fill"
    )
    .style.width =
      value+"%";

}


/* ==================================================
   감자 반응
================================================== */

function getRandomMessage(){

  const list =
    state.potato.messages;

  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];

}


function showPotatoMessage(
  emotion,
  message
){

  document
    .getElementById(
      "growEmotion"
    )
    .textContent =
      emotion;

  document
    .getElementById(
      "growMessage"
    )
    .textContent =
      message;

  document
    .getElementById(
      "potatoMessage"
    )
    .textContent =
      message;

}


/* ==================================================
   먹이
================================================== */

function feedPotato(){

  if(!state.potato){
    return;
  }

  state.stats.hunger =
    Math.min(
      100,
      state.stats.hunger+20
    );

  state.stats.energy =
    Math.min(
      100,
      state.stats.energy+5
    );

  showPotatoMessage(
    "😋",
    "냠냠! 맛있다!"
  );

  updateStats();
  saveGame();

}


/* ==================================================
   물
================================================== */

function waterPotato(){

  if(!state.potato){
    return;
  }

  state.stats.water =
    Math.min(
      100,
      state.stats.water+20
    );

  showPotatoMessage(
    "💧",
    "꿀꺽꿀꺽! 시원해!"
  );

  updateStats();
  saveGame();

}


/* ==================================================
   쓰다듬기
================================================== */

function petPotato(){

  if(!state.potato){
    return;
  }

  state.stats.love =
    Math.min(
      100,
      state.stats.love+8
    );

  const img =
    document.getElementById(
      "mainPotatoImage"
    );

  img.classList.remove(
    "jumping"
  );

  void img.offsetWidth;

  img.classList.add(
    "jumping"
  );

  showPotatoMessage(
    state.potato.id==="potato3"
      ? "😑"
      : "❤️",
    getRandomMessage()
  );

  updateStats();
  saveGame();

}


/* ==================================================
   산책
================================================== */

function walkPotato(){

  if(!state.potato){
    return;
  }

  if(state.stats.energy<10){

    showPotatoMessage(
      "🥱",
      "너무 피곤해..."
    );

    return;

  }

  state.stats.energy-=10;

  const img =
    document.getElementById(
      "mainPotatoImage"
    );

  img.classList.add(
    "walking"
  );

  showPotatoMessage(
    "🏃",
    "산책하러 가자!"
  );

  setTimeout(()=>{

    img.classList.remove(
      "walking"
    );

    showPotatoMessage(
      "😊",
      "산책 재밌었다!"
    );

  },3000);

  updateStats();
  saveGame();

}


/* ==================================================
   수확
================================================== */

function harvestPotato(){

  if(!state.potato){
    return;
  }


  const id =
    state.potato.id;


  /*
     수확할 때만 사전에 등록
  */

  if(
    !state.collection.includes(id)
  ){

    state.collection.push(id);

  }


  /*
     새로 발견한 감자는 자동 ON
  */

  state.activePotatoes[id]=true;


  showToast(
    "🥔 "+state.potato.name+
    "을(를) 수확했어요!"
  );


  state.potato=null;

  state.growth=0;

  state.day++;


  setTimeout(()=>{

    showScreen("sproutScreen");

    updateSprout();

  },700);


  saveGame();

}


/* ==================================================
   감자사전
================================================== */

function showDictionary(){

  if(!state.potato){

    showScreen("sproutScreen");

    return;

  }

  showScreen(
    "dictionaryScreen"
  );

  renderDictionary();

  renderRoom();

}


function renderDictionary(){

  const list =
    document.getElementById(
      "potatoList"
    );

  const count =
    document.getElementById(
      "collectionCount"
    );


  count.textContent =
    "발견한 감자 "+
    state.collection.length+
    "/5";


  list.innerHTML="";


  state.collection
    .forEach(id=>{

      const p =
        POTATOES[id];

      if(!p){
        return;
      }


      const item =
        document.createElement(
          "div"
        );

      item.className=
        "dictionary-item";


      item.innerHTML=`

        <img
          src="${p.image}"
          alt="${p.name}">

        <div
          class="dictionary-info">

          <div
            class="dictionary-name">
            ${p.name}
          </div>

          <div
            class="dictionary-personality">
            ${p.personality}
          </div>

        </div>

        <button
          class="toggle ${
            state.activePotatoes[id]
              ? "on"
              : ""
          }"
          onclick="
            togglePotato(
              '${id}'
            )
          ">
        </button>

      `;


      list.appendChild(item);

    });

}


/* ==================================================
   ON/OFF
================================================== */

function togglePotato(id){

  state.activePotatoes[id] =
    !state.activePotatoes[id];

  renderDictionary();
  renderRoom();

  saveGame();

}


/* ==================================================
   방 변경
================================================== */

function changeRoom(room){

  state.room=room;

  document
    .querySelectorAll(
      ".room-tab"
    )
    .forEach(button=>{
      button.classList.remove(
        "active"
      );
    });


  const buttons =
    document.querySelectorAll(
      ".room-tab"
    );


  const index={
    living:0,
    kitchen:1,
    bedroom:2,
    bathroom:3,
    playground:4
  }[room];


  if(buttons[index]){
    buttons[index]
      .classList.add(
        "active"
      );
  }


  renderRoom();

}


/* ==================================================
   방 렌더링
================================================== */

let roomPotatoes=[];

function renderRoom(){

  const room =
    document.getElementById(
      "room"
    );

  if(!room){
    return;
  }


  room.className=
    "tamagotchi-screen room-"+
    state.room;


  room.innerHTML="";


  addFurniture(state.room);


  roomPotatoes=[];


  /*
     발견했고 ON인 감자만 등장
  */

  state.collection
    .filter(id=>
      state.activePotatoes[id]
    )
    .forEach((id,index)=>{

      createRoomPotato(
        id,
        index
      );

    });

}


/* ==================================================
   가구
================================================== */

function addFurniture(room){

  const el =
    document.getElementById(
      "room"
    );


  if(room==="living"){

    const sofa =
      document.createElement(
        "div"
      );

    sofa.className="sofa";

    el.appendChild(sofa);


    const tv =
      document.createElement(
        "div"
      );

    tv.className="tv";

    el.appendChild(tv);

  }


  if(room==="kitchen"){

    const counter =
      document.createElement(
        "div"
      );

    counter.className=
      "kitchen-counter";

    el.appendChild(counter);


    const fridge =
      document.createElement(
        "div"
      );

    fridge.className=
      "kitchen-fridge";

/* ==================================================
   방 감자 생성
================================================== */

function createRoomPotato(
  id,
  index
){

  const room =
    document.getElementById(
      "room"
    );

  const p =
    POTATOES[id];


  const potato =
    document.createElement(
      "div"
    );

  potato.className=
    "pixel-potato";

  potato.dataset.id=id;


  const img =
    document.createElement(
      "img"
    );

  img.src=p.image;
  img.alt=p.name;


  potato.appendChild(img);


  /*
     초기 위치
  */

  const positions=[
    [10,65],
    [45,70],
    [72,66],
    [28,48],
    [63,48]
  ];


  const pos =
    positions[
      index % positions.length
    ];


  potato.style.left=
    pos[0]+"%";

  potato.style.top=
    pos[1]+"%";


  room.appendChild(
    potato
  );


  const data={

    id,

    element:potato,

    x:pos[0],

    y:pos[1],

    vx:
      (Math.random()-.5)*0.025,

    vy:
      (Math.random()-.5)*0.025,

    dragging:false,

    followLeader:false,

    stunned:false

  };


  roomPotatoes.push(data);


  setupPotatoTouch(
    data
  );

}


/* ==================================================
   감자 터치 / 드래그
================================================== */

function setupPotatoTouch(
  data
){

  const el =
    data.element;


  let timer=null;
  let dragging=false;
  let startX=0;
  let startY=0;


  el.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      startX=e.clientX;
      startY=e.clientY;


      timer=setTimeout(()=>{

        dragging=true;

        data.dragging=true;

        el.classList.add(
          "dragging"
        );

        el.setPointerCapture(
          e.pointerId
        );

      },450);

    }
  );


  el.addEventListener(
    "pointermove",
    e=>{

      if(!dragging){
        return;
      }


      const room =
        document.getElementById(
          "room"
        );

      const rect =
        room.getBoundingClientRect();


      data.x=
        ((e.clientX-rect.left)
        /rect.width)*100;


      data.y=
        ((e.clientY-rect.top)
        /rect.height)*100;


      data.x=
        Math.max(
          3,
          Math.min(
            94,
            data.x
          )
        );


      data.y=
        Math.max(
          5,
          Math.min(
            88,
            data.y
          )
        );


      el.style.left=
        data.x+"%";

      el.style.top=
        data.y+"%";


      /*
         대장감자 드래그 시
         다른 감자들이 따라오도록 설정.
         손을 떼도 유지된다.
      */

      if(data.id==="potato2"){

        roomPotatoes
          .forEach(other=>{

            if(
              other.id!=="potato2" &&
              other.id!=="potato3"
            ){

              other.followLeader=true;

            }

          });

      }

    }
  );


  el.addEventListener(
    "pointerup",
    e=>{

      clearTimeout(timer);


      if(dragging){

        dragging=false;

        data.dragging=false;

        el.classList.remove(
          "dragging"
        );

        return;

      }


      interactWithRoomPotato(
        data.id
      );

    }
  );


  el.addEventListener(
    "pointercancel",
    ()=>{
      clearTimeout(timer);

      dragging=false;

      data.dragging=false;

      el.classList.remove(
        "dragging"
      );
    }
  );


  el.addEventListener(
    "contextmenu",
    e=>{
      e.preventDefault();
    }
  );

}


/* ==================================================
   감자 상호작용
================================================== */

function interactWithRoomPotato(
  id
){

  const target =
    POTATOES[id];


  if(!target){
    return;
  }


  /*
     독감자 접촉 스턴
     10%
  */

  if(id==="potato3"){

    const others =
      roomPotatoes
        .filter(
          p=>p.id!=="potato3"
        );


    if(
      others.length &&
      Math.random()<.10
    ){

      const targetData =
        others[
          Math.floor(
            Math.random()*
            others.length
          )
        ];


      stunPotato(
        targetData
      );

      showEmotion(
        targetData,
        "⚡"
      );

      return;

    }

  }


  let emotion="❤️";


  if(id==="potato4"){
    emotion="💢";
  }

  if(id==="potato3"){
    emotion="😑";
  }

  if(id==="potato5"){
    emotion="❓";
  }

  if(id==="potato2"){
    emotion="👑";
  }


  /*
     꾼감자는 하트 남발
  */

  if(id==="potato1"){

    emotion=
      Math.random()<.5
        ? "❤️"
        : "💕";

  }


  showEmotionById(
    id,
    emotion
  );


  showToast(
    target.name+
    ": "+
    target.messages[
      Math.floor(
        Math.random()*
        target.messages.length
      )
    ]
  );


  /*
     독감자는 대장감자를 따르지 않음
     폭력감자는 독감자를 좋아함
  */

  if(id==="potato4"){

    const toxic =
      roomPotatoes.find(
        p=>p.id==="potato3"
      );

    if(toxic){

      dataFollow(
        roomPotatoes.find(
          p=>p.id==="potato4"
        ),
        toxic
      );

    }

  }

}


/* ==================================================
   스턴
================================================== */

function stunPotato(data){

  if(
    !data ||
    data.id==="potato3"
  ){
    return;
  }


  data.stunned=true;


  showEmotion(
    data,
    "⚡"
  );


  data.element.style.filter=
    "grayscale(1)";


  setTimeout(()=>{

    data.stunned=false;

    data.element.style.filter=
      "";

  },3000);

}


/* ==================================================
   감정
================================================== */

function showEmotion(
  data,
  emoji
){

  if(!data){
    return;
  }


  showEmotionByElement(
    data.element,
    emoji
  );

}


function showEmotionById(
  id,
  emoji
){

  const data =
    roomPotatoes.find(
      p=>p.id===id
    );

  if(data){
    showEmotion(
      data,
      emoji
    );
  }

}


function showEmotionByElement(
  element,
  emoji
){

  const emotion =
    document.createElement(
      "div"
    );

  emotion.className=
    "pixel-emotion";

  emotion.textContent=
    emoji;

  emotion.style.left=
    element.offsetLeft+
    "px";

  emotion.style.top=
    (element.offsetTop-15)+
    "px";


  document
    .getElementById("room")
    .appendChild(
      emotion
    );


  setTimeout(()=>{
    emotion.remove();
  },1000);

}


/* ==================================================
   대장감자 따라가기
================================================== */

function dataFollow(
  follower,
  leader
){

  if(
    !follower ||
    !leader
  ){
    return;
  }


  if(
    follower.id==="potato3"
  ){
    return;
  }


  follower.followTarget=
    leader.id;

}


/* ==================================================
   방 감자 자동 이동
================================================== */

function animateRoom(){

  const room =
    document.getElementById(
      "room"
    );


  if(
    !room ||
    !document
      .getElementById(
        "dictionaryScreen"
      )
      .classList
      .contains("active")
  ){

    requestAnimationFrame(
      animateRoom
    );

    return;

  }


  roomPotatoes
    .forEach(data=>{

      if(data.dragging){
        return;
      }

      if(data.stunned){
        return;
      }


      /*
         독감자는 혼자 돌아다님.
         대장감자는 자유롭게 이동.
      */

      if(
        data.followTarget
      ){

        const target =
          roomPotatoes.find(
            p=>
              p.id===
              data.followTarget
          );


        if(target){

          const dx=
            target.x-data.x;

          const dy=
            target.y-data.y;


          data.x +=
            dx*0.008;

          data.y +=
            dy*0.008;

        }

      }
      else{

        data.x +=
          data.vx;

        data.y +=
          data.vy;


        /*
           벽에 닿으면 방향 변경
        */

        if(
          data.x<3 ||
          data.x>94
        ){

          data.vx=
            -data.vx;

        }


        if(
          data.y<5 ||
          data.y>88
        ){

          data.vy=
            -data.vy;

        }


        /*
           가끔 방향 변경
        */

        if(
          Math.random()<0.008
        ){

          data.vx=
            (Math.random()-.5)
            *0.025;

          data.vy=
            (Math.random()-.5)
            *0.025;

        }

      }


      data.x=
        Math.max(
          3,
          Math.min(
            94,
            data.x
          )
        );


      data.y=
        Math.max(
          5,
          Math.min(
            88,
            data.y
          )
        );


      data.element.style.left=
        data.x+"%";


      data.element.style.top=
        data.y+"%";

    });


  requestAnimationFrame(
    animateRoom
  );

}


/* ==================================================
   전체 쓰다듬기
================================================== */

function petAllPotatoes(){

  roomPotatoes
    .forEach(data=>{

      data.element.classList.remove(
        "jumping"
      );

      void data.element.offsetWidth;

      data.element.classList.add(
        "jumping"
      );


      let emotion="❤️";

      if(data.id==="potato3"){
        emotion="😑";
      }

      if(data.id==="potato4"){
        emotion="💢";
      }

      if(data.id==="potato2"){
        emotion="👑";
      }

      showEmotion(
        data,
        emotion
      );

    });

}


/* ==================================================
   전체 간식
================================================== */

function feedAllPotatoes(){

  roomPotatoes
    .forEach(data=>{

      createFallingSnack(
        data
      );

    });


  showToast(
    "🍬 간식이 하늘에서 내려와요!"
  );

}


function createFallingSnack(
  data
){

  const room =
    document.getElementById(
      "room"
    );


  const snack =
    document.createElement(
      "div"
    );

  snack.textContent=
    "🍬";

  snack.style.position=
    "absolute";

  snack.style.left=
    data.x+"%";

  snack.style.top=
    "-10px";

  snack.style.fontSize=
    "20px";

  snack.style.zIndex=
    "50";

  room.appendChild(
    snack
  );


  let y=-10;


  const timer =
    setInterval(()=>{

      y+=2.5;

      snack.style.top=
        y+"%";


      if(y>data.y){

        clearInterval(timer);

        showEmotion(
          data,
          "😋"
        );

        snack.remove();

      }

    },30);

}

}


/* ==================================================
   토스트
================================================== */

let toastTimer=null;

function showToast(
  text
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent=
    text;

  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(()=>{

      toast.classList.remove(
        "show"
      );

    },1800);

}
