<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>감자 키우기</title>

<style>

/* ==================================================
   기본
================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;

  background:#f5ead8;
  color:#4b3525;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

body{
  min-height:100vh;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

.hidden{
  display:none !important;
}

.screen{
  width:100%;
  max-width:500px;
  min-height:100vh;

  margin:0 auto;

  background:#fffaf2;
}


/* ==================================================
   시작 화면
================================================== */

#startScreen{
  min-height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  padding:30px;
}

.start-potato{
  font-size:80px;
  margin-bottom:20px;
}

.start-title{
  font-size:40px;
  font-weight:1000;
  margin-bottom:8px;
}

.start-subtitle{
  font-size:14px;
  color:#806b58;
  margin-bottom:28px;
}

.start-button{
  width:240px;

  padding:16px;

  border-radius:17px;

  background:#d79b55;
  color:white;

  font-size:17px;
  font-weight:900;

  box-shadow:0 4px 0 #b87838;
}

.start-button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #b87838;
}


/* ==================================================
   게임
================================================== */

#gameScreen{
  padding-bottom:30px;
}

.sticky-top{
  position:sticky;
  top:0;

  z-index:50;

  background:#fffaf2;

  box-shadow:
    0 3px 12px rgba(80,50,20,.08);
}

.header{
  padding:15px 16px 8px;

  text-align:center;
}

.header-title{
  font-size:23px;
  font-weight:1000;
}

.header-subtitle{
  margin-top:4px;

  color:#806b58;

  font-size:11px;
}


/* ==================================================
   날짜
================================================== */

.day-badge{
  display:inline-block;

  margin-top:6px;

  padding:4px 10px;

  border-radius:20px;

  background:#eadcc6;

  color:#6d523a;

  font-size:10px;
  font-weight:900;
}


/* ==================================================
   감자
================================================== */

#potatoWrap{
  width:100%;
  height:190px;

  display:flex;

  justify-content:center;
  align-items:center;

  position:relative;

  overflow:visible;
}

#potatoImage{
  width:150px;
  max-width:55%;

  height:auto;

  object-fit:contain;

  cursor:pointer;

  touch-action:manipulation;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;
  -webkit-user-drag:none;

  position:relative;
  z-index:3;
}


/* ==================================================
   성장 중 감자 터치
================================================== */

.growth-touch{
  cursor:pointer;

  touch-action:manipulation;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;
}


/* ==================================================
   메시지
================================================== */

.message{
  width:calc(100% - 32px);

  margin:0 16px 12px;

  padding:11px 14px;

  min-height:52px;

  border-radius:15px;

  background:#fff0c9;

  border:2px solid #ead7ae;

  color:#4b3525;

  text-align:center;

  font-size:13px;

  font-weight:800;

  line-height:1.6;

  position:relative;
  z-index:10;

  box-shadow:
    0 2px 5px rgba(0,0,0,.05);
}

.birth-line{
  display:block;
}


/* ==================================================
   감자 터치 애니메이션
================================================== */

.potato-jump{
  animation:potatoJump .55s ease;
}

@keyframes potatoJump{

  0%{
    transform:translateY(0) scale(1);
  }

  35%{
    transform:translateY(-45px) scale(1.05);
  }

  65%{
    transform:translateY(-20px) scale(.98);
  }

  100%{
    transform:translateY(0) scale(1);
  }

}


.potato-shy{
  animation:potatoShy .7s ease;
}

@keyframes potatoShy{

  0%,100%{
    transform:rotate(0);
  }

  20%{
    transform:rotate(-8deg) translateX(-4px);
  }

  40%{
    transform:rotate(8deg) translateX(4px);
  }

  60%{
    transform:rotate(-5deg);
  }

  80%{
    transform:rotate(5deg);
  }

}


.potato-wiggle{
  animation:potatoWiggle .55s ease;
}

@keyframes potatoWiggle{

  0%,100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-18px) rotate(-5deg);
  }

  50%{
    transform:translateX(18px) rotate(5deg);
  }

  75%{
    transform:translateX(-10px);
  }

}


.potato-angry{
  animation:potatoAngry .5s ease;
}

@keyframes potatoAngry{

  0%,100%{
    transform:scale(1);
  }

  25%{
    transform:scale(1.08) rotate(-4deg);
  }

  50%{
    transform:scale(1.08) rotate(4deg);
  }

  75%{
    transform:scale(1.05);
  }

}


.potato-happy{
  animation:potatoHappy .65s ease;
}

@keyframes potatoHappy{

  0%,100%{
    transform:rotate(0) scale(1);
  }

  25%{
    transform:rotate(-12deg) scale(1.08);
  }

  50%{
    transform:rotate(12deg) scale(1.08);
  }

  75%{
    transform:rotate(-8deg) scale(1.04);
  }

}


.potato-sleep{
  animation:potatoSleep 1s ease;
}

@keyframes potatoSleep{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(10px) scale(.96);
  }

}


/* ==================================================
   하트
================================================== */

.touch-heart{
  position:absolute;

  font-size:28px;

  pointer-events:none;

  animation:heartFloat 1s ease forwards;

  z-index:20;
}

@keyframes heartFloat{

  0%{
    opacity:1;
    transform:translateY(0) scale(.7);
  }

  100%{
    opacity:0;
    transform:translateY(-80px) scale(1.3);
  }

}


/* ==================================================
   반짝이
================================================== */

.touch-sparkle{
  position:absolute;

  pointer-events:none;

  font-size:24px;

  animation:sparkleFloat .8s ease forwards;

  z-index:20;
}

@keyframes sparkleFloat{

  0%{
    opacity:1;
    transform:scale(.5) rotate(0);
  }

  100%{
    opacity:0;
    transform:
      scale(1.5)
      rotate(180deg)
      translateY(-35px);
  }

}


/* ==================================================
   스탯
================================================== */

.info{
  padding:8px 16px 0;
}

.potato-name{
  text-align:center;

  font-size:24px;

  font-weight:1000;

  margin:4px 0 5px;
}

.personality{
  text-align:center;

  color:#806b58;

  font-size:12px;

  font-weight:800;

  margin-bottom:16px;
}

.stat{
  margin-bottom:12px;
}

.stat-line{
  display:flex;

  justify-content:space-between;
  align-items:center;

  margin-bottom:5px;

  font-size:12px;
  font-weight:800;
}

.stat-bar{
  width:100%;

  height:12px;

  background:#eadcc6;

  border-radius:20px;

  overflow:hidden;
}

.stat-fill{
  height:100%;

  width:0%;

  border-radius:20px;

  transition:width .3s ease;
}


/* ==================================================
   버튼
================================================== */

.action-buttons{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  padding:20px 16px 24px;
}

.action-button{
  min-height:56px;

  padding:12px 8px;

  border-radius:15px;

  background:#eadcc6;

  color:#4b3525;

  font-size:14px;

  font-weight:900;

  line-height:1.3;

  box-shadow:
    0 3px 0 #d1bea3;
}

.action-button:active{
  transform:translateY(2px);

  box-shadow:
    0 1px 0 #d1bea3;
}

.action-button.harvest{
  background:#d79b55;

  color:white;

  box-shadow:
    0 3px 0 #b87838;
}


/* ==================================================
   성장 화면
================================================== */

.egg-scene{
  width:100%;

  height:270px;

  display:flex;

  justify-content:center;
  align-items:flex-end;

  padding-bottom:20px;

  position:relative;
}

.soil{
  position:absolute;

  width:250px;
  height:55px;

  background:#9a704e;

  border-radius:50%;

  bottom:20px;
}

.growth-emoji{
  position:relative;

  z-index:2;

  font-size:80px;

  line-height:1;

  animation:sproutBounce 2s ease-in-out infinite;
}

@keyframes sproutBounce{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }

}

.growth-info{
  text-align:center;

  padding:0 20px;
}

.growth-title{
  font-size:21px;

  font-weight:1000;

  margin-bottom:8px;
}

.growth-percent{
  font-size:14px;

  color:#806b58;

  margin-bottom:10px;
}

.progress{
  width:100%;

  height:18px;

  background:#eadcc6;

  border-radius:20px;

  overflow:hidden;
}

.progress-bar{
  width:0%;

  height:100%;

  background:#d79b55;

  border-radius:20px;

  transition:width .3s ease;
}


/* ==================================================
   산책
================================================== */

.walking{
  animation:walking .9s ease-in-out;
}

@keyframes walking{

  0%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-40px) rotate(-5deg);
  }

  50%{
    transform:translateX(40px) rotate(5deg);
  }

  75%{
    transform:translateX(-20px) rotate(-3deg);
  }

  100%{
    transform:translateX(0);
  }

}

.walk-effect{
  position:absolute;

  font-size:28px;

  animation:walkEffect 1s ease forwards;

  pointer-events:none;

  z-index:10;
}

@keyframes walkEffect{

  0%{
    opacity:1;
    transform:translateY(0);
  }

  100%{
    opacity:0;
    transform:translateY(-35px);
  }

}


/* ==================================================
   도감
================================================== */

.collection-header{
  padding:20px 16px;

  display:flex;

  align-items:center;
  justify-content:space-between;
}

.back-button{
  background:#eadcc6;

  color:#4b3525;

  padding:10px 14px;

  border-radius:12px;

  font-size:13px;

  font-weight:900;
}

.collection-title{
  font-size:23px;

  font-weight:1000;
}


/* ==================================================
   놀이터
================================================== */

.playground-title{
  text-align:center;

  font-size:18px;

  font-weight:1000;

  margin:0 0 7px;
}

.playground-subtitle{
  text-align:center;

  color:#806b58;

  font-size:11px;

  font-weight:700;

  margin-bottom:12px;
}

.playground{
  width:calc(100% - 32px);

  height:330px;

  margin:0 16px 18px;

  position:relative;

  overflow:hidden;

  border-radius:22px;

  border:3px solid #d9c19e;

  background:

    radial-gradient(
      circle at 20% 25%,
      rgba(255,255,255,.7) 0 2px,
      transparent 3px
    ),

    radial-gradient(
      circle at 80% 65%,
      rgba(255,255,255,.6) 0 2px,
      transparent 3px
    ),

    #dcecc8;

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;
}

.playground::before{
  content:"";

  position:absolute;

  width:100%;
  height:50px;

  bottom:0;
  left:0;

  background:#a9cb82;

  border-radius:50% 50% 0 0;

  opacity:.7;

  pointer-events:none;
}

.playground-empty{
  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:30px;

  color:#806b58;

  font-size:13px;

  font-weight:800;

  line-height:1.7;

  z-index:2;

  pointer-events:none;
}


/* ==================================================
   놀이터 감자
================================================== */

.play-potato{
  position:absolute;

  width:62px;
  height:62px;

  z-index:5;

  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;
  -webkit-user-drag:none;

  cursor:pointer;

  touch-action:none;

  transition:
    left .08s linear,
    top .08s linear;

  will-change:
    left,
    top,
    transform;
}

.play-potato.dragging{
  z-index:100;

  transform:scale(1.18);

  filter:
    drop-shadow(
      0 7px 5px rgba(0,0,0,.25)
    );
}

.play-potato.leader-near{
  filter:
    drop-shadow(
      0 0 7px rgba(215,155,85,.9)
    );
}

.play-potato-name{
  position:absolute;

  z-index:8;

  transform:translateX(-50%);

  padding:3px 6px;

  border-radius:8px;

  background:rgba(255,255,255,.85);

  font-size:8px;

  font-weight:900;

  white-space:nowrap;

  pointer-events:none;
}


/* ==================================================
   놀이터 행동
================================================== */

.play-jump{
  animation:playJump .65s ease;
}

@keyframes playJump{

  0%,100%{
    transform:translateY(0);
  }

  45%{
    transform:
      translateY(-28px)
      rotate(-5deg);
  }

  70%{
    transform:
      translateY(-10px)
      rotate(5deg);
  }

}


.play-shy{
  animation:playShy .9s ease;
}

@keyframes playShy{

  0%,100%{
    transform:rotate(0) scale(1);
  }

  30%{
    transform:rotate(-8deg) scale(.9);
  }

  60%{
    transform:rotate(8deg) scale(.9);
  }

}


.play-spin{
  animation:playSpin .7s ease;
}

@keyframes playSpin{

  from{
    transform:rotate(0);
  }

  to{
    transform:rotate(360deg);
  }

}


.play-angry{
  animation:playAngry .45s ease;
}

@keyframes playAngry{

  0%,100%{
    transform:scale(1);
  }

  30%{
    transform:
      scale(1.15)
      rotate(-5deg);
  }

  60%{
    transform:
      scale(1.15)
      rotate(5deg);
  }

}


.play-stun{
  filter:
    grayscale(100%)
    brightness(.85);

  opacity:.65;

  transform:
    rotate(8deg);

  transition:
    filter .2s ease,
    opacity .2s ease;
}

@keyframes playStunShake{

  0%,100%{
    transform:rotate(8deg);
  }

  25%{
    transform:rotate(-8deg);
  }

  50%{
    transform:rotate(10deg);
  }

  75%{
    transform:rotate(4deg);
  }

}


/* ==================================================
   기절 효과
================================================== */

.dizzy-stars{
  position:absolute;

  z-index:120;

  pointer-events:none;

  font-size:27px;

  animation:dizzyStars 3s ease-in-out infinite;
}

@keyframes dizzyStars{

  0%{
    transform:
      translate(-50%,-50%)
      rotate(0deg);
  }

  25%{
    transform:
      translate(-50%,-50%)
      rotate(-12deg);
  }

  50%{
    transform:
      translate(-50%,-50%)
      rotate(12deg);
  }

  75%{
    transform:
      translate(-50%,-50%)
      rotate(-12deg);
  }

  100%{
    transform:
      translate(-50%,-50%)
      rotate(0deg);
  }

}


/* ==================================================
   놀이터 효과
================================================== */

.play-effect{
  position:absolute;

  z-index:30;

  pointer-events:none;

  font-size:25px;

  transform:
    translate(-50%,-50%);

  animation:playEffect .8s ease forwards;
}

@keyframes playEffect{

  0%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.5);
  }

  50%{
    opacity:1;

    transform:
      translate(-50%,-70%)
      scale(1.2);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-110%)
      scale(.9);
  }

}


/* ==================================================
   발견 숫자
================================================== */

.collection-count{
  text-align:center;

  margin:0 16px 18px;

  padding:12px;

  background:#fff0c9;

  border-radius:14px;

  font-size:14px;

  font-weight:900;
}


/* ==================================================
   도감 카드
================================================== */

.collection-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

  padding:0 16px 30px;
}

.collection-card{
  min-height:210px;

  background:#fff;

  border:2px solid #eadcc6;

  border-radius:18px;

  padding:14px 10px;

  text-align:center;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.collection-card img{
  width:115px;
  height:115px;

  object-fit:contain;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;
  -webkit-user-drag:none;
}

.collection-question{
  font-size:65px;

  height:115px;

  display:flex;

  justify-content:center;
  align-items:center;
}

.collection-name{
  font-size:15px;

  font-weight:1000;

  margin-top:6px;
}

.collection-status{
  margin-top:5px;

  font-size:11px;

  color:#806b58;

  line-height:1.4;
}


/* ==================================================
   모달
================================================== */

.modal{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.4);

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:1000;
}

.modal-box{
  width:100%;

  max-width:360px;

  background:#fffaf2;

  border-radius:22px;

  padding:25px 20px;

  text-align:center;

  box-shadow:
    0 10px 30px rgba(0,0,0,.2);
}

.modal-title{
  font-size:21px;

  font-weight:1000;

  margin-bottom:12px;
}

.modal-text{
  font-size:14px;

  line-height:1.7;

  color:#806b58;

  margin-bottom:20px;
}

.modal-button{
  width:100%;

  padding:14px;

  border-radius:14px;

  background:#d79b55;

  color:white;

  font-size:14px;

  font-weight:900;
}

</style>
</head>


<body>


<!-- ==================================================
     시작 화면
================================================== -->

<section
  id="startScreen"
  class="screen">

  <div class="start-potato">
    🥔
  </div>

  <div class="start-title">
    감자 키우기
  </div>

  <div class="start-subtitle">
    나만의 감자를 키워보세요!
  </div>

  <button
    class="start-button"
    onclick="startGame()">

    감자 키우기 시작

  </button>

</section>



<!-- ==================================================
     성장 화면
================================================== -->

<section
  id="beforeScreen"
  class="screen hidden">

  <div class="header">

    <div class="header-title">
      감자 키우기
    </div>

    <div class="header-subtitle">
      작은 싹을 잘 키워주세요
    </div>

    <div
      id="growthDay"
      class="day-badge">

      1일차

    </div>

  </div>


  <div
    class="egg-scene"
    onclick="growthTouch()">

    <div class="soil"></div>

    <div
      id="growthEmoji"
      class="growth-emoji growth-touch">

      🌱

    </div>

  </div>


  <div class="growth-info">

    <div class="growth-title">
      감자가 자라고 있어요!
    </div>

    <div
      id="growthPercent"
      class="growth-percent">

      성장도 0%

    </div>

    <div class="progress">

      <div
        id="growthBar"
        class="progress-bar">
      </div>

    </div>

  </div>


  <div
    id="beforeMessage"
    class="message">

    감자에게 사랑을 주세요!

  </div>


  <div class="action-buttons">

    <button
      class="action-button"
      onclick="addGrowth(12)">

      🌱 비료 주기

    </button>

    <button
      class="action-button"
      onclick="addGrowth(10)">

      💧 물 주기

    </button>

    <button
      class="action-button"
      onclick="addGrowth(8)">

      ☀️ 햇빛 쬐기

    </button>

    <button
      class="action-button"
      onclick="addGrowth(5)">

      💕 응원하기

    </button>

  </div>

</section>



<!-- ==================================================
     게임 화면
================================================== -->

<section
  id="gameScreen"
  class="screen hidden">


  <div class="sticky-top">

    <div class="header">

      <div class="header-title">
        나의 감자
      </div>

      <div class="header-subtitle">
        감자와 함께 즐거운 하루!
      </div>

      <div
        id="gameDay"
        class="day-badge">

        1일차

      </div>

    </div>

  },

  },

    style:"violent"
  },

  {
    name:"저능감자",
    image:"Potato5.PNG",
    style:"silly"
  }

];


const personalities = [

  "애교쟁이",
  "느긋한",
  "장난꾸러기",
  "호기심 많은",
  "겁이 많은"

];


const STORAGE_KEY =
  "POTATO_GAME_FINAL_V5";


/* ==================================================
   기본 상태
================================================== */

let state = {

  started:false,

  born:false,

  growth:0,

  day:1,

  character:null,

  personality:null,

  hunger:100,

  water:100,

  love:50,

  energy:100,

  collection:[]

};


/* ==================================================
   놀이터
================================================== */

let playgroundTimer = null;

let playgroundPotatoes = [];

let activeDrag = null;

let dragTimer = null;

let dragStartX = 0;

let dragStartY = 0;

let dragMoved = false;


/* ==================================================
   저장
================================================== */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* ==================================================
   불러오기
================================================== */

function load(){

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(!saved){
    return;
  }

  try{

    const parsed =
      JSON.parse(saved);

    state = {
      ...state,
      ...parsed
    };


    if(
      !Array.isArray(
        state.collection
      )
    ){

      state.collection = [];

    }


    if(
      typeof state.day !== "number" ||
      state.day < 1
    ){

      state.day = 1;

    }

  }
  catch(error){

    console.log(
      "저장 데이터 불러오기 실패"
    );

  }

}


/* ==================================================
   화면 관리
================================================== */

function hideAllScreens(){

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("beforeScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.add("hidden");

  document
    .getElementById("collectionScreen")
    .classList.add("hidden");

}


function startGame(){

  state.started = true;

  save();

  showBeforeScreen();

}


function showBeforeScreen(){

  stopPlayground();

  hideAllScreens();

  document
    .getElementById("beforeScreen")
    .classList.remove("hidden");

  updateGrowth();

}


function showGameScreen(){

  hideAllScreens();

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  updateCharacter();

  updateStats();

  updateDay();

}


function showCollection(){

  hideAllScreens();

  document
    .getElementById("collectionScreen")
    .classList.remove("hidden");

  renderCollection();

}


function backToGame(){

  stopPlayground();

  showGameScreen();

}


/* ==================================================
   날짜
================================================== */

function updateDay(){

  const gameDay =
    document.getElementById(
      "gameDay"
    );

  const growthDay =
    document.getElementById(
      "growthDay"
    );


  if(gameDay){

    gameDay.innerText =
      `${state.day}일차`;

  }


  if(growthDay){

    growthDay.innerText =
      `${state.day}일차`;

  }

}


/* ==================================================
   성장
================================================== */

function addGrowth(amount){

  if(state.born){
    return;
  }


  state.growth += amount;


  if(state.growth > 100){

    state.growth = 100;

  }


  save();

  updateGrowth();


  const messages = [

    "조금씩 자라고 있어요!",

    "감자가 힘을 내고 있어요!",

    "쑥쑥 자라는 중이에요!",

    "조금만 더 힘내요!",

    "땅속에서 무언가 움직여요..."

  ];


  document
    .getElementById("beforeMessage")
    .innerText =

      messages[
        Math.floor(
          Math.random() *
          messages.length
        )
      ];


  if(
    state.growth >= 100
  ){

    setTimeout(
      hatchPotato,
      500
    );

  }

}


function updateGrowth(){

  const percent =
    state.growth;


  document
    .getElementById("growthPercent")
    .innerText =

      `성장도 ${percent}%`;


  document
    .getElementById("growthBar")
    .style.width =

      `${percent}%`;


  const emoji =
    document.getElementById(
      "growthEmoji"
    );


  if(percent < 25){

    emoji.innerText =
      "🌱";

  }
  else if(percent < 50){

    emoji.innerText =
      "🌿";

  }
  else if(percent < 75){

    emoji.innerText =
      "🌳";

  }
  else{

    emoji.innerText =
      "🥔";

  }


  updateDay();

}


/* ==================================================
   성장 중 터치
================================================== */

function growthTouch(){

  if(state.born){
    return;
  }


  const emoji =
    document.getElementById(
      "growthEmoji"
    );


  const reactions = [

    "jump",
    "shy",
    "wiggle",
    "happy",
    "sparkle"

  ];


  const reaction =
    reactions[
      Math.floor(
        Math.random() *
        reactions.length
      )
    ];


  emoji.classList.remove(
    "potato-jump",
    "potato-shy",
    "potato-wiggle",
    "potato-happy"
  );


  void emoji.offsetWidth;


  if(reaction === "jump"){

    emoji.classList.add(
      "potato-jump"
    );

    document
      .getElementById(
        "beforeMessage"
      )
      .innerText =
        "🌱 싹이 깜짝 놀랐어요!";

  }


  if(reaction === "shy"){

    emoji.classList.add(
      "potato-shy"
    );

    document
      .getElementById(
        "beforeMessage"
      )
      .innerText =
        "🌱 쑥스러운가 봐요...";

  }


  if(reaction === "wiggle"){

    emoji.classList.add(
      "potato-wiggle"
    );

    document
      .getElementById(
        "beforeMessage"
      )
      .innerText =
        "🌱 꼬물꼬물 움직여요!";

  }


  if(reaction === "happy"){

    emoji.classList.add(
      "potato-happy"
    );

    document
      .getElementById(
        "beforeMessage"
      )
      .innerText =
        "🌱 기분이 좋은가 봐요!";

  }


  if(reaction === "sparkle"){

    createGrowthSparkles();

    document
      .getElementById(
        "beforeMessage"
      )
      .innerText =
        "✨ 반짝반짝 빛나요!";

  }

}


function createGrowthSparkles(){

  const scene =
    document.querySelector(
      ".egg-scene"
    );


  for(
    let i=0;
    i<4;
    i++
  ){

    const sparkle =
      document.createElement(
        "div"
      );


    sparkle.className =
      "touch-sparkle";

    sparkle.innerText =
      "✨";


    sparkle.style.left =
      (
        35 +
        Math.random() * 30
      ) + "%";


    sparkle.style.top =
      (
        30 +
        Math.random() * 30
      ) + "%";


    scene.appendChild(
      sparkle
    );


    setTimeout(
      () => sparkle.remove(),
      900
    );

  }

}


/* ==================================================
   감자 탄생
================================================== */

function hatchPotato(){

  if(state.born){
    return;
  }


  const character =

    potatoes[
      Math.floor(
        Math.random() *
        potatoes.length
      )
    ];


  const personality =

    personalities[
      Math.floor(
        Math.random() *
        personalities.length
      )
    ];


  state.born = true;

  state.character =
    character;

  state.personality =
    personality;

  state.hunger = 100;
  state.water = 100;
  state.love = 50;
  state.energy = 100;


  save();

  showGameScreen();


  document
    .getElementById("messageLine1")
    .innerText =

      `🥔 ${character.name}가 태어났어요!`;


  document
    .getElementById("messageLine2")
    .innerText =

      `성격은 ${personality}이에요!`;

}


/* ==================================================

================================================== */

function updateCharacter(){

  if(!state.character){
    return;
  }


  const image =
    document.getElementById(
      "potatoImage"

  image.src =
    state.character.image;


  image.alt =
    state.character.name;


  document

    .innerText =

      state.character.name;


  document
    .getElementById("personality")
    .innerText =

      `성격 · ${state.personality}`;


  updateDay();

}

/* ==================================================
   먹이
================================================== */

function feed(){

  if(!state.born){
    return;
  }


  state.hunger += 25;

  state.hunger =
    Math.min(
      100,
      state.hunger
    );


  state.energy += 5;

  state.energy =
    Math.min(
      100,
      state.energy
    );


  save();

  updateStats();

  showMessage("feed");

}


/* ==================================================
   물
================================================== */

function giveWater(){

  if(!state.born){
    return;
  }


  state.water += 30;

  state.water =
    Math.min(
      100,
      state.water
    );


  save();

  updateStats();

  showMessage("water");

}


/* ==================================================
   쓰다듬기
================================================== */

function pet(){

  if(!state.born){
    return;
  }


  state.love += 12;

  state.love =
    Math.min(
      100,
      state.love
    );


  state.energy -= 2;

  state.energy =
    Math.max(
      0,
      state.energy
    );


  save();

  updateStats();

  showMessage("pet");

}


/* ==================================================
   산책
================================================== */

function walk(){

  if(!state.born){
    return;
  }


  if(
    state.energy < 15
  ){

    showMessage("tired");

    return;

  }


  state.energy -= 15;
  state.love += 10;
  state.hunger -= 8;
  state.water -= 8;


  state.energy =
    Math.max(
      0,
      state.energy
    );


  state.love =
    Math.min(
      100,
      state.love
    );


  state.hunger =
    Math.max(
      0,
      state.hunger
    );


  state.water =
    Math.max(
      0,
      state.water
    );


  save();

  updateStats();

  showMessage("walk");


  const image =
    document.getElementById(
      "potatoImage"
    );


  image.classList.remove(
    "walking"
  );


  void image.offsetWidth;


  image.classList.add(
    "walking"
  );


  setTimeout(
    () => {

      image.classList.remove(
        "walking"
      );

    },
    1000
  );


  createWalkEffect();

}


function createWalkEffect(){

  const wrap =
    document.getElementById(
      "potatoWrap"
    );


  const effect =
    document.createElement(
      "div"
    );


  effect.className =
    "walk-effect";


  effect.innerText =

  effect.style.left =
    "50%";


  effect.style.top =
    "55%";


  wrap.appendChild(
    effect
  );


  setTimeout(
    () => effect.remove(),
    1000
  );

}

function potatoTouch(){

  if(
    !state.born ||
    !state.character
  ){

    return;

  }


  const potato =
    document.getElementById(
      "potatoImage"
    );


  const personality =
    state.personality;


  const list =
    personalityReactions[
      personality
    ] || [];


  if(list.length === 0){
    return;
  }


  const reaction =
    list[
      Math.floor(
        Math.random() *
        list.length
      )
    ];


  potato.classList.remove(

    "potato-jump",
    "potato-shy",
    "potato-wiggle",
    "potato-angry",
    "potato-happy",
    "potato-sleep"

  );


  void potato.offsetWidth;


  if(
    reaction.type === "jump"
  ){

    potato.classList.add(
      "potato-jump"
    );

  }


  if(
    reaction.type === "shy"
  ){

    potato.classList.add(

/* ==================================================
   자동 감소
================================================== */

setInterval(

  () => {

    if(!state.born){
      return;
    }


    state.hunger -= 2;
    state.water -= 2;
    state.energy -= 1;


    state.hunger =
      Math.max(
        0,
        state.hunger
      );


    state.water =
      Math.max(
        0,
        state.water
      );


    state.energy =
      Math.max(
        0,
        state.energy
      );


    save();

    updateStats();


    if(
      state.hunger <= 20
    ){

      showMessage(
        "hungry"
      );

    }
    else if(
      state.water <= 20
    ){

      showMessage(
        "thirsty"
      );

    }
    else if(
      state.energy <= 20
    ){

      showMessage(
        "tired"
      );

    }

  },

  10000

);


/* ==================================================
   수확
================================================== */

function harvest(){

  if(
    !state.born ||
    !state.character
  ){

    return;

  }


  const character =
    state.character;


  const isNew =

    !state.collection.includes(
      character.name
    );


  if(isNew){

    state.collection.push(
      character.name
    );

  }


  /*
    수확하면 하루 증가
  */

  state.day += 1;


  state.born = false;

  state.growth = 0;

  state.character = null;

  state.personality = null;

  state.hunger = 100;

  state.water = 100;

  state.love = 50;

  state.energy = 100;


  save();

  showBeforeScreen();


  if(isNew){

    openModal(

      "🥔 새로운 감자 발견!",

      `${character.name}를 수확했어요!<br><br>
       도감에 등록되었습니다.`

    );

  }
  else{

    document
      .getElementById(
        "beforeMessage"
      )
      .innerText =

        `${character.name}는 이미 도감에 등록되어 있어요!`;

  }

}

/* ==================================================
   놀이터 감자 터치
================================================== */

function setupPotatoTouch(
  actor
){

  const el =
    actor.el;


  let startX = 0;
  let startY = 0;


  function startPress(
    x,
    y
  ){

    if(
      actor.stunned
    ){

      return;

    }


    actor.touchMoved =
      false;


    startX = x;
    startY = y;


    clearTimeout(
      actor.touchTimer
    );


    actor.touchTimer =

      setTimeout(
        () => {

          if(
            !actor.touchMoved &&
            !actor.stunned
          ){

            startDragging(
              actor,
              x,
              y
            );

          }

        },

        450

      );

  }


  function movePress(
    x,
    y
  ){

    const dx =
      x - startX;


    const dy =
      y - startY;


    if(
      Math.hypot(
        dx,
        dy
      ) > 8
    ){

      actor.touchMoved =
        true;

      clearTimeout(
        actor.touchTimer
      );

    }


    if(
      activeDrag === actor
    ){

      moveDragging(
        actor,
        x,
        y
      );

    }

  }


  function endPress(){

    clearTimeout(
      actor.touchTimer
    );


    if(
      activeDrag === actor
    ){

      stopDragging(
        actor
      );

      return;

    }


    if(
      !actor.touchMoved
    ){

      playPotatoReaction(
        actor
      );

    }

  }


  el.addEventListener(
    "touchstart",
    event => {

      const touch =
        event.touches[0];

      startPress(
        touch.clientX,
        touch.clientY
      );

      event.preventDefault();

    },
    {
      passive:false
    }
  );


  el.addEventListener(
    "touchmove",
    event => {

      const touch =
        event.touches[0];

      movePress(
        touch.clientX,
        touch.clientY
      );

      event.preventDefault();

    },
    {
      passive:false
    }
  );


  el.addEventListener(
    "touchend",
    event => {

      endPress();

      event.preventDefault();

    },
    {
      passive:false
    }
  );


  el.addEventListener(
    "mousedown",
    event => {

      startPress(
        event.clientX,
        event.clientY
      );

      event.preventDefault();

    }
  );


  el.addEventListener(
    "mousemove",
    event => {

      movePress(
        event.clientX,
        event.clientY
      );

    }
  );


  el.addEventListener(
    "mouseup",
    event => {

      endPress();

      event.preventDefault();

    }
  );


  el.addEventListener(
    "mouseleave",
    () => {

      if(
        activeDrag !== actor
      ){

        clearTimeout(
          actor.touchTimer
        );

      }

    }
  );

}

function updateActorPosition(
  actor
){

  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  const maxX =
    playground.clientWidth - 67;


  const maxY =

      5,
      Math.min(
        maxX,
        actor.x
      )
    );

    Math.max(
      25,
      Math.min(
        maxY,
        actor.y
      )
    );

    `${actor.x}px`;


  actor.el.style.top =
    `${actor.y}px`;

    `${actor.x + 31}px`;


  actor.label.style.top =
    `${actor.y + 60}px`;

}


/* ==================================================
   드래그 시작
================================================== */

function startDragging(
  actor,
  clientX,
  clientY
){

  if(
    activeDrag ||
    actor.stunned
  ){

    return;

  }


  activeDrag =
    actor;


  actor.dragging =
    true;


  actor.el.classList.add(
    "dragging"
  );


  actor.vx = 0;
  actor.vy = 0;


  if(
    actor.data.style ===
    "leader"
  ){

    playgroundPotatoes.forEach(
      other => {

        if(
          other !== actor &&
          !other.stunned
        ){

          other.followingLeader =
            true;

          other.el.classList.add(
            "leader-near"
          );

        }

      }
    );

  }


  moveDragging(
    actor,
    clientX,
    clientY
  );

}


/* ==================================================
   드래그 이동
================================================== */

function moveDragging(
  actor,
  clientX,
  clientY
){

  if(
    activeDrag !== actor
  ){

    return;

  }


  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  const rect =
    playground.getBoundingClientRect();


  actor.x =
    clientX -
    rect.left -
    31;


  actor.y =
    clientY -
    rect.top -
    31;


  updateActorPosition(
    actor
  );

}


/* ==================================================
   드래그 종료
================================================== */

function stopDragging(
  actor
){

  if(
    activeDrag !== actor
  ){

    return;

  }


  activeDrag = null;

  actor.dragging =
    false;


  actor.el.classList.remove(
    "dragging"
  );


  if(
    actor.data.style ===
    "leader"
  ){

    playgroundPotatoes.forEach(
      other => {

        other.followingLeader =
          false;

        other.el.classList.remove(
          "leader-near"
        );


        if(
          !other.stunned
        ){

          other.vx =
            (Math.random() - .5) * 1.5;

          other.vy =
            (Math.random() - .5) * 1.5;

        }

      }
    );

  }


  actor.vx =
    (Math.random() - .5) * 1.5;


  actor.vy =
    (Math.random() - .5) * 1.5;

}

/* ==================================================
   놀이터 AI
================================================== */

function playgroundTick(){

  const playground =
    document.getElementById(
      "playground"
    );


  if(
    !playground
  ){

    return;

  }


  if(
    document
      .getElementById(
        "collectionScreen"
      )
      .classList.contains(
        "hidden"
      )
  ){

    return;

  }


  const now =
    Date.now();


  const leader =
    playgroundPotatoes.find(
      actor =>
        actor.data.style ===
        "leader" &&
        actor.dragging
    );


  playgroundPotatoes.forEach(

    actor => {

      if(
        actor.dragging
      ){

        updateActorPosition(
          actor
        );

        return;

      }


      if(
        actor.stunned
      ){

        updateActorPosition(
          actor
        );

        return;

      }


      /* ==========================================
         대장감자 잡고 있을 때
      ========================================== */

      if(
        leader &&
        actor !== leader
      ){

        const dx =
          leader.x -
          actor.x;


        const dy =
          leader.y -
          actor.y;


        const distance =
          Math.hypot(
            dx,
            dy
          );


        if(
          distance > 58
        ){

          actor.x +=
            (dx / distance) *
            6.2;

          actor.y +=
            (dy / distance) *
            6.2;

        }
        else{

          const angle =
            (actor === playgroundPotatoes[0]
              ? 0
              : playgroundPotatoes.indexOf(actor)
            ) * 1.7;


          actor.x +=
            Math.cos(angle) *
            .8;

          actor.y +=
            Math.sin(angle) *
            .8;

        }


        keepInside(
          actor
        );


        updateActorPosition(
          actor
        );


        return;

      }


      /* ==========================================
         꾼감자
      ========================================== */

      if(
        actor.data.style ===
        "social"
      ){

        const target =
          getNearestOther(
            actor
          );


        if(target){

          moveToward(
            actor,
            target.x,
            target.y,
            .75
          );

        }


        randomAction(
          actor,
          [
            "jump",
            "heart"
          ],
          .012
        );

      }


      /* ==========================================
         대장감자
      ========================================== */

      else if(
        actor.data.style ===
        "leader"
      ){

        const centerX =
          playground.clientWidth / 2;


        const centerY =
          playground.clientHeight / 2;


        moveToward(
          actor,
          centerX - 31,
          centerY - 40,
          .35
        );


        randomAction(
          actor,
          [
            "jump",
            "spin"
          ],
          .008
        );

      }


      /* ==========================================
         독감자
      ========================================== */

      else if(
        actor.data.style ===
        "poison"
      ){

        const target =
          getNearestOther(
            actor
          );


        if(target){

          moveToward(
            actor,
            target.x,
            target.y,
            1.15
          );

        }


        randomAction(
          actor,
          [
            "angry"
          ],
          .012
        );

      }


      /* ==========================================
         폭력감자
      ========================================== */

      else if(
        actor.data.style ===
        "violent"
      ){

        const target =
          getNearestOther(
            actor
          );


        if(target){

          moveToward(
            actor,
            target.x,
            target.y,
            1.35
          );

        }


        randomAction(
          actor,
          [
            "angry",
            "jump"
          ],
          .018
        );

      }


      /* ==========================================
         저능감자
      ========================================== */

      else if(
        actor.data.style ===
        "silly"
      ){

        actor.x +=
          actor.vx;


        actor.y +=
          actor.vy;


        if(
          Math.random() < .018
        ){

          actor.vx =
            (Math.random() * 2 - 1) * 1.5;

          actor.vy =
            (Math.random() * 2 - 1) * 1.5;

        }


        randomAction(
          actor,
          [
            "spin",
            "jump"
          ],
          .012
        );

      }


      keepInside(
        actor
      );


      updateActorPosition(
        actor
      );

    }

  );


  checkPlaygroundCollisions();

}


/* ==================================================
   다른 감자 찾기
================================================== */

function getNearestOther(
  actor
){

  let nearest =
    null;


  let distance =
    Infinity;


  playgroundPotatoes.forEach(

    other => {

      if(
        other === actor ||
        other.stunned ||
        other.dragging
      ){

        return;

      }


      const dx =
        other.x -
        actor.x;


      const dy =
        other.y -
        actor.y;


      const d =
        Math.hypot(
          dx,
          dy
        );


      if(
        d < distance
      ){

        distance =
          d;

        nearest =
          other;

      }

    }

  );


  return nearest;

}


/* ==================================================
   이동
================================================== */

function moveToward(
  actor,
  tx,
  ty,
  speed
){

  const dx =
    tx -
    actor.x;


  const dy =
    ty -
    actor.y;


  const distance =
    Math.hypot(
      dx,
      dy
    );


  if(
    distance < 5
  ){

    return;

  }


  actor.x +=
    (dx / distance) *
    speed;


  actor.y +=
    (dy / distance) *
    speed;

}


/* ==================================================
   화면 밖 방지
================================================== */

function keepInside(
  actor
){

  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  const maxX =
    playground.clientWidth - 67;


  const maxY =
    playground.clientHeight - 95;


  if(
    actor.x <= 5
  ){

    actor.x = 5;

    actor.vx =
      Math.abs(actor.vx);

  }


  if(
    actor.x >= maxX
  ){

    actor.x = maxX;

    actor.vx =
      -Math.abs(actor.vx);

  }


  if(
    actor.y <= 25
  ){

    actor.y = 25;

    actor.vy =
      Math.abs(actor.vy);

  }


  if(
    actor.y >= maxY
  ){

    actor.y = maxY;

    actor.vy =
      -Math.abs(actor.vy);

  }

}


/* ==================================================
   랜덤 행동
================================================== */

function randomAction(
  actor,
  actions,
  chance
){

  if(
    Math.random() >
    chance
  ){

    return;

  }


  const action =
    actions[
      Math.floor(
        Math.random() *
        actions.length
      )
    ];


  playActorAnimation(
    actor,
    action
  );

}


/* ==================================================
   행동 애니메이션
================================================== */

function playActorAnimation(
  actor,
  action
){

  actor.el.classList.remove(

    "play-jump",
    "play-shy",
    "play-spin",
    "play-angry"

  );


  void actor.el.offsetWidth;


  if(
    action === "jump"
  ){

    actor.el.classList.add(
      "play-jump"
    );

  }


  if(
    action === "shy"
  ){

    actor.el.classList.add(
      "play-shy"
    );

  }


  if(
    action === "spin"
  ){

    actor.el.classList.add(
      "play-spin"
    );

  }


  if(
    action === "angry"
  ){

    actor.el.classList.add(
      "play-angry"
    );

  }


  if(
    action === "heart"
  ){

    createPlayEffect(
      actor,
      "💕"
    );

  }

}


/* ==================================================
   충돌
================================================== */

function checkPlaygroundCollisions(){

  const now =
    Date.now();


  for(
    let i=0;
    i<playgroundPotatoes.length;
    i++
  ){

    for(
      let j=i+1;
      j<playgroundPotatoes.length;
      j++
    ){

      const a =
        playgroundPotatoes[i];


      const b =
        playgroundPotatoes[j];


      if(
        a.dragging ||
        b.dragging ||
        a.stunned ||
        b.stunned
      ){

        continue;

      }


      const dx =
        b.x -
        a.x;


      const dy =
        b.y -
        a.y;


      const distance =
        Math.hypot(
          dx,
          dy
        );


      if(
        distance >= 55
      ){

        continue;

      }


      if(
        now - a.lastCollision <
        800 ||
        now - b.lastCollision <
        800
      ){

        continue;

      }


      a.lastCollision =
        now;

      b.lastCollision =
        now;


      const angle =
        Math.atan2(
          dy,
          dx
        );


      const push =
        10;


      a.x -=
        Math.cos(angle) *
        push;


      a.y -=
        Math.sin(angle) *
        push;


      b.x +=
        Math.cos(angle) *
        push;


      b.y +=
        Math.sin(angle) *
        push;


      keepInside(a);
      keepInside(b);


      updateActorPosition(a);
      updateActorPosition(b);


      createCollisionEffect(
        a,
        b
      );


      /* =========================================
         독감자 충돌
      ========================================= */

      if(
        a.data.style === "poison" &&
        b.data.style !== "poison"
      ){

        stunPotato(
          b,
          a
        );

        continue;

      }


      if(
        b.data.style === "poison" &&
        a.data.style !== "poison"
      ){

        stunPotato(
          a,
          b
        );

        continue;

      }


      /* =========================================
         폭력감자 충돌
      ========================================= */

      if(
        a.data.style === "violent" &&
        b.data.style !== "violent"
      ){

        playActorAnimation(
          a,
          "angry"
        );

        playActorAnimation(
          b,
          "shy"
        );

        createPlayEffect(
          a,
          "💢"
        );

      }
      else if(
        b.data.style === "violent" &&
        a.data.style !== "violent"
      ){

        playActorAnimation(
          b,
          "angry"
        );

        playActorAnimation(
          a,
          "shy"
        );

        createPlayEffect(
          b,
          "💢"
        );

      }
      else{

        playActorAnimation(
          a,
          "jump"
        );

        playActorAnimation(
          b,
          "jump"
        );

      }

    }

  }

}


/* ==================================================
   독감자 기절
================================================== */

function stunPotato(
  victim,
  attacker
){

  if(
    victim.stunned
  ){

    return;

  }


  const now =
    Date.now();


  if(
    victim.poisonCooldownUntil &&
    now <
    victim.poisonCooldownUntil
  ){

    return;

  }


  victim.stunned =
    true;


  victim.poisonCooldownUntil =
    now + 5000;


  victim.vx = 0;
  victim.vy = 0;


  victim.el.classList.remove(
    "play-stun"
  );


  void victim.el.offsetWidth;


  victim.el.classList.add(
    "play-stun"
  );


  /*
    독감자는 공격 성공
  */

  playActorAnimation(
    attacker,
    "angry"
  );


  createPlayEffect(
    victim,
    "💥"
  );


  createPlayEffect(
    victim,
    "😵"
  );


  createDizzyStars(
    victim
  );


  /*
    정확히 3초간 기절
  */

  setTimeout(

    () => {

      victim.stunned =
        false;


      victim.el.classList.remove(
        "play-stun"
      );


      removeDizzyStars(
        victim
      );


      victim.vx =
        (Math.random() - .5) * 1.2;


      victim.vy =
        (Math.random() - .5) * 1.2;


      createPlayEffect(
        victim,
        "💫"
      );

    },

    3000

  );

}


/* ==================================================
   기절 별
================================================== */

function createDizzyStars(
  actor
){

  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  removeDizzyStars(
    actor
  );


  const stars =
    document.createElement(
      "div"
    );


  stars.className =
    "dizzy-stars";


  stars.dataset.actor =
    actor.data.name;


  stars.innerText =
    "💫";


  stars.style.left =
    `${actor.x + 31}px`;


  stars.style.top =
    `${actor.y - 8}px`;


  playground.appendChild(
    stars
  );


  actor.dizzyStars =
    stars;

}


function removeDizzyStars(
  actor
){

  if(
    actor.dizzyStars
  ){

    actor.dizzyStars.remove();

    actor.dizzyStars =
      null;

  }

}


/* ==================================================
   충돌 효과
================================================== */

function createCollisionEffect(
  a,
  b
){

  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  const effect =
    document.createElement(
      "div"
    );


  effect.className =
    "play-effect";


  effect.innerText =
    "💥";


  effect.style.left =
    `${
      (
        a.x +
        b.x
      ) / 2 + 31
    }px`;


  effect.style.top =
    `${
      (
        a.y +
        b.y
      ) / 2 + 30
    }px`;


  playground.appendChild(
    effect
  );


  setTimeout(
    () => effect.remove(),
    800
  );

}


/* ==================================================
   놀이터 효과
================================================== */

function createPlayEffect(
  actor,
  emoji
){

  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  const effect =
    document.createElement(
      "div"
    );


  effect.className =
    "play-effect";


  effect.innerText =
    emoji;


  effect.style.left =
    `${actor.x + 31}px`;


  effect.style.top =
    `${actor.y + 20}px`;


  playground.appendChild(
    effect
  );


  setTimeout(
    () => effect.remove(),
    850
  );

}


/* ==================================================
   놀이터 기절 중 별 위치 보정
================================================== */

function updateDizzyStars(){

  playgroundPotatoes.forEach(
    actor => {

      if(
        actor.stunned &&
        actor.dizzyStars
      ){

        actor.dizzyStars.style.left =
          `${actor.x + 31}px`;

        actor.dizzyStars.style.top =
          `${actor.y - 8}px`;

      }

    }
  );

}
