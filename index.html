<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>감자 키우기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4efe5;color:#4b392b;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;border:0;cursor:pointer}
.app{width:100%;max-width:500px;margin:auto;min-height:100vh;background:#fffaf2}
.screen{display:none;min-height:100vh;padding:24px 16px}
.screen.active{display:block}

.start{display:flex;align-items:center;justify-content:center;text-align:center}
.start-box{width:100%;padding:30px 10px}
.big-potato{font-size:80px;animation:bob 2s ease-in-out infinite}
h1{font-size:34px;margin:10px 0 8px}
.sub{color:#8a7767;margin-bottom:28px}
.main-btn{width:100%;padding:16px;border-radius:16px;background:#7aa95c;color:white;font-weight:800;font-size:18px;box-shadow:0 5px 0 #5e8845}
.main-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5e8845}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.header h2{margin:0;font-size:22px}
.back{background:#eee4d5;padding:9px 12px;border-radius:12px}

.sticky-top{
position:sticky;
top:0;
z-index:50;
background:#fffaf2;
padding-top:8px;
padding-bottom:8px
}

.potato-card{
text-align:center;
background:#f5ead8;
border-radius:22px;
padding:14px 10px;
margin-bottom:10px;
overflow:hidden
}

.potato-wrap{
height:170px;
display:flex;
align-items:center;
justify-content:center;
position:relative
}

.potato-img{
width:145px;
height:145px;
object-fit:contain;
user-select:none;
-webkit-user-drag:none;
transition:transform .2s
}

.potato-img.jump{animation:jump .55s ease}
.potato-img.shy{animation:shy .5s ease}
.potato-img.wiggle{animation:wiggle .5s ease}
.potato-img.angry{animation:angry .5s ease}
.potato-img.happy{animation:happy .65s ease}
.potato-img.sleep{animation:sleep 1s ease}
.potato-img.sparkle{animation:sparkle .7s ease}

.message{min-height:42px;font-weight:700;color:#654b38}
.touch-hint{font-size:12px;color:#9b8877;margin-top:4px}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin:12px 0
}

.stat{background:#f3eee7;border-radius:13px;padding:10px}
.stat-top{display:flex;justify-content:space-between;font-size:13px}
.bar{height:8px;background:#ddd3c7;border-radius:9px;overflow:hidden;margin-top:6px}
.fill{height:100%;width:50%;background:#79a95c;transition:width .25s}

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px
}

.action{
padding:14px 8px;
border-radius:14px;
background:#eee6da;
font-weight:700
}

.action:active{transform:scale(.97)}
.action.primary{background:#dcebcf}
.action.danger{background:#f1ddd6}
.info{font-size:13px;color:#8b7969;text-align:center;margin:13px 0}

.growth{text-align:center}
.growth-potato{
font-size:110px;
height:230px;
display:flex;
align-items:center;
justify-content:center
}
.growth-percent{font-size:25px;font-weight:900}
.growth-bar{
height:15px;
background:#ded4c6;
border-radius:20px;
overflow:hidden;
margin:12px 0 20px
}
.growth-fill{
height:100%;
background:#76a65a;
width:0%;
transition:width .25s
}

.growth-actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.grow-btn{
padding:16px 8px;
border-radius:15px;
background:#eee5d9;
font-weight:800
}

.hatch{background:#dcebcf!important}

.collection-count{
text-align:center;
font-weight:800;
color:#786556;
margin:12px
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.card{
background:#f4eee5;
border-radius:17px;
padding:14px;
text-align:center;
min-height:175px
}

.card img{
width:105px;
height:105px;
object-fit:contain
}

.card .unknown{
font-size:72px;
height:105px;
display:flex;
align-items:center;
justify-content:center
}

.card-name{font-weight:900;margin-top:5px}
.card-sub{font-size:12px;color:#978475;margin-top:5px}

.playground{
position:relative;
height:340px;
border-radius:24px;
overflow:hidden;
margin-top:12px;
touch-action:none;
background:
radial-gradient(circle at 15% 18%,rgba(255,255,255,.7) 0 3px,transparent 4px),
radial-gradient(circle at 82% 25%,rgba(255,255,255,.6) 0 3px,transparent 4px),
linear-gradient(#bfe49b 0 38%,#91c96d 38% 100%)
}

.playground:before{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(ellipse at 12% 75%,#7eb45e 0 7%,transparent 7.5%),
radial-gradient(ellipse at 87% 65%,#78ad58 0 8%,transparent 8.5%),
radial-gradient(ellipse at 50% 92%,#79ad57 0 10%,transparent 10.5%);
opacity:.55
}

.sun{
position:absolute;
right:18px;
top:15px;
font-size:38px
}

.tree{
position:absolute;
font-size:48px;
user-select:none;
pointer-events:none
}

.tree.t1{left:8px;top:20px}
.tree.t2{right:10px;top:115px}
.tree.t3{left:34%;bottom:4px;font-size:42px}

.flower{
position:absolute;
font-size:22px;
pointer-events:none
}

.fl1{left:17%;bottom:18px}
.fl2{left:70%;bottom:38px}
.fl3{right:18%;bottom:12px}
.fl4{left:48%;top:52%}

.log{
position:absolute;
left:12px;
bottom:14px;
font-size:42px;
pointer-events:none
}

.pond{
position:absolute;
right:10px;
bottom:10px;
width:105px;
height:48px;
border-radius:50%;
background:#76c7d6;
opacity:.8;
pointer-events:none
}

.play-potato{
position:absolute;
width:64px;
height:64px;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
user-select:none;
z-index:5;
transition:filter .15s
}

.play-potato img{
width:58px;
height:58px;
object-fit:contain;
user-select:none;
-webkit-user-drag:none;
pointer-events:none
}

.play-potato.dragging{
z-index:100;
filter:drop-shadow(0 8px 5px rgba(0,0,0,.25));
transform:scale(1.18)
}

.play-potato.stunned img{animation:stun .7s infinite}

.play-name{
position:absolute;
top:-17px;
left:50%;
transform:translateX(-50%);
font-size:9px;
font-weight:800;
white-space:nowrap;
background:rgba(255,255,255,.8);
padding:2px 5px;
border-radius:6px;
pointer-events:none
}

.play-effect{
position:absolute;
z-index:20;
font-size:23px;
pointer-events:none;
animation:floatup .9s ease forwards
}

.playground-help{
text-align:center;
font-size:12px;
color:#8e7b69;
margin:8px 0
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:200
}

.modal.show{display:flex}

.modal-box{
background:#fffaf2;
border-radius:22px;
padding:24px;
max-width:380px;
width:100%;
text-align:center
}

.modal-box h3{margin-top:0}

.modal-close{
margin-top:15px;
width:100%;
padding:13px;
border-radius:13px;
background:#e9dfd2;
font-weight:800
}

@keyframes bob{
50%{transform:translateY(-8px)}
}

@keyframes jump{
50%{transform:translateY(-28px) rotate(-5deg)}
}

@keyframes shy{
50%{transform:scale(.82) translateX(8px)}
}

@keyframes wiggle{
25%{transform:rotate(-8deg)}
75%{transform:rotate(8deg)}
}

@keyframes angry{
25%{transform:translateX(-7px)}
75%{transform:translateX(7px)}
}

@keyframes happy{
50%{transform:translateY(-18px) scale(1.08)}
}

@keyframes sleep{
50%{transform:scale(.92);opacity:.7}
}

@keyframes sparkle{
50%{transform:scale(1.14) rotate(8deg)}
}

@keyframes stun{
50%{transform:rotate(20deg)}
}

@keyframes floatup{
0%{opacity:1;transform:translateY(0) scale(.8)}
100%{opacity:0;transform:translateY(-35px) scale(1.2)}
}
</style>
</head>

<body>
<div class="app">

<section id="startScreen" class="screen active start">
<div class="start-box">
<div class="big-potato">🥔</div>
<h1>감자 키우기</h1>
<div class="sub">나만의 감자를 키워보세요!</div>
<button class="main-btn" onclick="startGrowth()">감자 키우기 시작</button>
</div>
</section>

<section id="growthScreen" class="screen growth">
<div class="header">
<h2>감자를 키우는 중</h2>
</div>

<div class="growth-potato" id="growthEmoji">🌱</div>

<div class="growth-percent" id="growthPercent">0%</div>

<div class="growth-bar">
<div class="growth-fill" id="growthFill"></div>
</div>

<div class="growth-actions">
<button class="grow-btn" onclick="grow(12)">🌱 비료 +12</button>
<button class="grow-btn" onclick="grow(10)">💧 물주기 +10</button>
<button class="grow-btn" onclick="grow(8)">☀️ 햇빛 +8</button>
<button class="grow-btn" onclick="grow(5)">💗 응원하기 +5</button>
<button class="grow-btn hatch" onclick="hatch()">🥔 감자 탄생!</button>
</div>
</section>

<section id="gameScreen" class="screen">

<div class="sticky-top">

<div class="header">
<h2 id="gameTitle">🥔 감자</h2>
<button class="back" onclick="showScreen('startScreen')">처음으로</button>
</div>

<div class="potato-card">
<div class="potato-wrap">
<img id="potatoImg" class="potato-img" src="" alt="감자">
</div>

<div class="message" id="message">안녕!</div>
<div class="touch-hint">감자를 톡 눌러보세요</div>
</div>

</div>

<div class="stats">

<div class="stat">
<div class="stat-top">
<span>🍎 배고픔</span>
<b id="hungerText">100</b>
</div>
<div class="bar">
<div id="hungerFill" class="fill"></div>
</div>
</div>

<div class="stat">
<div class="stat-top">
<span>💧 수분</span>
<b id="waterText">100</b>
</div>
<div class="bar">
<div id="waterFill" class="fill"></div>
</div>
</div>

<div class="stat">
<div class="stat-top">
<span>💗 사랑</span>
<b id="loveText">100</b>
</div>
<div class="bar">
<div id="loveFill" class="fill"></div>
</div>
</div>

<div class="stat">
<div class="stat-top">
<span>⚡ 에너지</span>
<b id="energyText">100</b>
</div>
<div class="bar">
<div id="energyFill" class="fill"></div>
</div>
</div>

</div>

<div class="actions">
<button class="action primary" onclick="doAction('feed')">🍎 먹이 주기</button>
<button class="action" onclick="doAction('water')">💧 물 주기</button>
<button class="action primary" onclick="doAction('pet')">🖐️ 쓰다듬기</button>
<button class="action" onclick="doAction('walk')">🏃 산책하기</button>
<button class="action danger" onclick="harvest()">🥔 수확하기</button>
<button class="action" onclick="showCollection()">📖 도감 보기</button>
</div>

<div class="info">
10초마다 배고픔·수분·에너지가 조금씩 줄어들어요.
</div>

</section>

<section id="collectionScreen" class="screen">

<div class="header">
<h2>📖 감자 도감</h2>
<button class="back" onclick="showScreen('gameScreen')">돌아가기</button>
</div>

<div class="collection-count" id="collectionCount">
발견한 감자 0 / 5
</div>

<div class="cards" id="cards"></div>

<h2 style="margin-top:28px">🌱 감자 놀이터</h2>

<div class="playground" id="playground">

<div class="sun">☀️</div>

<div class="tree t1">🌳</div>
<div class="tree t2">🌳</div>
<div class="tree t3">🌲</div>

<div class="flower fl1">🌼</div>
<div class="flower fl2">🌷</div>
<div class="flower fl3">🌻</div>
<div class="flower fl4">🌸</div>

<div class="log">🪵</div>
<div class="pond"></div>

</div>

<div class="playground-help">
감자를 꾸욱 누르면 들어서 원하는 곳으로 옮길 수 있어요.
</div>

</section>

<div id="modal" class="modal">

<div class="modal-box">
<h3 id="modalTitle">감자</h3>
<p id="modalText"></p>
<button class="modal-close" onclick="closeModal()">닫기</button>
</div>

</div>

</div>

<script>

const potatoes=[
{name:"꾼감자",file:"Potato1.PNG",style:"social"},
{name:"대장감자",file:"Potato2.PNG",style:"leader"},
{name:"독감자",file:"Potato3.PNG",style:"poison"},
{name:"폭력감자",file:"Potato4.PNG",style:"violent"},
{name:"저능감자",file:"Potato5.PNG",style:"silly"}
];

const personalities=[
"애교쟁이",
"느긋한",
"장난꾸러기",
"호기심 많은",
"겁이 많은"
];

const dialogue={
feed:{
"애교쟁이":"냠냠! 역시 최고야!",
"느긋한":"천천히 먹을게.",
"장난꾸러기":"이거 내가 먹어도 되는 거야?",
"호기심 많은":"오? 이건 무슨 맛이지?",
"겁이 많은":"조금만... 조심해서 줘."
},

water:{
"애교쟁이":"물이다! 시원해!",
"느긋한":"촉촉해서 좋네.",
"장난꾸러기":"물장난 해도 돼?",
"호기심 많은":"물이 어디서 오는 거야?",
"겁이 많은":"차갑지는 않지?"
},

pet:{
"애교쟁이":"더 쓰다듬어줘!",
"느긋한":"음... 편안하네.",
"장난꾸러기":"잡았다!",
"호기심 많은":"손가락 신기하다.",
"겁이 많은":"살살 만져줘..."
},

walk:{
"애교쟁이":"같이 가자!",
"느긋한":"천천히 걷자.",
"장난꾸러기":"누가 더 빠른지 보자!",
"호기심 많은":"저쪽에 뭐가 있어!",
"겁이 많은":"너무 멀리는 가지 마..."
},

hungry:{
"애교쟁이":"배고파아...",
"느긋한":"슬슬 뭐 좀 먹을까.",
"장난꾸러기":"먹을 거 내놔!",
"호기심 많은":"뭔가 맛있는 냄새가 나.",
"겁이 많은":"혹시 먹을 거 있어?"
},

thirsty:{
"애교쟁이":"목말라!",
"느긋한":"물이 있으면 좋겠네.",
"장난꾸러기":"물 한 컵!",
"호기심 많은":"물이 필요해.",
"겁이 많은":"목이 좀 말라..."
},

tired:{
"애교쟁이":"조금 쉬었다가 놀자.",
"느긋한":"낮잠이나 잘까.",
"장난꾸러기":"잠깐만... 충전 중.",
"호기심 많은":"눈이 자꾸 감기네.",
"겁이 많은":"쉬고 싶어..."
}
};

let state={
growth:0,
character:null,
personality:null,
hunger:100,
water:100,
love:100,
energy:100,
collection:[],
collectionData:{}
};

try{
const saved=JSON.parse(localStorage.getItem("POTATO_GAME_FINAL_V4"));

if(saved){
state={
...state,
...saved,
collectionData:saved.collectionData||{}
};
}
}catch(e){}

let touchTimer=null;
let touching=false;

function save(){
localStorage.setItem(
"POTATO_GAME_FINAL_V4",
JSON.stringify(state)
);
}

function showScreen(id){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

if(id==="collectionScreen"){
renderCollection();
}
}

function startGrowth(){

state.growth=0;

updateGrowth();

showScreen("growthScreen");
}

function grow(amount){

if(state.growth>=100)return;

state.growth=Math.min(
100,
state.growth+amount
);

updateGrowth();
}

function updateGrowth(){

const g=state.growth;

document.getElementById("growthPercent")
.textContent=g+"%";

document.getElementById("growthFill")
.style.width=g+"%";

document.getElementById("growthEmoji")
.textContent=
g<25?"🌱":
g<50?"🌿":
g<75?"🌳":
g<100?"🥔":
"🥔";
}

function hatch(){

if(state.growth<100){

state.growth=Math.min(
100,
state.growth+5
);

updateGrowth();

return;
}

state.character=
potatoes[
Math.floor(
Math.random()*potatoes.length
)
];

state.personality=
personalities[
Math.floor(
Math.random()*personalities.length
)
];

state.hunger=100;
state.water=100;
state.love=100;
state.energy=100;

document.getElementById("gameTitle")
.textContent="🥔 "+state.character.name;

document.getElementById("potatoImg")
.src=state.character.file;

setMessage(
"안녕! 나는 "+
state.personality+" "+
state.character.name+"야!"
);

updateStats();

showScreen("gameScreen");

save();
}

function setMessage(text){
document.getElementById("message")
.textContent=text;
}

function doAction(type){

const img=document.getElementById("potatoImg");

if(type==="feed"){
state.hunger=Math.min(
100,
state.hunger+22
);
react("happy");
}

if(type==="water"){
state.water=Math.min(
100,
state.water+22
);
react("sparkle");
}

if(type==="pet"){
state.love=Math.min(
100,
state.love+10
);
react("heart");
}

if(type==="walk"){

if(state.energy<12){

setMessage(
dialogue.tired[state.personality]
);

react("sleep");

return;
}

state.energy=Math.max(
0,
state.energy-12
);

react("jump");
}

if(dialogue[type]?.[state.personality]){
setMessage(
dialogue[type][state.personality]
);
}

updateStats();

save();
}

function react(type){

const img=document.getElementById("potatoImg");

img.classList.remove(
"jump",
"shy",
"wiggle",
"angry",
"happy",
"sleep",
"sparkle"
);

void img.offsetWidth;

img.classList.add(type);

if(type==="heart"){
showEffect("💗",img);
}

if(type==="sparkle"){
showEffect("✨",img);
}
}

function showEffect(txt,target){

const r=target.getBoundingClientRect();

const e=document.createElement("div");

e.className="play-effect";
e.textContent=txt;

e.style.position="fixed";
e.style.left=(r.left+r.width/2)+"px";
e.style.top=r.top+"px";

document.body.appendChild(e);

setTimeout(
()=>e.remove(),
900
);
}

function updateStats(){

const vals={
hunger:state.hunger,
water:state.water,
love:state.love,
energy:state.energy
};

for(const k in vals){

document.getElementById(k+"Text")
.textContent=vals[k];

document.getElementById(k+"Fill")
.style.width=vals[k]+"%";
}

if(state.hunger<=25){

setMessage(
dialogue.hungry[state.personality]
);

}else if(state.water<=25){

setMessage(
dialogue.thirsty[state.personality]
);

}else if(state.energy<=20){

setMessage(
dialogue.tired[state.personality]
);
}
}

setInterval(()=>{

if(!state.character)return;

state.hunger=
Math.max(0,state.hunger-3);

state.water=
Math.max(0,state.water-3);

state.energy=
Math.max(0,state.energy-2);

updateStats();

save();

},10000);

function harvest(){

if(!state.character)return;

const n=state.character.name;

if(!state.collection.includes(n)){
state.collection.push(n);
}

if(!state.collectionData[n]){

state.collectionData[n]={
personality:state.personality
};

}

save();

showModal(
"🥔 수확 완료",
n+"을(를) 도감에 등록했어요!"
);
}

function showCollection(){
showScreen("collectionScreen");
}

function renderCollection(){

document.getElementById("collectionCount")
.textContent=
"발견한 감자 "+
state.collection.length+
" / 5";

const cards=
document.getElementById("cards");

cards.innerHTML="";

potatoes.forEach(p=>{

const found=
state.collection.includes(p.name);

const c=
document.createElement("div");

c.className="card";

if(found){

const personality=
state.collectionData?.[p.name]?.personality||
"성격 미상";

c.innerHTML=`
<img src="${p.file}" alt="${p.name}">
<div class="card-name">${p.name}</div>
<div class="card-sub">
발견 완료 ✓<br>
${personality}
</div>
`;

}else{

c.innerHTML=`
<div class="unknown">❓</div>
<div class="card-name">???</div>
<div class="card-sub">
아직 발견하지 못했어요
</div>
`;
}

cards.appendChild(c);

});

buildPlayground();
}

let actors=[];
let playLoop=null;

function buildPlayground(){

const area=
document.getElementById("playground");

area
.querySelectorAll(".play-potato")
.forEach(e=>e.remove());

actors=[];

state.collection.forEach((name,i)=>{

const p=
potatoes.find(
x=>x.name===name
);

if(p){
createPlayPotato(
p,
i,
area
);
}

});

if(!playLoop){
playLoop=
requestAnimationFrame(playTick);
}
}

function createPlayPotato(p,i,area){

const el=
document.createElement("div");

el.className="play-potato";

el.innerHTML=`
<span class="play-name">${p.name}</span>
<img src="${p.file}" alt="${p.name}">
`;

area.appendChild(el);

const personality=
state.collectionData?.[p.name]?.personality||
personalities[i%personalities.length];

const actor={

el,
p,

x:40+
Math.random()*
Math.max(
40,
area.clientWidth-100
),

y:80+
Math.random()*
Math.max(
80,
area.clientHeight-145
),

vx:0,
vy:0,

behavior:"wander",

until:
performance.now()+
1000+
Math.random()*2000,

target:null,

stunned:0,

lastCollision:0,

dragging:false,

personality,

lastEffect:0

};

actors.push(actor);

setupDrag(actor,area);

positionActor(actor);
}

function positionActor(a){

a.el.style.left=
a.x+"px";

a.el.style.top=
a.y+"px";
}

function chooseBehavior(a,now){

const r=Math.random();

const p=a.p.style;

a.target=null;

if(
a.personality==="겁이 많은" &&
r<.32
){

a.behavior="avoid";

a.until=
now+
1200+
Math.random()*1400;

}

else if(
a.personality==="애교쟁이" &&
r<.38
){

a.behavior="social";

a.until=
now+
1300+
Math.random()*1500;

}

else if(
a.personality==="느긋한" &&
r<.48
){

a.behavior="idle";

a.until=
now+
1300+
Math.random()*2500;

}

else if(
a.personality==="장난꾸러기" &&
r<.4
){

a.behavior="play";

a.until=
now+
1000+
Math.random()*1300;

}

else if(
a.personality==="호기심 많은" &&
r<.45
){

a.behavior="explore";

a.until=
now+
1300+
Math.random()*1700;

}

else if(
p==="social"
){

a.behavior="social";

a.until=
now+
1200+
Math.random()*1700;

}

else if(
p==="leader"
){

a.behavior="center";

a.until=
now+
1500+
Math.random()*2500;

}

else if(
p==="poison" &&
r<.12
){

a.behavior="rareChase";

a.until=
now+
700+
Math.random()*900;

}

else if(
p==="violent" &&
r<.18
){

a.behavior="rareChase";

a.until=
now+
700+
Math.random()*1000;

}

else if(
p==="silly"
){

a.behavior="silly";

a.until=
now+
700+
Math.random()*1600;

}

else{

a.behavior="wander";

a.until=
now+
1200+
Math.random()*2000;
}
}

function nearest(a){

let best=null;
let bd=9999;

actors.forEach(b=>{

if(
b===a||
b.dragging
)return;

const d=
Math.hypot(
a.x-b.x,
a.y-b.y
);

if(d<bd){

bd=d;
best=b;
}
});

return best;
}

function playTick(now){

const area=
document.getElementById("playground");

if(
!area||
!document
.getElementById("collectionScreen")
.classList.contains("active")
){

playLoop=null;

return;
}

const w=area.clientWidth;
const h=area.clientHeight;

actors.forEach(a=>{

if(a.dragging)return;

if(a.stunned>now){

a.el.classList.add("stunned");

return;

}

a.el.classList.remove("stunned");

if(now>a.until){

chooseBehavior(a,now);
}

let speed=
a.p.style==="violent"?.85:
a.p.style==="poison"?.55:
a.p.style==="leader"?.35:
.48;

if(
a.personality==="느긋한"
){
speed*=.62;
}

if(
a.personality==="겁이 많은"
){
speed*=.8;
}

if(a.behavior==="idle"){

a.vx*=.86;
a.vy*=.86;

}

else if(a.behavior==="center"){

const tx=w/2-32;
const ty=h/2-32;

a.vx+=(tx-a.x)*.004;
a.vy+=(ty-a.y)*.004;

}

else if(
a.behavior==="social"||
a.behavior==="play"
){

const t=nearest(a);

if(t){

const dx=t.x-a.x;
const dy=t.y-a.y;
const d=Math.hypot(dx,dy)||1;

if(d>75){

a.vx+=
dx/d*.035;

a.vy+=
dy/d*.035;

}else{

a.vx*=.92;
a.vy*=.92;

}

}

}

else if(
a.behavior==="rareChase"
){

const t=nearest(a);

if(t){

const dx=t.x-a.x;
const dy=t.y-a.y;
const d=Math.hypot(dx,dy)||1;

a.vx+=
dx/d*.055;

a.vy+=
dy/d*.055;
}

}

else if(
a.behavior==="avoid"
){

const t=nearest(a);

if(t){

const dx=a.x-t.x;
const dy=a.y-t.y;

const d=
Math.hypot(dx,dy)||1;

if(d<150){

a.vx+=
dx/d*.07;

a.vy+=
dy/d*.07;

}else{

a.vx+=
Math.cos(
now/900+iSeed(a)
)*.02;

a.vy+=
Math.sin(
now/900+iSeed(a)
)*.02;
}

}

}

else if(
a.behavior==="explore"
){

a.vx+=
Math.cos(
now/850+iSeed(a)
)*.025;

a.vy+=
Math.sin(
now/700+iSeed(a)
)*.025;

}

else if(
a.behavior==="silly"
){

a.vx+=
Math.cos(
now/330+iSeed(a)
)*.055;

a.vy+=
Math.sin(
now/410+iSeed(a)
)*.055;

}

else{

a.vx+=
Math.cos(
now/1100+iSeed(a)
)*.025;

a.vy+=
Math.sin(
now/900+iSeed(a)
)*.025;
}

const mag=
Math.hypot(
a.vx,
a.vy
);

if(mag>speed){

a.vx=
a.vx/mag*speed;

a.vy=
a.vy/mag*speed;
}

a.x+=a.vx;
a.y+=a.vy;

if(a.x<4){

a.x=4;
a.vx=Math.abs(a.vx);
}

if(a.y<20){

a.y=20;
a.vy=Math.abs(a.vy);
}

if(a.x>w-68){

a.x=w-68;
a.vx=-Math.abs(a.vx);
}

if(a.y>h-70){

a.y=h-70;
a.vy=-Math.abs(a.vy);
}

positionActor(a);

maybePersonalityAction(a,now);

});

for(
let i=0;
i<actors.length;
i++
){

for(
let j=i+1;
j<actors.length;
j++
){

const a=actors[i];
const b=actors[j];

if(
a.dragging||
b.dragging||
a.stunned>now||
b.stunned>now
)continue;

const d=
Math.hypot(
a.x-b.x,
a.y-b.y
);

if(
d<48 &&
now-a.lastCollision>5500 &&
now-b.lastCollision>5500
){

if(Math.random()<.08){

a.lastCollision=now;
b.lastCollision=now;

collision(a,b,now);
}

}

}

}

playLoop=
requestAnimationFrame(playTick);
}

function iSeed(a){

return a.p.name.length*17+
(actors.indexOf(a)+1)*31;
}

function maybePersonalityAction(a,now){

if(now%1000>25)return;

if(now-a.lastEffect<1800)return;

const r=Math.random();

if(
a.personality==="애교쟁이" &&
r<.08
){

a.lastEffect=now;
effectAt(a,"💗");

}

else if(
a.personality==="장난꾸러기" &&
r<.1
){

a.lastEffect=now;
effectAt(a,"✨");
smallJump(a);

}

else if(
a.personality==="느긋한" &&
r<.06
){

a.lastEffect=now;
effectAt(a,"💤");

}

else if(
a.personality==="호기심 많은" &&
r<.08
){

a.lastEffect=now;
effectAt(a,"❔");

}

else if(
a.personality==="겁이 많은" &&
r<.07
){

a.lastEffect=now;
effectAt(a,"😳");

}
}

function smallJump(a){

a.el.animate(
[
{transform:"translateY(0)"},
{transform:"translateY(-16px)"},
{transform:"translateY(0)"}
],
{
duration:500
}
);
}

function effectAt(a,txt){

const e=
document.createElement("div");

e.className="play-effect";
e.textContent=txt;

e.style.left=
(a.x+25)+"px";

e.style.top=
(a.y-8)+"px";

document
.getElementById("playground")
.appendChild(e);

setTimeout(
()=>e.remove(),
900
);
}

function collision(a,b,now){

if(Math.random()<.7){

effectAt(a,"✨");
effectAt(b,"💗");

smallJump(a);
smallJump(b);

return;
}

if(
a.p.style==="poison"||
b.p.style==="poison"
){

const victim=
a.p.style==="poison"
?b:a;

if(Math.random()<.3){

victim.stunned=
now+1500;

effectAt(victim,"😵");

}else{

effectAt(a,"💢");
effectAt(b,"😳");
}

}else{

effectAt(a,"💢");
effectAt(b,"💢");

if(Math.random()<.35){
smallJump(a);
}

if(Math.random()<.35){
smallJump(b);
}

}
}

function setupDrag(a,area){

let startX=0;
let startY=0;
let moved=false;
let pointerId=null;

a.el.addEventListener(
"pointerdown",
e=>{

if(
e.pointerType==="mouse"&&
e.button!==0
)return;

pointerId=e.pointerId;

startX=e.clientX;
startY=e.clientY;

moved=false;
touching=true;

clearTimeout(touchTimer);

touchTimer=setTimeout(()=>{

if(!touching)return;

a.dragging=true;

a.el.classList.add("dragging");

if(a.el.setPointerCapture){
a.el.setPointerCapture(pointerId);
}

effectAt(a,"✋");

},450);

}
);

a.el.addEventListener(
"pointermove",
e=>{

if(
pointerId!==e.pointerId
)return;

if(!a.dragging){

if(
Math.hypot(
e.clientX-startX,
e.clientY-startY
)>8
){

moved=true;

clearTimeout(touchTimer);
}

return;
}

const rect=
area.getBoundingClientRect();

a.x=Math.max(
0,
Math.min(
rect.width-68,
e.clientX-
rect.left-
32
)
);

a.y=Math.max(
15,
Math.min(
rect.height-68,
e.clientY-
rect.top-
32
)
);

positionActor(a);

}
);

function end(e){

if(
pointerId!==e.pointerId
)return;

touching=false;

clearTimeout(touchTimer);

if(a.dragging){

a.dragging=false;

a.el.classList.remove("dragging");

effectAt(a,"✨");

}else if(!moved){

if(
a.personality==="애교쟁이"
){

effectAt(a,"💗");

}else if(
a.personality==="겁이 많은"
){

effectAt(a,"😳");

}else if(
a.personality==="장난꾸러기"
){

effectAt(a,"😝");

}else if(
a.personality==="느긋한"
){

effectAt(a,"💤");

}else{

effectAt(a,"❔");

}

}

pointerId=null;
}

a.el.addEventListener(
"pointerup",
end
);

a.el.addEventListener(
"pointercancel",
end
);
}

function showModal(title,text){

document.getElementById("modalTitle")
.textContent=title;

document.getElementById("modalText")
.textContent=text;

document.getElementById("modal")
.classList.add("show");
}

function closeModal(){

document.getElementById("modal")
.classList.remove("show");
}

updateGrowth();

</script>
</body>
</html>
