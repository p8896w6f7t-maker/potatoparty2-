<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>감자 키우기</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:#f5ead8;
  color:#4b3525;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

body{
  min-height:100vh;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

.hidden{
  display:none !important;
}

.screen{
  width:100%;
  max-width:500px;
  min-height:100vh;
  margin:0 auto;
  background:#fffaf2;
}


/* ==================================================
   시작 화면
================================================== */

#startScreen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}

.start-potato{
  font-size:80px;
  margin-bottom:20px;
}

.start-title{
  font-size:40px;
  font-weight:1000;
  margin-bottom:8px;
}

.start-subtitle{
  font-size:14px;
  color:#806b58;
  margin-bottom:28px;
}

.start-button{
  width:240px;
  padding:16px;
  border-radius:17px;
  background:#d79b55;
  color:white;
  font-size:17px;
  font-weight:900;
  box-shadow:0 4px 0 #b87838;
}

.start-button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #b87838;
}


/* ==================================================
   게임 화면
================================================== */

#gameScreen{
  padding-bottom:30px;
}

.sticky-top{
  position:sticky;
  top:0;
  z-index:50;
  background:#fffaf2;
  box-shadow:0 3px 12px rgba(80,50,20,.08);
}

.header{
  padding:15px 16px 8px;
  text-align:center;
}

.header-title{
  font-size:23px;
  font-weight:1000;
}

.header-subtitle{
  margin-top:4px;
  color:#806b58;
  font-size:11px;
}


/* ==================================================
   감자
================================================== */

#potatoWrap{
  width:100%;
  height:190px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:visible;
}

#potatoImage{
  width:150px;
  max-width:55%;
  height:auto;
  object-fit:contain;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  position:relative;
  z-index:3;
}


/* ==================================================
   메시지
================================================== */

.message{
  width:calc(100% - 32px);
  margin:0 16px 12px;
  padding:11px 14px;
  min-height:52px;
  border-radius:15px;
  background:#fff0c9;
  border:2px solid #ead7ae;
  color:#4b3525;
  text-align:center;
  font-size:13px;
  font-weight:800;
  line-height:1.6;
  position:relative;
  z-index:10;
  box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.birth-line{
  display:block;
}


/* ==================================================
   감자 터치 반응
================================================== */

.potato-jump{
  animation:potatoJump .55s ease;
}

@keyframes potatoJump{
  0%{transform:translateY(0) scale(1);}
  35%{transform:translateY(-45px) scale(1.05);}
  65%{transform:translateY(-20px) scale(.98);}
  100%{transform:translateY(0) scale(1);}
}

.potato-shy{
  animation:potatoShy .7s ease;
}

@keyframes potatoShy{
  0%,100%{transform:rotate(0);}
  20%{transform:rotate(-8deg) translateX(-4px);}
  40%{transform:rotate(8deg) translateX(4px);}
  60%{transform:rotate(-5deg);}
  80%{transform:rotate(5deg);}
}

.potato-wiggle{
  animation:potatoWiggle .55s ease;
}

@keyframes potatoWiggle{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-18px) rotate(-5deg);}
  50%{transform:translateX(18px) rotate(5deg);}
  75%{transform:translateX(-10px);}
}

.potato-angry{
  animation:potatoAngry .5s ease;
}

@keyframes potatoAngry{
  0%,100%{transform:scale(1);}
  25%{transform:scale(1.08) rotate(-4deg);}
  50%{transform:scale(1.08) rotate(4deg);}
  75%{transform:scale(1.05);}
}

.potato-happy{
  animation:potatoHappy .65s ease;
}

@keyframes potatoHappy{
  0%,100%{transform:rotate(0) scale(1);}
  25%{transform:rotate(-12deg) scale(1.08);}
  50%{transform:rotate(12deg) scale(1.08);}
  75%{transform:rotate(-8deg) scale(1.04);}
}

.potato-sleep{
  animation:potatoSleep 1s ease;
}

@keyframes potatoSleep{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(10px) scale(.96);}
}


/* ==================================================
   하트
================================================== */

.touch-heart{
  position:absolute;
  font-size:28px;
  pointer-events:none;
  animation:heartFloat 1s ease forwards;
  z-index:20;
}

@keyframes heartFloat{
  0%{
    opacity:1;
    transform:translateY(0) scale(.7);
  }
  100%{
    opacity:0;
    transform:translateY(-80px) scale(1.3);
  }
}


/* ==================================================
   반짝이
================================================== */

.touch-sparkle{
  position:absolute;
  pointer-events:none;
  font-size:24px;
  animation:sparkleFloat .8s ease forwards;
  z-index:20;
}

@keyframes sparkleFloat{
  0%{
    opacity:1;
    transform:scale(.5) rotate(0);
  }
  100%{
    opacity:0;
    transform:scale(1.5) rotate(180deg) translateY(-35px);
  }
}


/* ==================================================
   스탯
================================================== */

.info{
  padding:8px 16px 0;
}

.potato-name{
  text-align:center;
  font-size:24px;
  font-weight:1000;
  margin:4px 0 5px;
}

.personality{
  text-align:center;
  color:#806b58;
  font-size:12px;
  font-weight:800;
  margin-bottom:16px;
}

.stat{
  margin-bottom:12px;
}

.stat-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
  font-size:12px;
  font-weight:800;
}

.stat-bar{
  width:100%;
  height:12px;
  background:#eadcc6;
  border-radius:20px;
  overflow:hidden;
}

.stat-fill{
  height:100%;
  width:0%;
  border-radius:20px;
  transition:width .3s ease;
}


/* ==================================================
   버튼
================================================== */

.action-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:20px 16px 24px;
}

.action-button{
  min-height:56px;
  padding:12px 8px;
  border-radius:15px;
  background:#eadcc6;
  color:#4b3525;
  font-size:14px;
  font-weight:900;
  line-height:1.3;
  box-shadow:0 3px 0 #d1bea3;
}

.action-button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #d1bea3;
}

.action-button.harvest{
  background:#d79b55;
  color:white;
  box-shadow:0 3px 0 #b87838;
}


/* ==================================================
   성장 화면
================================================== */

.egg-scene{
  width:100%;
  height:270px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:20px;
  position:relative;
}

.soil{
  position:absolute;
  width:250px;
  height:55px;
  background:#9a704e;
  border-radius:50%;
  bottom:20px;
}

.growth-emoji{
  position:relative;
  z-index:2;
  font-size:80px;
  line-height:1;
  animation:sproutBounce 2s ease-in-out infinite;
}

@keyframes sproutBounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

.growth-info{
  text-align:center;
  padding:0 20px;
}

.growth-title{
  font-size:21px;
  font-weight:1000;
  margin-bottom:8px;
}

.growth-percent{
  font-size:14px;
  color:#806b58;
  margin-bottom:10px;
}

.progress{
  width:100%;
  height:18px;
  background:#eadcc6;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#d79b55;
  border-radius:20px;
  transition:width .3s;
}


/* ==================================================
   산책
================================================== */

.walking{
  animation:walking .9s ease-in-out;
}

@keyframes walking{
  0%{
    transform:translateX(0) rotate(0) scale(1);
  }
  20%{
    transform:translateX(-55px) rotate(-6deg) scale(1.04);
  }
  40%{
    transform:translateX(0) rotate(3deg) scale(.97);
  }
  60%{
    transform:translateX(55px) rotate(6deg) scale(1.04);
  }
  80%{
    transform:translateX(20px) rotate(-3deg) scale(.98);
  }
  100%{
    transform:translateX(0) rotate(0) scale(1);
  }
}

.walk-effect{
  position:absolute;
  font-size:28px;
  animation:walkEffect 1s ease forwards;
  pointer-events:none;
  z-index:10;
}

@keyframes walkEffect{
  0%{
    opacity:1;
    transform:translateY(0) scale(.8);
  }
  50%{
    opacity:1;
    transform:translateY(-15px) scale(1);
  }
  100%{
    opacity:0;
    transform:translateY(-35px) scale(.7);
  }
}


/* ==================================================
   도감
================================================== */

.collection-header{
  padding:20px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back-button{
  background:#eadcc6;
  color:#4b3525;
  padding:10px 14px;
  border-radius:12px;
  font-size:13px;
  font-weight:900;
}

.collection-title{
  font-size:23px;
  font-weight:1000;
}


/* ==================================================
   감자 놀이터 제목
================================================== */

.playground-title{
  text-align:center;
  font-size:18px;
  font-weight:1000;
  margin:0 0 7px;
}

.playground-subtitle{
  text-align:center;
  color:#806b58;
  font-size:11px;
  font-weight:700;
  margin-bottom:12px;
}


/* ==================================================
   감자 놀이터
   완전 픽셀 LCD / 다마고치 스타일
================================================== */

.playground{

  width:calc(100% - 24px);
  height:330px;
  margin:0 12px 18px;

  position:relative;
  overflow:hidden;

  background:#aebc78;

  border:8px solid #34382a;
  border-radius:4px;

  box-shadow:
    inset 0 0 0 4px #5a6240,
    inset 0 0 0 7px #7e8958,
    0 6px 0 #25271d;

  image-rendering:pixelated;

  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-user-drag:none;

  -webkit-tap-highlight-color:transparent;

  touch-action:none;

  background-image:
    linear-gradient(
      rgba(45,52,31,.08) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(45,52,31,.08) 1px,
      transparent 1px
    );

  background-size:4px 4px;
}


/* ==================================================
   LCD 스캔라인
================================================== */

.playground::before{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:40;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(45,52,31,.12) 0px,
      rgba(45,52,31,.12) 2px,
      transparent 2px,
      transparent 4px
    );

}


/* ==================================================
   LCD 바닥
================================================== */

.playground::after{

  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:105px;

  pointer-events:none;

  z-index:2;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(58,68,38,.13) 0px,
      rgba(58,68,38,.13) 4px,
      transparent 4px,
      transparent 8px
    );

}


/* ==================================================
   놀이터 빈 화면
================================================== */

.playground-empty{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:30px;

  color:#3f472c;

  font-family:"Courier New",monospace;

  font-size:12px;

  font-weight:900;

  line-height:1.9;

  letter-spacing:0;

  z-index:50;

  user-select:none;

  -webkit-user-select:none;

}


/* ==================================================
   놀이터 감자
================================================== */

.play-potato{

  position:absolute;

  width:48px;
  height:48px;

  object-fit:contain;

  z-index:10;

  image-rendering:pixelated;
  image-rendering:crisp-edges;

  user-select:none;

  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-user-drag:none;

  pointer-events:auto;

  cursor:grab;

  touch-action:none;

  transition:
    left .35s steps(4,end),
    top .35s steps(4,end);

}


/* ==================================================
   감자를 잡고 있는 동안
================================================== */

.play-potato.dragging{

  cursor:grabbing;

  z-index:25;

  transition:none;

  filter:
    brightness(.82)
    contrast(1.15);

}


/* ==================================================
   감자 이름
================================================== */

.play-potato-name{

  position:absolute;

  z-index:20;

  transform:translateX(-50%);

  padding:3px 5px;

  background:#aebc78;

  border:2px solid #3f472c;

  color:#303822;

  font-family:"Courier New",monospace;

  font-size:7px;

  font-weight:900;

  line-height:1;

  white-space:nowrap;

  pointer-events:none;

  user-select:none;

  -webkit-user-select:none;

  box-shadow:
    2px 2px 0 #5d6742;

}


/* ==================================================
   놀이터 행동
================================================== */

.play-jump{
  animation:playJump .65s ease;
}

@keyframes playJump{
  0%,100%{
    transform:translateY(0);
  }
  45%{
    transform:translateY(-28px) rotate(-5deg);
  }
  70%{
    transform:translateY(-10px) rotate(5deg);
  }
}

.play-shy{
  animation:playShy .9s ease;
}

@keyframes playShy{
  0%,100%{
    transform:rotate(0) scale(1);
  }
  30%{
    transform:rotate(-8deg) scale(.9);
  }
  60%{
    transform:rotate(8deg) scale(.9);
  }
}

.play-spin{
  animation:playSpin .7s ease;
}

@keyframes playSpin{
  from{
    transform:rotate(0);
  }
  to{
    transform:rotate(360deg);
  }
}

.play-angry{
  animation:playAngry .45s ease;
}

@keyframes playAngry{
  0%,100%{
    transform:scale(1);
  }
  30%{
    transform:scale(1.15) rotate(-5deg);
  }
  60%{
    transform:scale(1.15) rotate(5deg);
  }
}

.play-stun{
  animation:playStun 1.4s ease;
}

@keyframes playStun{
  0%{transform:rotate(0);}
  20%{transform:rotate(-20deg);}
  40%{transform:rotate(20deg);}
  60%{transform:rotate(-12deg);}
  80%{transform:rotate(12deg);}
  100%{transform:rotate(0);}
}


/* ==================================================
   놀이터 터치
================================================== */

.play-touch{
  animation:playTouch .55s ease;
}

@keyframes playTouch{
  0%,100%{
    transform:scale(1) rotate(0);
  }
  25%{
    transform:scale(1.15) rotate(-7deg);
  }
  50%{
    transform:scale(1.08) rotate(7deg);
  }
  75%{
    transform:scale(1.12) rotate(-4deg);
  }
}


/* ==================================================
   놀이터 효과
================================================== */

.play-effect{

  position:absolute;

  z-index:30;

  pointer-events:none;

  font-size:25px;

  transform:translate(-50%,-50%);

  animation:playEffect .8s steps(4,end) forwards;

  user-select:none;

  -webkit-user-select:none;

  font-family:"Courier New",monospace;

  font-weight:900;

}

@keyframes playEffect{
  0%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.5);
  }
  50%{
    opacity:1;
    transform:translate(-50%,-70%) scale(1.2);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-110%) scale(.9);
  }
}


/* ==================================================
   발견 숫자
================================================== */

.collection-count{

  text-align:center;

  margin:0 16px 18px;

  padding:12px;

  background:#fff0c9;

  border-radius:14px;

  font-size:14px;

  font-weight:900;

}


/* ==================================================
   도감 카드
================================================== */

.collection-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

  padding:0 16px 30px;

}

.collection-card{

  min-height:210px;

  background:#fff;

  border:2px solid #eadcc6;

  border-radius:18px;

  padding:14px 10px;

  text-align:center;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

}

.collection-card img{

  width:115px;
  height:115px;

  object-fit:contain;

}

.collection-question{

  font-size:65px;

  height:115px;

  display:flex;

  justify-content:center;
  align-items:center;

}

.collection-name{

  font-size:15px;

  font-weight:1000;

  margin-top:6px;

}

.collection-status{

  margin-top:5px;

  font-size:11px;

  color:#806b58;

  line-height:1.4;

}


/* ==================================================
   모달
================================================== */

.modal{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.4);

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;

}

.modal-box{

  width:100%;

  max-width:360px;

  background:#fffaf2;

  border-radius:22px;

  padding:25px 20px;

  text-align:center;

  box-shadow:0 10px 30px rgba(0,0,0,.2);

}

.modal-title{

  font-size:21px;

  font-weight:1000;

  margin-bottom:12px;

}

.modal-text{

  font-size:14px;

  line-height:1.7;

  color:#806b58;

  margin-bottom:20px;

}

.modal-button{

  width:100%;

  padding:14px;

  border-radius:14px;

  background:#d79b55;

  color:white;

  font-size:14px;

  font-weight:900;

}

</style>
</head>


<body>


<!-- ==================================================
     시작
================================================== -->

<section id="startScreen" class="screen">

  <div class="start-potato">
    🥔
  </div>

  <div class="start-title">
    감자 키우기
  </div>

  <div class="start-subtitle">
    나만의 감자를 키워보세요!
  </div>

  <button
    class="start-button"
    onclick="startGame()">
    감자 키우기 시작
  </button>

</section>


<!-- ==================================================
     성장
================================================== -->

<section
  id="beforeScreen"
  class="screen hidden">

  <div class="header">

    <div class="header-title">
      감자 키우기
    </div>

    <div class="header-subtitle">
      작은 싹을 잘 키워주세요
    </div>

  </div>


  <div class="egg-scene">

    <div class="soil"></div>

    <div
      id="growthEmoji"
      class="growth-emoji">
      🌱
    </div>

  </div>


  <div class="growth-info">

    <div class="growth-title">
      감자가 자라고 있어요!
    </div>

    <div
      id="growthPercent"
      class="growth-percent">
      성장도 0%
    </div>

    <div class="progress">

      <div
        id="growthBar"
        class="progress-bar">
      </div>

    </div>

  </div>


  <div
    id="beforeMessage"
    class="message">
    감자에게 사랑을 주세요!
  </div>


  <div class="action-buttons">

    <button
      class="action-button"
      onclick="addGrowth(12)">
      🌱 비료 주기
    </button>

    <button
      class="action-button"
      onclick="addGrowth(10)">
      💧 물 주기
    </button>

    <button
      class="action-button"
      onclick="addGrowth(8)">
      ☀️ 햇빛 쬐기
    </button>

    <button
      class="action-button"
      onclick="addGrowth(5)">
      💕 응원하기
    </button>

  </div>

</section>


<!-- ==================================================
     게임
================================================== -->

<section
  id="gameScreen"
  class="screen hidden">


  <div class="sticky-top">

    <div class="header">

      <div class="header-title">
        나의 감자
      </div>

      <div class="header-subtitle">
        감자와 함께 즐거운 하루!
      </div>

    </div>


    <div id="potatoWrap">

      <img
        id="potatoImage"
        src=""
        alt="감자"
        onclick="potatoTouch()">

    </div>


    <div
      id="message"
      class="message">

      <div
        id="messageLine1"
        class="birth-line">
        감자가 태어났어요!
      </div>

      <div
        id="messageLine2"
        class="birth-line">

<script>


/* ==================================================
   감자 데이터
================================================== */

const potatoes = [

  {
    name:"꾼감자",
    image:"Potato1.PNG",
    style:"social"
  },

  {
    name:"대장감자",
    image:"Potato2.PNG",
    style:"leader"
  },

  {
    name:"독감자",
    image:"Potato3.PNG",
    style:"poison"
  },

  {
    name:"폭력감자",
    image:"Potato4.PNG",
    style:"violent"
  },

  {
    name:"저능감자",
    image:"Potato5.PNG",
    style:"silly"
  }

];


const personalities = [

  "애교쟁이",
  "느긋한",
  "장난꾸러기",
  "호기심 많은",
  "겁이 많은"

];


const STORAGE_KEY =
  "POTATO_GAME_FINAL_V4";


/* ==================================================
   게임 상태
================================================== */

let state = {

  started:false,

  born:false,

  growth:0,

  character:null,

  personality:null,

  hunger:100,

  water:100,

  love:50,

  energy:100,

  collection:[]

};


/* ==================================================
   놀이터
================================================== */

let playgroundTimer = null;

let playgroundPotatoes = [];


/* ==================================================
   저장
================================================== */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* ==================================================
   불러오기
================================================== */

function load(){

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(!saved){
    return;
  }

  try{

    const parsed =
      JSON.parse(saved);

    state = {
      ...state,
      ...parsed
    };

    if(
      !Array.isArray(
        state.collection
      )
    ){

      state.collection = [];

    }

  }
  catch(error){

    console.log(
      "저장 데이터 불러오기 실패"
    );

  }

}


/* ==================================================
   화면
================================================== */

function hideAllScreens(){

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("beforeScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.add("hidden");

  document
    .getElementById("collectionScreen")
    .classList.add("hidden");

}


function startGame(){

  state.started = true;

  save();

  showBeforeScreen();

}


function showBeforeScreen(){

  hideAllScreens();

  document
    .getElementById("beforeScreen")
    .classList.remove("hidden");

  updateGrowth();

}


function showGameScreen(){

  hideAllScreens();

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  updateCharacter();

  updateStats();

}


function showCollection(){

  hideAllScreens();

  document
    .getElementById("collectionScreen")
    .classList.remove("hidden");

  renderCollection();

}


function backToGame(){

  stopPlayground();

  showGameScreen();

}


/* ==================================================
   성장
================================================== */

function addGrowth(amount){

  if(state.born){
    return;
  }

  state.growth += amount;

  if(state.growth > 100){
    state.growth = 100;
  }

  save();

  updateGrowth();


  const messages = [

    "조금씩 자라고 있어요!",
    "감자가 힘을 내고 있어요!",
    "쑥쑥 자라는 중이에요!",
    "조금만 더 힘내요!",
    "땅속에서 무언가 움직여요..."

  ];


  document
    .getElementById("beforeMessage")
    .innerText =

      messages[
        Math.floor(
          Math.random() *
          messages.length
        )
      ];


  if(
    state.growth >= 100
  ){

    setTimeout(
      hatchPotato,
      500
    );

  }

}


function updateGrowth(){

  const percent =
    state.growth;


  document
    .getElementById("growthPercent")
    .innerText =

      `성장도 ${percent}%`;


  document
    .getElementById("growthBar")
    .style.width =

      `${percent}%`;


  const emoji =
    document.getElementById(
      "growthEmoji"
    );


  if(percent < 25){

    emoji.innerText =
      "🌱";

  }
  else if(percent < 50){

    emoji.innerText =
      "🌿";

  }
  else if(percent < 75){

    emoji.innerText =
      "🌳";

  }
  else{

    emoji.innerText =
      "🥔";

  }

}


/* ==================================================
   감자 탄생
================================================== */

function hatchPotato(){

  if(state.born){
    return;
  }


  const character =

    potatoes[
      Math.floor(
        Math.random() *
        potatoes.length
      )
    ];


  const personality =

    personalities[
      Math.floor(
        Math.random() *
        personalities.length
      )
    ];


  state.born = true;

  state.character =
    character;

  state.personality =
    personality;

  state.hunger = 100;
  state.water = 100;
  state.love = 50;
  state.energy = 100;


  save();

  showGameScreen();


  document
    .getElementById("messageLine1")
    .innerText =

      `🥔 ${character.name}가 태어났어요!`;


  document
    .getElementById("messageLine2")
    .innerText =

      `성격은 ${personality}이에요!`;

}


/* ==================================================
   감자 정보
================================================== */

function updateCharacter(){

  if(!state.character){
    return;
  }


  const image =
    document.getElementById(
      "potatoImage"
    );


  image.src =
    state.character.image;


  image.alt =
    state.character.name;


  document
    .getElementById("potatoName")
    .innerText =

      state.character.name;


  document
    .getElementById("personality")
    .innerText =

      `성격 · ${state.personality}`;

}


/* ==================================================
   메시지
================================================== */

function showMessage(type){

  const line1 =
    document.getElementById(
      "messageLine1"
    );

  const line2 =
    document.getElementById(
      "messageLine2"
    );


  const messages = {

    feed:[
      "냠냠! 맛있어요!",
      "더 먹고 싶어요!",
      "이거 정말 맛있어요!",
      "밥 먹으니까 힘이 나요!"
    ],

    water:[
      "꿀꺽꿀꺽! 시원해요!",
      "물이 맛있어요!",
      "촉촉해졌어요!",
      "살 것 같아요!"
    ],

    pet:[
      "쓰다듬어 주니까 좋아요!",
      "헤헤... 기분 좋아요.",
      "조금 더 쓰다듬어 주세요!",
      "따뜻해요..."
    ],

    walk:[
      "산책 가요!",
      "밖에 나오니까 좋아요!",
      "같이 걸어요!",
      "오늘 날씨 좋다!"
    ],

    hungry:[
      "배고파요...",
      "뭔가 먹고 싶어요...",
      "배에서 꼬르륵 소리가 나요..."
    ],

    thirsty:[
      "목말라요...",
      "물을 마시고 싶어요...",
      "촉촉하게 해주세요..."
    ],

    tired:[
      "조금 피곤해요...",
      "잠깐 쉬고 싶어요...",
      "힘이 없어요..."
    ]

  };


  const list =
    messages[type];


  if(!list){
    return;
  }


  line1.innerText =

    list[
      Math.floor(
        Math.random() *
        list.length
      )
    ];


  line2.innerText = "";

}


/* ==================================================
   먹이
================================================== */

function feed(){

  if(!state.born){
    return;
  }


  state.hunger += 25;

  state.hunger =
    Math.min(
      100,
      state.hunger
    );


  state.energy += 5;

  state.energy =
    Math.min(
      100,
      state.energy
    );


  save();

  updateStats();

  showMessage("feed");

}


/* ==================================================
   물
================================================== */

function giveWater(){

  if(!state.born){
    return;
  }


  state.water += 30;

  state.water =
    Math.min(
      100,
      state.water
    );


  save();

  updateStats();

  showMessage("water");

}


/* ==================================================
   쓰다듬기
================================================== */

function pet(){

  if(!state.born){
    return;
  }


  state.love += 12;

  state.love =
    Math.min(
      100,
      state.love
    );


  state.energy -= 2;

  state.energy =
    Math.max(
      0,
      state.energy
    );


  save();

  updateStats();

  showMessage("pet");

}


/* ==================================================
   산책
================================================== */

function walk(){

  if(!state.born){
    return;
  }


  if(
    state.energy < 15
  ){

    showMessage("tired");

    return;

  }


  state.energy -= 15;
  state.love += 10;
  state.hunger -= 8;
  state.water -= 8;


  state.energy =
    Math.max(
      0,
      state.energy
    );


  state.love =
    Math.min(
      100,
      state.love
    );


  state.hunger =
    Math.max(
      0,
      state.hunger
    );


  state.water =
    Math.max(
      0,
      state.water
    );


  save();

  updateStats();

  showMessage("walk");


  const image =
    document.getElementById(
      "potatoImage"
    );


  image.classList.remove(
    "walking"
  );


  void image.offsetWidth;


  image.classList.add(
    "walking"
  );


  createWalkEffect();


  setTimeout(
    () => {

      image.classList.remove(
        "walking"
      );

    },
    1000
  );

}


function createWalkEffect(){

  const wrap =
    document.getElementById(
      "potatoWrap"
    );


  const effects = [
    "🐾",
    "🐾",
    "💨"
  ];


  for(
    let i = 0;
    i < 3;
    i++
  ){

    const effect =
      document.createElement(
        "div"
      );


    effect.className =
      "walk-effect";


    effect.innerText =
      effects[i];


    effect.style.left =
      (
        30 +
        i * 20
      ) + "%";


    effect.style.top =
      (
        55 +
        Math.random() * 10
      ) + "%";


    effect.style.animationDelay =
      (
        i * 0.12
      ) + "s";


    wrap.appendChild(
      effect
    );


    setTimeout(
      () => {

        effect.remove();

      },
      1200
    );

  }

}


/* ==================================================
   감자 터치
================================================== */

function potatoTouch(){

  if(
    !state.born ||
    !state.character
  ){

    return;

  }


  const potato =
    document.getElementById(
      "potatoImage"
    );


  const reactions = [

    "jump",
    "shy",
    "wiggle",
    "heart",
    "angry",
    "happy",
    "sleep",
    "sparkle"

  ];


  const reaction =

    reactions[
      Math.floor(
        Math.random() *
        reactions.length
      )
    ];


  potato.classList.remove(

    "potato-jump",
    "potato-shy",
    "potato-wiggle",
    "potato-angry",
    "potato-happy",
    "potato-sleep"

  );


  void potato.offsetWidth;


  if(
    reaction === "jump"
  ){

    potato.classList.add(
      "potato-jump"
    );

    showTouchMessage(
      "jump"
    );

  }


  if(
    reaction === "shy"
  ){

    potato.classList.add(
      "potato-shy"
    );

    showTouchMessage(
      "shy"
    );

  }


  if(
    reaction === "wiggle"
  ){

    potato.classList.add(
      "potato-wiggle"
    );

    showTouchMessage(
      "wiggle"
    );

  }


  if(
    reaction === "heart"
  ){

    showTouchMessage(
      "heart"
    );

    createHeart();

  }


  if(
    reaction === "angry"
  ){

    potato.classList.add(
      "potato-angry"
    );

    showTouchMessage(
      "angry"
    );

  }


  if(
    reaction === "happy"
  ){

    potato.classList.add(
      "potato-happy"
    );

    showTouchMessage(
      "happy"
    );

  }


  if(
    reaction === "sleep"
  ){

    potato.classList.add(
      "potato-sleep"
    );

    showTouchMessage(
      "sleep"
    );

  }


  if(
    reaction === "sparkle"
  ){

    showTouchMessage(
      "sparkle"
    );

    createSparkles();

  }

}


function showTouchMessage(type){

  const line1 =
    document.getElementById(
      "messageLine1"
    );

  const line2 =
    document.getElementById(
      "messageLine2"
    );


  const name =
    state.character.name;


  const messages = {

    jump:[
      `${name}가 폴짝 뛰었어요!`,
      "우와! 갑자기 뛰었어요!",
      "잡아봐라~!"
    ],

    shy:[
      `${name}가 부끄러워해요...`,
      "으... 갑자기 만지면 부끄러워요.",
      "/// 부끄러워 ///"
    ],

    wiggle:[
      `${name}가 꼬물꼬물 움직여요!`,
      "간지러워요!",
      "꼬물꼬물~"
    ],

    heart:[
      `${name}가 좋아해요!`,
      "헤헤... 좋아!",
      "하트를 보냈어요!"
    ],

    angry:[
      `${name}가 삐졌어요!`,
      "왜 자꾸 건드려!",
      "흥!"
    ],

    happy:[
      `${name}가 신났어요!`,
      "기분 최고!",
      "같이 놀아요!"
    ],

    sleep:[
      `${name}가 졸려요...`,
      "조금만 쉬어요...",
      "Zzz..."
    ],

    sparkle:[
      `${name}가 반짝반짝 빛나요!`,
      "감자 파워!",
      "반짝!"
    ]

  };


  const list =
    messages[type];


  line1.innerText =

    list[
      Math.floor(
        Math.random() *
        list.length
      )
    ];


  line2.innerText = "";

}


function createHeart(){

  const wrap =
    document.getElementById(
      "potatoWrap"
    );


  const heart =
    document.createElement(
      "div"
    );


  heart.className =
    "touch-heart";


  const hearts = [
    "❤️",
    "💕",
    "💗",
    "💖"
  ];


  heart.innerText =

    hearts[
      Math.floor(
        Math.random() *
        hearts.length
      )
    ];


  heart.style.left =

    (
      40 +
      Math.random() * 20
    ) + "%";


  heart.style.top =
    "30%";


  wrap.appendChild(
    heart
  );


  setTimeout(
    () => {

      heart.remove();

    },
    1000
  );

}


function createSparkles(){

  const wrap =
    document.getElementById(
      "potatoWrap"
    );


  for(
    let i = 0;
    i < 4;
    i++
  ){

    const sparkle =
      document.createElement(
        "div"
      );


    sparkle.className =
      "touch-sparkle";


    sparkle.innerText =
      "✨";


    sparkle.style.left =

      (
        25 +
        Math.random() * 50
      ) + "%";


    sparkle.style.top =

      (
        20 +
        Math.random() * 35
      ) + "%";


    sparkle.style.animationDelay =

      (
        i * 0.08
      ) + "s";


    wrap.appendChild(
      sparkle
    );


    setTimeout(
      () => {

        sparkle.remove();

      },
      900
    );

  }

}


/* ==================================================
   스탯
================================================== */

function updateStats(){

  if(!state.born){
    return;
  }


  document.getElementById(
    "hungerText"
  ).innerText =
    `${state.hunger} / 100`;


  document.getElementById(
    "waterText"
  ).innerText =
    `${state.water} / 100`;


  document.getElementById(
    "loveText"
  ).innerText =
    `${state.love} / 100`;


  document.getElementById(
    "energyText"
  ).innerText =
    `${state.energy} / 100`;


  document.getElementById(
    "hungerBar"
  ).style.width =
    `${state.hunger}%`;


  document.getElementById(
    "waterBar"
  ).style.width =
    `${state.water}%`;


  document.getElementById(
    "loveBar"
  ).style.width =
    `${state.love}%`;


  document.getElementById(
    "energyBar"
  ).style.width =
    `${state.energy}%`;

}


/* ==================================================
   자동 감소
================================================== */

setInterval(

  () => {

    if(!state.born){
      return;
    }


    state.hunger -= 2;
    state.water -= 2;
    state.energy -= 1;


    state.hunger =
      Math.max(
        0,
        state.hunger
      );


    state.water =
      Math.max(
        0,
        state.water
      );


    state.energy =
      Math.max(
        0,
        state.energy
      );


    save();

    updateStats();


    if(
      state.hunger <= 20
    ){

      showMessage("hungry");

    }
    else if(
      state.water <= 20
    ){

      showMessage("thirsty");

    }
    else if(
      state.energy <= 20
    ){

      showMessage("tired");

    }

  },

  10000

);


/* ==================================================
   수확
================================================== */

function harvest(){

  if(
    !state.born ||
    !state.character
  ){

    return;

  }


  const character =
    state.character;


  const isNew =

    !state.collection.includes(
      character.name
    );


  if(isNew){

    state.collection.push(
      character.name
    );

  }


  state.born = false;

  state.growth = 0;

  state.character = null;

  state.personality = null;

  state.hunger = 100;

  state.water = 100;

  state.love = 50;

  state.energy = 100;

/* ==================================================
   놀이터
   원본 PNG → 12×12 → LCD 4색 → 48×48
================================================== */

function createPixelPotato(
  src,
  callback
){

  const source =
    new Image();


  source.onload = () => {

    const small =
      document.createElement(
        "canvas"
      );


    small.width = 12;

    small.height = 12;


    const ctx =
      small.getContext(
        "2d",
        {
          willReadFrequently:true
        }
      );


    ctx.imageSmoothingEnabled =
      false;


    ctx.clearRect(
      0,
      0,
      12,
      12
    );


    ctx.drawImage(
      source,
      0,
      0,
      12,
      12
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        12,
        12
      );


    const pixels =
      imageData.data;


    for(
      let i = 0;
      i < pixels.length;
      i += 4
    ){

      const r =
        pixels[i];

      const g =
        pixels[i + 1];

      const b =
        pixels[i + 2];

      const a =
        pixels[i + 3];


      if(
        a < 30
      ){

        pixels[i + 3] =
          0;

        continue;

      }


      const brightness =
        (
          r * .299 +
          g * .587 +
          b * .114
        );


      let nr;
      let ng;
      let nb;


      if(
        brightness > 205
      ){

        nr = 174;
        ng = 188;
        nb = 120;

      }
      else if(
        brightness > 145
      ){

        nr = 126;
        ng = 140;
        nb = 82;

      }
      else if(
        brightness > 80
      ){

        nr = 82;
        ng = 94;
        nb = 55;

      }
      else{

        nr = 48;
        ng = 56;
        nb = 34;

      }


      pixels[i] =
        nr;

      pixels[i + 1] =
        ng;

      pixels[i + 2] =
        nb;

    }


    ctx.putImageData(
      imageData,
      0,
      0
    );


    const finalCanvas =
      document.createElement(
        "canvas"
      );


    finalCanvas.width =
      48;


    finalCanvas.height =
      48;


    const finalCtx =
      finalCanvas.getContext(
        "2d"
      );


    finalCtx.imageSmoothingEnabled =
      false;


    finalCtx.clearRect(
      0,
      0,
      48,
      48
    );


    finalCtx.drawImage(
      small,
      0,
      0,
      12,
      12,
      0,
      0,
      48,
      48
    );


    callback(
      finalCanvas
    );

  };


  source.onerror = () => {

    callback(
      null
    );

  };


  source.src =
    src;

}


/* ==================================================
   놀이터 시작
================================================== */

function startPlayground(){

  stopPlayground();


  const playground =
    document.getElementById(
      "playground"
    );


  const empty =
    document.getElementById(
      "playgroundEmpty"
    );


  playgroundPotatoes = [];


  if(
    state.collection.length === 0
  ){

    empty.classList.remove(
      "hidden"
    );

    return;

  }


  empty.classList.add(
    "hidden"
  );


  /* -----------------------------------------
     놀이터 터치 / 복사 / 붙여넣기 방지
  ----------------------------------------- */

  playground.onselectstart =
    () => false;

  playground.oncopy =
    () => false;

  playground.oncut =
    () => false;

  playground.onpaste =
    () => false;

  playground.oncontextmenu =
    () => false;

  playground.ondragstart =
    () => false;


  playground.addEventListener(
    "touchstart",
    function(e){

      if(
        e.target === playground ||
        e.target.closest(".play-potato")
      ){

        e.stopPropagation();

      }

    },
    {
      passive:true
    }
  );


  /* -----------------------------------------
     감자 생성
  ----------------------------------------- */

  state.collection.forEach(

    (name,index) => {

      const potato =
        potatoes.find(
          p => p.name === name
        );


      if(!potato){
        return;
      }


      createPlayPotato(
        potato,
        index
      );

    }

  );


  playgroundTimer =
    setInterval(
      playgroundTick,
      650
    );

}


/* ==================================================
   놀이터 정지
================================================== */

function stopPlayground(){

  if(playgroundTimer){

    clearInterval(
      playgroundTimer
    );

    playgroundTimer =
      null;

  }


  playgroundPotatoes = [];


  const playground =
    document.getElementById(
      "playground"
    );


  if(playground){

    const actors =
      playground.querySelectorAll(

        ".play-potato, " +
        ".play-potato-name, " +
        ".play-effect"

      );


    actors.forEach(
      el => el.remove()
    );

  }

}


/* ==================================================
   놀이터 감자 생성
================================================== */

function createPlayPotato(
  potato,
  index
){

  const playground =
    document.getElementById(
      "playground"
    );


  /* -----------------------------------------
     실제 화면에는 캔버스 픽셀 감자를 사용
  ----------------------------------------- */

  const img =
    document.createElement(
      "canvas"
    );


  img.className =
    "play-potato";


  img.width =
    48;


  img.height =
    48;


  img.setAttribute(
    "aria-label",
    potato.name
  );


  img.setAttribute(
    "role",
    "img"
  );


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "play-potato-name";


  name.innerText =
    potato.name;


  playground.appendChild(
    img
  );


  playground.appendChild(
    name
  );


  const width =
    playground.clientWidth;


  const height =
    playground.clientHeight;


  const actor = {

    data:potato,

    img:img,

    label:name,

    x:
      20 +
      Math.random() *
      Math.max(
        50,
        width - 85
      ),

    y:
      55 +
      Math.random() *
      Math.max(
        80,
        height - 135
      ),

    vx:
      (
        Math.random() * 2 - 1
      ) * 1.5,

    vy:
      (
        Math.random() * 2 - 1
      ) * 1.5,

    target:null,

    stunned:false,

    lastCollision:0,

    actionCooldown:
      500 +
      Math.random() *
      1500,

    pressing:false,

    dragging:false,

    longPressTimer:null,

    suppressClick:false

  };


  /* ==================================================
     픽셀 감자 생성
  ================================================== */

  createPixelPotato(
    potato.image,
    canvas => {

      if(!canvas){
        return;
      }


      const ctx =
        img.getContext(
          "2d"
        );


      ctx.imageSmoothingEnabled =
        false;


      ctx.clearRect(
        0,
        0,
        48,
        48
      );


      ctx.drawImage(
        canvas,
        0,
        0,
        48,
        48
      );

    }
  );


  /* ==================================================
     감자 클릭
  ================================================== */

  img.addEventListener(
    "click",
    function(e){

      e.preventDefault();

      e.stopPropagation();


      if(
        actor.suppressClick
      ){

        actor.suppressClick =
          false;

        return;

      }


      playPotatoTouch(
        actor
      );

    }
  );


  /* ==================================================
     감자 꾹 누르기
  ================================================== */

  img.addEventListener(
    "pointerdown",
    function(e){

      if(
        actor.stunned
      ){

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      actor.pressing =
        true;


      actor.longPressTimer =

        setTimeout(
          () => {

            if(
              !actor.pressing
            ){

              return;

            }


            actor.dragging =
              true;


            actor.suppressClick =
              true;


            img.classList.add(
              "dragging"
            );


            try{

              img.setPointerCapture(
                e.pointerId
              );

            }
            catch(error){}

          },

          450

        );

    }
  );


  /* ==================================================
     감자 이동
  ================================================== */

  img.addEventListener(
    "pointermove",
    function(e){

      if(
        !actor.dragging
      ){

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      const rect =
        playground.getBoundingClientRect();


      actor.x =
        e.clientX -
        rect.left -
        24;


      actor.y =
        e.clientY -
        rect.top -
        24;


      keepInside(
        actor
      );


      updateActorPosition(
        actor
      );

    }
  );


  /* ==================================================
     손가락 떼기
  ================================================== */

  function releasePotato(e){

    actor.pressing =
      false;


    if(
      actor.longPressTimer
    ){

      clearTimeout(
        actor.longPressTimer
      );

      actor.longPressTimer =
        null;

    }


    if(
      actor.dragging
    ){

      actor.dragging =
        false;


      img.classList.remove(
        "dragging"
      );


      try{

        img.releasePointerCapture(
          e.pointerId
        );

      }
      catch(error){}


      updateActorPosition(
        actor
      );

    }

  }


  img.addEventListener(
    "pointerup",
    releasePotato
  );


  img.addEventListener(
    "pointercancel",
    releasePotato
  );


  img.addEventListener(
    "dragstart",
    function(e){

      e.preventDefault();

    }
  );


  playgroundPotatoes.push(
    actor
  );


  updateActorPosition(
    actor
  );

}


/* ==================================================
   놀이터 감자 터치 반응
================================================== */

function playPotatoTouch(
  actor
){

  if(
    !actor ||
    actor.stunned ||
    actor.dragging
  ){

    return;

  }


  actor.lastCollision =
    Date.now();


  actor.img.classList.remove(
    "play-touch",
    "play-jump",
    "play-shy",
    "play-spin",
    "play-angry"
  );


  void actor.img.offsetWidth;


  actor.img.classList.add(
    "play-touch"
  );


  const style =
    actor.data.style;


  let actions = [];


  if(
    style === "social"
  ){

    actions = [
      "♥",
      "+",
      "*"
    ];

  }
  else if(
    style === "leader"
  ){

    actions = [
      "*",
      "!",
      "+"
    ];

  }
  else if(
    style === "poison"
  ){

    actions = [
      "X",
      "!",
      "@"
    ];

  }
  else if(
    style === "violent"
  ){

    actions = [
      "!",
      "X",
      "*"
    ];

  }
  else{

    actions = [
      "?",
      "*",
      "!"
    ];

  }


  const effect =
    actions[
      Math.floor(
        Math.random() *
        actions.length
      )
    ];


  createPlayEffect(
    actor,
    effect
  );


  if(
    style === "social"
  ){

    playActorAnimation(
      actor,
      "heart"
    );

  }
  else if(
    style === "leader"
  ){

    playActorAnimation(
      actor,
      "spin"
    );

  }
  else if(
    style === "poison"
  ){

    playActorAnimation(
      actor,
      "angry"
    );

  }
  else if(
    style === "violent"
  ){

    playActorAnimation(
      actor,
      "angry"
    );

  }
  else{

    playActorAnimation(
      actor,
      "jump"
    );

  }

}


/* ==================================================
   위치 업데이트
================================================== */

function updateActorPosition(
  actor
){

  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  const maxX =
    playground.clientWidth - 53;


  const maxY =
    playground.clientHeight - 76;


  actor.x =
    Math.max(
      5,
      Math.min(
        maxX,
        actor.x
      )
    );


  actor.y =
    Math.max(
      25,
      Math.min(
        maxY,
        actor.y
      )
    );


  actor.img.style.left =
    `${actor.x}px`;


  actor.img.style.top =
    `${actor.y}px`;


  actor.label.style.left =
    `${actor.x + 24}px`;


  actor.label.style.top =
    `${actor.y + 48}px`;

}


/* ==================================================
   놀이터 AI
================================================== */

function playgroundTick(){

  const playground =
    document.getElementById(
      "playground"
    );


  if(
    !playground ||
    playground.classList.contains(
      "hidden"
    )
  ){

    return;

  }


  playgroundPotatoes.forEach(

    actor => {

      if(
        actor.stunned ||
        actor.dragging
      ){

        updateActorPosition(
          actor
        );

        return;

      }


      const style =
        actor.data.style;


      /* -----------------------------------------
         꾼감자
      ----------------------------------------- */

      if(
        style === "social"
      ){

        const target =
          getNearestOther(
            actor
          );


        if(target){

          moveToward(
            actor,
            target.x,
            target.y,
            .8
          );

        }


        randomAction(
          actor,
          [
            "jump",
            "heart"
          ],
          .025
        );

      }


      /* -----------------------------------------
         대장감자
      ----------------------------------------- */

      else if(
        style === "leader"
      ){

        const centerX =
          playground.clientWidth / 2;


        const centerY =
          playground.clientHeight / 2;


        moveToward(
          actor,
          centerX - 24,
          centerY - 24,
          .45
        );


        randomAction(
          actor,
          [
            "jump",
            "spin"
          ],
          .015
        );

      }


      /* -----------------------------------------
         독감자
      ----------------------------------------- */

      else if(
        style === "poison"
      ){

        actor.x +=
          actor.vx;

        actor.y +=
          actor.vy;


        if(
          Math.random() < .035
        ){

          actor.vx =
            (
              Math.random() * 2 - 1
            ) * 1.5;

          actor.vy =
            (
              Math.random() * 2 - 1
            ) * 1.5;

        }


        randomAction(
          actor,
          [
            "angry"
          ],
          .025
        );

      }


      /* -----------------------------------------
         폭력감자
      ----------------------------------------- */

      else if(
        style === "violent"
      ){

        const target =
          getNearestOther(
            actor
          );


        if(target){

          moveToward(
            actor,
            target.x,
            target.y,
            1.8
          );

        }


        randomAction(
          actor,
          [
            "angry",
            "jump"
          ],
          .035
        );

      }


      /* -----------------------------------------
         저능감자
      ----------------------------------------- */

      else if(
        style === "silly"
      ){

        actor.x +=
          actor.vx;

        actor.y +=
          actor.vy;


        if(
          Math.random() < .025
        ){

          actor.vx =
            (
              Math.random() * 2 - 1
            ) * 2;

          actor.vy =
            (
              Math.random() * 2 - 1
            ) * 2;

        }


        randomAction(
          actor,
          [
            "spin",
            "jump"
          ],
          .02
        );

      }


      keepInside(
        actor
      );


      updateActorPosition(
        actor
      );

    }

  );


  checkPlaygroundCollisions();

}


/* ==================================================
   다른 감자 찾기
================================================== */

function getNearestOther(
  actor
){

  let nearest = null;

  let distance = Infinity;


  playgroundPotatoes.forEach(

    other => {

      if(
        other === actor ||
        other.stunned ||
        other.dragging
      ){

        return;

      }


      const dx =
        other.x -
        actor.x;


      const dy =
        other.y -
        actor.y;


      const d =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if(
        d < distance
      ){

        distance = d;

        nearest = other;

      }

    }

  );


  return nearest;

}


/* ==================================================
   목표를 향해 이동
================================================== */

function moveToward(
  actor,
  tx,
  ty,
  speed
){

  const dx =
    tx -
    actor.x;


  const dy =
    ty -
    actor.y;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if(
    distance < 5
  ){

    return;

  }


  actor.x +=
    dx / distance *
    speed;


  actor.y +=
    dy / distance *
    speed;

}


/* ==================================================
   화면 밖 방지
================================================== */

function keepInside(
  actor
){

  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  const maxX =
    playground.clientWidth - 53;


  const maxY =
    playground.clientHeight - 76;


  if(
    actor.x <= 5 ||
    actor.x >= maxX
  ){

    actor.vx *= -1;

  }


  if(
    actor.y <= 25 ||
    actor.y >= maxY
  ){

    actor.vy *= -1;

  }


  actor.x =
    Math.max(
      5,
      Math.min(
        maxX,
        actor.x
      )
    );


  actor.y =
    Math.max(
      25,
      Math.min(
        maxY,
        actor.y
      )
    );

}


/* ==================================================
   랜덤 행동
================================================== */

function randomAction(
  actor,
  actions,
  chance
){

  if(
    Math.random() > chance
  ){

    return;

  }


  const action =
    actions[
      Math.floor(
        Math.random() *
        actions.length
      )
    ];


  playActorAnimation(
    actor,
    action
  );

}


/* ==================================================
   감자 행동 애니메이션
================================================== */

function playActorAnimation(
  actor,
  action
){

  if(
    actor.dragging
  ){

    return;

  }


  actor.img.classList.remove(

    "play-jump",
    "play-shy",
    "play-spin",
    "play-angry"

  );


  void actor.img.offsetWidth;


  if(
    action === "jump"
  ){

    actor.img.classList.add(
      "play-jump"
    );

  }


  if(
    action === "shy"
  ){

    actor.img.classList.add(
      "play-shy"
    );

  }


  if(
    action === "spin"
  ){

    actor.img.classList.add(
      "play-spin"
    );

  }


  if(
    action === "angry"
  ){

    actor.img.classList.add(
      "play-angry"
    );

  }


  if(
    action === "heart"
  ){

    createPlayEffect(
      actor,
      "♥"
    );

  }

}


/* ==================================================
   감자 충돌
================================================== */

function checkPlaygroundCollisions(){

  const now =
    Date.now();


  for(
    let i = 0;
    i < playgroundPotatoes.length;
    i++
  ){

    for(
      let j = i + 1;
      j < playgroundPotatoes.length;
      j++
    ){

      const a =
        playgroundPotatoes[i];


      const b =
        playgroundPotatoes[j];


      if(
        a.stunned ||
        b.stunned ||
        a.dragging ||
        b.dragging
      ){

        continue;

      }


      const dx =
        b.x -
        a.x;


      const dy =
        b.y -
        a.y;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if(
        distance < 43
      ){

        if(
          now - a.lastCollision < 1200 ||
          now - b.lastCollision < 1200
        ){

          continue;

        }


        a.lastCollision =
          now;

        b.lastCollision =
          now;


        const angle =
          Math.atan2(
            dy,
            dx
          );


        a.x -=
          Math.cos(angle) *
          10;


        a.y -=
          Math.sin(angle) *
          10;


        b.x +=
          Math.cos(angle) *
          10;


        b.y +=
          Math.sin(angle) *
          10;


        createCollisionEffect(
          a,
          b
        );


        /* -----------------------------------------
           독감자 충돌
        ----------------------------------------- */

        if(
          a.data.style === "poison" &&
          b.data.style !== "poison"
        ){

          if(
            Math.random() < 0.3
          ){

            stunPotato(
              b,
              a
            );

          }
          else{

            playActorAnimation(
              a,
              "angry"
            );

            playActorAnimation(
              b,
              "shy"
            );

          }

        }
        else if(
          b.data.style === "poison" &&
          a.data.style !== "poison"
        ){

          if(
            Math.random() < 0.3
          ){

            stunPotato(
              a,
              b
            );

          }
          else{

            playActorAnimation(
              b,
              "angry"
            );

            playActorAnimation(
              a,
              "shy"
            );

          }

        }
        else if(
          a.data.style === "violent" &&
          b.data.style !== "violent"
        ){

          playActorAnimation(
            a,
            "angry"
          );

          playActorAnimation(
            b,
            "shy"
          );

        }
        else if(
          b.data.style === "violent" &&
          a.data.style !== "violent"
        ){

          playActorAnimation(
            b,
            "angry"
          );

          playActorAnimation(
            a,
            "shy"
          );

        }
        else{

          playActorAnimation(
            a,
            "jump"
          );

          playActorAnimation(
            b,
            "jump"
          );

        }

      }

    }

  }

}


/* ==================================================
   독감자 공격
================================================== */

function stunPotato(
  victim,
  attacker
){

  victim.stunned = true;


  victim.img.classList.remove(
    "play-stun"
  );


  void victim.img.offsetWidth;


  victim.img.classList.add(
    "play-stun"
  );


  createPlayEffect(
    victim,
    "X"
  );


  createPlayEffect(
    victim,
    "?"
  );


  playActorAnimation(
    attacker,
    "angry"
  );


  setTimeout(

    () => {

      victim.stunned = false;

      victim.img.classList.remove(
        "play-stun"
      );


      createPlayEffect(
        victim,
        "*"
      );

    },

    1500

  );

}


/* ==================================================
   충돌 효과
================================================== */

function createCollisionEffect(
  a,
  b
){

  const x =
    (
      a.x +
      b.x
    ) / 2;


  const y =
    (
      a.y +
      b.y
    ) / 2;


  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  const effect =
    document.createElement(
      "div"
    );


  effect.className =
    "play-effect";


  effect.innerText =
    "X";


  effect.style.left =
    `${x + 24}px`;


  effect.style.top =
    `${y + 24}px`;


  playground.appendChild(
    effect
  );


  setTimeout(
    () => {

      effect.remove();

    },
    800
  );

}


/* ==================================================
   놀이터 효과
================================================== */

function createPlayEffect(
  actor,
  symbol
){

  const playground =
    document.getElementById(
      "playground"
    );


  if(!playground){
    return;
  }


  const effect =
    document.createElement(
      "div"
    );


  effect.className =
    "play-effect";


  effect.innerText =
    symbol;


  effect.style.left =
    `${actor.x + 24}px`;


  effect.style.top =
    `${actor.y + 16}px`;


  playground.appendChild(
    effect
  );


  setTimeout(
    () => {

      effect.remove();

    },
    850
  );

}


/* ==================================================
   모달
================================================== */

function openModal(
  title,
  text
){

  document
    .getElementById(
      "modalTitle"
    )
    .innerHTML =
      title;


  document
    .getElementById(
      "modalText"
    )
    .innerHTML =
      text;


  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "hidden"
    );

}


function closeModal(){

  document
    .getElementById(
      "modal"
    )
    .classList.add(
      "hidden"
    );

}


/* ==================================================
   초기 실행
================================================== */

load();


if(
  state.born
){

  showGameScreen();

}
else if(
  state.started
){

  showBeforeScreen();

}
else{

  hideAllScreens();

  document
    .getElementById(
      "startScreen"
    )
    .classList.remove(
      "hidden"
    );

}
