<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>감자키우기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
  background:#f5ead8;
  color:#49372a;
  user-select:none;
  -webkit-user-select:none;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

.hidden{
  display:none !important;
}

/* =========================================
   공통 화면
========================================= */

.screen{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* =========================================
   시작 화면
========================================= */

#startScreen{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%, #fff8eb 0%, #f5ead8 65%);
}

.startBox{
  text-align:center;
  width:90%;
  max-width:420px;
}

.startPotato{
  font-size:72px;
  margin-bottom:12px;
  animation:
    potatoFloat 2s ease-in-out infinite;
}

@keyframes potatoFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-8px);
  }
}

.gameTitle{
  font-size:32px;
  font-weight:900;
  margin-bottom:35px;
}

.startButton{
  width:180px;
  padding:16px 20px;
  border-radius:18px;
  background:#8fbd62;
  color:white;
  font-size:20px;
  font-weight:900;
  box-shadow:0 5px 0 #6f9948;
}

.startButton:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #6f9948;
}

/* =========================================
   감자 탄생 화면
========================================= */

#birthScreen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#f5ead8;
}

.birthText{
  font-size:22px;
  font-weight:800;
  margin-bottom:25px;
}

.growingPotato{
  position:relative;
  width:180px;
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.growthEmoji{
  font-size:110px;
  animation:growing 1.2s ease-in-out infinite;
}

@keyframes growing{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.08);
  }
}

.growthPercent{
  font-size:22px;
  font-weight:900;
  margin-top:15px;
}

.growthBar{
  width:280px;
  height:18px;
  border-radius:20px;
  background:#dfcfb7;
  overflow:hidden;
  margin-top:12px;
}

.growthFill{
  height:100%;
  width:0%;
  background:#7eaa52;
  border-radius:20px;
  transition:width .3s ease;
}

.growthActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  width:300px;
  margin-top:30px;
}

.growthAction{
  padding:13px 5px;
  border-radius:15px;
  background:#fffaf2;
  color:#4c3b2e;
  font-size:15px;
  font-weight:800;
  box-shadow:0 3px 0 #d7c5a9;
}

.growthAction:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #d7c5a9;
}

/* =========================================
   키우기 화면
========================================= */

#raiseScreen{
  background:#f5ead8;
}

.raiseLayout{
  position:relative;
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  padding-bottom:250px;
}

/* 고정 상단 */

.raiseHeader{
  position:sticky;
  top:0;
  z-index:20;
  background:#f5ead8;
  padding:13px 18px 8px;
  text-align:center;
}

.myPotato{
  font-size:22px;
  font-weight:900;
}

.dayText{
  font-size:13px;
  margin-top:4px;
  color:#806d5b;
}

.headerLine{
  height:1px;
  background:#d8c7ae;
  margin-top:10px;
}

/* 감자 카드 */

.potatoArea{
  padding:10px 18px 0;
}

.potatoCard{
  background:#fffaf2;
  border-radius:22px;
  padding:15px;
  box-shadow:0 4px 12px rgba(80,55,30,.08);
}

.potatoImageArea{
  position:relative;
  height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:18px;
  background:#eee1ca;
}

.potatoImage{
  width:175px;
  height:175px;
  object-fit:contain;
  image-rendering:auto;
  pointer-events:none;
  transition:
    transform .25s ease,
    filter .25s ease;
}

.potatoImage.jump{
  animation:jump .6s ease;
}

@keyframes jump{
  0%{transform:translateY(0) rotate(0deg);}
  30%{transform:translateY(-35px) rotate(-8deg);}
  60%{transform:translateY(-15px) rotate(8deg);}
  100%{transform:translateY(0) rotate(0deg);}
}

.potatoImage.run{
  animation:run .8s ease-in-out infinite;
}

@keyframes run{
  0%,100%{
    transform:translateX(-7px) rotate(-5deg);
  }
  50%{
    transform:translateX(7px) rotate(5deg);
  }
}

.potatoImage.spin{
  animation:spin .7s ease;
}

@keyframes spin{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}

.emotion{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:34px;
  opacity:0;
  pointer-events:none;
}

.emotion.show{
  animation:emotion .9s ease forwards;
}

@keyframes emotion{
  0%{
    opacity:0;
    transform:translate(-50%,10px) scale(.7);
  }
  25%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translate(-50%,-40px) scale(1.15);
  }
}

/* 메세지 */

.messageBox{
  margin-top:12px;
  min-height:68px;
  padding:13px 15px;
  border-radius:15px;
  background:#f2e7d5;
  font-size:14px;
  line-height:1.5;
  font-weight:700;
}

/* 이름/성격 */

.infoBox{
  margin-top:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4px;
}

.potatoName{
  font-size:21px;
  font-weight:900;
}

.potatoStyle{
  font-size:13px;
  color:#806d5b;
}

/* =========================================
   스탯
========================================= */

.sectionTitle{
  margin:18px 18px 9px;
  font-size:16px;
  font-weight:900;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding:0 18px;
}

.stat{
  background:#fffaf2;
  border-radius:15px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:9px;
}

.statIcon{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#eee1ca;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
}

.statInfo{
  min-width:0;
  flex:1;
}

.statName{
  font-size:12px;
  font-weight:800;
}

.statValue{
  font-size:11px;
  color:#7c6955;
  margin-top:2px;
}

.statBar{
  height:5px;
  background:#dfd0b9;
  border-radius:10px;
  margin-top:4px;
  overflow:hidden;
}

.statFill{
  height:100%;
  width:0%;
  border-radius:10px;
  background:#8fb966;
  transition:width .3s;
}

/* =========================================
   상호작용
========================================= */

.interactions{
  padding:0 18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.interactionButton{
  min-height:55px;
  border-radius:15px;
  background:#fffaf2;
  font-size:14px;
  font-weight:900;
  color:#4e3b2b;
  box-shadow:0 3px 0 #d9c8ad;
}

.interactionButton:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #d9c8ad;
}

/* =========================================
   감자사전
========================================= */

#dictionaryScreen{
  background:#eadbc4;
}

.dictionaryLayout{
  width:100%;
  height:100%;
  overflow-y:auto;
  padding-bottom:30px;
}

.dictionaryHeader{
  position:sticky;
  top:0;
  z-index:10;
  background:#eadbc4;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.backButton{
  padding:8px 12px;
  border-radius:12px;
  background:#fffaf2;
  font-size:12px;
  font-weight:900;
}

.dictionaryTitle{
  font-size:19px;
  font-weight:900;
}

.dictionaryDay{
  font-size:12px;
  color:#786652;
}

.pixelRoom{
  position:relative;
  width:92%;
  max-width:420px;
  aspect-ratio:1/1;
  margin:12px auto;
  background:
    linear-gradient(
      to bottom,
      #d7c0a1 0 62%,
      #a47c58 62% 100%
    );
  border:7px solid #71543c;
  box-shadow:
    inset 0 0 0 3px #9b7856,
    0 5px 0 rgba(70,45,30,.15);
  overflow:hidden;
  image-rendering:pixelated;
}

/* 창문 */

.window{
  position:absolute;
  top:25px;
  left:25px;
  width:90px;
  height:65px;
  background:#9bd1e5;
  border:6px solid #76583f;
  box-shadow:inset 0 0 0 4px #d8c4a5;
}

.window:before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  width:5px;
  height:100%;
  background:#76583f;
}

.window:after{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:5px;
  background:#76583f;
}

/* 소파 */

.sofa{
  position:absolute;
  left:24px;
  bottom:38px;
  width:145px;
  height:55px;
  background:#9a6b4e;
  border:5px solid #684b39;
  border-radius:7px;
}

.sofa:before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  top:-22px;
  height:27px;
  background:#a97757;
  border:5px solid #684b39;
}

/* TV */

.tv{
  position:absolute;
  right:25px;
  top:35px;
  width:90px;
  height:65px;
  background:#302c2a;
  border:6px solid #594436;
}

.tvScreen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:#657b70;
}

.tvStand{
  position:absolute;
  bottom:-18px;
  left:25px;
  width:40px;
  height:12px;
  background:#594436;
}

/* 바닥 테이블 */

.table{
  position:absolute;
  left:50%;
  bottom:48px;
  transform:translateX(-50%);
  width:90px;
  height:15px;
  background:#704e37;
  border:4px solid #503827;
}

.table:before,
.table:after{
  content:"";
  position:absolute;
  top:11px;
  width:7px;
  height:35px;
  background:#503827;
}

.table:before{
  left:8px;
}

.table:after{
  right:8px;
}

/* =========================================
   다마고치 감자
========================================= */

.pixelPotato{
  position:absolute;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  cursor:grab;
  touch-action:none;
  z-index:5;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-user-drag:none;
}

.pixelPotato.dragging{
  cursor:grabbing;
  transform:scale(1.15);
  z-index:20;
}

.pixelPotato.boss{
  animation:bossGlow 1.3s infinite alternate;
}

@keyframes bossGlow{
  from{
    filter:drop-shadow(0 0 0 rgba(255,180,40,0));
  }
  to{
    filter:drop-shadow(0 0 7px rgba(255,180,40,.8));
  }
}

.roomEmotion{
  position:absolute;
  pointer-events:none;
  font-size:22px;
  z-index:30;
  animation:roomEmotion 1s forwards;
}

@keyframes roomEmotion{
  0%{
    opacity:1;
    transform:translateY(0) scale(.7);
  }
  100%{
    opacity:0;
    transform:translateY(-30px) scale(1.2);
  }
}

/* =========================================
   사전 하단
========================================= */

.dictionaryBottom{
  width:92%;
  max-width:420px;
  margin:15px auto 0;
  background:#fffaf2;
  border-radius:18px;
  padding:15px;
}

.dictionaryBottomTitle{
  font-size:17px;
  font-weight:900;
}

.dictionarySub{
  margin-top:4px;
  font-size:12px;
  color:#806d5b;
}

.discovered{
  margin-top:15px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.discoveredItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#f0e4d1;
  padding:9px;
  border-radius:12px;
}

.discoveredLeft{
  display:flex;
  align-items:center;
  gap:8px;
}

.miniImage{
  width:40px;
  height:40px;
  object-fit:contain;
}

.toggle{
  width:43px;
  height:24px;
  border-radius:20px;
  background:#b8a991;
  position:relative;
  transition:.2s;
}

.toggle.on{
  background:#82a95d;
}

.toggleCircle{
  position:absolute;
  top:3px;
  left:3px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:white;
  transition:.2s;
}

.toggle.on .toggleCircle{
  left:22px;
}

/* =========================================
   사전 미니게임 버튼
========================================= */

.roomActions{
  width:92%;
  max-width:420px;
  margin:12px auto 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.roomAction{
  padding:12px 4px;
  border-radius:13px;
  background:#fffaf2;
  font-size:12px;
  font-weight:900;
  box-shadow:0 3px 0 #d1bfa4;
}

.roomAction:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #d1bfa4;
}

/* =========================================
   간식 애니메이션
========================================= */

.snack{
  position:absolute;
  font-size:24px;
  z-index:40;
  pointer-events:none;
  animation:snackFall 1.2s ease forwards;
}

@keyframes snackFall{
  0%{
    top:-30px;
    opacity:0;
  }
  15%{
    opacity:1;
  }
  100%{
    top:75%;
    opacity:0;
    transform:rotate(180deg);
  }
}

/* =========================================
   잠자는 화면
========================================= */

.sleepOverlay{
  position:absolute;
  inset:0;
  background:rgba(48,40,65,.35);
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.sleepText{
  background:rgba(255,250,242,.9);
  padding:13px 20px;
  border-radius:20px;
  font-weight:900;
  font-size:18px;
}

/* =========================================
   모바일
========================================= */

@media(max-width:380px){
  .potatoImageArea{
    height:220px;
  }

  .potatoImage{
    width:150px;
    height:150px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .growthActions{
    width:280px;
  }
}
</style>
</head>

<body>

<!-- =========================================
     시작
========================================= -->

<section id="startScreen" class="screen">

  <div class="startBox">

    <div class="startPotato">🥔</div>

    <div class="gameTitle">
      감자키우기
    </div>

    <button
      class="startButton"
      onclick="startGame()">
      시작
    </button>

  </div>

</section>


<!-- =========================================
     탄생 / 성장
========================================= -->

<section
  id="birthScreen"
  class="screen hidden">

  <div class="birthText">
    감자를 키워주세요!
  </div>

  <div class="growingPotato">
    <div
      id="growthEmoji"
      class="growthEmoji">
      🌱
    </div>
  </div>

  <div
    id="growthPercent"
    class="growthPercent">
    0%
  </div>

  <div class="growthBar">
    <div
      id="growthFill"
      class="growthFill">
    </div>
  </div>

  <div class="growthActions">

    <button
      class="growthAction"
      onclick="growthAction('fertilizer')">
      🌱 비료 주기
    </button>

    <button
      class="growthAction"
      onclick="growthAction('water')">
      💧 물 주기
    </button>

    <button
      class="growthAction"
      onclick="growthAction('sun')">
      ☀️ 햇빛 쬐기
    </button>

    <button
      class="growthAction"
      onclick="growthAction('cheer')">
      💕 응원하기
    </button>

  </div>

</section>


<!-- =========================================
     키우기
========================================= -->

<section
  id="raiseScreen"
  class="screen hidden">

  <div class="raiseLayout">

    <header class="raiseHeader">

      <div class="myPotato">
        나의 감자
      </div>

      <div
        id="dayText"
        class="dayText">
        1일차
      </div>

      <div class="headerLine"></div>

    </header>


    <main class="potatoArea">

      <div class="potatoCard">

        <div class="potatoImageArea">

          <img
            id="potatoImage"
            class="potatoImage"
            src="Potato1.PNG"
            draggable="false"
            alt="감자">

          <div
            id="emotion"
            class="emotion">
          </div>

        </div>


        <div
          id="messageBox"
          class="messageBox">
          감자가 태어났어요!
        </div>


        <div class="infoBox">

          <div
            id="potatoName"
            class="potatoName">
            꾼감자
          </div>

          <div
            id="potatoStyle"
            class="potatoStyle">
            social
          </div>

        </div>

      </div>

    </main>


    <div class="sectionTitle">
      감자 상태
    </div>


    <div class="stats">

      <div class="stat">

        <div class="statIcon">
          🍖
        </div>

        <div class="statInfo">

          <div class="statName">
            배고픔
          </div>

          <div
            id="hungerValue"
            class="statValue">
            0 / 100
          </div>

          <div class="statBar">
            <div
              id="hungerFill"
              class="statFill">
            </div>
          </div>

        </div>

      </div>


      <div class="stat">

        <div class="statIcon">
          💧
        </div>

        <div class="statInfo">

          <div class="statName">
            수분
          </div>

          <div
            id="waterValue"
            class="statValue">
            0 / 100
          </div>

          <div class="statBar">
            <div
              id="waterFill"
              class="statFill">
            </div>
          </div>

        </div>

      </div>


      <div class="stat">

        <div class="statIcon">
          ❤️
        </div>

        <div class="statInfo">

          <div class="statName">
            사랑
          </div>

          <div
            id="loveValue"
            class="statValue">
            0 / 100
          </div>

          <div class="statBar">
            <div
              id="loveFill"
              class="statFill">
            </div>
          </div>

        </div>

      </div>


      <div class="stat">

        <div class="statIcon">
          ⚡
        </div>

        <div class="statInfo">

          <div class="statName">
            체력
          </div>

          <div
            id="energyValue"
            class="statValue">
            0 / 100
          </div>

          <div class="statBar">
            <div
              id="energyFill"
              class="statFill">
            </div>
          </div>

        </div>

      </div>

    </div>


    <div class="sectionTitle">
      상호작용
    </div>


    <div class="interactions">

      <button
        class="interactionButton"
        onclick="feedPotato()">
        🍖 먹이 주기
      </button>

      <button
        class="interactionButton"
        onclick="waterPotato()">
        💧 물 주기
      </button>

      <button
        class="interactionButton"
        onclick="petPotato()">
        ❤️ 쓰다듬기
      </button>

      <button
        class="interactionButton"
        onclick="walkPotato()">
        🏃 산책하기
      </button>

      <button
        class="interactionButton"
        onclick="harvestPotato()">
        🥔 수확하기
      </button>

      <button
        class="interactionButton"
        onclick="openDictionary()">
        📖 감자사전
      </button>

    </div>

  </div>

</section>


<!-- =========================================
     감자사전 / 다마고치
========================================= -->

<section
  id="dictionaryScreen"
  class="screen hidden">

  <div class="dictionaryLayout">

================================================== */

  love:0,

/* ==================================================
   화면 전환
================================================== */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.classList.add("hidden");
    });

  document
    .getElementById(id)
    .classList.remove("hidden");
}


/* ==================================================
   게임 시작
================================================== */

function startGame(){

  growth = 0;

  updateGrowth();

  showScreen("birthScreen");

}


/* ==================================================
   성장
================================================== */

function growthAction(type){

  let amount = 5;

  if(type === "fertilizer"){
    amount = 12;
  }

  if(type === "water"){
    amount = 8;
  }

  if(type === "sun"){
    amount = 7;
  }

  if(type === "cheer"){
    amount = 10;
  }

  growth += amount;

  if(growth > 100){
    growth = 100;
  }

  updateGrowth();

  if(growth >= 100){

    setTimeout(()=>{
      createPotato();
    },700);

  }

}


/* ==================================================
   성장 UI
================================================== */

function updateGrowth(){

  const percent =
    document.getElementById("growthPercent");

  const fill =
    document.getElementById("growthFill");

  const emoji =
    document.getElementById("growthEmoji");

  percent.textContent =
    growth + "%";

  fill.style.width =
    growth + "%";


  if(growth < 25){

    emoji.textContent = "🌱";

  }else if(growth < 50){

    emoji.textContent = "🌿";

  }else if(growth < 75){

    emoji.textContent = "🌳";

  }else if(growth < 100){

    emoji.textContent = "🥔";

  }else{

    emoji.textContent = "🥔";

  }

}


/* ==================================================
   랜덤 감자 탄생
================================================== */

function createPotato(){

  const randomIndex =
    Math.floor(
      Math.random() * potatoes.length
    );

  currentPotato =
    JSON.parse(
      JSON.stringify(
        potatoes[randomIndex]
      )
    );

  currentDay = 1;

  stats = {
    hunger:30,
    water:30,
    love:30,
    energy:70
  };


  if(
    !discovered.includes(
      currentPotato.name
    )
  ){

    discovered.push(
      currentPotato.name
    );

  }


  setupPotato();

  showScreen("raiseScreen");

}

   감자 설정
================================================== */

/* ==================================================
   랜덤 대사
================================================== */

function randomMessage(){

    currentPotato.messages;

  return messages[
    Math.floor(
      Math.random() *
      messages.length

  ];

}

   메세지
================================================== */

   감정 표현
================================================== */

function showEmotion(emoji){

  const emotion =
    document.getElementById("emotion");

  emotion.classList.remove("show");

  void emotion.offsetWidth;

  emotion.textContent =
    emoji;

  emotion.classList.add("show");

}


/* ==================================================
   감자 애니메이션
================================================== */

function potatoAnimation(type){

  const image =
    document.getElementById("potatoImage");

  image.classList.remove(
    "jump",
    "run",
    "spin"
  );

  void image.offsetWidth;

  image.classList.add(type);

  if(type !== "run"){

    setTimeout(()=>{
      image.classList.remove(type);
    },900);

  }

}


/* ==================================================
   스탯
================================================== */

function updateStats(){

  setStat(
    "hunger",
    stats.hunger
  );

  setStat(
    "water",
    stats.water
  );

  setStat(
    "love",
    stats.love
  );

  setStat(
    "energy",
    stats.energy
  );

}


function setStat(name,value){

  value =
    Math.max(
      0,
      Math.min(
        100,
        value
      )
    );

  stats[name] =
    value;

  document
    .getElementById(
      name + "Value"
    )
    .textContent =
    value + " / 100";

  document
    .getElementById(
      name + "Fill"
    )
    .style.width =
    value + "%";

}

function saveGame(){

/* ==================================================
   다마고치 방
================================================== */

function setupRoom(){

  const room =
    document.getElementById(
      "pixelRoom"
    );

  roomPotatoes = [];

  room
    .querySelectorAll(
      ".pixelPotato"
    )
    .forEach(el=>el.remove());


  discovered.forEach(
    (name,index)=>{

      const potato =
        potatoes.find(
          p=>p.name === name
        );

      if(!potato){
        return;
      }


      const el =
        document.createElement("div");

      el.className =
        "pixelPotato";


      if(potato.name === "대장감자"){
        el.classList.add("boss");
      }


      el.dataset.name =
        potato.name;

      el.dataset.style =
        potato.style;


      /*
       실제 이미지 파일을 그대로 사용.
       다마고치에서는 작은 픽셀 느낌으로 표시.
      */

      const img =
        document.createElement("img");

      img.src =
        potato.image;

      img.draggable =
        false;

      img.style.width =
        "42px";

      img.style.height =
        "42px";

      img.style.objectFit =
        "contain";

      img.style.imageRendering =
        "pixelated";

      img.style.pointerEvents =
        "none";

      el.appendChild(img);


      const positions = [

        [15,70],
        [40,70],
        [65,70],
        [28,52],
        [53,52]

      ];

      const pos =
        positions[
          index %
          positions.length
        ];


      el.style.left =
        pos[0] + "%";

      el.style.top =
        pos[1] + "%";


      room.appendChild(el);

      roomPotatoes.push(el);

      setupDrag(el);

      setupRoomTouch(el);

    }
  );


  /*
    독감자는 혼자 있으려는 성향
  */

  setTimeout(
    autonomousBehavior,
    800
  );

}

/* ==================================================
   감자 드래그
================================================== */

function setupDrag(el){

  let dragging = false;


  el.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      dragging = true;

      draggedPotato = el;

      const rect =
        el.getBoundingClientRect();

      dragOffsetX =
        e.clientX -
        rect.left;

      dragOffsetY =
        e.clientY -
        rect.top;

      el.setPointerCapture(
        e.pointerId
      );

      el.classList.add(
        "dragging"
      );

    }
  );


  el.addEventListener(
    "pointermove",
    function(e){

      if(
        !dragging ||
        draggedPotato !== el
      ){
        return;
      }

      e.preventDefault();

      const room =
        document.getElementById(
          "pixelRoom"
        );

      const roomRect =
        room.getBoundingClientRect();

      let x =
        e.clientX -
        roomRect.left -
        dragOffsetX;

      let y =
        e.clientY -
        roomRect.top -
        dragOffsetY;


      const maxX =
        roomRect.width -
        el.offsetWidth;

      const maxY =
        roomRect.height -
        el.offsetHeight;


      x =
        Math.max(
          0,
          Math.min(
            x,
            maxX
          )
        );

      y =
        Math.max(
          0,
          Math.min(
            y,
            maxY
          )
        );


      el.style.left =
        x + "px";

      el.style.top =
        y + "px";

      el.style.right =
        "auto";

      el.style.bottom =
        "auto";

    }
  );


  el.addEventListener(
    "pointerup",
    function(e){

      dragging = false;

      draggedPotato = null;

      el.classList.remove(
        "dragging"
      );

      try{
        el.releasePointerCapture(
          e.pointerId
        );
      }catch(err){}

    }
  );


  el.addEventListener(
    "pointercancel",
    function(){

      dragging = false;

      draggedPotato = null;

      el.classList.remove(
        "dragging"
      );

    }
  );

}


/* ==================================================
   다마고치 감자 터치
================================================== */

function setupRoomTouch(el){

  let touchTimer = null;

  el.addEventListener(
    "pointerdown",
    function(){

      touchTimer =
        setTimeout(
          ()=>{
            roomEmotionFor(
              el,
              getRoomEmotion(
                el.dataset.style
              )
            );
          },
          500
        );

    }
  );


  el.addEventListener(
    "pointerup",
    function(){

      clearTimeout(
        touchTimer
      );

    }
  );


  el.addEventListener(
    "pointercancel",
    function(){

      clearTimeout(
        touchTimer
      );

    }
  );

}


/* ==================================================
   감정
================================================== */

function getRoomEmotion(style){

  if(style === "social"){
    return "❤️";
  }

  if(style === "leader"){
    return "👑";
  }

  if(style === "poison"){
    return "☠️";
  }

  if(style === "violent"){
    return "💢";
  }

  return "❓";

}


function roomEmotionFor(el,emoji){

  const room =
    document.getElementById(
      "pixelRoom"
    );

  const roomRect =
    room.getBoundingClientRect();

  const rect =
    el.getBoundingClientRect();


  const emotion =
    document.createElement("div");

  emotion.className =
    "roomEmotion";

  emotion.textContent =
    emoji;


  emotion.style.left =
    (
      rect.left -
      roomRect.left +
      10
    ) + "px";

  emotion.style.top =
    (
      rect.top -
      roomRect.top -
      5
    ) + "px";


  room.appendChild(
    emotion
  );


  setTimeout(()=>{
    emotion.remove();
  },1000);

}


/* ==================================================
   방 쓰다듬기
================================================== */

function roomPet(){

  const visible =
    getVisibleRoomPotatoes();

  if(!visible.length){
    return;
  }


  visible.forEach(
    (el,index)=>{

      setTimeout(()=>{

        el.animate(
          [
            {
              transform:"translateY(0)"
            },
            {
              transform:
                "translateY(-18px) rotate(-8deg)"
            },
            {
              transform:
                "translateY(0) rotate(0)"
            }
          ],
          {
            duration:650
          }
        );

        roomEmotionFor(
          el,
          getRoomEmotion(
            el.dataset.style
          )
        );

      },index * 100);

    }
  );

}

  const snacks = [
    "🍪",
    "🍬",
    "🍭",
    "🍫",
    "🍩"
  ];


  for(let i=0;i<6;i++){

    setTimeout(()=>{

      const snack =
        document.createElement("div");

      snack.className =
        "snack";

      snack.textContent =
        snacks[
          Math.floor(
            Math.random() *
            snacks.length
          )
        ];

      snack.style.left =
        (
          10 +
          Math.random() * 80
        ) + "%";


      room.appendChild(
        snack
      );


      setTimeout(()=>{
        snack.remove();
      },1300);

    },i * 150);

  }


  getVisibleRoomPotatoes()
    .forEach(el=>{

      roomEmotionFor(
        el,
        "😋"
      );

    });

}


/* ==================================================
   잠자기
================================================== */

function roomSleep(){

  const room =
    document.getElementById(
      "pixelRoom"
    );


  const overlay =
    document.createElement(
      "div"
    );

  overlay.className =
    "sleepOverlay";


  const text =
    document.createElement(
      "div"
    );

  text.className =
    "sleepText";

  text.textContent =
    "💤 감자들이 잠들었습니다";


  overlay.appendChild(
    text
  );

  room.appendChild(
    overlay
  );


  getVisibleRoomPotatoes()
    .forEach(el=>{

      el.animate(
        [
          {
            transform:
              "translateY(0)"
          },
          {
            transform:
              "translateY(4px)"
          },
          {
            transform:
              "translateY(0)"
          }
        ],
        {
          duration:900,
          iterations:3
        }
      );

    });


  setTimeout(()=>{
    overlay.remove();
  },10000);

}


/* ==================================================
   보이는 감자
================================================== */

function getVisibleRoomPotatoes(){

  return roomPotatoes.filter(
    el=>{
      const toggle =
        document.querySelector(
          `.toggle[data-name="${el.dataset.name}"]`
        );

      return !toggle ||
             toggle.classList.contains("on");
    }
  );

}


/* ==================================================
   사전 ON/OFF
================================================== */

function updateRoomVisibility(){

  roomPotatoes.forEach(
    el=>{

      const toggle =
        document.querySelector(
          `.toggle[data-name="${el.dataset.name}"]`
        );

      if(
        toggle &&
        !toggle.classList.contains("on")
      ){

        el.style.display =
          "none";

      }else{

        el.style.display =
          "flex";

      }

    }
  );

}


/* ==================================================
   감자 AI식 자율 행동
================================================== */

function autonomousBehavior(){

  if(
    document
      .getElementById(
        "dictionaryScreen"
      )
      .classList.contains(
        "hidden"
      )
  ){
    return;
  }


  const visible =
    getVisibleRoomPotatoes();


  visible.forEach(
    el=>{

      const style =
        el.dataset.style;


      /*
        대장감자는 다른 감자를 따라다님
      */

      if(style === "leader"){
        leaderBehavior(el);
      }


      /*
        독감자는 혼자 움직임
      */

      else if(style === "poison"){
        poisonBehavior(el);
      }


      /*
        폭력감자
      */

      else if(style === "violent"){
        violentBehavior(el);
      }


      /*
        꾼감자
      */

      else if(style === "social"){
        socialBehavior(el);
      }


      /*
        저능감자
      */

      else{
        dummyBehavior(el);
      }

    }
  );


  interactionBetweenPotatoes();


  setTimeout(
    autonomousBehavior,
    3500
  );

}


/* ==================================================
   랜덤 이동
================================================== */

function moveRandom(el){

  const room =
    document.getElementById(
      "pixelRoom"
    );

  const maxX =
    room.clientWidth -
    el.offsetWidth -
    5;

  const maxY =
    room.clientHeight -
    el.offsetHeight -
    5;


  let x =
    Math.random() *
    maxX;

  let y =
    Math.random() *
    maxY;


  /*
    너무 위쪽에 가지 않게
  */

  y =
    Math.max(
      80,
      y
    );


  el.style.left =
    x + "px";

  el.style.top =
    y + "px";

}


/* ==================================================
   대장감자 행동
================================================== */

function leaderBehavior(el){

  const others =
    getVisibleRoomPotatoes()
      .filter(
        p =>
          p !== el &&
          p.dataset.style !== "poison"
      );


  if(!others.length){
    moveRandom(el);
    return;
  }


  /*
    대장은 저능감자를 가장 좋아함
  */

  const dummy =
    others.find(
      p =>
        p.dataset.style ===
        "dummy"
    );


  if(dummy){

    followTarget(
      el,
      dummy,
      0.35
    );

  }else{

    moveRandom(el);

  }

}


/* ==================================================
   독감자
================================================== */

function poisonBehavior(el){

  /*
    독감자는 다른 감자를 따라가지 않고
    주로 혼자 움직인다.
  */

  moveRandom(el);

}


/* ==================================================
   꾼감자
================================================== */

function socialBehavior(el){

  const others =
    getVisibleRoomPotatoes()
      .filter(
        p=>p !== el
      );


  if(!others.length){
    moveRandom(el);
    return;
  }


  const target =
    others[
      Math.floor(
        Math.random() *
        others.length
      )
    ];


  followTarget(
    el,
    target,
    .22
  );


  roomEmotionFor(
    el,
    "❤️"
  );

}


/* ==================================================
   폭력감자
================================================== */

function violentBehavior(el){

  const others =
    getVisibleRoomPotatoes()
      .filter(
        p =>
          p !== el &&
          p.dataset.style !== "poison"
      );


  if(!others.length){
    return;
  }


  const target =
    others[
      Math.floor(
        Math.random() *
        others.length
      )
    ];


  followTarget(
    el,
    target,
    .55
  );


  if(
    Math.random() < .5
  ){

    roomEmotionFor(
      el,
      "💢"
    );

  }

}


/* ==================================================
   저능감자
================================================== */

function dummyBehavior(el){

  /*
    모두에게 사랑받는 설정
  */

  const others =
    getVisibleRoomPotatoes()
      .filter(
        p =>
          p !== el &&
          p.dataset.style !== "poison"
      );


  if(
    others.length &&
    Math.random() < .7
  ){

    const target =
      others[
        Math.floor(
          Math.random() *
          others.length
        )
      ];


    followTarget(
      el,
      target,
      .18
    );

  }else{

    moveRandom(el);

  }


  if(
    Math.random() < .5
  ){

    roomEmotionFor(
      el,
      "🥹"
    );

  }

}


/* ==================================================
   따라가기
================================================== */

function followTarget(
  actor,
  target,
  amount
){

  const room =
    document.getElementById(
      "pixelRoom"
    );


  const ax =
    actor.offsetLeft;

  const ay =
    actor.offsetTop;


  const tx =
    target.offsetLeft;

  const ty =
    target.offsetTop;


  let dx =
    tx - ax;

  let dy =
    ty - ay;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if(distance < 35){
    return;
  }


  actor.style.left =
    (
      ax +
      dx / distance *
      35 *
      amount
    ) + "px";


  actor.style.top =
    (
      ay +
      dy / distance *
      35 *
      amount
    ) + "px";

}


/* ==================================================
   감자끼리 상호작용
================================================== */

function interactionBetweenPotatoes(){

  const list =
    getVisibleRoomPotatoes();


  for(
    let i=0;
    i<list.length;
    i++
  ){

    for(
      let j=i+1;
      j<list.length;
      j++
    ){

      const a =
        list[i];

      const b =
        list[j];


      const ax =
        a.offsetLeft;

      const ay =
        a.offsetTop;

      const bx =
        b.offsetLeft;

      const by =
        b.offsetTop;


      const dx =
        ax - bx;

      const dy =
        ay - by;


      const distance =
        Math.sqrt(
          dx*dx +
          dy*dy
        );


      if(distance > 48){
        continue;
      }


      const aStyle =
        a.dataset.style;

      const bStyle =
        b.dataset.style;


      /*
        독감자 스턴
        폭력감자는 면역
      */

      if(
        aStyle === "poison" &&
        bStyle !== "violent"
      ){

        poisonAttack(b);

      }


      if(
        bStyle === "poison" &&
        aStyle !== "violent"
      ){

        poisonAttack(a);

      }


      /*
        폭력감자 -> 독감자
        친절
      */

      if(
        aStyle === "violent" &&
        bStyle === "poison"
      ){

        roomEmotionFor(
          a,
          "❤️"
        );

      }


      if(
        bStyle === "violent" &&
        aStyle === "poison"
      ){

        roomEmotionFor(
          b,
          "❤️"
        );

      }


      /*
        꾼감자 -> 모두에게 하트
      */

      if(
        aStyle === "social"
      ){

        roomEmotionFor(
          a,
          "❤️"
        );

      }


      if(
        bStyle === "social"
      ){

        roomEmotionFor(
          b,
          "❤️"
        );

      }


      /*
        저능감자
      */

      if(
        aStyle === "dummy" &&
        bStyle !== "poison"
      ){

        roomEmotionFor(
          b,
          "❤️"
        );

      }


      if(
        bStyle === "dummy" &&
        aStyle !== "poison"
      ){

        roomEmotionFor(
          a,
          "❤️"
        );

      }

    }

  }

}


/* ==================================================
   독감자 스턴
================================================== */

function poisonAttack(target){

  /*
    10% 확률
  */

  if(
    Math.random() > .10
  ){
    return;
  }


  /*
    폭력감자는 독감자 스턴 면역.
  */

  if(
    target.dataset.style ===
    "violent"
  ){
    return;
  }


  target.style.filter =
    "grayscale(1)";


  roomEmotionFor(
    target,
    "💫"
  );


  target.dataset.stunned =
    "true";


  setTimeout(()=>{

    target.style.filter =
      "";

    target.dataset.stunned =
      "false";

  },3000);

}


/* ==================================================
   페이지 시작
================================================== */

loadGame();

</script>
