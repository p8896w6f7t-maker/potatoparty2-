<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>감자키우기</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    Arial,
    "Apple SD Gothic Neo",
    sans-serif;
  background:#f4e7cf;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

.screen{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
}

.screen.active{
  display:flex;
}


/* ==================================================
   시작 화면
================================================== */

#startScreen{
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(
      #fff4dc 0 65%,
      #d7a76e 65% 100%
    );
  text-align:center;
}

.start-potato{
  font-size:110px;
  animation:
    potatoFloat 2s infinite ease-in-out;
}

.start-title{
  margin-top:10px;
  font-size:38px;
  font-weight:900;
  color:#5c351d;
}

.start-sub{
  margin-top:8px;
  color:#8c6345;
}

.start-button{
  margin-top:35px;
  padding:16px 55px;
  border-radius:18px;
  background:#8c5a32;
  color:white;
  font-size:20px;
  font-weight:900;
  box-shadow:
    0 6px 0 #5c351d;
}

.start-button:active{
  transform:translateY(5px);
  box-shadow:
    0 1px 0 #5c351d;
}


/* ==================================================
   새싹 키우기
================================================== */

#sproutScreen{
  background:
    linear-gradient(
      #bde8ff 0 63%,
      #8cc96d 63% 100%
    );
  align-items:center;
  color:#54351e;
}

.sprout-header{
  width:100%;
  padding:22px 20px 10px;
  text-align:center;
}

.sprout-header h1{
  margin:0;
  font-size:28px;
}

.growth-box{
  width:calc(100% - 40px);
  max-width:500px;
  margin-top:10px;
}

.growth-label{
  display:flex;
  justify-content:space-between;
  font-weight:900;
}

.progress{
  margin-top:8px;
  height:20px;
  border-radius:20px;
  overflow:hidden;
  background:#eee0c9;
  border:3px solid #704522;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#6dbb4b;
  transition:width .3s;
}

.sprout-area{
  flex:1;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

.sprout-pot{
  width:230px;
  height:230px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:150px;
  transition:.3s;
}

.sprout-pot.grow{
  animation:sproutBounce .4s;
}

.sprout-stage{
  position:absolute;
  bottom:10%;
  font-size:20px;
  font-weight:900;
  background:#fff8e8;
  padding:8px 18px;
  border-radius:15px;
}

.growth-actions{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:15px 20px 25px;
  max-width:500px;
}

.growth-action{
  min-height:65px;
  border-radius:18px;
  background:white;
  box-shadow:0 4px 0 #c39b72;
  font-size:16px;
  font-weight:900;
  color:#5a3923;
}

.growth-action:active{
  transform:translateY(4px);
  box-shadow:0 0 0 #c39b72;
}


/* ==================================================
   부화
================================================== */

.hatch-overlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
  background:rgba(255,248,226,.94);
  flex-direction:column;
}

.hatch-overlay.show{
  display:flex;
}

.hatch-egg{
  font-size:120px;
  animation:hatchShake .35s infinite alternate;
}

.hatch-text{
  margin-top:20px;
  font-size:27px;
  font-weight:900;
  color:#5c351d;
}


/* ==================================================
   감자 키우기 화면
================================================== */

#growScreen{
  background:#f7ecd9;
}

.grow-header{
  flex:none;
  height:115px;
  padding:12px 15px;
  background:#fff8ea;
  border-bottom:2px solid #d7b78e;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}

.grow-title{
  font-weight:900;
  font-size:17px;
}

.day{
  color:#886044;
  font-size:13px;
}

.potato-info{
  display:flex;
  gap:10px;
  align-items:center;
}

.info-img{
  width:72px;
  height:72px;
  object-fit:contain;
}

.message-box{
  min-width:0;
}

.message{
  background:white;
  border:2px solid #b58b63;
  border-radius:12px;
  padding:7px 10px;
  font-size:13px;
  min-height:42px;
}

.potato-name{
  font-weight:900;
  margin-top:4px;
}

.personality{
  font-size:11px;
  color:#8b694e;
}


/* ==================================================
   스탯
================================================== */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  padding:9px 12px;
  background:#ead5b8;
}

.stat{
  text-align:center;
  font-size:11px;
  font-weight:900;
}

.stat-bar{
  height:8px;
  margin-top:4px;
  border-radius:10px;
  overflow:hidden;
  background:#d0b89b;
}

.stat-fill{
  height:100%;
  width:100%;
  background:#7fb65a;
}


/* ==================================================
   메인 감자 영역
================================================== */

.grow-main{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.main-potato{
  width:min(70vw,300px);
  height:min(70vw,300px);
  object-fit:contain;
  transition:.2s;
}

.main-potato.jump{
  animation:potatoJump .55s;
}

.effect{
  position:absolute;
  font-size:42px;
  pointer-events:none;
  animation:effectUp 1s forwards;
}


/* ==================================================
   감자 행동 버튼
================================================== */

.grow-actions{
  flex:none;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:9px 10px;
  background:#fff8ea;
  border-top:2px solid #d7b78e;
}

.grow-action{
  min-height:55px;
  border-radius:13px;
  background:#f0ddbd;
  color:#573820;
  font-weight:900;
  font-size:12px;
}

.grow-action:active{
  transform:scale(.94);
}


/* ==================================================
   하단 메뉴
================================================== */

.bottom-menu{
  height:58px;
  flex:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#765034;
}

.bottom-menu button{
  background:transparent;
  color:#fff4dd;
  font-weight:900;
  font-size:14px;
}

.bottom-menu button.active{
  background:#5a3924;
}


/* ==================================================
   감자사전
================================================== */

#dictionaryScreen{
  background:#f4e6cf;
}

.dictionary-header{
  height:70px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#fff8e9;
  border-bottom:2px solid #cba77b;
}

.dictionary-title{
  font-size:23px;
  font-weight:900;
  color:#5a3924;
}

.back-button{
  padding:9px 13px;
  border-radius:10px;
  background:#765034;
  color:white;
  font-weight:900;
}

.dictionary-room{
  flex:1;
  padding:10px;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.room-tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding-bottom:8px;
}

.room-tab{
  flex:none;
  padding:8px 12px;
  border-radius:10px;
  background:#d9c2a1;
  font-weight:900;
}

.room-tab.active{
  background:#765034;
  color:white;
}


/* ==================================================
   18비트 느낌의 다마고치 화면
================================================== */

.tama-frame{
  flex:1;
  min-height:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.tama-screen{
  width:min(92vw,500px);
  aspect-ratio:1 / .82;
  max-height:100%;
  position:relative;
  overflow:hidden;

  image-rendering:pixelated;

  border:
    10px solid #5a3a27;

  box-shadow:
    inset 0 0 0 4px #b68b5e,
    0 7px 0 #3d281b;

  background:#c9b083;
}


/* 18비트 픽셀 타일 */

.pixel-grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(
      rgba(0,0,0,.055) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,0,0,.055) 1px,
      transparent 1px
    );
  background-size:18px 18px;
  pointer-events:none;
  z-index:20;
}


/* ==================================================
   거실
================================================== */

.room-living{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      #d6bd8d 0 62%,
      #9c6c46 62% 100%
    );
}

.window{
  position:absolute;
  width:105px;
  height:75px;
  left:16px;
  top:16px;
  background:#8dd8e8;
  border:7px solid #765034;
}

.window:before,
.window:after{
  content:"";
  position:absolute;
  background:#765034;
}

.window:before{
  width:7px;
  height:100%;
  left:43px;
}

.window:after{
  height:7px;
  width:100%;
  top:31px;
}

.sun{
  position:absolute;
  width:20px;
  height:20px;
  right:10px;
  top:10px;
  background:#f3d45e;
}

.sofa{
  position:absolute;
  width:150px;
  height:58px;
  left:50%;
  bottom:43px;
  transform:translateX(-50%);
  background:#8c5b3a;
  border:6px solid #654129;
}

.sofa:before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  top:-31px;
  height:32px;
  background:#9f6a45;
  border:6px solid #654129;
}

.tv{
  position:absolute;
  width:92px;
  height:65px;
  right:17px;
  top:15px;
  background:#352e2a;
  border:7px solid #60452f;
}

.tv-screen{
  position:absolute;
  inset:9px;
  background:#7ab7a3;
}

.tv-stand{
  position:absolute;
  bottom:-22px;
  left:29px;
  width:28px;
  height:17px;
  background:#60452f;
}


/* ==================================================
   주방
================================================== */

.room-kitchen{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      #e2cda7 0 63%,
      #a97850 63% 100%
    );
}

.kitchen-counter{
  position:absolute;
  left:10px;
  right:10px;
  bottom:55px;
  height:75px;
  background:#765034;
  border-top:10px solid #b98b5e;
}

.kitchen-sink{
  position:absolute;
  left:22px;
  top:18px;
  width:60px;
  height:35px;
  background:#9cb4b3;
  border:5px solid #624735;
}

.kitchen-fridge{
  position:absolute;
  right:18px;
  top:15px;
  width:65px;
  height:120px;
  background:#ddd5c7;
  border:7px solid #766a5b;
}

.kitchen-table{
  position:absolute;
  left:50%;
  bottom:20px;
  width:115px;
  height:18px;
  transform:translateX(-50%);
  background:#71462d;
}


/* ==================================================
   침실
================================================== */

.room-bedroom{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      #d9c5ae 0 62%,
      #9c765b 62% 100%
    );
}

.bed{
  position:absolute;
  width:185px;
  height:78px;
  left:50%;
  bottom:37px;
  transform:translateX(-50%);
  background:#a97d67;
  border:7px solid #674939;
}

.pillow{
  position:absolute;
  width:55px;
  height:32px;
  left:13px;
  top:10px;
  background:#eee0ca;
}

.lamp{
  position:absolute;
  right:30px;
  top:35px;
  width:25px;
  height:65px;
  background:#765034;
}

.lamp:before{
  content:"";
  position:absolute;
  width:45px;
  height:28px;
  left:-10px;
  top:-20px;
  background:#e8cb72;
  border:5px solid #765034;
}


/* ==================================================
   욕실
================================================== */

.room-bathroom{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      #d4e4df 0 63%,
      #91aaa4 63% 100%
    );
}

.bath{
  position:absolute;
  width:160px;
  height:70px;
  left:50%;
  bottom:45px;
  transform:translateX(-50%);
  background:#f2f0df;
  border:7px solid #6f7f79;
}

.mirror{
  position:absolute;
  width:90px;
  height:70px;
  right:18px;
  top:15px;
  background:#a8d5d7;
  border:7px solid #6d7772;
}

.sink{
  position:absolute;
  left:20px;
  top:25px;
  width:70px;
  height:38px;
  background:#eeeade;
  border:6px solid #6f7f79;
}


/* ==================================================
   놀이터
================================================== */

.room-playground{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      #a9dcf0 0 58%,
      #74b65c 58% 100%
    );
}

.cloud{
  position:absolute;
  width:65px;
  height:25px;
  background:white;
  top:25px;
  left:30px;
}

.swing{
  position:absolute;
  right:35px;
  bottom:42px;
  width:75px;
  height:90px;
  border-left:7px solid #765034;
  border-right:7px solid #765034;
}

.swing:before{
  content:"";
  position:absolute;
  left:-7px;
  top:15px;
  width:75px;
  height:7px;
  background:#765034;
}

.swing:after{
  content:"";
  position:absolute;
  width:50px;
  height:6px;
  left:5px;
  top:65px;
  background:#765034;
}

.slide{
  position:absolute;
  left:25px;
  bottom:38px;
  width:80px;
  height:55px;
  border-bottom:12px solid #d67c55;
  border-right:12px solid #d67c55;
}


/* ==================================================
   다마고치 감자
================================================== */

.tama-potato{
  position:absolute;
  width:55px;
  height:55px;
  object-fit:contain;
  z-index:10;
  touch-action:none;
  transition:
    left .35s,
    top .35s,
    transform .25s;
}

.tama-potato.following{
  animation:tinyBounce .7s infinite;
}

.tama-potato.stunned{
  filter:grayscale(.7);
  animation:stun 1s infinite;
}

.tama-emotion{
  position:absolute;
  z-index:30;
  font-size:25px;
  pointer-events:none;
  animation:effectUp 1.2s forwards;
}

.sleep-overlay{
  position:absolute;
  inset:0;
  z-index:50;
  background:rgba(25,35,60,.78);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  font-weight:900;
}

.sleep-overlay.show{
  display:flex;
}

.sleep-stars{
  font-size:35px;
}


/* ==================================================
   다마고치 조작
================================================== */

.tama-controls{
  flex:none;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:8px;
}

.tama-control{
  padding:10px 4px;
  border-radius:11px;
  background:#765034;
  color:white;
  font-weight:900;
  font-size:12px;
}


/* ==================================================
   사전 목록
================================================== */

.collection{
  flex:none;
  max-height:150px;
  overflow-y:auto;
  margin-top:8px;
  background:#fff8e9;
  border:2px solid #cba77b;
  border-radius:12px;
  padding:8px;
}

.collection-title{
  font-weight:900;
  color:#5a3924;
}

.collection-count{
  font-size:12px;
  color:#8a694d;
  margin-top:2px;
}

.collection-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 0;
  border-bottom:1px solid #e4d2b7;
}

.collection-item:last-child{
  border-bottom:0;
}

.collection-item img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.collection-name{
  flex:1;
  font-weight:900;
  font-size:13px;
}

.toggle{
  width:44px;
  height:25px;
  border-radius:20px;
  background:#aaa;
  position:relative;
}

.toggle.on{
  background:#6ca54f;
}

.toggle:after{
  content:"";
  position:absolute;
  width:19px;
  height:19px;
  border-radius:50%;
  background:white;
  top:3px;
  left:3px;
  transition:.2s;
}

.toggle.on:after{
  left:22px;
}


/* ==================================================
   애니메이션
================================================== */

@keyframes potatoFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-12px);
  }
}

@keyframes sproutBounce{
  0%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.12);
  }
  100%{
    transform:scale(1);
  }
}

@keyframes hatchShake{
  from{
    transform:rotate(-7deg) scale(1);
  }
  to{
    transform:rotate(7deg) scale(1.08);
  }
}

@keyframes potatoJump{
  0%{
    transform:translateY(0) rotate(0);
  }
  40%{
    transform:translateY(-45px) rotate(-8deg);
  }
  70%{
    transform:translateY(-20px) rotate(8deg);
  }
  100%{
    transform:translateY(0) rotate(0);
  }
}

@keyframes effectUp{
  0%{
    opacity:1;
    transform:translateY(0) scale(.8);
  }
  100%{
    opacity:0;
    transform:translateY(-70px) scale(1.3);
  }
}

@keyframes tinyBounce{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-5px);
  }
}

@keyframes stun{
  0%,100%{
    transform:rotate(0);
  }
  25%{
    transform:rotate(-10deg);
  }
  75%{
    transform:rotate(10deg);
  }
}


/* ==================================================
   작은 화면
================================================== */

@media(max-height:650px){

  .grow-header{
    height:95px;
  }

  .info-img{
    width:58px;
    height:58px;
  }

  .grow-actions{
    padding:5px;
  }

  .grow-action{
    min-height:45px;
  }

  .bottom-menu{
    height:48px;
  }

  .collection{
    max-height:105px;
  }

}

</style>
</head>


<body>


<!-- ==================================================
     시작
================================================== -->

<section
  id="startScreen"
  class="screen active">

  <div class="start-potato">🥔</div>

  <div class="start-title">
    감자키우기
  </div>

  <div class="start-sub">
    나만의 감자를 키워보세요
  </div>

  <button
    class="start-button"
    onclick="startGame()">
    게임 시작
  </button>

</section>


<!-- ==================================================
     새싹 키우기
================================================== -->

<section
  id="sproutScreen"
  class="screen">

  <div class="sprout-header">

    <h1>
      🌱 새싹 키우기
    </h1>

    <div class="growth-box">

      <div class="growth-label">
        <span id="growthStage">
          싹
        </span>

        <span>
          <span id="growthPercent">0</span>%
        </span>
      </div>

      <div class="progress">
        <div
          id="growthFill"
          class="progress-fill">
        </div>
      </div>

    </div>

  </div>


  <div class="sprout-area">

    <div
      id="sproutPot"
      class="sprout-pot">
      🌱
    </div>

    <div
      id="sproutStage"
      class="sprout-stage">
      싹
    </div>

  </div>


  <div class="growth-actions">

    <button
      class="growth-action"
      onclick="growthAction(10)">
      🌱 비료 주기
    </button>

    <button
      class="growth-action"
      onclick="growthAction(8)">
      💧 물 주기
    </button>

    <button
      class="growth-action"
      onclick="growthAction(7)">
      ☀️ 햇빛 쬐기
    </button>

    <button
      class="growth-action"
      onclick="growthAction(5)">
      💕 응원하기
    </button>

  </div>

<!-- ==================================================

<script>

/* ==================================================
   감자 데이터
================================================== */

const POTATO_DATA = {

  Potato1:{
    name:"꾼감자",
    personality:"모두를 좋아하고 사랑을 표현해요",
    lines:[
      "너도 좋아! ❤️",
      "우리 친하게 지내자! 💕",
      "감자는 사랑이야! ❤️"
    ]
  },

  Potato2:{
    name:"대장감자",
    personality:"친구들을 이끄는 리더예요",
    lines:[
      "다들 내 뒤를 따라와!",
      "저능감자는 내가 지켜줄게.",
      "감자들은 내가 책임진다!"
    ]
  },

  Potato3:{
    name:"독감자",
    personality:"혼자 있는 걸 좋아하고 조금 위험해요",
    lines:[
      "...건드리지 마.",
      "혼자 있고 싶어.",
      "다가오지 마."
    ]
  },

  Potato4:{
    name:"폭력감자",
    personality:"싸움을 좋아하지만 독감자에게는 다정해요",
    lines:[
      "한판 붙자!",
      "누가 내 상대야?",
      "독감자는 건드리지 마. ❤️"
    ]
  },

  Potato5:{
    name:"저능감자",
    personality:"순하고 모두에게 사랑받아요",
    lines:[
      "우와아!",
      "감자다!",
      "헤헤 좋아!"
    ]
  }

};


/* ==================================================
   상태
================================================== */

let growth = 0;

let currentPotato = null;

let currentRoom = "living";

let day = 1;

let stats = {
  hunger:100,
  water:100,
  love:100,
  energy:100
};

let collection =
  JSON.parse(
    localStorage.getItem(
      "potatoCollection"
    ) || "[]"
  );

let activePotatoes =
  JSON.parse(
    localStorage.getItem(
      "activePotatoes"
    ) || "[]"
  );


let roomPotatoes = [];

let followLeader = false;

let draggedPotato = null;

let dragOffsetX = 0;
let dragOffsetY = 0;

let sleepTimer = null;


/* ==================================================
   이미지
================================================== */

function potatoImage(id){

  return `${id}.Png`;

}


/* ==================================================
   시작
================================================== */

function startGame(){

  document
    .getElementById("startScreen")
    .classList.remove("active");

  document
    .getElementById("sproutScreen")
    .classList.add("active");

  growth = 0;

  updateGrowth();

}


/* ==================================================
   화면 전환
================================================== */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

}


/* ==================================================
   성장
================================================== */

function growthAction(amount){

  if(growth >= 100){
    return;
  }

  growth += amount;

  if(growth > 100){
    growth = 100;
  }

  updateGrowth();

  const sprout =
    document.getElementById(
      "sproutPot"
    );

  sprout.classList.remove("grow");

  void sprout.offsetWidth;

  sprout.classList.add("grow");

  if(growth >= 100){

    setTimeout(
      hatchPotato,
      600
    );

  }

}


function updateGrowth(){

  document
    .getElementById(
      "growthPercent"
    )
    .textContent = growth;

  document
    .getElementById(
      "growthFill"
    )
    .style.width =
      growth + "%";


  let stage = "싹";
  let emoji = "🌱";

  if(growth >= 25){

    stage = "이파리";
    emoji = "🌿";

  }

  if(growth >= 50){

    stage = "나무";
    emoji = "🌳";

  }

  if(growth >= 75){

    stage = "감자";
    emoji = "🥔";

  }


  document
    .getElementById(
      "growthStage"
    )
    .textContent = stage;

  document
    .getElementById(
      "sproutStage"
    )
    .textContent = stage;

  document
    .getElementById(
      "sproutPot"
    )
    .textContent = emoji;

}


/* ==================================================
   감자 부화
================================================== */

function hatchPotato(){

  const ids = Object.keys(
    POTATO_DATA
  );

  const id =
    ids[
      Math.floor(
        Math.random() * ids.length
      )
    ];


  currentPotato = {

    id:id,

    name:
      POTATO_DATA[id].name,

    personality:
      POTATO_DATA[id].personality,

    lines:
      [...POTATO_DATA[id].lines],

    birthDay:day

  };


  const overlay =
    document.getElementById(
      "hatchOverlay"
    );

  overlay.classList.add("show");


  setTimeout(()=>{

    overlay.classList.remove("show");

    showScreen("growScreen");

    renderCurrentPotato();

    updateStats();

    showMessage(
      `${currentPotato.name}이(가) 태어났어요! 🥔`
    );

  },1200);

}


/* ==================================================
   현재 감자 표시
================================================== */

function renderCurrentPotato(){

  if(!currentPotato){
    return;
  }

  const src =
    potatoImage(
      currentPotato.id
    );


  document
    .getElementById("mainPotato")
    .src = src;

  document
    .getElementById("infoImg")
    .src = src;

  document
    .getElementById("potatoName")
    .textContent =
      currentPotato.name;

  document
    .getElementById("personality")
    .textContent =
      currentPotato.personality;

}


/* ==================================================
   메시지
================================================== */

function showMessage(text){

  document
    .getElementById("message")
    .textContent = text;

}


function randomLine(){

  if(!currentPotato){
    return "";
  }

  const lines =
    currentPotato.lines;

  return lines[
    Math.floor(
      Math.random() * lines.length
    )
  ];

}


/* ==================================================
   감자 행동
================================================== */

function feedPotato(){

  stats.hunger =
    Math.min(
      100,
      stats.hunger + 20
    );

  stats.energy =
    Math.min(
      100,
      stats.energy + 5
    );

  showMessage(
    "냠냠! 맛있어! 🍖"
  );

  createEffect(
    "🍖",
    document.getElementById(
      "growMain"
    )
  );

  updateStats();

}


function waterPotato(){

  stats.water =
    Math.min(
      100,
      stats.water + 20
    );

  showMessage(
    "꿀꺽꿀꺽! 💧"
  );

  createEffect(
    "💧",
    document.getElementById(
      "growMain"
    )
  );

  updateStats();

}


function petPotato(){

  stats.love =
    Math.min(
      100,
      stats.love + 12
    );

  stats.energy =
    Math.max(
      0,
      stats.energy - 2
    );

  const potato =
    document.getElementById(
      "mainPotato"
    );

  potato.classList.remove("jump");

  void potato.offsetWidth;

  potato.classList.add("jump");

  showMessage(
    randomLine()
  );

  createEffect(
    "💕",
    document.getElementById(
      "growMain"
    )
  );

  updateStats();

}


function petMainPotato(){

  petPotato();

}


function walkPotato(){

  stats.energy =
    Math.max(
      0,
      stats.energy - 12
    );

  stats.love =
    Math.min(
      100,
      stats.love + 8
    );

  showMessage(
    "산책 가자! 🏃🥔"
  );

  const potato =
    document.getElementById(
      "mainPotato"
    );

  potato.classList.remove("jump");

  void potato.offsetWidth;

  potato.classList.add("jump");

  createEffect(
    "🏃",
    document.getElementById(
      "growMain"
    )
  );

  updateStats();

}


/* ==================================================
   수확
================================================== */

function harvestPotato(){

  if(!currentPotato){
    return;
  }


  const id =
    currentPotato.id;


  if(
    !collection.includes(id)
  ){

    collection.push(id);

    localStorage.setItem(
      "potatoCollection",
      JSON.stringify(collection)
    );

  }


  if(
    !activePotatoes.includes(id)
  ){

    activePotatoes.push(id);

    localStorage.setItem(
      "activePotatoes",
      JSON.stringify(activePotatoes)
    );

  }


  showMessage(
    `${currentPotato.name}을(를) 수확했어요! 🥔`
  );


  setTimeout(()=>{

    currentPotato = null;

    growth = 0;

    updateGrowth();

    showScreen(
      "sproutScreen"
    );

  },700);

}


/* ==================================================
   스탯
================================================== */

function updateStats(){

  document
    .getElementById("hungerBar")
    .style.width =
      stats.hunger + "%";

  document
    .getElementById("waterBar")
    .style.width =
      stats.water + "%";

  document
    .getElementById("loveBar")
    .style.width =
      stats.love + "%";

  document
    .getElementById("energyBar")
    .style.width =
      stats.energy + "%";

}


/* ==================================================
   효과
================================================== */

function createEffect(
  emoji,
  parent
){

  const effect =
    document.createElement("div");

  effect.className =
    "effect";

  effect.textContent =
    emoji;

  effect.style.left =
    (45 + Math.random()*10)
    + "%";

  effect.style.top =
    "45%";

  parent.appendChild(effect);

  setTimeout(
    ()=>effect.remove(),
    1000
  );

}


/* ==================================================
   감자사전 열기
================================================== */

function showDictionary(){

  showScreen(
    "dictionaryScreen"
  );

  renderCollection();

  renderRoom();

}


/* ==================================================
   키우기 화면
================================================== */

function showGrow(){

  if(!currentPotato){

    showScreen(
      "sproutScreen"
    );

    return;

  }

  showScreen(
    "growScreen"
  );

}


/* ==================================================
   사전 목록
================================================== */

function renderCollection(){

  const list =
    document.getElementById(
      "collectionList"
    );

  list.innerHTML = "";


  document
    .getElementById(
      "collectionCount"
    )
    .textContent =
      collection.length;


  collection.forEach(id=>{

    const data =
      POTATO_DATA[id];

    const item =
      document.createElement("div");

    item.className =
      "collection-item";


    const img =
      document.createElement("img");

    img.src =
      potatoImage(id);


    const name =
      document.createElement("div");

    name.className =
      "collection-name";

    name.textContent =
      data.name;


    const toggle =
      document.createElement("button");

    toggle.className =
      "toggle " +
      (
        activePotatoes.includes(id)
          ? "on"
          : ""
      );


    toggle.onclick =
      (event)=>{

        event.stopPropagation();

        togglePotato(id);

      };


    item.appendChild(img);
    item.appendChild(name);
    item.appendChild(toggle);

    list.appendChild(item);

  });

}


function togglePotato(id){

  const index =
    activePotatoes.indexOf(id);


  if(index >= 0){

    activePotatoes.splice(
      index,
      1
    );

  }else{

    activePotatoes.push(id);

  }


  localStorage.setItem(
    "activePotatoes",
    JSON.stringify(
      activePotatoes
    )
  );


  renderCollection();

  renderRoom();

}


/* ==================================================
   방 변경
================================================== */

function changeRoom(
  room,
  button
){

  currentRoom =
    room;


  document
    .querySelectorAll(
      ".room-tab"
    )
    .forEach(tab=>{
      tab.classList.remove(
        "active"
      );
    });


  button.classList.add(
    "active"
  );


  renderRoom();

}


/* ==================================================
   방 렌더링
================================================== */

function renderRoom(){

  const rooms = {

    living:
      "roomLiving",

    kitchen:
      "roomKitchen",

    bedroom:
      "roomBedroom",

    bathroom:
      "roomBathroom",

    playground:
      "roomPlayground"

  };


  Object.entries(rooms)
    .forEach(([key,id])=>{

      document
        .getElementById(id)
        .style.display =
          key === currentRoom
            ? "block"
            : "none";

    });


  const container =
    document.getElementById(
      "tamaPotatoes"
    );

  container.innerHTML = "";


  roomPotatoes = [];


  activePotatoes.forEach(
    (id,index)=>{

      createTamaPotato(
        id,
        index
      );

    }
  );

}


/* ==================================================
   다마고치 감자 생성
================================================== */

function createTamaPotato(
  id,
  index
){

  const img =
    document.createElement("img");

  img.className =
    "tama-potato";

  img.src =
    potatoImage(id);

  img.dataset.id =
    id;

  img.draggable =
    false;


  const x =
    15 +
    Math.random() * 70;

  const y =
    35 +
    Math.random() * 40;


  img.style.left =
    x + "%";

  img.style.top =
    y + "%";


  const potato = {

    id:id,
    element:img,
    x:x,
    y:y,
    stunnedUntil:0

  };


  roomPotatoes.push(
    potato
  );


  addPotatoTouch(
    potato
  );


  document
    .getElementById(
      "tamaPotatoes"
    )
    .appendChild(img);

}


/* ==================================================
   터치 / 드래그
================================================== */

function addPotatoTouch(
  potato
){

  const el =
    potato.element;


  let startX = 0;
  let startY = 0;
  let dragging = false;
  let longPress = null;


  el.addEventListener(
    "pointerdown",
    event=>{

      event.preventDefault();

      startX =
        event.clientX;

      startY =
        event.clientY;


      const rect =
        el.getBoundingClientRect();


      dragOffsetX =
        event.clientX -
        rect.left;

      dragOffsetY =
        event.clientY -
        rect.top;


      longPress =
        setTimeout(()=>{

          dragging = true;

          draggedPotato =
            potato;

          el.setPointerCapture(
            event.pointerId
          );


          if(
            potato.id ===
            "Potato2"
          ){

            followLeader =
              true;

            showRoomMessage(
              "대장감자가 다른 감자들을 이끌기 시작했어요!"
            );

          }

        },450);

    }
  );


  el.addEventListener(
    "pointermove",
    event=>{

      if(
        !dragging ||
        draggedPotato !== potato
      ){
        return;
      }


      const room =
        document.getElementById(
          "tamaScreen"
        );

      const rect =
        room.getBoundingClientRect();


      let x =
        event.clientX -
        rect.left -
        dragOffsetX;

      let y =
        event.clientY -
        rect.top -
        dragOffsetY;


      x =
        Math.max(
          0,
          Math.min(
            rect.width - el.offsetWidth,
            x
          )
        );

      y =
        Math.max(
          0,
          Math.min(
            rect.height - el.offsetHeight,
            y
          )
        );


      el.style.left =
        x + "px";

      el.style.top =
        y + "px";

    }
  );


  el.addEventListener(
    "pointerup",
    event=>{

      clearTimeout(
        longPress
      );


      if(!dragging){

        touchTamaPotato(
          potato
        );

      }


      dragging =
        false;

      draggedPotato =
        null;

    }
  );


  el.addEventListener(
    "pointercancel",
    ()=>{
      clearTimeout(
        longPress
      );

      dragging =
        false;

      draggedPotato =
        null;
    }
  );

}


/* ==================================================
   감자 터치 반응
================================================== */

function touchTamaPotato(
  potato
){

  const now =
    Date.now();


  if(
    potato.stunnedUntil >
    now
  ){

    showRoomMessage(
      "😵 기절해 있어요!"
    );

    return;

  }


  const id =
    potato.id;


  let emoji = "💭";
  let text =
    POTATO_DATA[id].lines[
      Math.floor(
        Math.random() *
        POTATO_DATA[id].lines.length
      )
    ];


  /* 독감자 */

  if(id === "Potato3"){

    emoji = "⚡";

    if(
      Math.random() < .1
    ){

      const others =
        roomPotatoes.filter(
          p=>p !== potato
        );


      if(others.length){

        const target =
          others[
            Math.floor(
              Math.random() *
              others.length
            )
          ];


        target.stunnedUntil =
          now + 3000;

        target.element.classList.add(
          "stunned"
        );


        setTimeout(()=>{

          target.element.classList.remove(
            "stunned"
          );

        },3000);

        text =
          "건드리지 마! ⚡";

      }

    }

  }


  /* 꾼감자 */

  if(id === "Potato1"){

    emoji = "❤️";

  }


  /* 폭력감자 */

  if(id === "Potato4"){

    if(
      roomPotatoes.some(
        p=>
          p.id === "Potato3"
      )
    ){

      emoji = "💕";

      text =
        "독감자는 내가 지켜줄게. ❤️";

    }else{

      emoji = "💢";

      text =
        "한판 붙자!";

    }

  }


  /* 저능감자 */

  if(id === "Potato5"){

    emoji = "✨";

  }


  showTamaEmotion(
    potato,
    emoji
  );

  showRoomMessage(
    `${POTATO_DATA[id].name}: ${text}`
  );

}


/* ==================================================
   다마고치 메시지
================================================== */

function showRoomMessage(
  text
){

  const message =
    document.getElementById(
      "message"
    );

  message.textContent =
    text;

}


/* ==================================================
   다마고치 감정
================================================== */

function showTamaEmotion(
  potato,
  emoji
){

  const emotion =
    document.createElement(
      "div"
    );

  emotion.className =
    "tama-emotion";

  emotion.textContent =
    emoji;


  const room =
    document.getElementById(
      "tamaScreen"
    );


  const rect =
    potato.element.getBoundingClientRect();

  const roomRect =
    room.getBoundingClientRect();


  emotion.style.left =
    (
      rect.left -
      roomRect.left +
      15
    ) + "px";


  emotion.style.top =
    (
      rect.top -
      roomRect.top -
      10
    ) + "px";


  room.appendChild(
    emotion
  );


  setTimeout(
    ()=>emotion.remove(),
    1200
  );

}


/* ==================================================
   다마고치 쓰다듬기
================================================== */

function tamaPet(){

  if(!roomPotatoes.length){
    return;
  }


  roomPotatoes.forEach(
    potato=>{

      potato.element.style.transform =
        "translateY(-12px)";

      setTimeout(()=>{

        potato.element.style.transform =
          "translateY(0)";

      },350);

    }
  );


  roomPotatoes.forEach(
    potato=>{

      showTamaEmotion(
        potato,
        "❤️"
      );

    }
  );

}


/* ==================================================
   간식
================================================== */

function tamaSnack(){

  const room =
    document.getElementById(
      "tamaScreen"
    );


  const snack =
    document.createElement(
      "div"
    );


  snack.className =
    "tama-emotion";

  snack.textContent =
    "🍬";

  snack.style.left =
    (
      20 +
      Math.random()*60
    ) + "%";

  snack.style.top =
    "0px";

  snack.style.animation =
    "none";

  snack.style.transition =
    "top 1s linear";


  room.appendChild(
    snack
  );


  requestAnimationFrame(()=>{

    snack.style.top =
      "75%";

  });


  setTimeout(
    ()=>snack.remove(),
    1100
  );


  roomPotatoes.forEach(
    potato=>{

      showTamaEmotion(
        potato,
        "😋"
      );

    }
  );

}


/* ==================================================
   잠자기
================================================== */

function tamaSleep(){

  const overlay =
    document.getElementById(
      "sleepOverlay"
    );


  overlay.classList.add(
    "show"
  );


  clearTimeout(
    sleepTimer
  );


  sleepTimer =
    setTimeout(()=>{

      overlay.classList.remove(
        "show"
      );

    },10000);

}


/* ==================================================
   대장감자 따라가기
================================================== */

setInterval(()=>{

  if(
    !followLeader ||
    !roomPotatoes.length
  ){
    return;
  }


  const leader =
    roomPotatoes.find(
      p=>p.id === "Potato2"
    );


  if(!leader){
    return;
  }


  roomPotatoes.forEach(
    potato=>{

      if(
        potato === leader ||
        potato.id === "Potato3"
      ){
        return;
      }


      const leaderRect =
        leader.element.getBoundingClientRect();


      const room =
        document.getElementById(
          "tamaScreen"
        );

      const roomRect =
        room.getBoundingClientRect();


      const targetX =
        leaderRect.left -
        roomRect.left -
        60;


      const targetY =
        leaderRect.top -
        roomRect.top +
        (
          Math.random()*50-25
        );


      potato.element.style.left =
        Math.max(
          0,
          Math.min(
            roomRect.width - 55,
            targetX
          )
        ) + "px";


      potato.element.style.top =
        Math.max(
          0,
          Math.min(
            roomRect.height - 55,
            targetY
          )
        ) + "px";


      potato.element.classList.add(
        "following"
      );

    }
  );

},1000);


/* ==================================================
   날짜
================================================== */

setInterval(()=>{

  if(currentPotato){

    day++;

    document
      .getElementById(
        "dayText"
      )
      .textContent =
        day;

  }

},60000);


/* ==================================================
   기본 스탯 감소
================================================== */

setInterval(()=>{

  if(
    !currentPotato ||
    !document
      .getElementById(
        "growScreen"
      )
      .classList.contains("active")
  ){
    return;
  }


  stats.hunger =
    Math.max(
      0,
      stats.hunger - 2
    );

  stats.water =
    Math.max(
      0,
      stats.water - 2
    );

  stats.energy =
    Math.max(
      0,
      stats.energy - 1
    );


  updateStats();

},10000);
