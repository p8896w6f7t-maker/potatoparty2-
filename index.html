<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>감자키우기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:#f4ead8;
  color:#34291f;
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

/* 시작 화면 */
#startScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(#fff7e9,#ead8ba);
}

.start-potato{
  font-size:90px;
  animation:bob 1.8s infinite ease-in-out;
}

#startScreen h1{
  margin:8px 0 25px;
  font-size:34px;
}

.start-btn{
  background:#765333;
  color:white;
  padding:14px 55px;
  border-radius:18px;
  font-weight:700;
  font-size:20px;
}

/* 공통 */
.page{
  width:100%;
  height:100%;
  display:none;
  padding-bottom:66px;
}

.page.active{
  display:block;
}

.top{
  position:relative;
  height:100%;
}

.scroll{
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:100px;
}

/* 성장 화면 */
.grow-fixed{
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  top:0;
  background:#fff9ef;
  box-shadow:0 2px 12px #0002;
}

.grow-title{
  padding:12px 16px 4px;
  font-size:14px;
  color:#8b735d;
}

.day{
  font-size:13px;
  color:#8b735d;
}

.potato-info{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:10px;
  padding:5px 15px 12px;
}

.potato-visual{
  width:100px;
  height:110px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.potato-visual img{
  max-width:95px;
  max-height:105px;
  object-fit:contain;
  display:none;
}

.potato-emoji{
  font-size:70px;
}

.message-box{
  background:white;
  border:2px solid #d8c2a4;
  border-radius:14px;
  padding:9px;
  min-height:60px;
  margin-bottom:5px;
  font-size:14px;
}

.name{
  font-size:18px;
  font-weight:800;
}

.personality{
  font-size:12px;
  color:#786653;
  margin-top:4px;
}

.grow-body{
  padding:0 14px;
}

.grow-spacer{
  height:255px;
}

.growth-box{
  background:#fff9ef;
  border-radius:18px;
  padding:13px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.stage{
  text-align:center;
  font-size:55px;
  height:70px;
}

.growth-number{
  text-align:center;
  font-weight:800;
  margin-bottom:6px;
}

.progress{
  height:13px;
  border-radius:20px;
  background:#e0d3c1;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#7a9b4b;
  transition:.25s;
}

.growth-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.action-btn{
  padding:11px 5px;
  border-radius:12px;
  background:#eee0ca;
  font-size:14px;
  font-weight:700;
}

.stats{
  background:#fff9ef;
  border-radius:18px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.stats h3{
  margin:0 0 10px;
  font-size:15px;
}

.stat-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
}

.circle{
  width:43px;
  height:43px;
  border-radius:50%;
  position:relative;
  background:conic-gradient(#8aa75b 0deg,#8aa75b var(--value),#ded3c4 var(--value));
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.circle:after{
  content:"";
  position:absolute;
  inset:5px;
  background:#fff9ef;
  border-radius:50%;
}

.circle span{
  position:relative;
  z-index:2;
  font-size:9px;
  font-weight:800;
}

.stat-label{
  line-height:1.3;
}

.interactions{
  background:#fff9ef;
  border-radius:18px;
  padding:12px;
  box-shadow:0 2px 8px #0001;
}

.interactions h3{
  margin:0 0 9px;
  font-size:15px;
}

.interaction-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.interaction-grid button{
  padding:13px 4px;
  border-radius:12px;
  background:#eee0ca;
  font-weight:700;
  font-size:14px;
}

/* 방 */
.room-tabs{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff9ef;
  padding:8px;
  display:flex;
  gap:5px;
  overflow-x:auto;
}

.room-tab{
  flex:1;
  min-width:65px;
  padding:8px 3px;
  border-radius:10px;
  background:#e4d5bf;
  font-size:12px;
}

.room-tab.active{
  background:#765333;
  color:white;
}

.room{
  height:280px;
  margin:0 10px 12px;
  border:5px solid #765333;
  border-radius:14px;
  position:relative;
  overflow:hidden;
  background:#d9c3a5;
  touch-action:none;
}

.wall{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:65%;
  background:#eadcc8;
}

.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:35%;
  background:#b99670;
  background-image:
    repeating-linear-gradient(
      90deg,
      transparent 0 39px,
      #a98560 40px 42px
    );
}

.window{
  position:absolute;
  width:75px;
  height:58px;
  top:18px;
  left:18px;
  background:#a9d8e5;
  border:5px solid #79563b;
}

.window:before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:4px;
  background:#79563b;
}

.window:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:4px;
  background:#79563b;
}

.sofa{
  position:absolute;
  right:20px;
  bottom:43px;
  width:105px;
  height:48px;
  background:#8e6247;
  border:5px solid #67462f;
  border-radius:8px;
}

.tv{
  position:absolute;
  right:24px;
  top:22px;
  width:65px;
  height:45px;
  background:#292522;
  border:5px solid #514239;
}

.tv:after{
  content:"";
  position:absolute;
  width:24px;
  height:5px;
  background:#514239;
  bottom:-11px;
  left:16px;
}

.table{
  position:absolute;
  left:35%;
  bottom:35px;
  width:70px;
  height:22px;
  background:#7a5136;
  border:4px solid #583a28;
}

.kitchen{
  position:absolute;
  left:20px;
  bottom:40px;
  width:90px;
  height:70px;
  background:#f1eee7;
  border:5px solid #817b70;
}

.bed{
  position:absolute;
  left:25px;
  bottom:42px;
  width:140px;
  height:65px;
  background:#e8d4d8;
  border:5px solid #765333;
}

.bathtub{
  position:absolute;
  right:25px;
  bottom:40px;
  width:125px;
  height:65px;
  background:#f5f5f2;
  border:5px solid #888;
  border-radius:25px;
}

.playground-bg{
  background:#8bc56c;
}

.playground-bg .wall{
  background:#91cf72;
}

.playground-bg .floor{
  background:#72b259;
}

.pixel-object{
  position:absolute;
  font-size:28px;
  image-rendering:pixelated;
}

.room-potato{
  position:absolute;
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  z-index:5;
  touch-action:none;
  transform:translate(-50%,-50%);
  transition:filter .15s;
}

.room-potato.dragging{
  z-index:50;
  transform:translate(-50%,-50%) scale(1.15);
}

.room-potato.bounce{
  animation:jump .55s;
}

.room-potato.stunned{
  animation:stun .5s infinite alternate;
  filter:grayscale(.5);
}

.room-potato img{
  width:38px;
  height:38px;
  object-fit:contain;
  image-rendering:auto;
  pointer-events:none;
}

.room-emoji{
  position:absolute;
  z-index:100;
  font-size:25px;
  pointer-events:none;
  animation:emojiFloat 1s forwards;
}

/* 다마고치 */
.dex{
  height:100%;
  overflow-y:auto;
  padding-bottom:90px;
}

.dex-head{
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.dex-head h2{
  margin:0;
  font-size:19px;
}

.back-grow{
  background:#e4d5bf;
  padding:7px 10px;
  border-radius:9px;
  font-size:12px;
}

.tamagotchi{
  width:calc(100% - 20px);
  max-width:430px;
  height:390px;
  margin:0 auto 12px;
  border:8px solid #49362a;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:#cdb895;
  touch-action:none;
}

.pixel-wall{
  position:absolute;
  inset:0 0 34% 0;
  background:#c8b18e;
  background-image:
    linear-gradient(#bca47e 2px,transparent 2px),
    linear-gradient(90deg,#bca47e 2px,transparent 2px);
  background-size:24px 24px;
}

.pixel-floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:34%;
  background:#8c6747;
  background-image:
    repeating-linear-gradient(
      90deg,
      #79583d 0 2px,
      transparent 2px 24px
    );
}

.pixel-window{
  position:absolute;
  left:18px;
  top:20px;
  width:90px;
  height:70px;
  background:#79b9d1;
  border:7px solid #60432d;
}

.pixel-window:before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:6px;
  background:#60432d;
}

.pixel-window:after{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:6px;
  background:#60432d;
}

.pixel-sofa{
  position:absolute;
  right:18px;
  bottom:62px;
  width:115px;
  height:65px;
  background:#774e39;
  border:7px solid #513523;
}

.pixel-tv{
  position:absolute;
  right:25px;
  top:28px;
  width:72px;
  height:55px;
  background:#201e1b;
  border:7px solid #473a31;
}

.pixel-tv:after{
  content:"";
  position:absolute;
  bottom:-15px;
  left:23px;
  width:12px;
  height:9px;
  background:#473a31;
}

.tamo-potato{
  position:absolute;
  width:38px;
  height:38px;
  z-index:20;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  touch-action:none;
}

.tamo-potato img{
  width:32px;
  height:32px;
  object-fit:contain;
  image-rendering:pixelated;
  pointer-events:none;
}

.tamo-potato.walk{
  animation:walk .45s infinite alternate;
}

.tamo-potato.sleep{
  animation:sleep .8s infinite alternate;
  opacity:.7;
}

.tamo-potato.spin{
  animation:spin .6s;
}

.tamo-potato.jump{
  animation:jump .55s;
}

.dex-controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:0 10px 12px;
}

.dex-controls button{
  background:#765333;
  color:white;
  border-radius:11px;
  padding:11px 3px;
  font-size:13px;
  font-weight:700;
}

.collection{
  margin:0 10px;
  background:#fff9ef;
  border-radius:16px;
  padding:13px;
}

.collection h3{
  margin:0;
}

.collection p{
  margin:4px 0 12px;
  color:#877360;
  font-size:12px;
}

.collection-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 0;
  border-top:1px solid #e4d8c7;
}

.collection-img{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.toggle{
  margin-left:auto;
  width:46px;
  height:26px;
  border-radius:20px;
  background:#bbb;
  padding:3px;
}

.toggle.on{
  background:#78994e;
}

.toggle i{
  display:block;
  width:20px;
  height:20px;
  border-radius:50%;
  background:white;
  transition:.2s;
}

.toggle.on i{
  transform:translateX(20px);
}

.candy{
  position:absolute;
  z-index:200;
  font-size:25px;
  animation:candyFall 1.3s linear forwards;
  pointer-events:none;
}

.float-message{
  position:absolute;
  z-index:300;
  font-weight:800;
  font-size:15px;
  pointer-events:none;
  animation:messageFloat 1.3s forwards;
}

.bottom-nav{
  position:absolute;
  z-index:500;
  bottom:0;
  left:0;
  right:0;
  height:66px;
  background:#fff9ef;
  border-top:1px solid #d8c8b4;
  display:flex;
}

.bottom-nav button{
  flex:1;
  background:transparent;
  font-size:13px;
  color:#806c58;
}

.bottom-nav button.active{
  color:#65462c;
  font-weight:800;
}

.hidden{
  display:none!important;
}

@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

@keyframes jump{
  0%{transform:translate(-50%,-50%)}
  50%{transform:translate(-50%,-90%) rotate(8deg)}
  100%{transform:translate(-50%,-50%)}
}

@keyframes walk{
  from{transform:translate(-50%,-50%) rotate(-8deg)}
  to{transform:translate(-50%,-50%) rotate(8deg)}
}

@keyframes spin{
  0%{transform:translate(-50%,-50%) rotate(0)}
  100%{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes stun{
  from{transform:translate(-50%,-50%) rotate(-12deg)}
  to{transform:translate(-50%,-50%) rotate(12deg)}
}

@keyframes sleep{
  from{transform:translate(-50%,-50%) translateY(0)}
  to{transform:translate(-50%,-50%) translateY(5px)}
}

@keyframes emojiFloat{
  0%{opacity:0;transform:translateY(10px) scale(.7)}
  30%{opacity:1}
  100%{opacity:0;transform:translateY(-35px) scale(1.2)}
}

@keyframes messageFloat{
  0%{opacity:0;transform:translateY(5px)}
  20%{opacity:1}
  100%{opacity:0;transform:translateY(-35px)}
}

@keyframes candyFall{
  from{transform:translateY(-20px) rotate(0)}
  to{transform:translateY(360px) rotate(360deg)}
}
</style>
</head>

<body>
<div id="app">

<!-- 시작 -->
<section id="startScreen">
  <div class="start-potato">🥔</div>
  <h1>감자키우기</h1>
  <button class="start-btn" id="startBtn">시작</button>
</section>

<!-- 키우기 -->
<section id="growPage" class="page">
  <div class="top">

    <div class="grow-fixed">
      <div class="grow-title">
        <b>나의 감자</b>
        <span class="day" id="dayText"> · 1일차</span>
      </div>

      <div class="potato-info">
        <div class="potato-visual" id="mainVisual"></div>

        <div>
          <div class="message-box" id="messageBox">
            감자를 키워보자!
          </div>
          <div class="name" id="potatoName">새싹감자</div>
          <div class="personality" id="personalityText">
            성격 • 아직 감자가 태어나지 않았어요.
          </div>
        </div>
      </div>
    </div>

    <div class="scroll" id="growScroll">
      <div class="grow-body">
        <div class="grow-spacer"></div>

        <div class="growth-box">
          <div class="stage" id="stageEmoji">🌱</div>
          <div class="growth-number" id="growthText">성장도 0%</div>

          <div class="progress">
            <div class="progress-fill" id="growthFill"></div>
          </div>

          <div class="growth-buttons">
            <button class="action-btn" id="fertilizerBtn">🌱 비료 주기</button>
            <button class="action-btn" id="waterGrowBtn">💧 물 주기</button>
            <button class="action-btn" id="sunBtn">☀️ 햇빛 쬐기</button>
            <button class="action-btn" id="cheerBtn">💕 응원하기</button>
          </div>
        </div>

        <div class="stats">
          <h3>감자 상태</h3>

          <div class="stat-list">

            <div class="stat">
              <div class="circle" id="hungerCircle">
                <span id="hungerValue">0</span>
              </div>
              <div class="stat-label">🍖 배고픔<br>0 / 100</div>
            </div>

            <div class="stat">
              <div class="circle" id="waterCircle">
                <span id="waterValue">0</span>
              </div>
              <div class="stat-label">💧 수분<br>0 / 100</div>
            </div>

            <div class="stat">
              <div class="circle" id="loveCircle">
                <span id="loveValue">0</span>
              </div>
              <div class="stat-label">❤️ 사랑<br>0 / 100</div>
            </div>

            <div class="stat">
              <div class="circle" id="energyCircle">
                <span id="energyValue">0</span>
              </div>
              <div class="stat-label">⚡ 체력<br>0 / 100</div>
            </div>

          </div>
        </div>

        <div class="interactions">
          <h3>상호작용</h3>

          <div class="interaction-grid">
            <button id="feedBtn">🍖 먹이 주기</button>
            <button id="waterBtn">💧 물 주기</button>
            <button id="petBtn">❤️ 쓰다듬기</button>
            <button id="walkBtn">🏃 산책하기</button>
            <button id="harvestBtn">🥔 수확하기</button>
            <button id="dictionaryBtn">📖 감자사전</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<!-- 감자사전 -->
<section id="dexPage" class="page">

  <div class="dex">

    <div class="dex-head">
      <div>
        <h2>감자사전 <span class="day" id="dexDay">· 1일차</span></h2>
      </div>

      <button class="back-grow" id="backGrow">
        키우기로 돌아가기
      </button>
    </div>

    <div class="tamagotchi" id="tamagotchi">

      <div class="pixel-wall"></div>
      <div class="pixel-floor"></div>

      <div class="pixel-window"></div>
      <div class="pixel-sofa"></div>
      <div class="pixel-tv"></div>

    </div>

    <div class="dex-controls">
      <button id="dexPet">❤️ 쓰다듬기</button>
      <button id="dexSnack">🍬 간식주기</button>
      <button id="dexSleep">😴 잠자기</button>
    </div>

    <div class="collection">
      <h3>감자 사전</h3>
      <p>지금까지 만난 감자들이에요</p>

      <b id="collectionCount">발견한 감자 0/5</b>

      <div id="collectionList"></div>
    </div>

  </div>
</section>

<!-- 하단 -->
<nav class="bottom-nav hidden" id="bottomNav">
  <button id="navGrow">🏠<br>키우기</button>
  <button id="navDex">📖<br>감자사전</button>
</nav>

</div>

<script>
/* =========================================================
   감자 데이터
========================================================= */

const POTATOES = {

  Potato1:{
    name:"꾼감자",
    personality:"모두를 좋아하고 하트 이모지를 남발하는 감자.",
    lines:[
      "너무 좋아! ❤️",
      "하트 받아라! ❤️❤️",
      "같이 놀자! 💕",
      "너도 좋아!"
    ]
  },

  Potato2:{
    name:"대장감자",
    personality:"책임감이 강하고 저능감자를 가장 좋아하는 감자.",
    lines:[
      "다들 따라와!",
      "대장은 내가 한다.",

function changeGrowth(amount){

  if(state.currentPotato){
    message(
      "이미 감자가 태어났어! 먼저 수확해줘."
    );
    return;
  }

  state.growth =
    Math.max(
      0,
      Math.min(
        100,
        state.growth + amount
      )
    );

  updateStage();

  if(state.growth >= 100){

    birthPotato();

  }

  save();

}


function updateStage(){

  let emoji = "🌱";

  if(state.growth >= 75){
    emoji = "🥔";
  }
  else if(state.growth >= 50){
    emoji = "🌳";
  }
  else if(state.growth >= 25){
    emoji = "🌿";
  }

  document
    .getElementById("stageEmoji")
    .textContent = emoji;

  document
    .getElementById("growthText")
    .textContent =
      "성장도 " + state.growth + "%";

  document
    .getElementById("growthFill")
    .style.width =
      state.growth + "%";

}

function birthPotato(){

  const ids =
    Object.keys(POTATOES);

  const id =
    ids[
      Math.floor(
        Math.random() * ids.length
      )
    ];

  state.currentPotato = id;

  state.hunger = 50;
  state.water = 50;
  state.love = 50;
  state.energy = 80;

  if(!state.collection.includes(id)){

    state.collection.push(id);

    /* 처음 발견한 감자는 기본 ON */
    if(!state.activePotatoes.includes(id)){
      state.activePotatoes.push(id);
    }

  }

  const p = POTATOES[id];

  message(
    p.lines[
      Math.floor(
        Math.random()*p.lines.length
      )
    ]
  );

  renderGrow();
  renderCollection();

  save();

}

/* =========================================================
   감자 이동
========================================================= */

function moveRoomPotatoes(){

  const room =
    document.getElementById(
      "tamagotchi"
    );

  if(!room) return;

  state.activePotatoes.forEach(
    id=>{

      const pos =
        state.roomPositions[id];

      if(!pos) return;

      if(tamoObjects[id]?.dragging){
        return;
      }

      if(
        id === "Potato3"
      ){

        /* 독감자는 혼자 다님 */
        pos.vx +=
          (Math.random()-.5)*1.2;

        pos.vy +=
          (Math.random()-.5)*1.2;

      }
      else if(
        state.leaderFollowing &&
        id !== "Potato2"
      ){

        const leader =
          state.roomPositions.Potato2;

        if(
          leader &&
          id !== "Potato3"
        ){

          const dx =
            leader.x-pos.x;

          const dy =
            leader.y-pos.y;

          pos.vx += dx*.002;
          pos.vy += dy*.002;

        }

      }
      else{

        pos.vx +=
          (Math.random()-.5)*.8;

        pos.vy +=
          (Math.random()-.5)*.8;

      }

      const speed =
        Math.sqrt(
          pos.vx*pos.vx+
          pos.vy*pos.vy
        );

      if(speed>2.2){

        pos.vx =
          pos.vx/speed*2.2;

        pos.vy =
          pos.vy/speed*2.2;

      }

      pos.x += pos.vx*8;
      pos.y += pos.vy*8;

      if(pos.x<25){
        pos.x=25;
        pos.vx=Math.abs(pos.vx);
      }

      if(pos.x>390){
        pos.x=390;
        pos.vx=-Math.abs(pos.vx);
      }

      if(pos.y<105){
        pos.y=105;
        pos.vy=Math.abs(pos.vy);
      }

      if(pos.y>335){
        pos.y=335;
        pos.vy=-Math.abs(pos.vy);
      }

      const el =
        room.querySelector(
          `.tamo-potato[data-id="${id}"]`
        );

      if(el){

        el.style.left =
          pos.x+"px";

        el.style.top =
          pos.y+"px";

        if(
          Math.abs(pos.vx)+
          Math.abs(pos.vy)>2
        ){
          el.classList.add("walk");
        }
        else{
          el.classList.remove("walk");
        }

      }

    }
  );

}


/* =========================================================
   터치 / 드래그
========================================================= */

function setupTamoTouch(
  el,
  id
){

  let timer=null;
  let dragging=false;

  tamoObjects[id]={
    dragging:false
  };

  el.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      el.setPointerCapture(
        e.pointerId
      );

      timer =
        setTimeout(
          ()=>{
            dragging=true;

            tamoObjects[id].dragging=true;

            el.classList.add(
              "dragging"
            );

            if(id==="Potato2"){

              state.leaderFollowing=true;

              showTamoMessage(
                el,
                "다들 따라와! 🫡"
              );

            }

          },
          420
        );

    },
    {passive:false}
  );


  el.addEventListener(
    "pointermove",
    function(e){

      if(!dragging) return;

      e.preventDefault();

      const room =
        document.getElementById(
          "tamagotchi"
        );

      const rect =
        room.getBoundingClientRect();

      const x =
        e.clientX-rect.left;

      const y =
        e.clientY-rect.top;

      state.roomPositions[id].x =
        Math.max(
          25,
          Math.min(
            rect.width-25,
            x
          )
        );

      state.roomPositions[id].y =
        Math.max(
          100,
          Math.min(
            rect.height-30,
            y
          )
        );

      el.style.left =
        state.roomPositions[id].x+"px";

      el.style.top =
        state.roomPositions[id].y+"px";

    },
    {passive:false}
  );


  el.addEventListener(
    "pointerup",
    function(){

      clearTimeout(timer);

      if(dragging){

        dragging=false;

        tamoObjects[id].dragging=false;

        el.classList.remove(
          "dragging"
        );

        /*
          대장감자의 추종 상태는
          손을 떼도 유지된다.
        */

      }
      else{

        potatoTouched(
          id,
          el
        );

      }

    }
  );


  el.addEventListener(
    "pointercancel",
    function(){

      clearTimeout(timer);

      dragging=false;

      tamoObjects[id].dragging=false;

      el.classList.remove(
        "dragging"
      );

    }
  );


  el.addEventListener(
    "contextmenu",
    e => e.preventDefault()
  );

}


/* =========================================================
   감자 터치
========================================================= */

function potatoTouched(
  id,
  el
){

  const p =
    POTATOES[id];

  el.classList.remove(
    "jump",
    "spin"
  );

  void el.offsetWidth;

  if(id==="Potato1"){

    el.classList.add("jump");

    showTamoMessage(
      el,
      "❤️❤️❤️"
    );

  }
  else if(id==="Potato2"){

    el.classList.add("jump");

    showTamoMessage(
      el,
      "🫡 대장 등장!"
    );

  }
  else if(id==="Potato3"){

    el.classList.add("spin");

    showTamoMessage(
      el,
      "☠️ 건드리지 마."
    );

  }
  else if(id==="Potato4"){

    el.classList.add("jump");

    showTamoMessage(
      el,
      "👊 뭐야!"
    );

  }
  else{

    el.classList.add("jump");

    showTamoMessage(
      el,
      "💕 헤헤!"
    );

  }

}


/* =========================================================
   감자끼리 상호작용
========================================================= */

function potatoInteractions(){

  const ids =
    state.activePotatoes;

  for(
    let i=0;
    i<ids.length;
    i++
  ){

    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const a=ids[i];
      const b=ids[j];

      const pa =
        state.roomPositions[a];

      const pb =
        state.roomPositions[b];

      if(!pa || !pb) continue;

      const dx =
        pa.x-pb.x;

      const dy =
        pa.y-pb.y;

      const distance =
        Math.sqrt(
          dx*dx+dy*dy
        );

      if(distance>60) continue;


      /*
        독감자
      */
      if(
        a==="Potato3" ||
        b==="Potato3"
      ){

        const other =
          a==="Potato3" ? b : a;

        /*
          폭력감자는 독감자 스턴 면역
        */
        if(
          other!=="Potato4" &&
          Math.random()<.10
        ){

          stunPotato(other);

          showInteractionEmoji(
            other,
            "⚡"
          );

        }

        /*
          폭력감자와 독감자는 친함
        */
        if(other==="Potato4"){

          showInteractionEmoji(
            "Potato4",
            "❤️"
          );

          showInteractionEmoji(
            "Potato3",
            "🖤"
          );

        }

        continue;

      }


      /*
        꾼감자
      */
      if(a==="Potato1"){

        showInteractionEmoji(
          a,
          "❤️"
        );

      }

      if(b==="Potato1"){

        showInteractionEmoji(
          b,
          "❤️"
        );

      }


      /*
        대장감자 → 저능감자
      */
      if(
        (a==="Potato2"&&b==="Potato5") ||
        (a==="Potato5"&&b==="Potato2")
      ){

        showInteractionEmoji(
          a,
          "💕"
        );

        showInteractionEmoji(
          b,
          "💕"
        );

      }


      /*
        저능감자는 사랑받음
      */
      if(
        a==="Potato5" &&
        b!=="Potato3"
      ){

        showInteractionEmoji(
          b,
          "💕"
        );

      }

      if(
        b==="Potato5" &&
        a!=="Potato3"
      ){

        showInteractionEmoji(
          a,
          "💕"
        );

      }


      /*
        폭력감자 → 시비
      */
      if(
        a==="Potato4" &&
        b!=="Potato5"
      ){

        showInteractionEmoji(
          a,
          "👊"
        );

      }

      if(
        b==="Potato4" &&
        a!=="Potato5"
      ){

        showInteractionEmoji(
          b,
          "👊"
        );

      }

    }

  }

}


/* =========================================================
   스턴
========================================================= */

function stunPotato(id){

  if(id==="Potato4"){
    return;
  }

  const el =
    document.querySelector(
      `.tamo-potato[data-id="${id}"]`
    );

  if(!el) return;

  el.classList.add("sleep");

  showTamoMessage(
    el,
    "⚡ 스턴!"
  );

  if(state.roomPositions[id]){

    state.roomPositions[id].vx=0;
    state.roomPositions[id].vy=0;

  }

  setTimeout(
    ()=>{

      el.classList.remove(
        "sleep"
      );

    },
    3000
  );

}


/* =========================================================
   다마고치 메시지
========================================================= */

function showTamoMessage(
  target,
  text
){

  const room =
    document.getElementById(
      "tamagotchi"
    );

  const msg =
    document.createElement(
      "div"
    );

  msg.className =
    "float-message";

  msg.textContent =
    text;

  msg.style.left =
    target.offsetLeft + "px";

  msg.style.top =
    Math.max(
      10,
      target.offsetTop-35
    ) + "px";

  room.appendChild(msg);

  setTimeout(
    ()=>msg.remove(),
    1300
  );

}


function showInteractionEmoji(
  id,
  emoji
){

  const room =
    document.getElementById(
      "tamagotchi"
    );

  const el =
    room.querySelector(
      `.tamo-potato[data-id="${id}"]`
    );

  if(!el) return;

  const em =
    document.createElement(
      "div"
    );

  em.className =
    "room-emoji";

  em.textContent =
    emoji;

  em.style.left =
    el.offsetLeft+"px";

  em.style.top =
    (el.offsetTop-20)+"px";

  room.appendChild(em);

  setTimeout(
    ()=>em.remove(),
    1000
  );

}

/* =========================================================
   잠자기
========================================================= */

document
  .getElementById("dexSleep")
  .onclick=function(){

    state.sleepUntil =
      Date.now()+10000;

    state.activePotatoes.forEach(
      id=>{

        const el =
          document.querySelector(
            `.tamo-potato[data-id="${id}"]`
          );

        if(el){

          el.classList.add(
            "sleep"
          );

          showTamoMessage(
            el,
            "😴"
          );

        }

      }
    );

    setTimeout(
      ()=>{

        document
          .querySelectorAll(
            ".tamo-potato"
          )
          .forEach(
            el =>
              el.classList.remove(
                "sleep"
              )
          );

      },
      10000
    );

  };


/* =========================================================
   주기적인 스탯 감소
========================================================= */

setInterval(
  function(){

    if(!state.started){
      return;
    }

    if(state.currentPotato){

      state.hunger =
        Math.max(
          0,
          state.hunger-1
        );

      state.water =
        Math.max(
          0,
          state.water-1
        );

      state.energy =
        Math.max(
          0,
          state.energy-.5
        );

    }

    save();
    updateStats();

  },
  30000
);
