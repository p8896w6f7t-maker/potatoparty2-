<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>감자 키우기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:#f8f0df;color:#4b351f;text-align:center}
button{border:0;border-radius:14px;padding:13px 18px;margin:5px;background:#fff3d2;color:#4b351f;font-size:16px;font-weight:bold}
.screen{display:none;min-height:100vh;padding:28px 16px}.on{display:block}
h1{margin:10px 0;font-size:34px}h2{margin:8px}
.sub{color:#866d52;margin-bottom:25px}
.big{font-size:100px;margin:35px 0}
.bar{height:18px;background:#eadbc2;border-radius:20px;overflow:hidden;margin:12px 0}
.fill{height:100%;background:#86b96b;width:0%;transition:.3s}
.box{background:#fffaf0;border-radius:18px;padding:15px;margin:12px auto;max-width:500px;box-shadow:0 3px 12px #0001}
.sticky-top{position:sticky;top:0;z-index:50;background:#f8f0df;padding-bottom:8px}
#potatoWrap{font-size:100px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.jump{animation:jump .45s}.wiggle{animation:wig .45s}.spin{animation:spin .5s}.shy{animation:shy .45s}.angry{animation:ang .4s}.happy{animation:happy .5s}
@keyframes jump{50%{transform:translateY(-25px) scale(1.1)}}@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes shy{50%{transform:scale(.8)}}@keyframes ang{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes happy{50%{transform:scale(1.18)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#fff3df;border-radius:12px;padding:10px}
#playground{position:relative;height:430px;background:#dff0cf;border:5px solid #9b7650;border-radius:22px;overflow:hidden;touch-action:none}
.play-potato{position:absolute;width:55px;height:55px;background-size:contain;background-repeat:no-repeat;background-position:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s}
.play-potato.held{transform:scale(1.25);filter:drop-shadow(0 7px 5px #0005);z-index:20}
.play-potato.leader-near{transform:scale(1.05)}
.pg-stunned{filter:grayscale(.4)}
.label{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:#fff9;padding:2px 5px;border-radius:6px}
.effect{position:absolute;pointer-events:none;font-size:24px;animation:effect 1s forwards;z-index:30}
@keyframes effect{0%{opacity:1;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-45px) scale(1.3)}}
.collection-card{background:#fffaf0;border-radius:15px;padding:15px;margin:10px auto;max-width:420px}
.collection-card img{width:100px;height:100px;object-fit:contain}
.hidden-potato{font-size:65px}
.small{font-size:13px;color:#8d755c}
</style>
</head>
<body>

<section id="start" class="screen on">
<h1>🥔</h1>
<h1>감자 키우기</h1>
<p class="sub">나만의 감자를 키워보세요!</p>
<button onclick="startGame()">감자 키우기 시작</button>
</section>

<section id="before" class="screen">
<div class="sticky-top"><h2 id="dayText">1일차</h2></div>
<div id="growthEmoji" class="big">🌱</div>
<h2 id="growthText">감자가 자라고 있어요!</h2>
<div class="box">
<div id="growthPercent">0%</div>
<div class="bar"><div id="growthFill" class="fill"></div></div>
</div>
<button onclick="grow(12)">🪴 비료주기</button>
<button onclick="grow(10)">💧 물주기</button>
<button onclick="grow(8)">☀️ 햇빛주기</button>
<button onclick="grow(5)">💗 응원하기</button>
<br>
<button onclick="hatch()">🥔 감자 만들기</button>
<button onclick="showCollection()">📖 도감 보기</button>
</section>

<section id="game" class="screen">
<div class="sticky-top">
<h2 id="gameDay">1일차</h2>
<div id="message" class="box">감자가 태어났어요!</div>
</div>
<div id="potatoWrap">🥔</div>
<h2 id="potatoName">감자</h2>
<p id="personality"></p>
<div class="stats">
<div class="stat">🍚 배고픔 <b id="hunger">100</b></div>
<div class="stat">💧 수분 <b id="water">100</b></div>
<div class="stat">❤️ 사랑 <b id="love">100</b></div>
<div class="stat">⚡ 에너지 <b id="energy">100</b></div>
</div>
<div class="box">
<button onclick="action('feed')">🍚 먹이주기</button>
<button onclick="action('water')">💧 물주기</button>
<button onclick="action('pet')">❤️ 쓰다듬기</button>
<button onclick="action('walk')">🏃 산책하기</button>
</div>
<button onclick="harvest()">🥔 수확하기</button>
<button onclick="showCollection()">📖 도감 보기</button>
</section>

<section id="collection" class="screen">
<h1>📖 감자 도감</h1>
<h3 id="count">발견한 감자 0 / 5</h3>
<div id="cards"></div>
<button onclick="backGame()">돌아가기</button>
</section>

<section id="play" class="screen">
<h1>🥔 감자 놀이터</h1>
<p class="small">감자를 길게 누르면 잡을 수 있어요</p>
<div id="playground"></div>
<button onclick="backGame()">돌아가기</button>
</section>

<script>
const potatoes=[
{name:"꾼감자",img:"Potato1.PNG",type:"social"},
{name:"대장감자",img:"Potato2.PNG",type:"leader"},
{name:"독감자",img:"Potato3.PNG",type:"poison"},
{name:"폭력감자",img:"Potato4.PNG",type:"violent"},
{name:"저능감자",img:"Potato5.PNG",type:"silly"}
];
const personalities=["애교쟁이","느긋한","장난꾸러기","호기심 많은","겁이 많은"];
let state=JSON.parse(localStorage.getItem("POTATO_GAME_FINAL_V6")||"null")||{
started:false,born:false,day:1,growth:0,character:null,personality:null,
hunger:100,water:100,love:100,energy:100,collection:[]
};
if(!state.day)state.day=1;
let timer;

function save(){localStorage.setItem("POTATO_GAME_FINAL_V6",JSON.stringify(state))}
function screen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on")}
function startGame(){
state.started=true;state.born=false;state.growth=0;state.character=null;state.personality=null;
save();showBefore()
}
function showBefore(){
screen("before");updateGrowth();document.getElementById("dayText").textContent=state.day+"일차"
}
function grow(n){
if(state.born)return;
state.growth=Math.min(100,state.growth+n);save();updateGrowth()
}
function updateGrowth(){
let g=state.growth,e=g<25?"🌱":g<50?"🌿":g<75?"🌳":g<100?"🥔":"🥔";
growthEmoji.textContent=e;growthPercent.textContent=g+"%";growthFill.style.width=g+"%"
}
function hatch(){
if(state.growth<100){message("아직 감자가 다 자라지 않았어요!");return}
state.born=true;
state.character=potatoes[Math.floor(Math.random()*potatoes.length)];
state.personality=personalities[Math.floor(Math.random()*personalities.length)];
state.hunger=100;state.water=100;state.love=100;state.energy=100;
save();showGame(true)
}
function showGame(first=false){
screen("game");gameDay.textContent=state.day+"일차";
potatoName.textContent=state.character.name;
potatoWrap.textContent="";
potatoWrap.style.background="url('"+state.character.img+"') center/contain no-repeat";
potatoWrap.style.height="130px";
personality.textContent="성격은 "+state.personality+"이에요";
if(first)message("감자가 태어났어요!");
updateStats();clearInterval(timer);
timer=setInterval(decay,10000)
}
function message(t){document.getElementById("message").textContent=t}
function updateStats(){
hunger.textContent=state.hunger;water.textContent=state.water;
love.textContent=state.love;energy.textContent=state.energy
}
function action(a){
if(!state.born)return;
if(a=="feed"){state.hunger=Math.min(100,state.hunger+20);message(feedMsg())}
if(a=="water"){state.water=Math.min(100,state.water+20);message(waterMsg())}
if(a=="pet"){state.love=Math.min(100,state.love+15);message(petMsg());react("happy")}
if(a=="walk"){
if(state.energy<20){message("너무 피곤해서 산책하기 힘들어요...");return}
state.energy=Math.max(0,state.energy-10);message("같이 산책하고 왔어요!");react("jump")
}
save();updateStats()
}
function feedMsg(){
let p=state.personality;
return p=="애교쟁이"?"냠냠! 더 주세요! 💕":p=="느긋한"?"천천히 먹을게요...":p=="장난꾸러기"?"이걸 나한테 주는 거야? 😋":p=="호기심 많은"?"이건 무슨 맛일까?": "조금 먹어볼게요..."
}
function waterMsg(){
let p=state.personality;
return p=="애교쟁이"?"꿀꺽! 고마워요! 💕":p=="느긋한"?"시원하네요...":p=="장난꾸러기"?"물장난 해도 돼요?":p=="호기심 많은"?"물이 참 신기해요!":"물을 조금만 더 주세요..."
}
function petMsg(){
let p=state.personality;
return p=="애교쟁이"?"쓰다듬어줘서 좋아요! 💕":p=="느긋한"?"후후... 편안하네요.":p=="장난꾸러기"?"간지러워요!":p=="호기심 많은"?"왜 쓰다듬으면 기분이 좋죠?":"조금 부끄러워요..."
}
function react(c){
potatoWrap.className="";void potatoWrap.offsetWidth;potatoWrap.classList.add(c)
}
function decay(){
if(!state.born)return;
state.hunger=Math.max(0,state.hunger-5);state.water=Math.max(0,state.water-5);
state.energy=Math.max(0,state.energy-3);
if(state.hunger<20)message("배가 고파요...");
else if(state.water<20)message("목이 말라요...");
else if(state.energy<20)message("졸리고 피곤해요...");
save();updateStats()
}
function harvest(){
if(!state.born)return;
let id=state.character.name;
if(!state.collection.includes(id))state.collection.push(id);
state.day++;
state.born=false;state.growth=0;state.character=null;state.personality=null;
clearInterval(timer);save();showBefore()
}
function showCollection(){
clearInterval(timer);screen("collection");renderCollection()
}
function renderCollection(){
count.textContent="발견한 감자 "+state.collection.length+" / 5";
cards.innerHTML="";
potatoes.forEach(p=>{
let found=state.collection.includes(p.name);
let d=document.createElement("div");d.className="collection-card";
d.innerHTML=found?
"<img src='"+p.img+"'><h2>"+p.name+"</h2><p>발견 완료 ✓</p>":
"<div class='hidden-potato'>❓</div><h2>???</h2><p>아직 발견하지 못했어요</p>";
cards.appendChild(d)
})
}
function backGame(){
if(state.born)showGame();else showBefore()
}

const pg=document.getElementById("playground");
let actors=[];
function createPlayPotato(data){
let el=document.createElement("div"),label=document.createElement("div");
el.className="play-potato";el.style.backgroundImage="url('"+data.img+"')";
label.className="label";label.textContent=data.name;el.appendChild(label);pg.appendChild(el);
let a={data,el,x:20+Math.random()*(pg.clientWidth-80),y:60+Math.random()*(pg.clientHeight-130),
vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,dragging:false,
followingLeader:false,stunned:false,sleeping:false,lastCollision:0,pressTimer:null,
pointerDown:false,moved:false,startX:0,startY:0};
actors.push(a);setupPointer(a);return a
}
function setupPointer(a){
a.el.addEventListener("pointerdown",e=>{
a.pointerDown=true;a.moved=false;a.startX=e.clientX;a.startY=e.clientY;
a.el.setPointerCapture(e.pointerId);
a.pressTimer=setTimeout(()=>startDrag(a,e),450)
});
a.el.addEventListener("pointermove",e=>{
if(!a.pointerDown)return;
let dx=e.clientX-a.startX,dy=e.clientY-a.startY;
if(Math.hypot(dx,dy)>8){a.moved=true;clearTimeout(a.pressTimer)}
if(a.dragging){a.x=e.clientX-pg.getBoundingClientRect().left-27;a.y=e.clientY-pg.getBoundingClientRect().top-27}
});
a.el.addEventListener("pointerup",e=>{
clearTimeout(a.pressTimer);if(a.dragging)stopDrag(a);
else if(a.pointerDown&&!a.moved&&!a.stunned)playReaction(a);
a.pointerDown=false
});
a.el.addEventListener("pointercancel",()=>{clearTimeout(a.pressTimer);if(a.dragging)stopDrag(a);a.pointerDown=false})
}
function startDrag(a){
if(!a.pointerDown)return;
a.dragging=true;a.el.classList.add("held");
if(a.data.type=="leader")actors.forEach(x=>{if(x!==a)x.followingLeader=true,x.el.classList.add("leader-near")})
}
function stopDrag(a){
a.dragging=false;a.el.classList.remove("held");
if(a.data.type=="leader")actors.forEach(x=>{x.followingLeader=false;x.el.classList.remove("leader-near");x.vx=(Math.random()-.5)*1.2;x.vy=(Math.random()-.5)*1.2})
}
function playReaction(a){
let type=a.data.type,c=type=="poison"?"angry":type=="violent"?"angry":type=="leader"?"jump":type=="silly"?"spin":"jump";
a.el.classList.remove("jump","spin","angry","shy","happy","wiggle");
void a.el.offsetWidth;a.el.classList.add(c);
effect(a,type=="poison"?"☠️":type=="violent"?"💢":type=="leader"?"👑":"💕")
}
function effect(a,t){
let e=document.createElement("div");e.className="effect";e.textContent=t;
e.style.left=a.x+20+"px";e.style.top=a.y+"px";pg.appendChild(e);setTimeout(()=>e.remove(),900)
}
function nearest(a){
let best=null,dist=9999;
actors.forEach(b=>{
if(b===a||b.dragging||b.stunned||b.sleeping)return;
let d=Math.hypot(a.x-b.x,a.y-b.y);if(d<dist){dist=d;best=b}
});return best
}
function tick(){
let w=pg.clientWidth,h=pg.clientHeight,now=Date.now();
actors.forEach(a=>{
if(a.dragging){a.x=Math.max(3,Math.min(w-58,a.x));a.y=Math.max(35,Math.min(h-90,a.y));return}
if(a.stunned)return;
if(a.followingLeader){
let l=actors.find(x=>x.dragging&&x.data.type=="leader");
if(l){
let dx=l.x-a.x,dy=l.y-a.y,d=Math.hypot(dx,dy);
if(d>58){a.x+=dx/d*5.5;a.y+=dy/d*5.5}
}
}else if(a.data.type=="leader"){
a.vx+=(w/2-a.x)*.0005;a.vy+=(h/2-a.y)*.0005
}else if(a.data.type=="poison"){
/* 독감자는 외롭게 지낸다.
   다른 감자를 따라가지 않고 혼자 돌아다닌다. */
let n=nearest(a);
if(n){
let d=Math.hypot(a.x-n.x,a.y-n.y);
if(d<115){a.vx+=(a.x-n.x)/Math.max(d,1)*.08;a.vy+=(a.y-n.y)/Math.max(d,1)*.08}
}
}else{
let n=nearest(a);
if(a.data.type=="violent"&&n){
let dx=n.x-a.x,dy=n.y-a.y,d=Math.max(1,Math.hypot(dx,dy));
a.vx+=dx/d*.025;a.vy+=dy/d*.025
}else{
a.vx+=(Math.random()-.5)*.03;a.vy+=(Math.random()-.5)*.03
}
}
a.x+=a.vx;a.y+=a.vy;a.vx*=.995;a.vy*=.995;
if(a.x<3||a.x>w-58)a.vx*=-1;
if(a.y<35||a.y>h-90)a.vy*=-1;
a.x=Math.max(3,Math.min(w-58,a.x));a.y=Math.max(35,Math.min(h-90,a.y));
a.el.style.left=a.x+"px";a.el.style.top=a.y+"px"
});
collisions(now);poisonAttack(now)
}
function collisions(now){
for(let i=0;i<actors.length;i++)for(let j=i+1;j<actors.length;j++){
let a=actors[i],b=actors[j];if(a.dragging||b.dragging||a.stunned||b.stunned)continue;
let d=Math.hypot(a.x-b.x,a.y-b.y);if(d>52||now-a.lastCollision<700||now-b.lastCollision<700)continue;
a.lastCollision=b.lastCollision=now;effect(a,"💥");
if(a.data.type=="violent"||b.data.type=="violent"){a.el.classList.add("angry");b.el.classList.add("angry")}
else{playReaction(a);playReaction(b)}
}
}
function poisonAttack(now){
actors.forEach(a=>{
if(a.data.type!="poison"||a.dragging)return;
actors.forEach(b=>{
if(a===b||b.dragging||b.stunned)return;
let d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<65&&now-(a.poisonTime||0)>5000){
a.poisonTime=now;b.stunned=true;b.el.classList.add("pg-stunned");effect(b,"😵");
setTimeout(()=>{b.stunned=false;b.el.classList.remove("pg-stunned")},3000)
}
})
})
}
function initPlay(){
actors=[];pg.innerHTML="";
potatoes.forEach(p=>createPlayPotato(p));
setInterval(tick,40)
}
document.addEventListener("contextmenu",e=>{
if(e.target.closest("#playground,#potatoWrap,.collection-card"))e.preventDefault()
});
document.addEventListener("dragstart",e=>{
if(e.target.closest("#playground,#potatoWrap,.collection-card"))e.preventDefault()
});
if(state.born&&state.character)showGame();
else if(state.started)showBefore();
initPlay();
</script>
</body>
</html>
