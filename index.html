<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0"
>

<title>감자키우기</title>

<style>

/* ==================================================
   기본
================================================== */

*{
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:#f3ead7;

    font-family:
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

    overflow-x:hidden;

    -webkit-touch-callout:none;
}

body{

    overscroll-behavior-x:none;
}

button{

    font-family:inherit;

    border:0;

    cursor:pointer;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;
}

img{

    -webkit-user-drag:none;
    user-select:none;
    -webkit-user-select:none;
    pointer-events:none;
}

#app{

    width:100%;
    min-height:100vh;
}

.screen{

    width:100%;
    min-height:100vh;
}

.hidden{

    display:none!important;
}

.page{

    width:min(600px,100%);

    min-height:100vh;

    margin:auto;

    background:#fffaf0;
}

button:active{

    transform:scale(.94);
}


/* ==================================================
   시작 화면
================================================== */

#startScreen{

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #fff9eb 0%,
            #f3dfb8 100%
        );
}

.startBox{

    text-align:center;

    padding:40px 25px;
}

.bigPotato{

    font-size:80px;

    animation:
        floatPotato
        2s
        infinite
        ease-in-out;
}

@keyframes floatPotato{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

}

.gameTitle{

    font-size:34px;

    font-weight:900;

    margin:10px 0 25px;
}

.startBtn{

    padding:15px 55px;

    border-radius:18px;

    background:#76502e;

    color:white;

    font-size:20px;

    font-weight:900;

    box-shadow:
        0 6px 0 #50351f;
}

.startBtn:active{

    transform:translateY(5px);

    box-shadow:
        0 1px 0 #50351f;
}


/* ==================================================
   성장 화면
================================================== */

.growPage{

    padding-bottom:30px;
}

.growHeader{

    padding:18px 18px 10px;

    text-align:center;
}

.growHeader h1{

    margin:0;

    font-size:25px;
}

.dayText{

    margin-top:5px;

    font-size:14px;

    color:#777;
}

.growArea{

    position:relative;

    height:360px;

    margin:10px 15px;

    overflow:hidden;

    border-radius:25px;

    background:
        linear-gradient(
            #bfe8ff 0 67%,
            #8fc66c 67% 100%
        );

    border:4px solid #725236;
}

.sun{

    position:absolute;

    top:25px;
    right:35px;

    font-size:45px;

    animation:
        sunPulse
        2s
        infinite;
}

@keyframes sunPulse{

    50%{
        transform:scale(1.08);
    }

}

.ground{

    position:absolute;

    bottom:0;

    width:100%;
    height:32%;

    background:
        repeating-linear-gradient(
            0deg,
            #8bc36a,
            #8bc36a 8px,
            #83ba62 8px,
            #83ba62 16px
        );
}

.growPotato{

    position:absolute;

    left:50%;
    bottom:20%;

    transform:
        translateX(-50%);

    width:150px;
    height:180px;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:100px;

    z-index:5;

    transition:
        font-size .2s ease;
}

.growPotato.jump{

    animation:
        potatoJump
        .6s
        ease;
}

@keyframes potatoJump{

    0%{
        transform:
            translateX(-50%)
            translateY(0)
            rotate(0);
    }

    35%{
        transform:
            translateX(-50%)
            translateY(-55px)
            rotate(-8deg);
    }

    70%{
        transform:
            translateX(-50%)
            translateY(-25px)
            rotate(8deg);
    }

    100%{
        transform:
            translateX(-50%)
            translateY(0)
            rotate(0);
    }

}

.growthInfo{

    padding:0 20px;
}

.growthTop{

    display:flex;

    justify-content:space-between;

    font-weight:800;

    margin-bottom:7px;
}

.progress{

    width:100%;

    height:20px;

    background:#e5d9c5;

    border-radius:20px;

    overflow:hidden;
}

.progressBar{

    height:100%;

    width:0%;

    background:#72ad50;

    border-radius:20px;

    transition:
        width .4s ease;
}

.growActions{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    padding:18px;
}

.actionBtn{

    padding:15px 8px;

    border-radius:15px;

    background:#f0e1c5;

    font-size:15px;

    font-weight:800;
}

.actionBtn:hover{

    background:#e8d2ad;
}


/* ==================================================
   키우기 화면
   완전 고정형
================================================== */

.petPage{

    min-height:100vh;

    position:relative;

    background:#fffaf0;
}


/*
   sticky 대신 fixed 사용.

   모바일 Safari에서도
   감자 / 이름 / 성격이
   무조건 화면 상단에 남는다.
*/

.petFixed{

    position:fixed;

    top:0;
    left:50%;

    transform:translateX(-50%);

    width:min(600px,100%);

    z-index:999;

    background:#fffaf0;

    box-shadow:
        0 5px 18px rgba(80,50,20,.12);
}


/*
   fixed 영역 때문에
   아래 내용이 가려지지 않도록
   정확한 공간 확보.
*/

.petFixedSpacer{

    height:395px;

    width:100%;
}


/* ==================================================
   키우기 상단
================================================== */

.petTop{

    padding:8px 18px 4px;

    text-align:center;

    background:#fffaf0;
}

.petTop h1{

    margin:0;

    font-size:23px;
}

.petDay{

    font-size:13px;

    color:#888;

    margin-top:3px;
}

.petMain{

    padding:0 15px;
}

.petStage{

    position:relative;

    height:285px;

    border-radius:24px;

    background:
        linear-gradient(
            #c7ecff 0 70%,
            #9bc76e 70%
        );

    border:4px solid #725236;

    overflow:hidden;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;
}

.petSun{

    position:absolute;

    top:15px;
    right:25px;

    font-size:40px;

    animation:
        sunPulse
        2s
        infinite;
}

.petGround{

    position:absolute;

    bottom:0;

    height:30%;

    width:100%;

    background:
        repeating-linear-gradient(
            90deg,
            #91bf69 0 15px,
            #88b761 15px 20px
        );
}


/* ==================================================
   키우기 감자
   IMG 아님
   DIV + background-image
================================================== */

.petImage{

    position:absolute;

    width:165px;
    height:165px;

    left:50%;
    top:46%;

    transform:
        translate(-50%,-50%);

    background-repeat:no-repeat;

    background-position:center;

    background-size:contain;

    image-rendering:pixelated;

    z-index:5;

    touch-action:none;

    -webkit-user-drag:none;

    pointer-events:auto;

    -webkit-touch-callout:none;

    user-select:none;
    -webkit-user-select:none;

    will-change:
        transform,
        left,
        top;
}


/* 숨쉬기 */

.petImage.breathe{

    animation:
        potatoBreathe
        2.2s
        ease-in-out
        infinite;
}

@keyframes potatoBreathe{

    0%,
    100%{
        transform:
            translate(-50%,-50%)
            scale(1)
            rotate(0);
    }

    50%{
        transform:
            translate(-50%,-52%)
            scale(1.025)
            rotate(-1deg);
    }

}


/* 점프 */

.petImage.petJump{

    animation:
        petJump
        .65s
        ease;
}

@keyframes petJump{

    0%{
        transform:
            translate(-50%,-50%)
            translateY(0)
            rotate(0);
    }

    30%{
        transform:
            translate(-50%,-50%)
            translateY(-55px)
            rotate(-8deg)
            scale(1.03);
    }

    55%{
        transform:
            translate(-50%,-50%)
            translateY(-70px)
            rotate(8deg)
            scale(1.04);
    }

    100%{
        transform:
            translate(-50%,-50%)
            translateY(0)
            rotate(0)
            scale(1);
    }

}


/* 갸웃 */

.petImage.tilt{

    animation:
        potatoTilt
        .55s
        ease;
}

@keyframes potatoTilt{

    0%{
        transform:
            translate(-50%,-50%)
            rotate(0);
    }

    25%{
        transform:
            translate(-50%,-50%)
            rotate(-10deg);
    }

    50%{
        transform:
            translate(-50%,-50%)
            rotate(10deg);
    }

    75%{
        transform:
            translate(-50%,-50%)
            rotate(-5deg);
    }

    100%{
        transform:
            translate(-50%,-50%)
            rotate(0);
    }

}


/* 산책 */

.petImage.running{

    animation:
        runPotato
        .25s
        infinite
        alternate;
}

@keyframes runPotato{

    from{

        transform:
            translate(-50%,-50%)
            translateY(2px)
            rotate(-5deg);
    }

    to{

        transform:
            translate(-50%,-50%)
            translateY(-5px)
            rotate(5deg);
    }

}


/* ==================================================
   감정
================================================== */

.petEmotion{

    position:absolute;

    z-index:30;

    left:50%;

    top:30%;

    font-size:30px;

    pointer-events:none;

    animation:
        emotionFloat
        1s
        ease-out
        forwards;
}

@keyframes emotionFloat{

    0%{
        opacity:0;

        transform:
            translate(-50%,10px)
            scale(.5);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-45px)
            scale(1.15);
    }

}


/* ==================================================
   말풍선
================================================== */

.message{

    position:absolute;

    left:50%;
    bottom:12px;

    transform:
        translateX(-50%);

    width:82%;

    min-height:42px;

    background:white;

    border:3px solid #543b26;

    border-radius:18px;

    padding:9px;

    text-align:center;

    font-size:13px;

    font-weight:700;

    z-index:40;
}

.nameBox{

    padding:7px 5px 10px;

    background:#fffaf0;

    text-align:center;
}

.potatoName{

    font-size:21px;

    font-weight:900;
}

.personality{

    color:#777;

    margin-top:2px;

    font-size:13px;
}


/* ==================================================
   스탯
================================================== */

.stats{

    margin:12px 0;

    padding:12px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    background:#f2e7d4;

    border-radius:20px;
}

.stat{

    background:white;

    border-radius:15px;

    padding:9px;

    display:flex;

    align-items:center;

    gap:8px;
}

.statCircle{

    width:42px;
    height:42px;

    border-radius:50%;

    background:#eee4d2;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:19px;

    flex-shrink:0;
}

.statText{

    font-size:12px;

    font-weight:800;
}

.statValue{

    font-size:11px;

    color:#777;

    margin-top:2px;
}


/* ==================================================
   키우기 버튼
================================================== */

.petActions{

    padding:4px 0 30px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;
}

.petAction{

    padding:14px 5px;

    border-radius:15px;

    background:#ead8ba;

    font-size:14px;

    font-weight:900;
}


/* ==================================================
   사전
================================================== */

.dictionary{

    min-height:100vh;

    background:#fffaf0;
}

.dictionaryHeader{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:15px;

    border-bottom:2px solid #e5d7c0;

    background:#fffaf0;

    position:relative;

    z-index:300;
}

.dictionaryHeader h1{

    margin:0;

    font-size:20px;
}

.backBtn{

    padding:7px 11px;

    border-radius:10px;

    background:#e5d5b8;

    font-weight:800;
}


/* ==================================================
   다마고치 방
   더 잘게 쪼갠 픽셀 배경
================================================== */

.tama{

    margin:18px auto;

    width:min(92vw,500px);

    aspect-ratio:1/1;

    max-height:500px;

    position:relative;

    overflow:hidden;

    border:12px solid #473d35;

    border-radius:12px;

    background:#9aaf72;

    image-rendering:pixelated;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    overscroll-behavior:none;

    isolation:isolate;
}


/*
   벽

   기존보다 훨씬 작은 타일.

   12px x 12px 느낌으로
   가로 + 세로를 동시에 분할.
*/

.pixelWall{

    position:absolute;

    inset:0;

    background-color:#c8a47b;

    background-image:

        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 11px,
            #b99268 11px,
            #b99268 13px
        ),

        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 23px,
            rgba(150,110,70,.28) 23px,
            rgba(150,110,70,.28) 25px
        );

    z-index:1;
}


/*
   벽돌을 한 번 더 쪼개서
   픽셀방 느낌 강화
*/

.pixelWall:after{

    content:"";

    position:absolute;

    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 11px,
            rgba(255,255,255,.06) 11px,
            rgba(255,255,255,.06) 12px
        );

    opacity:.8;

    pointer-events:none;
}


/* ==================================================
   바닥
================================================== */

.pixelFloor{

    position:absolute;

    bottom:0;

    width:100%;

    height:31%;

    background-color:#b17d4e;

    background-image:

        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 11px,
            #9d6e45 11px,
            #9d6e45 13px
        ),

        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 15px,
            rgba(115,75,42,.42) 15px,
            rgba(115,75,42,.42) 18px
        );

    z-index:3;
}


/*
   바닥 타일에 작은 픽셀 무늬
*/

.pixelFloor:after{

    content:"";

    position:absolute;

    inset:0;

    background:
        repeating-linear-gradient(
            45deg,
            transparent 0 7px,
            rgba(255,255,255,.05) 7px 9px,
            transparent 9px 16px
        );

    pointer-events:none;
}


/* ==================================================
   창문
================================================== */

.window{

    position:absolute;

    top:28px;
    left:25px;

    width:100px;
    height:75px;

    background:#9edcf1;

    border:8px solid #6e4c36;

    box-shadow:
        inset 0 0 0 4px #d7e9dc;

    z-index:5;
}

.window:before{

    content:"";

    position:absolute;

    left:50%;
    top:0;

    width:5px;
    height:100%;

    background:#6e4c36;
}

.window:after{

    content:"";

    position:absolute;

    left:0;
    top:50%;

    width:100%;
    height:5px;

    background:#6e4c36;
}


/* ==================================================
   소파
================================================== */

.sofa{

    position:absolute;

    bottom:65px;
    right:20px;

    width:130px;
    height:55px;

    background:#865d4c;

    border:7px solid #654535;

    z-index:8;

    box-shadow:
        inset 0 -10px 0 rgba(60,35,25,.18);
}

.sofa:before{

    content:"";

    position:absolute;

    left:8px;
    right:8px;

    top:-18px;

    height:20px;

    background:#865d4c;

    border:7px solid #654535;

}

.sofa:after{

    content:"";

    position:absolute;

    left:15px;
    bottom:-13px;

    width:15px;
    height:12px;

    background:#543b2d;

    box-shadow:
        80px 0 #543b2d;
}


/* ==================================================
   TV
================================================== */

.tv{

    position:absolute;

    top:25px;
    right:22px;

    width:75px;
    height:55px;

    background:#2e302e;

    border:7px solid #4b4035;

    z-index:7;
}

.tvScreen{

    position:absolute;

    inset:7px;

    background:#71a3a2;

    animation:
        tvGlow
        2s
        infinite
        alternate;
}

@keyframes tvGlow{

    from{
        opacity:.65;
    }

    to{
        opacity:1;
    }

}


/* ==================================================
   다마고치 감자
================================================== */

.tamaPotato{

    position:absolute;

    width:65px;
    height:65px;

    z-index:20;

    transform:
        translate3d(-50%,-50%,0);

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    -webkit-user-drag:none;

    cursor:grab;

    will-change:
        left,
        top,
        transform;

    /*
       div 자체에는
       background-image가 들어감.
    */

    background-repeat:no-repeat;

    background-position:center;

    background-size:contain;

    image-rendering:pixelated;
}

.tamaPotato:active{

    cursor:grabbing;
}

.tamaPotato.selected{

    filter:
        drop-shadow(0 0 7px white)
        brightness(1.08);
}


/* 걷기 */

.tamaPotato.walking{

    animation:
        tamaWalk
        .22s
        infinite
        alternate;
}

@keyframes tamaWalk{

    from{

        margin-top:2px;

        transform:
            translate3d(-50%,-50%,0)
            rotate(-3deg);
    }

    to{

        margin-top:-2px;

        transform:
            translate3d(-50%,-50%,0)
            rotate(3deg);
    }

}


/* 점프 */

.tamaPotato.reactionJump{

    animation:
        tamaReactionJump
        .6s
        ease;
}

@keyframes tamaReactionJump{

    0%{

        transform:
            translate3d(-50%,-50%,0)
            translateY(0)
            rotate(0);
    }

    35%{

        transform:
            translate3d(-50%,-50%,0)
            translateY(-18px)
            rotate(-10deg);
    }

    65%{

        transform:
            translate3d(-50%,-50%,0)
            translateY(-10px)
            rotate(10deg);
    }

    100%{

        transform:
            translate3d(-50%,-50%,0)
            translateY(0)
            rotate(0);
    }

}


/* 갸웃 */

.tamaPotato.reactionTilt{

    animation:
        tamaTilt
        .65s
        ease;
}

@keyframes tamaTilt{

    0%{
        transform:
            translate3d(-50%,-50%,0)
            rotate(0);
    }

    25%{
        transform:
            translate3d(-50%,-50%,0)
            rotate(-12deg);
    }

    50%{
        transform:
            translate3d(-50%,-50%,0)
            rotate(12deg);
    }

    75%{
        transform:
            translate3d(-50%,-50%,0)
            rotate(-5deg);
    }

    100%{
        transform:
            translate3d(-50%,-50%,0)
            rotate(0);
    }

}


/* ==================================================
   말풍선
================================================== */

.tamaSpeech{

    position:absolute;

    z-index:70;

    background:white;

    border:2px solid #332a22;

    border-radius:10px;

    padding:3px 6px;

    font-size:10px;

    font-weight:900;

    white-space:nowrap;

    pointer-events:none;

    animation:
        speech
        1.3s
        ease
        forwards;
}

@keyframes speech{

    0%{

        opacity:0;

        transform:
            translate(-50%,8px)
            scale(.8);
    }

    20%{

        opacity:1;

        transform:
            translate(-50%,0)
            scale(1);
    }

    80%{

        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-15px)
            scale(.95);
    }

}


/* ==================================================
   감정
================================================== */

.tamaEmotion{

    position:absolute;

    z-index:80;

    pointer-events:none;

    font-size:22px;

    animation:
        tamaEmotionFloat
        1s
        ease-out
        forwards;
}

@keyframes tamaEmotionFloat{

    0%{

        opacity:0;

        transform:
            translate(-50%,10px)
            scale(.5);
    }

    20%{

        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-30px)
            scale(1.1);
    }

}


/* ==================================================
   스턴
================================================== */

.tamaPotato.stunned{

    filter:
        grayscale(1)
        brightness(.7);

    animation:
        stunShake
        .25s
        infinite
        alternate;
}

@keyframes stunShake{

    from{
        margin-left:-3px;
    }

    to{
        margin-left:3px;
    }

}


/* ==================================================
   간식
================================================== */

.snack{

================================================== */

.bookItemName{

/* ==================================================
   개별 ON / OFF
================================================== */

.potatoToggle{

    width:52px;
    height:29px;

    border-radius:20px;

    background:#aaa;

    position:relative;

    flex-shrink:0;

    transition:
        background .2s ease;
}

.potatoToggle.on{

    background:#6ca04c;
}

.potatoToggle:after{

    content:"";

    position:absolute;

    top:4px;
    left:4px;

    width:21px;
    height:21px;

    background:white;

    border-radius:50%;

    transition:
        left .2s ease;

.potatoToggle.on:after{

    left:27px;
}

<script>

/* ==================================================

const POTATOES = [

            pet:[

        }
    },


    {

            water:[

            ],

            pet:[

            walk:[

                "조용한 곳이 좋다고."
            ]

        }
    },


    {
        name:"폭력감자",
        image:"Potato4.PNG",
        style:"violent",
        personality:"다혈질이고 싸움을 좋아한다",
        favorite:"독감자",

        lines:{

            food:[
                "더 줘! 이걸로 부족해!",

            walk:[

                "싸울 상대를 찾아보자!"
            ]

        }
    },


    {
        name:"저능감자",
        image:"Potato5.PNG",
        style:"dummy",
        personality:"느긋하고 순하며 조금 멍하다",
        favorite:"모두",

        lines:{

            food:[
                "먹는 거... 맞지?",
                "우와... 맛있다...",
                "또 먹어도 돼?"
            ],

            water:[
                "물이네...",
                "꼴깍... 시원하다...",
                "물은 왜 이렇게 맛있지?"
            ],

            pet:[
                "헤헤...",
                "기분 좋다...",
                "나 좋아해?"
            ],

            walk:[
                "어... 어디 가?",
                "잠깐만... 나도 갈래.",
                "우와! 뛰는 거 재밌다!"
            ]

        }
    }

];


/* ==================================================
   게임 상태
================================================== */

let game = {

    growth:0,

    stage:0,

    day:1,

    potato:null,

    stats:{
        hunger:0,
        water:0,
        love:0,
        energy:0
    },

    discovered:[],

    /*
       감자별 독립 ON/OFF
    */

    tamaEnabled:{},

    tamaPotatoes:[],

    tamaSnacks:[],

    sleeping:false,

    tamaAnimationId:null,

    lastTamaTime:0

};


/* ==================================================
   성장 단계
================================================== */

const STAGES=[
    "싹",
    "이파리",
    "나무",
    "감자"
];

const STAGE_EMOJIS=[
    "🌱",
    "🌿",
    "🌳",
    "🥔"
];


/* ==================================================
   DOM
================================================== */

const startScreen=
    document.getElementById("startScreen");

const growScreen=
    document.getElementById("growScreen");

const petScreen=
    document.getElementById("petScreen");

const dictionaryScreen=
    document.getElementById("dictionaryScreen");

const growPotato=
    document.getElementById("growPotato");

const growthBar=
    document.getElementById("growthBar");

const growthText=
    document.getElementById("growthText");

const stageText=
    document.getElementById("stageText");

const petImage=
    document.getElementById("petImage");


/* ==================================================
   화면 전환
================================================== */

function showScreen(screen){

    [
        startScreen,
        growScreen,
        petScreen,
        dictionaryScreen
    ].forEach(
        s=>s.classList.add("hidden")
    );

    screen.classList.remove("hidden");

    window.scrollTo(0,0);


    if(
        screen===dictionaryScreen
    ){

        startTamaLoop();

    }

    else{

        stopTamaLoop();

    }

}


/* ==================================================
   시작
================================================== */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        ()=>{

            game.growth=0;
            game.stage=0;
            game.day=1;
            game.potato=null;

            updateGrow();

            showScreen(growScreen);

        }
    );


/* ==================================================
   성장
================================================== */

let creatingPotato=false;

function growAction(type){

    if(creatingPotato){
        return;
    }

    let amount=7;

    if(type==="fertilizer")
        amount=12;

    if(type==="water")
        amount=8;

    if(type==="sun")
        amount=9;

    if(type==="cheer")
        amount=6;


    game.growth+=amount;

    if(game.growth>100)
        game.growth=100;


    game.stage=
        Math.min(
            3,
            Math.floor(
                game.growth/25
            )
        );


    growPotato
        .classList
        .remove("jump");

    void growPotato.offsetWidth;

    growPotato
        .classList
        .add("jump");


    updateGrow();


    if(
        game.growth>=100 &&
        !creatingPotato
    ){

        creatingPotato=true;

        setTimeout(
            ()=>{

                createRandomPotato();

                creatingPotato=false;

            },
            650
        );

    }

}


function updateGrow(){

    growthBar.style.width=
        game.growth+"%";

    growthText.textContent=
        game.growth+" / 100%";

    stageText.textContent=
        STAGES[game.stage];

    growPotato.textContent=
        STAGE_EMOJIS[game.stage];

    document
        .getElementById("growDay")
        .textContent=
        game.day+"일차";

}


/* ==================================================
   랜덤 감자 탄생
================================================== */

function createRandomPotato(){

    const potato=
        POTATOES[
            Math.floor(
                Math.random()*
                POTATOES.length
            )
        ];


    game.potato=potato;


    if(
        !game.discovered.includes(
            potato.name
        )
    ){

        game.discovered.push(
            potato.name
        );

        /*
           처음 발견한 감자는
           기본적으로 ON.
        */

        game.tamaEnabled[
            potato.name
        ]=true;

    }


    game.stats={

        hunger:50,
        water:50,
        love:50,
        energy:100

    };


    updatePet();

    showScreen(petScreen);

    showEmotion(
        emotionEmoji(potato)
    );

    speak(
        "태어났다! "+
        potato.name+
        "이다! 🥔"
    );

}


/* ==================================================
   감정 이모지
================================================== */

function emotionEmoji(p){

    if(p.style==="social")
        return "💕";

    if(p.style==="leader")
        return "🫡";

    if(p.style==="toxic")
        return "☠️";

    if(p.style==="violent")
        return "💢";

    return "🥺";

}


function emotionSet(p){

    if(p.style==="social")
        return ["💕","❤️","🥰","✨"];

    if(p.style==="leader")
        return ["🫡","⭐","📣","💪"];

    if(p.style==="toxic")
        return ["☠️","💢","😑","⚠️"];

    if(p.style==="violent")
        return ["💢","👊","🔥","😤"];

    return ["🥺","😳","💭","😊"];

}

function touchPet(){

function petAction(type){

    if(!game.potato)
        return;


    const p=
        game.potato;


    if(type==="food"){

        game.stats.hunger=
            clamp(
                game.stats.hunger+20
            );

        speak(
            random(p.lines.food)+
            " "+
            random(emotionSet(p))
        );

        showEmotion(
            random(emotionSet(p))
        );

        jumpPet();

    }


    if(type==="water"){

        game.stats.water=
            clamp(
                game.stats.water+20
            );

        speak(
            random(p.lines.water)+
            " "+
            random(emotionSet(p))
        );

        showEmotion(
            random([
                "💧",
                "😊",
                "✨"
            ])
        );

        jumpPet();

    }


    if(type==="pet"){

        game.stats.love=
            clamp(
                game.stats.love+15
            );

        speak(
            random(p.lines.pet)+
            " "+
            random(emotionSet(p))
        );

        showEmotion(
            random(emotionSet(p))
        );


        if(
            Math.random()<.5
        )
            jumpPet();
        else
            tiltPet();

    }


    if(type==="walk"){

        game.stats.energy=
            clamp(
                game.stats.energy-15
            );

        speak(
            random(p.lines.walk)+
            " "+
            random([
                "🏃",
                "💨",
                "😆"
            ])
        );

        showEmotion("🏃");

        runPet();

    }


    updateStats();

}

/* ==================================================
   산책
================================================== */

let petWalkFrame=null;
let petWalkStart=0;
let petWalkX=50;
let petWalkDirection=1;


function runPet(){

    if(petWalkFrame){

        cancelAnimationFrame(
            petWalkFrame
        );

    }


    petImage
        .classList
        .add("running");


    petWalkStart=
        performance.now();

    petWalkX=50;

    petWalkDirection=
        Math.random()<.5
        ? -1
        : 1;


    function walkFrame(now){

        const elapsed=
            now-
            petWalkStart;


        if(elapsed>=3000){

            petImage
                .classList
                .remove("running");

            petImage.style.left="50%";

            petWalkFrame=null;

            return;

        }


        petWalkX+=
            petWalkDirection*.12;


        if(petWalkX>=78){

            petWalkX=78;

            petWalkDirection=-1;

        }


        if(petWalkX<=22){

            petWalkX=22;

            petWalkDirection=1;

        }


        petImage.style.left=
            petWalkX+"%";


        petWalkFrame=
            requestAnimationFrame(
                walkFrame
            );

    }


    petWalkFrame=
        requestAnimationFrame(
            walkFrame
        );

}

function renderTama(){

    const tama=
        document.getElementById(
            "tama"
        );


    tama
        .querySelectorAll(
            ".tamaPotato,"+
            ".tamaSpeech,"+
            ".tamaEmotion,"+
            ".snack,"+
            ".sleepOverlay"
        )
        .forEach(
            el=>el.remove()
        );


    game.tamaPotatoes=[];


    /*
       발견했고
       해당 감자의 ON/OFF가 ON인 경우만 등장.
    */

    const selected=
        game.discovered.filter(
            name=>
                game.tamaEnabled[name]
                !==false
        );


    game.tamaPotatoes=
        selected.map(
            (name,index)=>{

                const p=
                    POTATOES.find(
                        x=>x.name===name
                    );


                const angle=
                    (
                        Math.PI*2/
                        Math.max(
                            selected.length,
                            1
                        )
                    )*
                    index;


                const radius=
                    Math.min(
                        20,
                        8+
                        selected.length*2
                    );


                const obj={

                    id:
                        "tama_"+
                        index+
                        "_"+
                        Date.now(),

                    data:p,

                    x:
                        50+
                        Math.cos(angle)*
                        radius,

                    y:
                        72+
                        Math.sin(angle)*
                        12,

                    vx:0,

                    vy:0,

                    targetX:null,

                    targetY:null,

                    maxSpeed:
                        4+
                        Math.random()*2.5,

                    dragging:false,

                    sleeping:false,

                    stunnedUntil:0,

                    nextDecision:0,

                    nextSpeech:
                        performance.now()+
                        4000+
                        Math.random()*5000,

                    nextInteraction:0,

                    seed:
                        Math.random()*
                        100,

                    speechEl:null,

                    speechTimer:null,

                    dragOffsetX:0,

                    dragOffsetY:0,

                    snackTarget:null

                };


                return obj;

            }
        );


    game.tamaPotatoes.forEach(
        obj=>{
            createTamaPotato(obj);
            chooseInitialTarget(obj);
        }
    );

}

/* ==================================================
   롱프레스 드래그
================================================== */

function enableLongPress(
    element,
    obj
){

    let pointerId=null;

    let startX=0;
    let startY=0;

    let moved=false;

    let longPressTimer=null;

    let dragging=false;


    element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            pointerId=
                e.pointerId;

            startX=
                e.clientX;

            startY=
                e.clientY;

            moved=false;

            dragging=false;


            try{

                element.setPointerCapture(
                    pointerId
                );

            }catch(err){}


            /*
               0.4초 동안 꾹 누르면
               드래그 시작.
            */

            longPressTimer=
                setTimeout(
                    ()=>{

                        dragging=true;

                        obj.dragging=true;

                        obj.vx=0;
                        obj.vy=0;

                        element.classList.add(
                            "selected"
                        );

                    },
                    400
                );

        },
        {
            passive:false
        }
    );


    element.addEventListener(
        "pointermove",
        e=>{

            if(
                e.pointerId!==pointerId
            )
                return;


            e.preventDefault();


            const dx=
                e.clientX-
                startX;

            const dy=
                e.clientY-
                startY;


            if(
                Math.hypot(dx,dy)>8
            ){

                moved=true;

            }


            if(!dragging){

                if(moved){

                    clearTimeout(
                        longPressTimer
                    );

                }

                return;

            }


            const tama=
                document.getElementById(
                    "tama"
                );


            const rect=
                tama.getBoundingClientRect();


            let x=
                (
                    (
                        e.clientX-
                        rect.left
                    )/
                    rect.width
                )*
                100;


            let y=
                (
                    (
                        e.clientY-
                        rect.top
                    )/
                    rect.height
                )*
                100;


            x=
                clampTamaX(x);

            y=
                clampTamaY(y);


            obj.x=x;

            obj.y=y;

            obj.vx=0;

            obj.vy=0;


            updateTamaDOM(obj);

        },
        {
            passive:false
        }
    );


    function finish(e){

        if(
            e.pointerId!==pointerId
        )
            return;


        e.preventDefault();


        clearTimeout(
            longPressTimer
        );


        if(dragging){

            obj.dragging=false;

            dragging=false;

            element.classList.remove(
                "selected"
            );


            tamaReaction(obj);

        }

        else if(!moved){

            tamaReaction(obj);

        }


        pointerId=null;

    }


    element.addEventListener(
        "pointerup",
        finish,
        {
            passive:false
        }
    );


    element.addEventListener(
        "pointercancel",
        finish,
        {
            passive:false
        }
    );

}


/* ==================================================
   좌표
================================================== */

function clampTamaX(x){

    return Math.max(
        8,
        Math.min(
            92,
            x
        )
    );

}


function clampTamaY(y){

    return Math.max(
        50,
        Math.min(
            89,
            y
        )
    );

}


function distanceBetween(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


function randomRange(
    min,
    max
){

    return min+
        Math.random()*
        (max-min);

}


/* ==================================================
   DOM 위치
================================================== */

function getTamaElement(obj){

    return [
        ...document
            .getElementById("tama")
            .querySelectorAll(
                ".tamaPotato"
            )
    ].find(
        el=>
            el.dataset.id===
            obj.id
    );

}


function updateTamaDOM(obj){

    const el=
        getTamaElement(obj);


    if(!el)
        return;


    el.style.left=
        obj.x+"%";

    el.style.top=
        obj.y+"%";

}


/* ==================================================
   초기 목표
================================================== */

function chooseInitialTarget(obj){

    obj.targetX=
        randomRange(
            15,
            85
        );

    obj.targetY=
        randomRange(
            57,
            84
        );

}


/* ==================================================
   AI 목표
================================================== */

function chooseAITarget(
    obj,
    now
){

    if(
        obj.sleeping ||
        obj.dragging ||
        now<obj.stunnedUntil
    )
        return;


    const style=
        obj.data.style;


    /*
       독감자
       다른 감자와 반대 방향.
       절대로 대장을 따라가지 않음.
    */

    if(style==="toxic"){

        let avgX=50;
        let avgY=70;

        const others=
            game.tamaPotatoes.filter(
                x=>
                    x!==obj &&
                    !x.sleeping
            );


        if(others.length){

            avgX=
                others.reduce(
                    (sum,x)=>
                        sum+x.x,
                    0
                )/
                others.length;


            avgY=
                others.reduce(
                    (sum,x)=>
                        sum+x.y,
                    0
                )/
                others.length;

        }


        let dx=
            obj.x-
            avgX;

        let dy=
            obj.y-
            avgY;


        const len=
            Math.hypot(dx,dy)||1;


        dx/=len;
        dy/=len;


        obj.targetX=
            clampTamaX(
                obj.x+
                dx*25
            );


        obj.targetY=
            clampTamaY(
                obj.y+
                dy*20
            );


        return;

    }


    /*
       폭력감자
       독감자 추적.
    */

    if(style==="violent"){

        const toxic=
            game.tamaPotatoes.find(
                x=>
                    x.data.style==="toxic"
            );


        if(toxic){

            const angle=
                Math.random()*
                Math.PI*2;


            const radius=
                8+
                Math.random()*9;


            obj.targetX=
                clampTamaX(
                    toxic.x+
                    Math.cos(angle)*
                    radius
                );


            obj.targetY=
                clampTamaY(
                    toxic.y+
                    Math.sin(angle)*
                    radius
                );

        }

        else{

            chooseInitialTarget(obj);

        }


        return;

    }


    /*
       대장감자
       목적지를 정해서 움직임.
    */

    if(style==="leader"){

        obj.targetX=
            randomRange(
                18,
                82
            );

        obj.targetY=
            randomRange(
                58,
                83
            );


        return;

    }


    /*
       저능감자
       대장 따라가기.
    */

    if(style==="dummy"){

        const leader=
            game.tamaPotatoes.find(
                x=>
                    x.data.style==="leader"
            );


        if(leader){

            obj.targetX=
                leader.x+
                randomRange(
                    -10,
                    10
                );


            obj.targetY=
                leader.y+
                randomRange(
                    -7,
                    7
                );

        }

        else{

            chooseInitialTarget(obj);

        }


        return;

    }


    /*
       꾼감자
       주변 감자에게 접근.
    */

    if(style==="social"){

        const others=
            game.tamaPotatoes.filter(
                x=>
                    x!==obj &&
                    !x.sleeping
            );


        if(others.length){

            const other=
                random(others);


            obj.targetX=
                other.x+
                randomRange(
                    -7,
                    7
                );


            obj.targetY=
                other.y+
                randomRange(
                    -7,
                    7
                );

        }

        else{

            chooseInitialTarget(obj);

        }

    }

}

                )

/* ==================================================
   부드러운 이동
   requestAnimationFrame
================================================== */

function updateTamaMovement(
    obj,
    delta,
    now
){

    if(
        obj.sleeping ||
        obj.dragging
    )
        return;


    if(
        now<
        obj.stunnedUntil
    ){

        obj.vx*=.9;
        obj.vy*=.9;

        return;

    }


    if(
        obj.targetX===null ||
        obj.targetY===null
    ){

        chooseAITarget(
            obj,
            now
        );

    }


    if(
        obj.targetX===null
    )
        return;


    let dx=
        obj.targetX-
        obj.x;

    let dy=
        obj.targetY-
        obj.y;


    const dist=
        Math.hypot(dx,dy);


    if(dist<1.8){

        obj.vx*=.88;
        obj.vy*=.88;

        return;

    }


    dx/=dist;
    dy/=dist;


    let speed=
        obj.maxSpeed;


    if(
        obj.data.style==="dummy"
    ){

        speed*=.48;

    }


    if(
        obj.data.style==="toxic"
    ){

        speed*=1.12;

    }


    if(
        obj.data.style==="violent"
    ){

        speed*=1.15;

    }


    /*
       부드러운 가속.
    */

    const acceleration=
        .065;


    obj.vx+=
        dx*
        acceleration;

    obj.vy+=
        dy*
        acceleration;


    const velocity=
        Math.hypot(
            obj.vx,
            obj.vy
        );


    if(velocity>speed){

        obj.vx=
            obj.vx/
            velocity*
            speed;

        obj.vy=
            obj.vy/
            velocity*
            speed;

    }


    /*
       60fps 기준 보정.
    */

    const frameScale=
        Math.min(
            delta/16.6667,
            2
        );


    obj.x+=
        obj.vx*
        frameScale;

    obj.y+=
        obj.vy*
        frameScale;


    /*
       경계.
    */

    if(obj.x<8){

        obj.x=8;

        obj.vx=
            Math.abs(
                obj.vx
            );

    }


    if(obj.x>92){

        obj.x=92;

        obj.vx=
            -Math.abs(
                obj.vx
            );

    }


    if(obj.y<50){

        obj.y=50;

        obj.vy=
            Math.abs(
                obj.vy
            );

    }


    if(obj.y>89){

        obj.y=89;

        obj.vy=
            -Math.abs(
                obj.vy
            );

    }


    const el=
        getTamaElement(obj);


    if(el){

        if(
            velocity>.25
        ){

            el.classList.add(
                "walking"
            );

        }

        else{

            el.classList.remove(
                "walking"
            );

        }

    }


    updateTamaDOM(obj);

}


/* ==================================================
   감자끼리 충돌
================================================== */

function processPotatoInteractions(
    now
){

    const list=
        game.tamaPotatoes;


    for(
        let i=0;
        i<list.length;
        i++
    ){

        const a=list[i];


        for(
            let j=i+1;
            j<list.length;
            j++
        ){

            const b=list[j];


            if(
                a.sleeping ||
                b.sleeping ||
                a.dragging ||
                b.dragging
            )
                continue;


            const distance=
                distanceBetween(a,b);


            /*
               가까워졌을 때
               성격별 상호작용.
            */

            if(
                distance<11 &&
                now>
                Math.max(
                    a.nextInteraction,
                    b.nextInteraction
                )
            ){

                handlePotatoMeeting(
                    a,
                    b,
                    now
                );

            }


            /*
               겹치지 않도록 밀어냄.
            */

            if(
                distance<7 &&
                distance>0
            ){

                let dx=
                    a.x-b.x;

                let dy=
                    a.y-b.y;


                const len=
                    Math.hypot(dx,dy)||1;


                dx/=len;
                dy/=len;


                const push=
                    (7-distance)*
                    .05;


                a.vx+=
                    dx*push;

                a.vy+=
                    dy*push;

                b.vx-=
                    dx*push;

                b.vy-=
                    dy*push;

            }

        }

    }

}


/* ==================================================
   만남
================================================== */

function handlePotatoMeeting(
    a,
    b,
    now
){

    const cooldown=
        now+
        1600+
        Math.random()*2200;


    a.nextInteraction=
        cooldown;

    b.nextInteraction=
        cooldown;


    /*
       독감자 접촉.
    */

    if(
        a.data.style==="toxic" ||
        b.data.style==="toxic"
    ){

        const toxic=
            a.data.style==="toxic"
            ? a
            : b;


        const target=
            toxic===a
            ? b
            : a;


        /*
           폭력감자는 독감자 공격에
           완전 면역.
        */

        if(
            target.data.style==="violent"
        ){

            showTamaSpeech(
                target,
                "독감자! ❤️"
            );

            showTamaEmotion(
                target,
                "❤️"
            );

            showTamaSpeech(
                toxic,
                "...또 너냐."
            );

            showTamaEmotion(
                toxic,
                "😑"
            );

            return;

        }


        /*
           10% 확률 스턴.
        */

        if(
            Math.random()<.10
        ){

            stunTama(target);

            showTamaSpeech(
                toxic,
                "건드리지 마. ☠️"
            );

            showTamaEmotion(
                toxic,
                "☠️"
            );

            return;

        }

    }


    /*
       꾼감자
       누구에게나 친근.
    */

    if(
        a.data.style==="social"
    ){

        showTamaSpeech(
            a,
            "친구다! ❤️"
        );

        showTamaEmotion(
            a,
            "💕"
        );

    }


    if(
        b.data.style==="social"
    ){

        showTamaSpeech(
            b,
            "같이 놀자! ❤️"
        );

        showTamaEmotion(
            b,
            "💕"
        );

    }


    /*
       대장 + 저능감자.
    */

    if(
        a.data.style==="leader" &&
        b.data.style==="dummy"
    ){

        showTamaSpeech(
            a,
            "따라와라."
        );

        showTamaSpeech(
            b,
            "응... 어디 가?"
        );

        showTamaEmotion(
            a,
            "🫡"
        );

    }


    if(
        b.data.style==="leader" &&
        a.data.style==="dummy"
    ){

        showTamaSpeech(
            b,
            "따라와라."
        );

        showTamaSpeech(
            a,
            "응... 어디 가?"
        );

        showTamaEmotion(
            b,
            "🫡"
        );

    }


    /*
       저능감자는 독감자 제외 모두에게 사랑받음.
    */

    if(
        a.data.style==="dummy" &&
        b.data.style!=="toxic"
    ){

        showTamaEmotion(
            b,
            b.data.style==="violent"
            ? "❤️"
            : "💕"
        );

    }


    if(
        b.data.style==="dummy" &&
        a.data.style!=="toxic"
    ){

        showTamaEmotion(
            a,
            a.data.style==="violent"
            ? "❤️"
            : "💕"
        );

    }

}

   스턴
================================================== */

function stunTama(obj){

    if(
        obj.data.style==="violent"
    )
        return;


    obj.stunnedUntil=
        performance.now()+
        3000;


    obj.vx=0;
    obj.vy=0;


    const el=
        getTamaElement(obj);


    if(!el)
        return;


    el.classList.add(
        "stunned"
    );


    showTamaEmotion(
        obj,
        "😵"
    );


    setTimeout(
        ()=>{

            if(el.parentNode){

                el.classList.remove(
                    "stunned"
                );

            }

        },
        3000
    );

}

function makeLeaderFollow(leader){

    if(
        !leader ||
        leader.data.style!=="leader"
    )
        return;


    game.tamaPotatoes
        .forEach(
            other=>{

                if(
                    other===leader ||
                    other.data.style==="toxic" ||
                    other.data.style==="violent" ||
                    other.dragging ||
                    other.sleeping
                )
                    return;


                other.targetX=
                    leader.x+
                    randomRange(

                    );


                other.targetY=
                    leader.y+
                    randomRange(
                        -7,
                        7
                    );

            }
        );

/* ==================================================
   독감자 공격
================================================== */

function toxicAttack(toxic){

    game.tamaPotatoes
        .forEach(
            other=>{

                if(
                    other===toxic ||
                    other.data.style==="violent"
                )
                    return;


                const distance=
                    distanceBetween(
                        toxic,
                        other
                    );


                if(
                    distance<15 &&
                    Math.random()<.10
                ){

                    stunTama(other);

                }

            }
        );

}

function showTamaSpeech(
    obj,
    text
){

    const tama=
        document.getElementById(
            "tama"
        );


    if(
        obj.speechEl &&
        obj.speechEl.parentNode
    ){

        obj.speechEl.remove();

    }


    const speech=
        document.createElement(
            "div"
        );


    speech.className=
        "tamaSpeech";


    speech.textContent=
        text;


    speech.style.left=
        obj.x+"%";


    speech.style.top=
        (obj.y-11)+"%";


    tama.appendChild(
        speech
    );


    obj.speechEl=
        speech;


    setTimeout(
        ()=>{

            if(
                speech.parentNode
            ){

                speech.remove();

            }


            if(
                obj.speechEl===speech
            ){

                obj.speechEl=null;

            }

        },
        1300
    );

}

/* ==================================================
   간식 업데이트
================================================== */

function updateSnacks(
    delta,
    now
){

    for(
        let i=
            game.tamaSnacks.length-1;
        i>=0;
        i--
    ){

        const snack=
            game.tamaSnacks[i];


        if(
            !snack.element ||
            !snack.element.parentNode
        ){

            game.tamaSnacks.splice(
                i,
                1
            );

            continue;

        }


        /*
           떨어지는 중.
        */

        if(!snack.landed){

            snack.y+=
                snack.speed*
                delta/
                1000;


            if(snack.y>=73){

                snack.y=73;

                snack.landed=true;

            }

        }


        snack.element.style.left=
            snack.x+"%";

        snack.element.style.top=
            snack.y+"%";


        /*
           감자가 먹는지 확인.
        */

        if(snack.landed){

            let eater=null;

            let closest=
                Infinity;


            game.tamaPotatoes
                .forEach(
                    obj=>{

                        if(
                            obj.sleeping ||
                            obj.dragging ||
                            now<
                            obj.stunnedUntil
                        )
                            return;


                        const d=
                            Math.hypot(
                                obj.x-snack.x,
                                obj.y-snack.y
                            );


                        if(
                            d<closest
                        ){

                            closest=d;

                            eater=obj;

                        }

                    }
                );


            if(
                eater &&
                closest<8
            ){

                eatSnack(
                    eater,
                    snack,
                    i
                );

            }

        }


        /*
           너무 오래 방치된 경우
           20초 후 정리.
        */

        if(
            now-
            snack.created>
            20000
        ){

            if(
                snack.element.parentNode
            )
                snack.element.remove();


            game.tamaSnacks.splice(
                i,
                1
            );

        }

    }

}


/* ==================================================
   간식 먹기
================================================== */

function eatSnack(
    obj,
    snack,
    index
){

    if(
        snack.element &&
        snack.element.parentNode
    ){

        snack.element.remove();

    }


    game.tamaSnacks.splice(
        index,
        1
    );


    obj.targetX=null;
    obj.targetY=null;
    obj.snackTarget=null;


    showTamaSpeech(
        obj,
        obj.data.style==="dummy"
        ? "냠냠..."
        : "맛있다! 🍬"
    );


    showTamaEmotion(
        obj,
        obj.data.style==="toxic"
        ? "😐"
        : "😋"
    );


    const el=
        getTamaElement(obj);


    if(el){

        el.classList.remove(
            "reactionJump"
        );

        void el.offsetWidth;

        el.classList.add(
            "reactionJump"
        );

    }

}


/* ==================================================
   잠
================================================== */

function tamaSleep(){

    if(
        game.sleeping ||
        game.tamaPotatoes.length===0
    )
        return;


    game.sleeping=true;


    const tama=
        document.getElementById(
            "tama"
        );


    const overlay=
        document.createElement(
            "div"
        );


    overlay.className=
        "sleepOverlay";


    overlay.textContent=
        "🌙 Zzz...";


    tama.appendChild(
        overlay
    );


    game.tamaPotatoes
        .forEach(
            obj=>{

                obj.sleeping=true;

                obj.vx=0;
                obj.vy=0;

                showTamaSpeech(
                    obj,
                    "Zzz... 😴"
                );

            }
        );


    setTimeout(
        ()=>{

            if(
                overlay.parentNode
            )
                overlay.remove();


            game.tamaPotatoes
                .forEach(
                    obj=>{

                        obj.sleeping=false;

                        obj.targetX=null;
                        obj.targetY=null;

                        obj.nextDecision=0;

                    }
                );


            game.sleeping=false;

        },
        10000
    );

}


/* ==================================================
   다마고치 RAF
================================================== */

function startTamaLoop(){

    stopTamaLoop();


    game.lastTamaTime=
        performance.now();


    function frame(now){

        if(
            dictionaryScreen.classList.contains(
                "hidden"
            )
        ){

            game.tamaAnimationId=null;

            return;

        }


        const delta=
            Math.min(
                now-
                game.lastTamaTime,
                40
            );


        game.lastTamaTime=
            now;


        /*
           대장 추종.
        */

        updateLeaderFollowing();


        /*
           감자 각각 이동.
        */

        game.tamaPotatoes
            .forEach(
                obj=>{

                    if(
                        obj.sleeping ||
                        obj.dragging
                    )
                        return;


                    /*
                       다음 AI 목표.
                    */

                    if(
                        now>
                        obj.nextDecision
                    ){

                        chooseAITarget(
                            obj,
                            now
                        );


                        obj.nextDecision=
                            now+
                            1300+
                            Math.random()*1700;

                    }


                    updateTamaMovement(
                        obj,
                        delta,
                        now
                    );


                    /*
                       혼잣말.
                    */

                    if(
                        now>
                        obj.nextSpeech
                    ){

                        if(
                            Math.random()<.18
                        ){

                            autonomousSpeech(
                                obj
                            );

                        }


                        obj.nextSpeech=
                            now+
                            4500+
                            Math.random()*6000;

                    }

                }
            );


        /*
           감자끼리 상호작용.
        */

        processPotatoInteractions(
            now
        );


        /*
           간식 업데이트.
        */

        updateSnacks(
            delta,
            now
        );


        /*
           말풍선 위치를
           감자 위치에 계속 맞춤.
        */

        game.tamaPotatoes
            .forEach(
                obj=>{

                    if(
                        obj.speechEl &&
                        obj.speechEl.parentNode
                    ){

                        obj.speechEl.style.left=
                            obj.x+"%";

                        obj.speechEl.style.top=
                            (obj.y-11)+"%";

                    }

                }
            );


        game.tamaAnimationId=
            requestAnimationFrame(
                frame
            );

    }


    game.tamaAnimationId=
        requestAnimationFrame(
            frame
        );

}


function stopTamaLoop(){

    if(
        game.tamaAnimationId
    ){

        cancelAnimationFrame(
            game.tamaAnimationId
        );

        game.tamaAnimationId=null;

    }

}


/* ==================================================
   유틸
================================================== */

function random(array){

    if(
        !array ||
        array.length===0
    )
        return "";


    return array[
        Math.floor(
            Math.random()*
            array.length
        )
    ];

}


/* ==================================================
   초기화
================================================== */

updateGrow();


/* ==================================================
   추가 복사 방지
================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            (
                e.ctrlKey ||
                e.metaKey
            ) &&
            (
                e.key==="c" ||
                e.key==="C"
            )
        ){

            if(
                e.target.closest(".tama") ||
                e.target.closest(".petStage")
            ){

                e.preventDefault();

            }

        }

    },
    {
        passive:false
    }
);
