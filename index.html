<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>감자 키우기</title>

<style>

/* =====================================================
   기본
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;

  background:#f8f4e8;
  color:#3d3428;
}

body{
  overflow-x:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.screen{
  display:none;
  min-height:100vh;
}

.screen.active{
  display:block;
}


/* =====================================================
   시작 화면
===================================================== */

#startScreen{
  min-height:100vh;

  display:none;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:30px;

  background:
    linear-gradient(
      #dff5ff 0%,
      #dff5ff 47%,
      #b9df8d 47%,
      #b9df8d 100%
    );
}

#startScreen.active{
  display:flex;
}

.start-box{
  width:min(90vw,420px);

  padding:40px 25px;

  background:rgba(255,255,255,.92);

  border-radius:30px;

  box-shadow:
    0 15px 45px
    rgba(72,52,25,.15);
}

.start-potato{
  font-size:80px;

  animation:
    startBounce
    2s
    infinite
    ease-in-out;
}

@keyframes startBounce{

  0%,
  100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-12px);
  }

}

.start-box h1{
  margin:12px 0 8px;

  font-size:34px;
}

.start-box p{
  margin:0 0 25px;

  color:#756957;
}

.start-btn{
  border:0;

  padding:16px 25px;

  border-radius:18px;

  background:#8cbd5a;

  color:white;

  font-size:17px;

  font-weight:800;

  box-shadow:
    0 5px 0 #67953b;
}

.start-btn:active{
  transform:translateY(4px);

  box-shadow:
    0 1px 0 #67953b;
}


/* =====================================================
   공통
===================================================== */

.game-wrap{
  width:min(100%,600px);

  margin:0 auto;

  padding-bottom:30px;
}

.sticky-top{
  position:sticky;

  top:0;

  z-index:50;

  background:
    rgba(248,244,232,.96);

  backdrop-filter:blur(12px);

  padding:
    12px
    14px
    10px;

  border-bottom:
    1px solid
    rgba(80,65,40,.08);
}

.title{
  text-align:center;

  font-size:22px;

  font-weight:900;

  margin:
    3px
    0
    10px;
}

.potato-area{
  position:relative;

  height:250px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;
}

.main-potato{
  width:190px;

  max-width:55vw;

  user-select:none;

  -webkit-user-select:none;

  -webkit-user-drag:none;

  cursor:pointer;

  transition:
    transform .18s ease;
}

.main-potato:active{
  transform:scale(.94);
}

.message{
  min-height:55px;

  padding:
    12px
    16px;

  margin:
    4px
    0;

  border-radius:18px;

  background:white;

  text-align:center;

  font-size:15px;

  font-weight:700;

  box-shadow:
    0 3px 12px
    rgba(60,45,25,.08);
}


/* =====================================================
   성장
===================================================== */

.growth-box{
  padding:20px 16px;

  text-align:center;
}

.growth-potato{
  font-size:100px;

  margin:
    25px
    0;
}

.growth-percent{
  font-size:28px;

  font-weight:900;
}

.progress{
  width:100%;

  height:18px;

  background:#ddd6c7;

  border-radius:20px;

  overflow:hidden;

  margin:
    12px
    0
    25px;
}

.progress-bar{
  width:0%;

  height:100%;

  background:#8cbd5a;

  transition:
    width .3s ease;
}

.growth-buttons{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}

.growth-buttons button{
  border:0;

  border-radius:16px;

  padding:15px 8px;

  background:white;

  box-shadow:
    0 3px 10px
    rgba(60,45,25,.08);

  font-size:15px;

  font-weight:800;
}

.hatch-btn{
  grid-column:1/-1;

  background:#8cbd5a !important;

  color:white;
}

.hidden{
  display:none !important;
}


/* =====================================================
   상태
===================================================== */

.stats{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  padding:
    12px
    14px;
}

.stat{
  background:white;

  padding:
    11px
    13px;

  border-radius:15px;

  box-shadow:
    0 3px 10px
    rgba(60,45,25,.06);
}

.stat-top{
  display:flex;

  justify-content:space-between;

  font-size:13px;

  margin-bottom:6px;
}

.stat-bar{
  height:9px;

  border-radius:20px;

  background:#e5e0d5;

  overflow:hidden;
}

.stat-fill{
  height:100%;

  width:100%;

  border-radius:20px;

  transition:
    width .3s;
}

.hunger-fill{
  background:#f0a85c;
}

.water-fill{
  background:#71b8dc;
}

.love-fill{
  background:#e7839e;
}

.energy-fill{
  background:#d4bd57;
}


/* =====================================================
   버튼
===================================================== */

.actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  padding:
    8px
    14px;
}

.actions button{
  border:0;

  padding:
    15px
    8px;

  border-radius:17px;

  background:white;

  font-size:15px;

  font-weight:800;

  box-shadow:
    0 3px 10px
    rgba(60,45,25,.07);
}

.actions button:active{
  transform:scale(.96);
}

.harvest-btn{
  background:#a47b4d !important;

  color:white;
}

.collection-btn{
  background:#6e9c5b !important;

  color:white;
}


/* =====================================================
   걷기
===================================================== */

.walking{
  animation:
    walking
    .65s
    infinite
    alternate
    ease-in-out;
}

@keyframes walking{

  from{
    transform:
      translateX(-15px)
      rotate(-3deg);
  }

  to{
    transform:
      translateX(15px)
      rotate(3deg);
  }

}

.walk-effect{
  position:absolute;

  font-size:32px;

  animation:
    walkEffect
    .9s
    forwards;
}

@keyframes walkEffect{

  from{
    opacity:1;

    transform:
      translateY(0);
  }

  to{
    opacity:0;

    transform:
      translateY(-55px);
  }

}


/* =====================================================
   메인 감자 반응
===================================================== */

.react-jump{
  animation:
    jump
    .55s
    ease;
}

@keyframes jump{

  0%{
    transform:translateY(0);
  }

  40%{
    transform:
      translateY(-28px)
      rotate(-4deg);
  }

  70%{
    transform:
      translateY(0)
      rotate(4deg);
  }

  100%{
    transform:translateY(0);
  }

}

.react-shy{
  animation:
    shy
    .65s
    ease;
}

@keyframes shy{

  0%{
    transform:scale(1);
  }

  30%{
    transform:
      scale(.9)
      rotate(-5deg);
  }

  60%{
    transform:
      scale(.9)
      rotate(5deg);
  }

  100%{
    transform:scale(1);
  }

}

.react-wiggle{
  animation:
    wiggle
    .55s
    ease;
}

@keyframes wiggle{

  0%,
  100%{
    transform:rotate(0);
  }

  25%{
    transform:rotate(-9deg);
  }

  75%{
    transform:rotate(9deg);
  }

}

.react-heart{
  animation:
    heart
    .6s
    ease;
}

@keyframes heart{

  0%{
    transform:scale(1);
  }

  45%{
    transform:scale(1.13);
  }

  100%{
    transform:scale(1);
  }

}

.react-angry{
  animation:
    angry
    .5s
    ease;
}

@keyframes angry{

  0%,
  100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-8px);
  }

  75%{
    transform:translateX(8px);
  }

}

.react-happy{
  animation:
    happy
    .65s
    ease;
}

@keyframes happy{

  0%{
    transform:scale(1);
  }

  50%{
    transform:
      scale(1.12)
      translateY(-7px);
  }

  100%{
    transform:scale(1);
  }

}

.react-sleep{
  animation:
    sleep
    .9s
    ease;
}

@keyframes sleep{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:
      translateY(7px)
      scale(.96);
  }

  100%{
    transform:translateY(0);
  }

}


/* =====================================================
   도감
===================================================== */

#collectionScreen{
  background:#b9df8d;
}

.collection-head{
  position:sticky;

  top:0;

  z-index:40;

  padding:
    13px
    14px;

  background:
    rgba(244,250,229,.94);

  backdrop-filter:blur(10px);
}

.collection-title{
  text-align:center;

  font-size:22px;

  font-weight:900;
}

.collection-count{
  text-align:center;

  margin-top:5px;

  font-size:14px;

  font-weight:700;

  color:#647152;
}

.back-btn{
  position:absolute;

  left:12px;

  top:10px;

  border:0;

  background:white;

  border-radius:12px;

  padding:
    9px
    11px;

  font-weight:800;
}


/* =====================================================
   농장 놀이터
===================================================== */

.playground{
  position:relative;

  width:100%;

  height:390px;

  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      #9dd56d 0%,
      #a9db76 48%,
      #b6df83 48%,
      #b6df83 100%
    );

  border-bottom:
    5px solid
    rgba(94,124,57,.3);

  touch-action:none;
}

.playground::before{
  content:"";

  position:absolute;

  inset:0;

  opacity:.35;

  background-image:
    radial-gradient(
      circle,
      #6ea451 1.5px,
      transparent 1.7px
    ),
    radial-gradient(
      circle,
      #d8efad 1px,
      transparent 1.4px
    );

  background-size:
    38px 38px,
    27px 27px;

  background-position:
    8px 7px,
    20px 16px;

  pointer-events:none;
}


/* 길 */

.dirt-path{
  position:absolute;

  left:-10%;

  bottom:-45px;

  width:120%;

  height:125px;

  background:#d9b77a;

  border-radius:
    50%
    50%
    0
    0;

  transform:rotate(-3deg);

  box-shadow:
    inset
    0 9px 0
    rgba(177,132,76,.18);

  pointer-events:none;
}


/* 연못 */

.pond{
  position:absolute;

  left:20px;

  bottom:55px;

  width:115px;

  height:62px;

  background:#72c5dc;

  border:
    5px solid
    #80bd76;

  border-radius:50%;

  box-shadow:
    inset
    0 7px 0
    rgba(255,255,255,.2);

  pointer-events:none;
}

.pond::after{
  content:"";

  position:absolute;

  width:22px;

  height:7px;

  border-top:
    2px solid
    rgba(255,255,255,.55);

  border-radius:50%;

  left:42px;

  top:24px;
}


/* 해 */

.sun{
  position:absolute;

  right:25px;

  top:18px;

  font-size:48px;

  pointer-events:none;
}


/* 구름 */

.cloud{
  position:absolute;

  font-size:36px;

  opacity:.8;

  pointer-events:none;
}

.cloud1{
  left:18px;

  top:20px;
}

.cloud2{
  left:44%;

  top:55px;

  font-size:28px;
}


/* 나무 */

.tree{
  position:absolute;

  font-size:58px;

  pointer-events:none;

  z-index:1;
}

.tree1{
  right:10px;

  bottom:145px;
}

.tree2{
  right:85px;

  bottom:170px;

  font-size:46px;
}

.tree3{
  left:120px;

  bottom:150px;

  font-size:43px;
}


/* 통나무 */

.log{
  position:absolute;

  right:18px;

  bottom:65px;

  font-size:43px;

  pointer-events:none;
}


/* 꽃 */

.flower{
  position:absolute;

  font-size:24px;

  pointer-events:none;
}

.flower1{
  left:17%;
  bottom:115px;
}

.flower2{
  left:34%;
  bottom:85px;
}

.flower3{
  right:30%;
  bottom:125px;
}

.flower4{
  right:12%;
  bottom:105px;
}


/* =====================================================
   놀이터 감자
===================================================== */

.play-potato{

  position:absolute;

  width:62px;

  height:62px;

  object-fit:contain;

  z-index:10;


  /*
    아이폰 Safari가
    이미지 길게 누르기를
    복사/저장으로 처리하지 않도록
  */

  -webkit-touch-callout:none !important;

  -webkit-user-select:none !important;

  user-select:none !important;

  -webkit-user-drag:none !important;

  user-drag:none !important;


  /*
    터치 이벤트를
    브라우저 스크롤보다 우선 처리
  */

  touch-action:none !important;

  pointer-events:auto !important;


  cursor:grab;

  transition:
    transform .16s ease,
    filter .16s ease;
}

.play-potato.dragging{

  cursor:grabbing;

  transform:scale(1.28);

  filter:
    drop-shadow(
      0 12px 8px
      rgba(50,40,20,.32)
    );

  z-index:100;

  transition:none;
}

.play-potato.leader-near{

  animation:
    leaderNear
    .6s
    infinite
    alternate
    ease-in-out;
}

@keyframes leaderNear{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-4px);
  }

}

.play-potato.bounce{

  animation:
    miniBounce
    .45s
    ease;
}

@keyframes miniBounce{

  0%,
  100%{
    transform:scale(1);
  }

  40%{
    transform:
      scale(1.14)
      translateY(-10px);
  }

}

.play-potato.wiggle{

  animation:
    miniWiggle
    .5s
    ease;
}

@keyframes miniWiggle{

  0%,
  100%{
    transform:rotate(0);
  }

  25%{
    transform:rotate(-10deg);
  }

  75%{
    transform:rotate(10deg);
  }

}

.play-potato.sleep{

  animation:
    miniSleep
    1s
    ease;
}

@keyframes miniSleep{

  0%,
  100%{
    transform:translateY(0);
  }

  50%{
    transform:
      translateY(5px)
      scale(.95);
  }

}

.play-potato.angry{

  animation:
    miniAngry
    .45s
    ease;
}

@keyframes miniAngry{

  0%,
  100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-5px);
  }

  75%{
    transform:translateX(5px);
  }

}

.play-potato.happy{

  animation:
    miniHappy
    .55s
    ease;
}

@keyframes miniHappy{

  0%,
  100%{
    transform:scale(1);
  }

  50%{
    transform:
      scale(1.15)
      translateY(-6px);
  }

}


/* =====================================================
   충돌
===================================================== */

.collision-effect{

  position:absolute;

  z-index:120;

  font-size:30px;

  pointer-events:none;

  animation:
    collision
    .7s
    forwards;
}

@keyframes collision{

  0%{
    opacity:1;

    transform:
      scale(.5)
      rotate(0);
  }

  45%{
    opacity:1;

    transform:
      scale(1.25)
      rotate(15deg);
  }

  100%{
    opacity:0;

    transform:
      scale(1.5)
      rotate(-10deg)
      translateY(-12px);
  }

}


/* =====================================================
   도감 카드
===================================================== */

.collection-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:12px;

  padding:14px;

  background:#edf5dc;
}

.collection-card{

  background:white;

  border-radius:20px;

  padding:
    14px
    10px;

  text-align:center;

  min-height:170px;

  box-shadow:
    0 4px 12px
    rgba(55,70,35,.1);
}

.collection-card img{

  width:100px;

  height:100px;

  object-fit:contain;
}

.collection-card .unknown{

  width:100px;

  height:100px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#e5eadb;

  border-radius:50%;

  font-size:42px;
}

.collection-name{

  margin-top:7px;

  font-size:16px;

  font-weight:900;
}

.collection-status{

  margin-top:5px;

  font-size:12px;

  color:#78905d;

  font-weight:700;
}


/* =====================================================
   모달
===================================================== */

.modal{

  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.42);
}

.modal.active{

  display:flex;
}

.modal-box{

  width:min(90vw,380px);

  background:white;

  border-radius:25px;

  padding:25px;

  text-align:center;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.25);
}

.modal-potato{

  width:150px;

  height:150px;

  object-fit:contain;
}

.modal-box h2{

  margin:
    8px
    0;
}

.modal-box p{

  color:#756957;
}

.modal-close{

  border:0;

  background:#6e9c5b;

  color:white;

  padding:
    12px
    25px;

  border-radius:14px;

  font-weight:800;
}


/* =====================================================
   작은 화면
===================================================== */

@media(max-width:380px){

  .playground{
    height:360px;
  }

  .play-potato{

    width:56px;

    height:56px;
  }

  .main-potato{

    width:170px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     시작 화면
===================================================== -->

<section
  id="startScreen"
  class="screen active">

  <div class="start-box">

    <div class="start-potato">
      🥔
    </div>

    <h1>
      감자 키우기
    </h1>

    <p>
      나만의 감자를 키워보세요!
    </p>

    <button
      class="start-btn"
      onclick="startGame()">

      감자 키우기 시작

    </button>

  </div>

</section>


<!-- =====================================================
     성장 화면
===================================================== -->

<section
  id="growthScreen"
  class="screen">

  <div class="game-wrap">

    <div class="sticky-top">

      <div class="title">
        🥔 감자 키우기
      </div>

      <div
        class="message"
        id="growthMessage">

        감자가 자라기를 기다리고 있어요!

      </div>

    </div>


    <div class="growth-box">

      <div
        id="growthPotato"
        class="growth-potato">

        🌱

      </div>


      <div class="growth-percent">

        <span id="growthPercent">
          0
        </span>%

      </div>


      <div class="progress">

        <div
          id="growthBar"
          class="progress-bar">
        </div>

      </div>


      <div class="growth-buttons">

        <button onclick="grow(12)">
          🌱 비료 주기<br>
          +12
        </button>

        <button onclick="grow(10)">
          💧 물 주기<br>
          +10
        </button>

        <button onclick="grow(8)">
          ☀️ 햇빛 쬐기<br>
          +8
        </button>

        <button onclick="grow(5)">
          💕 응원하기<br>
          +5
        </button>

        <button
          id="hatchButton"
          class="hatch-btn hidden"
          onclick="hatchPotato()">

          🥔 감자 태어나기

        </button>

      </div>

    </div>

  </div>

</section>


<!-- =====================================================
     메인 게임
===================================================== -->

<section
  id="gameScreen"
  class="screen">

  <div class="game-wrap">


    <div class="sticky-top">

      <div class="title">
        🥔 감자 키우기
      </div>


      <div
        class="potato-area"
        id="potatoArea">

        <img
          id="mainPotato"
          class="main-potato"
          src=""
          alt="감자"
          onclick="potatoTouch()">

      </div>


      <div
        id="message"
        class="message">

/* =====================================================
   저장
===================================================== */

function saveState(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =====================================================
   불러오기
===================================================== */

function loadState(){

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if(!saved){
    return;
  }


  try{

    const parsed =
      JSON.parse(saved);


    state={
      ...state,
      ...parsed
    };


    if(
      !Array.isArray(
        state.collection
      )
    ){

      state.collection=[];

    }


    if(
      !state.collectionData
    ){

      state.collectionData={};

    }


  }catch(error){

    console.log(
      "저장 데이터 불러오기 실패"
    );

  }

}


/* =====================================================
   화면
===================================================== */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{

      screen.classList.remove(
        "active"
      );

    });


  document
    .getElementById(id)
    .classList.add(
      "active"
    );

}


/* =====================================================
   시작
===================================================== */

function startGame(){

  state.started=true;

  state.born=false;

  state.growth=0;

  saveState();

  showScreen(
    "growthScreen"
  );

  updateGrowth();

}


/* =====================================================
   성장
===================================================== */

function grow(amount){

  if(
    state.growth>=100
  ){

    return;

  }


  state.growth += amount;


  if(
    state.growth>100
  ){

    state.growth=100;

  }


  updateGrowth();


  if(
    state.growth<25
  ){

    showGrowthMessage(
      "🌱 아직 작은 새싹이에요!"
    );

  }

  else if(
    state.growth<50
  ){

    showGrowthMessage(
      "🌿 쑥쑥 자라고 있어요!"
    );

  }

  else if(
    state.growth<75
  ){

    showGrowthMessage(
      "🌳 제법 많이 자랐어요!"
    );

  }

  else if(
    state.growth<100
  ){

    showGrowthMessage(
      "🥔 감자가 거의 다 자랐어요!"
    );

  }

  else{

    showGrowthMessage(
      "🥔 감자가 다 자랐어요!"
    );


    document
      .getElementById(
        "hatchButton"
      )
      .classList.remove(
        "hidden"
      );

  }


  saveState();

}


function showGrowthMessage(text){

  document
    .getElementById(
      "growthMessage"
    )
    .textContent=text;

}


function updateGrowth(){

  const percent =
    state.growth;


  let emoji="🌱";


  if(
    percent>=25 &&
    percent<50
  ){

    emoji="🌿";

  }


  if(
    percent>=50 &&
    percent<75
  ){

    emoji="🌳";

  }


  if(
    percent>=75 &&
    percent<100
  ){

    emoji="🥔";

  }


  if(
    percent>=100
  ){

    emoji="🥔";

  }


  document
    .getElementById(
      "growthPotato"
    )
    .textContent=emoji;


  document
    .getElementById(
      "growthPercent"
    )
    .textContent=percent;


  document
    .getElementById(
      "growthBar"
    )
    .style.width=
      percent+"%";


  if(
    percent>=100
  ){

    document
      .getElementById(
        "hatchButton"
      )
      .classList.remove(
        "hidden"
      );

  }

}


/* =====================================================
   탄생
===================================================== */

function hatchPotato(){

  if(
    state.growth<100
  ){

    return;

  }


  const character =
    potatoes[
      Math.floor(
        Math.random()*
        potatoes.length
      )
    ];


  const personality =
    personalities[
      Math.floor(
        Math.random()*
        personalities.length
      )
    ];


  state.character=
    character;

  state.personality=
    personality;


  state.hunger=100;

  state.water=100;

  state.love=50;

  state.energy=100;

  state.born=true;


  saveState();


  showScreen(
    "gameScreen"
  );


  updateCharacter();


  showMessage(
    `${character.name}가 태어났어요! ${personality} 성격이에요.`
  );

}


function updateCharacter(){

  if(
    !state.character

    return;

  }


  const img =
    document.getElementById(
      "mainPotato"
    );


  img.src=
    state.character.image;


  img.alt=
    state.character.name;

function personalityMessage(action){

  const list =
    dialogue[
      state.personality
    ]?.[action];


  if(
    !list ||
    !list.length
  ){

    return "";

  }


  return list[
    Math.floor(
      Math.random()*
      list.length
    )
  ];

}


/* =====================================================
   밥
===================================================== */

function feed(){

  if(
    !state.born
  ){

    return;

  }


  state.hunger=
    Math.min(
      100,
      state.hunger+20
    );


  state.energy=
    Math.min(
      100,
      state.energy+3
    );


  saveState();


  showMessage(
    personalityMessage(
      "feed"
    )
  );


  reactMain(
    "happy"
  );


  updateStats();

}


/* =====================================================
   물
===================================================== */

  if(
    !state.born
  ){

    return;

  }


  state.water=
    Math.min(
      100,
      state.water+20
    );


  saveState();


  showMessage(
    personalityMessage(
      "water"
    )
  );


  reactMain(
    "happy"
  );


  updateStats();

}

===================================================== */

  if(
    !state.born
  ){

    return;

  }


  state.love=
    Math.min(
      100,
      state.love+8
    );


  saveState();


  showMessage(
    personalityMessage(
      "pet"
    )
  );


  reactMain(

    state.personality===
      "겁이 많은"

      ? "shy"

      : "heart"

  );


  updateStats();

}


/* =====================================================
   산책
===================================================== */

function walk(){

  if(
    !state.born
  ){

    return;

  }


  if(
    state.energy<15
  ){

    showMessage(
      personalityMessage(
        "tired"
      )
    );


    reactMain(
      "sleep"
    );


    return;

  }


  state.energy=
    Math.max(
      0,
      state.energy-15
    );


  state.love=
    Math.min(
      100,
      state.love+5
    );


  state.hunger=
    Math.max(
      0,
      state.hunger-5
    );


  state.water=
    Math.max(
      0,
      state.water-5
    );


  saveState();


  showMessage(
    personalityMessage(
      "walk"
    )
  );


  const img =
    document.getElementById(
      "mainPotato"
    );


  img.classList.add(
    "walking"
  );


  createWalkEffect();


  setTimeout(()=>{

    img.classList.remove(
      "walking"
    );

  },3000);


  updateStats();

}


function createWalkEffect(){

  const area =
    document.getElementById(
      "potatoArea"
    );


  const effect =
    document.createElement(
      "div"
    );


  effect.className=
    "walk-effect";


  effect.textContent=
    "🏃";


  effect.style.left=
    (45+Math.random()*10)+"%";


  effect.style.top=
    "55%";


  area.appendChild(
    effect
  );


  setTimeout(()=>{

    effect.remove();

  },900);

}


/* =====================================================
   메인 터치
===================================================== */

function potatoTouch(){

  if(
    !state.born
  ){

    return;

  }


  const reactions=[

    "jump",
    "shy",
    "wiggle",
    "heart",
    "happy",
    "sleep"

  ];


  let reaction;


  if(
    state.personality===
    "애교쟁이"
  ){

    reaction="heart";

  }

  else if(
    state.personality===
    "느긋한"
  ){

    reaction="sleep";

  }

  else if(
    state.personality===
    "장난꾸러기"
  ){

    reaction="wiggle";

  }

  else if(
    state.personality===
    "호기심 많은"
  ){

    reaction="jump";

  }

  else if(
    state.personality===
    "겁이 많은"
  ){

    reaction="shy";

  }

  else{

    reaction=
      reactions[
        Math.floor(
          Math.random()*
          reactions.length
        )
      ];

  }


  reactMain(
    reaction
  );


  state.love=
    Math.min(
      100,
      state.love+2
    );


  saveState();

}


function reactMain(type){

  const img =
    document.getElementById(
      "mainPotato"
    );


  img.classList.remove(

    "react-jump",
    "react-shy",
    "react-wiggle",
    "react-heart",
    "react-angry",
    "react-happy",
    "react-sleep"

  );


  void img.offsetWidth;


  img.classList.add(
    "react-"+type
  );

}

      state.love+"%";


  document
    .getElementById(
      "energyBar"
    )
    .style.width=
      state.energy+"%";

}


/* =====================================================
   자동 감소
===================================================== */

setInterval(()=>{

  if(
    !state.born
  ){

    return;

  }


  state.hunger=
    Math.max(
      0,
      state.hunger-2
    );


  state.water=
    Math.max(
      0,
      state.water-2
    );


  state.energy=
    Math.max(
      0,
      state.energy-1
    );


  if(
    state.hunger<=15
  ){

    showMessage(
      personalityMessage(
        "hungry"
      )
    );

  }

  else if(
    state.water<=15
  ){

    showMessage(
      personalityMessage(
        "thirsty"
      )
    );

  }

  else if(
    state.energy<=10
  ){

    showMessage(
      personalityMessage(
        "tired"
      )
    );

  }


  saveState();

  updateStats();

},10000);


/* =====================================================
   수확
===================================================== */

function harvest(){

  if(
    !state.born ||
    !state.character
  ){

    return;

  }


  const name=
    state.character.name;


  const alreadyFound=
    state.collection.includes(
      name
    );


  if(
    !alreadyFound
  ){

    state.collection.push(
      name
    );


    if(
      !state.collectionData
    ){

      state.collectionData={};

    }


    state.collectionData[name]=
      state.personality;

  }


  const harvested=
    state.character;


  saveState();


  openModal(
    harvested,
    alreadyFound
  );

}


/* =====================================================
   수확 후 새 감자
===================================================== */

function continueAfterHarvest(){

  closeModal();


  state.born=false;

  state.character=null;

  state.personality=null;

  state.growth=0;


  saveState();


  showScreen(
    "growthScreen"
  );


  updateGrowth();

}


/* =====================================================
   도감
===================================================== */

function showCollection(){

  renderCollection();

  showScreen(
    "collectionScreen"
  );

  startPlayground();

}


function backToGame(){

  stopPlayground();

  showScreen(
    "gameScreen"
  );

}


/* =====================================================
   도감 감자 성격
===================================================== */

function getCollectionPersonality(
  potato,
  index
){

  if(
    state.collectionData &&
    state.collectionData[
      potato.name
    ]
  ){

    return state.collectionData[
      potato.name
    ];

  }


  const personality=
    personalities[
      index%
      personalities.length
    ];


  if(
    !state.collectionData
  ){

    state.collectionData={};

  }


  state.collectionData[
    potato.name
  ]=
    personality;


  saveState();


  return personality;

}

   도감 렌더링
===================================================== */

/* =====================================================
   놀이터 변수
===================================================== */

let playgroundTimer=null;

let playgroundPotatoes=[];

let playgroundRunning=false;


/* =====================================================
   드래그 상태
===================================================== */

let dragState={

  actor:null,

  touchId:null,

  startX:0,

  startY:0,

  offsetX:0,

  offsetY:0,

  longPressTimer:null,

  dragging:false,

  moved:false

};


/* =====================================================
   놀이터 시작
===================================================== */

function startPlayground(){

  stopPlayground();


  playgroundRunning=true;


  playgroundPotatoes=[];


  const playground=
    document.getElementById(
      "playground"
    );


  playground
    .querySelectorAll(
      ".play-potato"
    )
    .forEach(
      el=>el.remove()
    );


  const found=
    potatoes.filter(
      potato=>
        state.collection.includes(
          potato.name
        )
    );


  found.forEach(
    (potato,index)=>{

      createPlayPotato(
        potato,
        index
      );

    }
  );


  playgroundTimer=
    setInterval(
      playgroundTick,
      60
    );

}


/* =====================================================
   놀이터 정지
===================================================== */

function stopPlayground(){

  playgroundRunning=false;


  if(
    playgroundTimer
  ){

    clearInterval(
      playgroundTimer
    );

    playgroundTimer=null;

  }


  cancelDrag();


  playgroundPotatoes=[];

}


/* =====================================================
   놀이터 감자 생성
===================================================== */

function createPlayPotato(
  potato,
  index
){

  const playground=
    document.getElementById(
      "playground"
    );


  const img=
    document.createElement(
      "img"
    );


  img.src=
    potato.image;


  img.alt=
    potato.name;


  img.className=
    "play-potato";


  /*
    이미지 자체의 브라우저 기본 동작 제거
  */

  img.setAttribute(
    "draggable",
    "false"
  );


  img.ondragstart=
    function(){
      return false;
    };


  img.oncontextmenu=
    function(e){

      e.preventDefault();

      return false;

    };


  const rect=
    playground.getBoundingClientRect();


  const padding=20;


  const actor={

    element:img,

    data:potato,


    x:
      padding+
      Math.random()*
      Math.max(
        1,
        rect.width-80
      ),


    y:
      110+
      Math.random()*
      Math.max(
        1,
        rect.height-180
      ),


    vx:
      (Math.random()-.5)*.35,


    vy:
      (Math.random()-.5)*.35,


    followingLeader:false,


    stunnedUntil:0,


    reactionCooldown:0,


    nextDecision:
      Date.now()+
      Math.random()*2000

  };


  playgroundPotatoes.push(
    actor
  );


  updateActorPosition(
    actor
  );


  /*
    모바일 터치
  */

  img.addEventListener(
    "touchstart",
    e=>{
      handleTouchStart(
        e,
        actor
      );
    },
    {
      passive:false
    }
  );


  img.addEventListener(
    "touchmove",
    e=>{
      handleTouchMove(
        e,
        actor
      );
    },
    {
      passive:false
    }
  );


  img.addEventListener(
    "touchend",
    e=>{
      handleTouchEnd(
        e,
        actor
      );
    },
    {
      passive:false
    }
  );


  img.addEventListener(
    "touchcancel",
    e=>{
      handleTouchEnd(
        e,
        actor
      );
    },
    {
      passive:false
    }
  );


  /*
    PC 마우스도 작동하게
  */

  img.addEventListener(
    "mousedown",
    e=>{
      handleMouseDown(
        e,
        actor
      );
    }
  );


  img.addEventListener(
    "mousemove",
    e=>{
      handleMouseMove(
        e,
        actor
      );
    }
  );


  img.addEventListener(
    "mouseup",
    e=>{
      handleMouseUp(
        e,
        actor
      );
    }
  );


  img.addEventListener(
    "mouseleave",
    e=>{
      if(
        dragState.dragging &&
        dragState.actor===actor
      ){

        handleMouseUp(
          e,
          actor
        );

      }

    }
  );


  /*
    일반 클릭
  */

  img.addEventListener(
    "click",
    e=>{

      if(
        actor.ignoreClick
      ){

        actor.ignoreClick=false;

        e.preventDefault();

        return;

      }


      playPotatoReaction(
        actor
      );

    }
  );


  playground.appendChild(
    img
  );

}


/* =====================================================
   위치
===================================================== */

function updateActorPosition(
  actor
){

  actor.element.style.left=
    actor.x+"px";


  actor.element.style.top=
    actor.y+"px";

}


/* =====================================================
   터치 시작
===================================================== */

function handleTouchStart(
  e,
  actor
){

  if(
    !playgroundRunning
  ){

    return;

  }


  if(
    dragState.actor
  ){

    return;

  }


  e.preventDefault();


  const touch=
    e.changedTouches[0];


  const playground=
    document.getElementById(
      "playground"
    );


  const rect=
    playground.getBoundingClientRect();


  dragState.actor=
    actor;


  dragState.touchId=
    touch.identifier;


  dragState.startX=
    touch.clientX;


  dragState.startY=
    touch.clientY;


  dragState.offsetX=
    touch.clientX-
    rect.left-
    actor.x;


  dragState.offsetY=
    touch.clientY-
    rect.top-
    actor.y;


  dragState.dragging=false;

  dragState.moved=false;


  /*
    0.4초 꾹 누르면 들기
  */

  dragState.longPressTimer=
    setTimeout(()=>{

      if(
        dragState.actor===actor &&
        !dragState.moved
      ){

        startDragging(
          actor
        );

      }

    },400);

}


/* =====================================================
   터치 이동
===================================================== */

function handleTouchMove(
  e,
  actor
){

  if(
    dragState.actor!==actor
  ){

    return;

  }


  const touch=
    Array.from(
      e.touches
    ).find(
      t=>
        t.identifier===
        dragState.touchId
    );


  if(!touch){
    return;
  }


  const dx=
    touch.clientX-
    dragState.startX;


  const dy=
    touch.clientY-
    dragState.startY;


  if(
    Math.abs(dx)>8 ||
    Math.abs(dy)>8
  ){

    dragState.moved=true;


    /*
      0.4초 전에 움직이면
      꾹 누르기 취소
    */

    if(
      !dragState.dragging &&
      dragState.longPressTimer
    ){

      clearTimeout(
        dragState.longPressTimer
      );

      dragState.longPressTimer=null;

    }

  }


  if(
    !dragState.dragging
  ){

    return;

  }


  e.preventDefault();


  moveDraggedActor(
    actor,
    touch.clientX,
    touch.clientY
  );

}


/* =====================================================
   터치 종료
===================================================== */

function handleTouchEnd(
  e,
  actor
){

  if(
    dragState.actor!==actor
  ){

    return;

  }


  e.preventDefault();


  if(
    dragState.longPressTimer
  ){

    clearTimeout(
      dragState.longPressTimer
    );

    dragState.longPressTimer=null;

  }


  if(
    dragState.dragging
  ){

    actor.ignoreClick=true;

    dropDraggedActor(
      actor
    );

  }


  dragState.actor=null;

  dragState.touchId=null;

  dragState.dragging=false;

  dragState.moved=false;

}


/* =====================================================
   마우스
===================================================== */

function handleMouseDown(
  e,
  actor
){

  if(
    e.button!==0
  ){

    return;

  }


  if(
    dragState.actor
  ){

    return;

  }


  e.preventDefault();


  const playground=
    document.getElementById(
      "playground"
    );


  const rect=
    playground.getBoundingClientRect();


  dragState.actor=
    actor;


  dragState.startX=
    e.clientX;


  dragState.startY=
    e.clientY;


  dragState.offsetX=
    e.clientX-
    rect.left-
    actor.x;


  dragState.offsetY=
    e.clientY-
    rect.top-
    actor.y;


  dragState.dragging=false;

  dragState.moved=false;


  dragState.longPressTimer=
    setTimeout(()=>{

      if(
        dragState.actor===actor &&
        !dragState.moved
      ){

        startDragging(
          actor
        );

      }

    },400);

}


function handleMouseMove(
  e,
  actor
){

  if(
    dragState.actor!==actor
  ){

    return;

  }


  const dx=
    e.clientX-
    dragState.startX;


  const dy=
    e.clientY-
    dragState.startY;


  if(
    Math.abs(dx)>8 ||
    Math.abs(dy)>8
  ){

    dragState.moved=true;

  }


  if(
    !dragState.dragging
  ){

    return;

  }


  e.preventDefault();


  moveDraggedActor(
    actor,
    e.clientX,
    e.clientY
  );

}


function handleMouseUp(
  e,
  actor
){

  if(
    dragState.actor!==actor
  ){

    return;

  }


  if(
    dragState.longPressTimer
  ){

    clearTimeout(
      dragState.longPressTimer
    );

    dragState.longPressTimer=null;

  }


  if(
    dragState.dragging
  ){

    actor.ignoreClick=true;

    dropDraggedActor(
      actor
    );

  }


  dragState.actor=null;

  dragState.dragging=false;

  dragState.moved=false;

}


/* =====================================================
   드래그 시작
===================================================== */

function startDragging(
  actor
){

  dragState.dragging=true;


  actor.element.classList.add(
    "dragging"
  );


  actor.ignoreClick=true;


  actor.vx=0;

  actor.vy=0;


  /*
    대장감자라면
    즉시 전원 집결
  */

  if(
    actor.data.style===
    "leader"
  ){

    playgroundPotatoes
      .forEach(
        other=>{

          if(
            other===actor
          ){

            return;

          }


          other.followingLeader=
            true;


          other.element
            .classList.add(
              "leader-near"
            );

        }
      );

  }

}


/* =====================================================
   드래그 위치
===================================================== */

function moveDraggedActor(
  actor,
  clientX,
  clientY
){

  const playground=
    document.getElementById(
      "playground"
    );


  const rect=
    playground.getBoundingClientRect();


  const maxX=
    rect.width-
    actor.element.offsetWidth;


  const maxY=
    rect.height-
    actor.element.offsetHeight;


  actor.x=
    clientX-
    rect.left-
    dragState.offsetX;


  actor.y=
    clientY-
    rect.top-
    dragState.offsetY;


  actor.x=
    Math.max(
      0,
      Math.min(
        maxX,
        actor.x
      )
    );


  actor.y=
    Math.max(
      75,
      Math.min(
        maxY,
        actor.y
      )
    );


  updateActorPosition(
    actor
  );


  /*
    대장감자를 들고 움직이는 동안
    계속 따라오도록 즉시 갱신
  */

  if(
    actor.data.style===
    "leader"
  ){

    gatherFollowers(
      actor
    );

  }

}


/* =====================================================
   대장 주변 집결
===================================================== */

function gatherFollowers(
  leader
){

  const followers=
    playgroundPotatoes.filter(
      actor=>
        actor!==leader &&
        actor.followingLeader
    );


  followers.forEach(
    (actor,index)=>{

      /*
        감자들이 겹치지 않게
        원형으로 배치
      */

      const angle=
        (
          index/
          Math.max(
            1,
            followers.length
          )
        )*
        Math.PI*2;


      const radius=
        48+
        (index%2)*16;


      const targetX=
        leader.x+
        Math.cos(angle)*
        radius;


      const targetY=
        leader.y+
        Math.sin(angle)*
        radius;


      moveActorToward(
        actor,
        targetX,
        targetY,
        5.8
      );

    }
  );

}


/* =====================================================
   드래그 놓기
===================================================== */

function dropDraggedActor(
  actor
){

  actor.element.classList.remove(
    "dragging"
  );


  /*
    대장감자를 내려놓으면
    모두 자유 상태로 복귀
  */

  if(
    actor.data.style===
    "leader"
  ){

    playgroundPotatoes
      .forEach(
        other=>{

          other.followingLeader=
            false;


          other.element
            .classList.remove(
              "leader-near"
            );


          /*
            다시 천천히 돌아다니기
          */

          other.vx=
            (Math.random()-.5)*.45;


          other.vy=
            (Math.random()-.5)*.45;


          other.nextDecision=
            Date.now()+
            Math.random()*1500;

        }
      );

  }

}


/* =====================================================
   드래그 취소
===================================================== */

function cancelDrag(){

  if(
    dragState.longPressTimer
  ){

    clearTimeout(
      dragState.longPressTimer
    );

  }


  if(
    dragState.actor
  ){

    const actor=
      dragState.actor;


    actor.element.classList.remove(
      "dragging"
    );


    actor.followingLeader=false;

  }


  dragState={

    actor:null,

    touchId:null,

    startX:0,

    startY:0,

    offsetX:0,

    offsetY:0,

    longPressTimer:null,

    dragging:false,

    moved:false

  };

}


/* =====================================================
   놀이터 AI
===================================================== */

function playgroundTick(){

  if(
    !playgroundRunning
  ){

    return;

  }


  const now=
    Date.now();


  const draggedActor=
    dragState.dragging
      ? dragState.actor
      : null;


  playgroundPotatoes
    .forEach(
      actor=>{


        /*
          들고 있는 감자는 AI 정지
        */

        if(
          actor===draggedActor
        ){

          return;

        }


        /*
          대장감자를 들었을 때
          다른 감자는 집결 AI만
        */

        if(
          draggedActor &&
          draggedActor.data.style===
            "leader" &&
          actor.followingLeader
        ){

          return;

        }


        /*
          기절
        */

        if(
          actor.stunnedUntil>
          now
        ){

          return;

        }


        /*
          새로운 행동 결정
        */

        if(
          now>=actor.nextDecision
        ){

          actor.nextDecision=
            now+
            1000+
            Math.random()*2500;


          decideActor(
            actor
          );

        }


        /*
          이동
        */

        actor.x+=
          actor.vx;


        actor.y+=
          actor.vy;


        const playground=
          document.getElementById(
            "playground"
          );


        const maxX=
          playground.clientWidth-
          actor.element.offsetWidth;


        const maxY=
          playground.clientHeight-
          actor.element.offsetHeight;


        /*
          벽
        */

        if(
          actor.x<=5
        ){

          actor.x=5;

          actor.vx=
            Math.abs(
              actor.vx
            );

        }


        if(
          actor.x>=maxX-5
        ){

          actor.x=
            maxX-5;

          actor.vx=
            -Math.abs(
              actor.vx
            );

        }


        if(
          actor.y<=80
        ){

          actor.y=80;

          actor.vy=
            Math.abs(
              actor.vy
            );

        }


        if(
          actor.y>=maxY-5
        ){

          actor.y=
            maxY-5;

          actor.vy=
            -Math.abs(
              actor.vy
            );

        }


        updateActorPosition(
          actor
        );


        /*
          너무 빨라지지 않게
        */

        const speed=
          Math.hypot(
            actor.vx,
            actor.vy
          );


        if(
          speed>1.1
        ){

          actor.vx=
            actor.vx/
            speed*
            1.1;


          actor.vy=
            actor.vy/
            speed*
            1.1;

        }


        /*
          충돌
        */

        checkCollisions(
          actor
        );

      }
    );

}


/* =====================================================
   AI 결정
===================================================== */

function decideActor(
  actor
){

  const style=
    actor.data.style;


  let speed=.45;


  /*
    꾼감자
  */

  if(
    style==="social"
  ){

    speed=.5;


    const target=
      findNearestActor(
        actor
      );


    if(
      target &&
      Math.random()<.45
    ){

      moveActorToward(
        actor,
        target.x,
        target.y,
        speed
      );

    }

    else{

      randomDirection(
        actor,
        speed
      );

    }


    if(
      Math.random()<.025
    ){

      miniReaction(
        actor,
        "happy"
      );

    }

  }


  /*
    대장감자
  */

  else if(
    style==="leader"
  ){

    speed=.4;


    /*
      평소에는 느긋하게 이동
    */

    randomDirection(
      actor,
      speed
    );


    if(
      Math.random()<.04
    ){

      miniReaction(
        actor,
        "bounce"
      );

    }

  }


  /*
    독감자
  */

  else if(
    style==="poison"
  ){

    speed=.42;


    randomDirection(
      actor,
      speed
    );


    if(
      Math.random()<.025
    ){

      miniReaction(
        actor,
        "angry"
      );

    }

  }


  /*
    폭력감자
  */

  else if(
    style==="violent"
  ){

    speed=.55;


    const target=
      findNearestActor(
        actor
      );


    /*
      평소에는 거의 안 쫓아감
    */

    if(
      target &&
      Math.random()<.12
    ){

      moveActorToward(
        actor,
        target.x,
        target.y,
        speed
      );

    }

    else{

      randomDirection(
        actor,
        speed
      );

    }


    if(
      Math.random()<.025
    ){

      miniReaction(
        actor,
        "bounce"
      );

    }

  }


  /*
    저능감자
  */

  else if(
    style==="silly"
  ){

    speed=.45;


    randomDirection(
      actor,
      speed
    );


    /*
      가끔 방향을 이상하게 바꿈
    */

    if(
      Math.random()<.08
    ){

      actor.vx*=-1;

    }


    if(
      Math.random()<.08
    ){

      actor.vy*=-1;

    }


    if(
      Math.random()<.035
    ){

      miniReaction(
        actor,
        "wiggle"
      );

    }

  }

}


/* =====================================================
   랜덤 방향
===================================================== */

function randomDirection(
  actor,
  speed
){

  const angle=
    Math.random()*
    Math.PI*2;


  actor.vx=
    Math.cos(angle)*
    speed;


  actor.vy=
    Math.sin(angle)*
    speed;

}


/* =====================================================
   이동
===================================================== */

function moveActorToward(
  actor,
  tx,
  ty,
  speed
){

  const dx=
    tx-actor.x;


  const dy=
    ty-actor.y;


  const distance=
    Math.hypot(
      dx,
      dy
    );


  if(
    distance<1
  ){

    actor.vx=0;

    actor.vy=0;

    return;

  }


  actor.vx=
    dx/
    distance*
    speed;


  actor.vy=
    dy/
    distance*
    speed;

}


/* =====================================================
   가장 가까운 감자
===================================================== */

function findNearestActor(
  actor
){

  let nearest=null;

  let nearestDistance=
    Infinity;


  playgroundPotatoes
    .forEach(
      other=>{

        if(
          other===actor
        ){

          return;

        }


        const distance=
          Math.hypot(
            actor.x-other.x,
            actor.y-other.y
          );


        if(
          distance<
          nearestDistance
        ){

          nearestDistance=
            distance;

          nearest=
            other;

        }

      }
    );


  return nearest;

}


/* =====================================================
   작은 감자 반응
===================================================== */

function miniReaction(
  actor,
  type
){

  if(
    Date.now()<
    actor.reactionCooldown
  ){

    return;

  }


  actor.reactionCooldown=
    Date.now()+900;


  const el=
    actor.element;


  el.classList.remove(

    "bounce",
    "wiggle",
    "sleep",
    "angry",
    "happy"

  );


  void el.offsetWidth;


  el.classList.add(
    type
  );


  setTimeout(()=>{

    el.classList.remove(
      type
    );

  },900);

}


/* =====================================================
   도감 감자 터치
===================================================== */

function playPotatoReaction(
  actor
){

  const personality=
    getCollectionPersonality(
      actor.data,
      potatoes.indexOf(
        actor.data
      )
    );


  let reaction="bounce";


  if(
    personality===
    "애교쟁이"
  ){

    reaction="happy";

  }

  else if(
    personality===
    "느긋한"
  ){

    reaction="sleep";

  }

  else if(
    personality===
    "장난꾸러기"
  ){

    reaction="wiggle";

  }

  else if(
    personality===
    "호기심 많은"
  ){

    reaction="bounce";

  }

  else if(
    personality===
    "겁이 많은"
  ){

    reaction="wiggle";

  }


  miniReaction(
    actor,
    reaction
  );

}


/* =====================================================
   충돌
===================================================== */

function checkCollisions(
  actor
){

  /*
    드래그 중이면 충돌 없음
  */

  if(
    dragState.dragging
  ){

    return;

  }


  const now=
    Date.now();


  playgroundPotatoes
    .forEach(
      other=>{

        if(
          other===actor
        ){

          return;

        }


        if(
          dragState.actor===
            actor ||
          dragState.actor===
            other
        ){

          return;

        }


        if(
          actor.reactionCooldown>
          now
        ){

          return;

        }


        if(
          other.reactionCooldown>
          now
        ){

          return;

        }


        const distance=
          Math.hypot(
            actor.x-other.x,
            actor.y-other.y
          );


        if(
          distance>40
        ){

          return;

        }


        /*
          서로 살짝 튕김
        */

        const dx=
          actor.x-other.x;


        const dy=
          actor.y-other.y;


        const length=
          Math.max(
            .1,
            Math.hypot(
              dx,
              dy
            )
          );


        actor.vx+=
          dx/
          length*
          .3;


        actor.vy+=
          dy/
          length*
          .3;


        other.vx-=
          dx/
          length*
          .3;


        other.vy-=
          dy/
          length*
          .3;


        actor.reactionCooldown=
          now+1000;


        other.reactionCooldown=
          now+1000;


        /*
          93%는 그냥 부딪히기만 함
        */

        if(
          Math.random()<.93
        ){

          miniReaction(
            actor,
            "bounce"
          );


          miniReaction(
            other,
            "bounce"
          );


          return;

        }


        /*
          진짜 사건은 아주 드물게
        */

        if(
          actor.data.style===
            "violent" ||
          other.data.style===
            "violent"
        ){

          miniReaction(
            actor,
            "angry"
          );


          miniReaction(
            other,
            "wiggle"
          );


          createCollisionEffect(
            actor,
            other
          );


          /*
            폭력감자가 가끔 상대를
            잠깐 멈춤
          */

          if(
            Math.random()<.18
          ){

            const target=
              actor.data.style===
              "violent"
                ? other
                : actor;


            target.stunnedUntil=
              now+800;

          }

        }

        else if(
          actor.data.style===
            "poison" ||
          other.data.style===
            "poison"
        ){

          miniReaction(
            actor,
            "wiggle"
          );


          miniReaction(
            other,
            "wiggle"
          );


          createCollisionEffect(
            actor,
            other
          );

        }

        else{

          miniReaction(
            actor,
            "bounce"
          );


          miniReaction(
            other,
            "bounce"
          );

        }

      }
    );

}


/* =====================================================
   충돌 이펙트
===================================================== */

function createCollisionEffect(
  actor,
  other
){

  const playground=
    document.getElementById(
      "playground"
    );


  const effect=
    document.createElement(
      "div"
    );


  effect.className=
    "collision-effect";


  effect.textContent=
    "💥";


  effect.style.left=
    (
      (actor.x+other.x)/2
    )+"px";


  effect.style.top=
    (
      (actor.y+other.y)/2
    )+"px";


  playground.appendChild(
    effect
  );


  setTimeout(()=>{

    effect.remove();

  },700);

}


/* =====================================================
   모달
===================================================== */

function openModal(
  potato,
  alreadyFound
){

  const modal=
    document.getElementById(
      "modal"
    );


  const image=
    document.getElementById(
      "modalPotato"
    );


  const title=
    document.getElementById(
      "modalTitle"
    );


  const text=
    document.getElementById(
      "modalText"
    );


  image.src=
    potato.image;


  title.textContent=
    potato.name;


  if(
    alreadyFound
  ){

    text.textContent=
      "이미 도감에 등록된 감자예요!";

  }

  else{

    text.textContent=
      "새로운 감자를 발견했어요! 도감에 등록되었습니다.";

  }


  modal.classList.add(
    "active"
  );

}


function closeModal(){

  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "active"
    );

}
